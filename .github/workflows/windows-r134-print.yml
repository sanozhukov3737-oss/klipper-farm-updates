name: Build and validate R134 print transfer fix (candidate only)
'on':
  push:
    branches:
    - r134-print-transfer
    paths:
    - .github/workflows/windows-r134-print.yml
    - r134-print-patch.json
    - r134-print-patch.sha256
    - r134-build/**
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: windows-r134-print-candidate
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Restore exact published R133 and apply reviewed R134 source
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        if ((Get-FileHash r134-print-patch.json).Hash.ToLowerInvariant() -ne ''67f57cd6e77e53e1fef7b97ba09a302460a470956e31601abf78ab9395ab4d64'')
        { throw ''Reviewed R134 patch differs'' }

        Copy-Item r134-build ci -Recurse

        New-Item -ItemType Directory -Force incoming,proof | Out-Null

        gh release download r133-ota --repo $env:GITHUB_REPOSITORY --pattern KF-R133-FULL.zip --dir incoming

        if ($LASTEXITCODE -ne 0) { throw ''Published R133 source download failed'' }

        if ((Get-Item incoming/KF-R133-FULL.zip).Length -ne 582849045 -or (Get-FileHash incoming/KF-R133-FULL.zip).Hash.ToLowerInvariant()
        -ne ''edf5c8a4401eb2d2997827c5e3c2ce4b3d3ce3721f8bd2a097517519546621ff'') { throw ''Published R133 archive differs''
        }

        Expand-Archive incoming/KF-R133-FULL.zip work

        Rename-Item work/Klipper-Farm-R133 app

        python ci/apply.py work/app r134-print-patch.json

        if ($LASTEXITCODE -ne 0) { throw ''R134 patch application failed'' }

        python ci/verify-source.py work/app r134-print-patch.json incoming/KF-R133-FULL.zip proof/source-delta.json

        if ($LASTEXITCODE -ne 0) { throw ''Unreviewed source changed'' }

        '
    - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
      with:
        toolchain: 1.98.0
        components: clippy
    - name: Check print transfer, routing, preflight and existing regressions
      shell: pwsh
      run: "$ErrorActionPreference='Stop'\nSet-Location work/app\nnpm ci --no-audit --no-fund\nif ($LASTEXITCODE -ne 0) {\
        \ throw 'Locked dependencies failed' }\nnode node_modules/typescript/bin/tsc --noEmit\nif ($LASTEXITCODE -ne 0) {\
        \ throw 'TypeScript failed' }\n$env:KF_R128_FINISH_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r134-finish-core.json'\n\
        $env:KF_R127_PRINT_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r134-print-start.json'\n$env:KF_R127_SOUND_PROOF=Join-Path\
        \ $env:GITHUB_WORKSPACE 'proof/r134-sound-core.json'\n$env:KF_R127_CORE_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r134-filament-core.json'\n\
        node scripts/check-approved-filament.mjs | Tee-Object -FilePath (Join-Path $env:GITHUB_WORKSPACE 'proof/r134-approved-accounting.json')\n\
        if ($LASTEXITCODE -ne 0) { throw 'Approved filament accounting failed' }\nforeach ($script in @('check-r128-finish.mjs','check-r127-print-confirmation.mjs','check-r127-notification-sound.mjs','check-r127-filament.mjs','check-r126-files-profile.mjs','check-r126-file-sync.mjs','check-printer-catalog.mjs','check-printer-catalog-images.mjs','check-gcode-validation.mjs','check-printer-config-persistence.mjs','check-security.mjs','check-moonraker-compat.mjs','check-filament-inventory.mjs','check-filament-telemetry.mjs','check-local-library.mjs','check-print-start-confirmation.mjs','check-r9-clean-installer.mjs','check-update-gate.mjs'))\
        \ {\n node \"scripts/$script\"\n if ($LASTEXITCODE -ne 0) { throw \"Regression failed: $script\" }\n}\n\n$env:KF_AUTO_RETRY_PROOF=Join-Path\
        \ $env:GITHUB_WORKSPACE 'proof/r134-auto-retry-core.json'\nnode scripts/check-filament-auto-retry.mjs\nif ($LASTEXITCODE\
        \ -ne 0) { throw 'Automatic late-data accounting failed' }\n$env:KF_NATIVE_POLICY_PROOF=Join-Path $env:GITHUB_WORKSPACE\
        \ 'proof/r134-native-history-policy.json'\nnode scripts/check-filament-history-policy.mjs\nif ($LASTEXITCODE -ne 0)\
        \ { throw 'Native single-job history permission checks failed' }\n\nforeach ($script in @('check-legacy-library-routing.mjs','check-upload-actor-identity.mjs','check-local-library-print-target.mjs','check-printer-files-start-recovery.mjs','check-print-filename-preservation.mjs'))\
        \ {\n node \"scripts/$script\"\n if ($LASTEXITCODE -ne 0) { throw \"Print transfer regression failed: $script\" }\n\
        }\n"
    - name: Verify file workflow, profile, spool and updater in Windows Edge
      shell: pwsh
      run: "$ErrorActionPreference='Stop'\nSet-Location work/app\nnpm ci --prefix ui-tests --no-audit --no-fund\nif ($LASTEXITCODE\
        \ -ne 0) { throw 'UI dependencies failed' }\n$env:CHROMIUM_EXECUTABLE=Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'\n\
        $env:KF_UI_SCREENSHOTS=Join-Path $env:GITHUB_WORKSPACE 'proof'\nforeach ($script in @('file-workflow.mjs','r126-profile-app.mjs','r126-files.mjs','single-spool-page.mjs','filament-auto-accounting.mjs','updater.mjs'))\
        \ {\n Write-Host \"BEGIN_UI_SCRIPT=$script\"\n node \"ui-tests/$script\"\n if ($LASTEXITCODE -ne 0) { throw \"Windows\
        \ Edge acceptance failed: $script\" }\n Write-Host \"END_UI_SCRIPT=$script\"\n}\nRemove-Item ui-tests/node_modules\
        \ -Recurse -Force\n"
      timeout-minutes: 20
      env:
        KF_FILE_WORKFLOW_ONLY: '1'
    - name: Compile frontend and freeze complete R134 source
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        Set-Location work/app

        npm run build

        if ($LASTEXITCODE -ne 0) { throw ''Frontend build failed'' }

        node scripts/lock-v20-6-dist.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Frontend source contract failed'' }

        node scripts/generate-release-manifests.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Manifest generation failed'' }

        node scripts/check-release-portability.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Source portability failed'' }

        $env:KF_ARCHIVE_ROOT=''Klipper-Farm-R134''

        $env:KF_SOURCE_ZIP=Join-Path $env:GITHUB_WORKSPACE ''candidate/KF-R134-FULL.zip''

        New-Item -ItemType Directory -Force (Split-Path $env:KF_SOURCE_ZIP) | Out-Null

        node scripts/build-reproducible-zip.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Complete R134 source archive failed'' }

        '
    - name: Build Windows installer and retain exact candidate
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        Set-Location work/app

        node scripts/build-and-install-windows.mjs --build-only

        if ($LASTEXITCODE -ne 0) { throw ''Windows native checks and build failed'' }

        $release=Join-Path $PWD ''.klipper-build-cache/target/release''

        New-Item -ItemType Directory -Force ../../candidate/release,../../candidate/scripts | Out-Null

        foreach ($file in @(''klipper-farm-client.exe'',''klipper-farmd.exe'',''klipper-farm-ipc-probe.exe'')) { Copy-Item
        (Join-Path $release $file) ../../candidate/release/ }

        foreach ($file in @(''check-desktop-startup-smoke.mjs'',''check-headless-telemetry-runtime.mjs'',''hardware-emulator.mjs''))
        { Copy-Item "scripts/$file" ../../candidate/scripts/ }

        Copy-Item ../../ci/r134-upgrade-data.py,../../ci/r134-check-installed-payload.mjs ../../candidate/scripts/

        $setup=@(Get-ChildItem INSTALLER -Filter ''*.exe'')

        if ($setup.Count -ne 1) { throw ''Expected exactly one R134 installer'' }

        Copy-Item $setup[0].FullName ../../candidate/Klipper-Farm-R134-setup.exe

        Copy-Item ../../proof ../../candidate/proof -Recurse

        $manifest=@{}

        foreach ($name in @(''Klipper-Farm-R134-setup.exe'',''KF-R134-FULL.zip'')) { $item=Get-Item "../../candidate/$name";
        $manifest[$name]=@{sha256=(Get-FileHash $item.FullName).Hash.ToLowerInvariant();sizeBytes=$item.Length} }

        @{release=''R134'';sequence=134;baselineSequence=133;buildId=(Get-Content RELEASE-BUILD-ID.txt -Raw).Trim();headSha=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;patchSha256=''67f57cd6e77e53e1fef7b97ba09a302460a470956e31601abf78ab9395ab4d64'';assets=$manifest}
        | ConvertTo-Json -Depth 8 | Set-Content ../../candidate/provenance.json -Encoding utf8NoBOM

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: r134-ota-candidate
        path: candidate
        retention-days: 14
        compression-level: 0
    - name: Retain build evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: r134-ota-build-evidence
        path: 'proof

          work/app/.klipper-build-cache/*.log

          work/app/.klipper-build-cache/target/*last.log

          work/app/.klipper-build-cache/logs/*'
        retention-days: 14
        include-hidden-files: true
  validate:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: r134-ota-candidate
        path: candidate
    - name: Extract exact NSIS payload for complete installed-byte comparison
      shell: pwsh
      run: "$ErrorActionPreference='Stop'\n$seven=Join-Path $env:ProgramFiles '7-Zip/7z.exe'\nif (-not (Test-Path $seven))\
        \ { $seven=(Get-Command 7z.exe -ErrorAction Stop).Source }\n& $seven x '-y' '-ocandidate/extracted-nsis' candidate/Klipper-Farm-R134-setup.exe\n\
        if ($LASTEXITCODE -ne 0) { throw 'Could not extract exact NSIS installer payload' }\nforeach ($name in @('klipper-farm-client.exe','klipper-farmd.exe'))\
        \ {\n  $items=@(Get-ChildItem candidate/extracted-nsis -Recurse -File -Filter $name)\n  if ($items.Count -ne 1) {\
        \ throw \"Expected one extracted NSIS payload: $name\" }\n  Write-Host \"EXTRACTED $name size=$($items[0].Length)\
        \ sha256=$((Get-FileHash $items[0].FullName).Hash.ToLowerInvariant())\"\n}\n"
    - name: Install R134 over R133 and verify exact payload, data and desktop restart
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        Set-Location candidate

        $installDir=Join-Path $env:RUNNER_TEMP ''KF-R134-upgrade''

        New-Item -ItemType Directory -Force old,smoke | Out-Null

        gh release download r133-ota --repo $env:GITHUB_REPOSITORY --pattern Klipper-Farm-R133-setup.exe --dir old

        if ($LASTEXITCODE -ne 0) { throw ''R133 installer download failed'' }

        $old=(Resolve-Path old/Klipper-Farm-R133-setup.exe).Path

        if ((Get-FileHash $old).Hash.ToLowerInvariant() -ne ''de5cd23f80107793cdb4a1ab15532c20421400e56d5e0ded1d21e3863f67eee7'')
        { throw ''R133 installer differs'' }

        $process=Start-Process $old -ArgumentList (''/S /D=''+$installDir) -Wait -PassThru

        if ($process.ExitCode -ne 0) { throw ''R133 install failed'' }

        node scripts/check-desktop-startup-smoke.mjs "$installDir/klipper-farm-client.exe" "$installDir/klipper-farmd.exe"
        smoke

        if ($LASTEXITCODE -ne 0) { throw ''Published R133 actual WebView startup failed'' }


        $dataDir=Join-Path $env:APPDATA ''app.klipper.farm''

        New-Item -ItemType Directory -Force $dataDir | Out-Null

        $marker=Join-Path $dataDir ''r134-preservation.txt''

        [IO.File]::WriteAllText($marker,''preserve-existing-data'')

        python scripts/r134-upgrade-data.py seed --database (Join-Path $dataDir ''farm.sqlite3'') --proof proof/upgrade-data-seed.json

        if ($LASTEXITCODE -ne 0) { throw ''Legacy seed failed'' }

        $setup=(Resolve-Path Klipper-Farm-R134-setup.exe).Path

        $process=Start-Process $setup -ArgumentList (''/S /D=''+$installDir) -Wait -PassThru

        if ($process.ExitCode -ne 0) { throw ''R134 install over R133 failed'' }

        node scripts/r134-check-installed-payload.mjs $installDir "$PWD/extracted-nsis" "$PWD/proof/installed-payload.json"

        if ($LASTEXITCODE -ne 0) { throw ''Installed bytes differ from exact NSIS bundle payload'' }

        if ((Get-Content $marker -Raw) -ne ''preserve-existing-data'') { throw ''Existing app data lost'' }

        node scripts/check-desktop-startup-smoke.mjs "$installDir/klipper-farm-client.exe" "$installDir/klipper-farmd.exe"
        smoke

        if ($LASTEXITCODE -ne 0) { throw ''Installed WebView main-window smoke failed'' }

        node scripts/check-headless-telemetry-runtime.mjs --daemon "$installDir/klipper-farmd.exe" --probe "$PWD/release/klipper-farm-ipc-probe.exe"
        --report "$PWD/proof/headless-runtime.json"

        if ($LASTEXITCODE -ne 0) { throw ''Installed telemetry regression failed'' }

        python scripts/r134-upgrade-data.py verify --database (Join-Path $dataDir ''farm.sqlite3'') --proof proof/upgrade-data-preserved.json

        if ($LASTEXITCODE -ne 0) { throw ''Printer configuration, stocks, usage, reserves or spools changed during upgrade''
        }


        node scripts/check-desktop-startup-smoke.mjs "$installDir/klipper-farm-client.exe" "$installDir/klipper-farmd.exe"
        smoke

        if ($LASTEXITCODE -ne 0) { throw ''Installed R134 second actual WebView startup failed'' }

        python scripts/r134-upgrade-data.py verify --database (Join-Path $dataDir ''farm.sqlite3'') --proof proof/upgrade-data-after-restart.json

        if ($LASTEXITCODE -ne 0) { throw ''Existing printer or filament data changed after installed app restart'' }

        node scripts/r134-check-installed-payload.mjs $installDir "$PWD/extracted-nsis" "$PWD/proof/installed-payload-after-restart.json"

        if ($LASTEXITCODE -ne 0) { throw ''Installed exact payload changed after restart'' }

        @{release=''R134'';installedSequence=134;embeddedUpdateChannelVerified=$true;passed=$true;runId=$env:GITHUB_RUN_ID;headSha=$env:GITHUB_SHA;upgradeFrom=133;exactInstallerPayloadVerified=$true;installedBinaryHashesMatch=$true;desktopWebViewLoaded=$true;legacyDataPreserved=$true;printerConfigurationPreserved=$true;filamentInventoryPreserved=$true;installedRestartVerified=$true}
        | ConvertTo-Json | Set-Content exact-validation.json -Encoding utf8NoBOM

        Compress-Archive proof,smoke R134-UI-proof.zip

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: r134-ota-validated
        path: 'candidate/Klipper-Farm-R134-setup.exe

          candidate/KF-R134-FULL.zip

          candidate/provenance.json

          candidate/exact-validation.json

          candidate/R134-UI-proof.zip'
        retention-days: 14
        compression-level: 0
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: r134-ota-installed-evidence
        path: 'candidate/proof

          candidate/smoke'
        retention-days: 14
    - name: Retain reviewed installer separately
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: r134-reviewed-installer
        path: 'candidate/Klipper-Farm-R134-setup.exe

          candidate/provenance.json

          candidate/exact-validation.json'
        retention-days: 14
        compression-level: 0

          if ($LASTEXITCODE -ne 0) { throw 'Windows component integrity and repair fixtures failed' }
          node work/app/scripts/check-release-portability.mjs --text-encoding-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Release text encoding fixtures failed' }
      - name: Stamp release version and single-instance identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force proof | Out-Null
          python version-stamp/stamp-version.py --app work/app --audit --audit-strict --report proof/version-stamp.json
          if ($LASTEXITCODE -ne 0) { throw 'Release version stamping failed' }
          $stamped=Get-Content proof/version-stamp.json -Raw | ConvertFrom-Json
          $expected=(Get-Content version-stamp/version.json -Raw | ConvertFrom-Json).version
          if ($stamped.to -cne $expected) { throw 'Stamped version differs from version-stamp/version.json' }
          $channel=Get-Content work/app/UPDATE-CHANNEL.json -Raw | ConvertFrom-Json
          $identity=(Get-Content work/app/RELEASE-BUILD-ID.txt -Raw).Trim()
          "Stamped $($stamped.from) -> $($stamped.to) in $($stamped.applied.Count) files; sequence $($channel.installedSequence); build $identity"
      - name: Prepare pinned offline speech and understanding components
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python work/app/scripts/prepare-neural-speech.py --cache incoming/speech
          if ($LASTEXITCODE -ne 0) { throw 'Pinned speech engine preparation failed' }
          python r146-voice-quality/prepare-windows-runtime.py work/app
          if ($LASTEXITCODE -ne 0) { throw 'App-local speech runtime preparation failed' }
          Remove-Item -LiteralPath work/app/.speech-worker-build -Recurse -Force
          python work/app/scripts/check-silero-runtime.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaged offline Kseniya voice failed' }
          Copy-Item work/app/silero-runtime-proof.json proof/silero-runtime.json
          & ./work/app/src-tauri/speech/silero/python/python.exe -I -X utf8 work/app/scripts/check-speech-pronunciation.py
          if ($LASTEXITCODE -ne 0) { throw 'Explicit pronunciation boundary checks failed' }
          python work/app/scripts/check-speech-workers.py r145-installed-voice-audio.zip
          if ($LASTEXITCODE -ne 0) { throw 'Five consecutive warm speech requests failed' }
          Copy-Item work/app/speech-worker-proof.json proof/speech-workers.json
          python work/app/scripts/prepare-voice-understanding.py --cache incoming/understanding --model-sidecar
          if ($LASTEXITCODE -ne 0) { throw 'Pinned static understanding runtimes or required model sidecar preparation failed' }
          Copy-Item work/app/src-tauri/resources/understanding/manifest.json proof/understanding-assets.json
          Invoke-WebRequest -Uri 'https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip' -OutFile incoming/voice-model.zip
          python work/app/scripts/prepare-voice-model.py incoming/voice-model.zip
          if ($LASTEXITCODE -ne 0) { throw 'Confirmation model preparation failed' }
          python work/app/scripts/prepare-update-components.py
          if ($LASTEXITCODE -ne 0) { throw 'Verified offline component split failed' }
          Copy-Item work/app/.update-components/component-build-report.json proof/component-build-report.json
      - name: Verify full prepared component installation before native build
        timeout-minutes: 25
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File work/app/scripts/check-prepared-update-components.ps1 -ComponentBuildReportPath work/app/.update-components/component-build-report.json -ProofPath proof/prepared-components.json
          if ($LASTEXITCODE -ne 0) { throw 'Real prepared offline component installation or reuse failed' }
          $prepared=Get-Content proof/prepared-components.json -Raw | ConvertFrom-Json
          if ($prepared.passed -ne $true) { throw 'Real prepared component acceptance did not pass' }
      - name: Voice understanding boundaries, lifecycle and existing printer regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:KF_TEST_PYTHON=(Get-Command python).Source
          Set-Location work/app
          # Пути к доказательствам — относительные от work/app, ровно как у
          # regressions.json ниже. Абсолютные пути через переменную окружения
          # дважды подряд не сработали: файлы не появлялись, а шаг считался
          # успешным. Относительный путь проверен этим же шагом.
          $env:KF_VOICE_PROOF='../../proof/voice-unit.json'
          $env:KF_VOICE_CONVERSATION_PROOF='../../proof/voice-conversation.json'
          $env:KF_VOICE_LANGUAGE_PROOF='../../proof/voice-language.json'
          $env:KF_VOICE_LEARNING_PROOF='../../proof/voice-learning.json'
          $env:KF_VOICE_DISPATCH_PROOF='../../proof/voice-dispatch.json'
          $env:KF_VOICE_DIAGNOSTICS_PROOF='../../proof/voice-diagnostics.json'
          $env:KF_VOICE_TASK_EVIDENCE_PROOF='../../proof/voice-task-evidence.json'
          $env:KF_VOICE_SEMANTIC_PROOF='../../proof/voice-semantic.json'
          python scripts/check-voice-understanding-preparation.py 2>&1 | Tee-Object ../../proof/understanding-preparation.log
          if ($LASTEXITCODE -ne 0) { throw 'Offline understanding preparation checks failed' }
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependencies failed' }
          node node_modules/typescript/bin/tsc --noEmit
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript failed' }
          node scripts/prepare-windows-build-cache.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Windows cache lifecycle checks failed' }
          node node_modules/eslint/bin/eslint.js src/ --max-warnings 0
          if ($LASTEXITCODE -ne 0) { throw 'Lint found errors in the frontend' }
          # 99 — метка «ни один скрипт не запускался»: ниже она обязана смениться.
          $LASTEXITCODE=99
          $regressionResults=@()
          foreach ($script in @('check-update-download.mjs','check-update-signing.mjs','check-large-file-hash.mjs','check-voice-printer-controls.mjs','check-voice-printer-forecast.mjs','check-voice-navigate.mjs','check-voice-responsiveness.mjs','check-voice-printer-dialogue.mjs','check-voice-control-transport.mjs','check-voice-assistant.mjs','check-voice-semantic.mjs','check-voice-pronunciation.mjs','check-voice-understanding-assets.mjs','check-voice-language.mjs','check-voice-conversation.mjs','check-voice-learning.mjs','check-voice-catalog.mjs','check-voice-task-queue.mjs','check-voice-task-evidence.mjs','check-voice-dispatch.mjs','check-voice-diagnostics.mjs','check-background-mode.mjs','check-voice-file-weight.mjs','check-neural-speech.mjs','check-print-near-end.mjs','check-neural-speech-assets.mjs','check-security.mjs','check-local-library.mjs','check-local-library-print-target.mjs','check-gcode-validation.mjs','check-print-start-confirmation.mjs','check-print-start-delivery.mjs','check-print-filename-preservation.mjs','check-printer-fault-recovery.mjs','check-r9-clean-installer.mjs','check-storage-janitor.mjs','check-update-watch.mjs','check-printer-catalog.mjs','check-access-light.mjs','check-approved-filament.mjs','check-audit-hardening.mjs','check-background-camera-r118.mjs','check-camera-guard.mjs','check-connection-feedback.mjs','check-creality-light.mjs','check-desktop-packaging.mjs','check-desktop-startup-smoke.mjs','check-farm-upgrades.mjs','check-filament-auto-retry.mjs','check-filament-history-policy.mjs','check-filament-inventory.mjs','check-filament-telemetry.mjs','check-gcode-thumbnails.mjs','check-http-keepalive.mjs','check-i18n.mjs','check-launch-auto-recovery.mjs','check-legacy-library-routing.mjs','check-maintenance.mjs','check-model-detection.mjs','check-moonraker-compat.mjs','check-offline-first.mjs','check-print-forecast.mjs','check-printer-catalog-images.mjs','check-printer-config-persistence.mjs','check-printer-connection-bridge.mjs','check-printer-files-start-recovery.mjs','check-printer-health.mjs','check-printer-identity-r125.mjs','check-runtime-stability.mjs','check-rust-structure.mjs','check-search-art.mjs','check-source-syntax.mjs','check-spool-geometry-buffer.mjs','check-spool-remnants.mjs','check-supply-chain.mjs','check-transactional-core.mjs','check-tv-dashboard.mjs','check-tv-spotlight.mjs','check-update-gate.mjs','check-upload-actor-identity.mjs','check-boot-splash.mjs','check-fix3-10-engine-quarantine-ui-recovery.mjs','check-fix3-11-stale-daemon-takeover.mjs','check-fix3-12-engine-ownership-recovery.mjs','check-fix3-13-identity-connection-recovery.mjs','check-fix3-14-verified-mutex-owner-recovery.mjs','check-fix3-15-clean-quarantine-gate.mjs','check-fix3-3-daemon-recovery.mjs','check-fix3-4-windows-ipc-probe.mjs','check-fix3-5-restart-lifecycle.mjs','check-fix3-6-durable-actor-recovery.mjs','check-fix3-7-windows-socket-shutdown.mjs','check-fix3-8-graceful-windows-ipc-drain.mjs','check-fix3-9-nonblocking-actor-snapshot.mjs','check-r126-file-sync.mjs','check-r126-files-profile.mjs','check-r127-filament.mjs','check-r127-notification-sound.mjs','check-r127-print-confirmation.mjs','check-r128-finish.mjs','check-r135-print-start-runtime.mjs','check-r138-visual-activity.mjs','check-r139-address-recovery.mjs','check-r139-fan-control.mjs','check-r141-temperature-merge.mjs','check-r141-tv-fullscreen.mjs','check-r141-tv-projection.mjs','check-v18-engine.mjs','check-v19-kernel.mjs','check-v20-6-discovery-display.mjs','check-v20-6-hardening.mjs','check-v20-6-protocol-matrix.mjs','check-v20-6-responsive.mjs','check-v20-core.mjs','check-moonraker-protocol-behaviour.mjs')) {
            # Этот вызов — то, что делает проверку проверкой. Он был случайно
            # удалён при правке списка, и цикл записывал все имена как
            # пройденные, не запустив ни одного скрипта.
            node "scripts/$script"
            if ($LASTEXITCODE -ne 0) { throw "Regression failed: $script" }
            $regressionResults+=@{script=$script;passed=$true}
          }
          if ($LASTEXITCODE -eq 99) { throw 'Regression loop executed no scripts' }
          $regressionResults | ConvertTo-Json -Depth 3 | Set-Content ../../proof/regressions.json -Encoding utf8NoBOM
          # Доказательства, на которые опираются последующие шаги. Проверяем
          # сразу здесь: иначе отсутствие файла всплывает через полчаса в
          # чужом шаге и не говорит, кто его не создал.
          $required=@('voice-unit.json','voice-conversation.json','voice-language.json','voice-learning.json','voice-dispatch.json','voice-diagnostics.json','voice-task-evidence.json','voice-semantic.json')
          $missing=@($required | Where-Object { -not (Test-Path -LiteralPath (Join-Path '../../proof' $_)) })
          if ($missing.Count -ne 0) { throw "Regression proofs missing: $($missing -join ', ') in ../../proof" }
          Get-ChildItem -LiteralPath '../../proof' -Filter 'voice-*.json' | ForEach-Object { Write-Host "proof: $($_.Name) $($_.Length) bytes" }
      - name: Build and bind complete offline frontend
        shell: pwsh
        run: |
          Set-Location work/app
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Offline frontend build failed' }
          # Эти проверки читают собранный dist, поэтому идут здесь, а не до сборки.
          # Первые две уже были тут; ещё три проверяют то же дерево и раньше
          # не запускались нигде.
          foreach ($script in @('lock-v20-6-dist.mjs','check-frontend-contract.mjs','generate-release-manifests.mjs','check-release-portability.mjs','check-production-bundle.mjs','check-ui-files.mjs','check-full-audit.mjs')) {
            node "scripts/$script"
            if ($LASTEXITCODE -ne 0) { throw "Frontend verification failed: $script" }
          }
      - name: Browser dialogue, filename learning and profile isolation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $uiTools=Join-Path $env:RUNNER_TEMP 'kf-preview10-ui-tools'
          npm install --prefix $uiTools --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned browser test tools could not be prepared' }
          $browserCandidates=@(
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft/Edge/Application/msedge.exe'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Microsoft/Edge/Application/msedge.exe'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Google/Chrome/Application/chrome.exe')
          )
          $browser=@($browserCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }) | Select-Object -First 1
          if (-not $browser) { throw 'No system Edge or Chrome executable found for browser UI verification' }
          $env:CHROMIUM_EXECUTABLE=$browser
          $env:PLAYWRIGHT_MODULE_PATH=Join-Path $uiTools 'node_modules/playwright/index.mjs'
          $env:KF_VOICE_BROWSER_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/voice-browser.json'
          $env:KF_VOICE_SCREENSHOT=Join-Path $env:GITHUB_WORKSPACE 'proof/voice-browser.png'
          $env:KF_VOICE_FAILURE_SCREENSHOT=Join-Path $env:GITHUB_WORKSPACE 'proof/voice-browser-failure.png'
          Set-Location work/app
          node ui-tests/voice-assistant-r145.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser conversation, learning or profile isolation failed' }
          # Физическая браузерная приёмка сэмплера камеры. Раньше не запускалась:
          # ей нужен playwright, а он устанавливается именно в этом шаге.
          node scripts/check-background-camera-browser-r118.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Background camera browser acceptance failed' }
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: rustcache
        with:
          path: work/app/.klipper-build-cache
          key: windows-neural-voice-rust198-${{ hashFiles('work/app/MANIFEST-SHA256.txt') }}
          restore-keys: windows-neural-voice-rust198-
      - name: Native Windows tests, Clippy and NSIS installer
        id: native
        shell: pwsh
        run: |
          $env:KF_TEST_PYTHON=(Get-Command python).Source
          Set-Location work/app
          node scripts/build-and-install-windows.mjs --build-only
          if ($LASTEXITCODE -ne 0) { throw 'Native checks or installer build failed' }
          Copy-Item .klipper-build-cache/target/v20-rust-tests-last.log ../../proof/native-tests.log
          $setups=@(Get-ChildItem INSTALLER -Filter '*.exe')
          if ($setups.Count -ne 1) { throw 'Expected one installer' }
          if ($setups[0].Length -lt 1 -or $setups[0].Length -gt 512MB) { throw 'Installer exceeds the existing updater limit (512 MiB)' }
          New-Item -ItemType Directory -Force ../../install-input,../../runtime-publish | Out-Null
          Copy-Item $setups[0].FullName ../../candidate/Klipper-Farm-Update-Delivery-setup.exe
          Copy-Item $setups[0].FullName ../../install-input/Klipper-Farm-Update-Delivery-setup.exe
          $components=Get-Content .update-components/component-build-report.json -Raw | ConvertFrom-Json
          Copy-Item -LiteralPath $components.assetPath -Destination (Join-Path ../../install-input $components.name)
          Copy-Item -LiteralPath $components.assetPath -Destination (Join-Path ../../runtime-publish $components.name)
          Copy-Item -LiteralPath $components.modelPath -Destination ../../install-input/model.gguf
          Copy-Item .update-components/component-build-report.json ../../runtime-publish/component-build-report.json
          $semantic=Get-Content ../../proof/voice-semantic.json -Raw | ConvertFrom-Json
          if ($semantic.passed -ne $true -or $semantic.cases -lt 21) { throw 'Understanding boundary checks did not complete' }
      - name: Rust protocol regressions against the vendored crate set
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-Location work/app
          # Эти три проверки создают изолированный Cargo-проект и собирают его
          # офлайн. Им нужен каталог vendored-зависимостей rv/, который
          # распаковывает сборщик на предыдущем шаге, поэтому место — здесь, а
          # не в регрессиях до сборки, где rv/ ещё нет.
          if (-not (Test-Path -LiteralPath '.cargo/config.toml')) { throw 'Vendored Cargo configuration is missing' }
          if (-not (Test-Path -LiteralPath 'rv')) { throw 'Vendored crate directory rv/ was not unpacked by the native build' }
          # Переиспользуем target нативной сборки: там уже лежат собранные
          # зависимости, иначе три проверки пересобирают serde_json с нуля.
          $sharedTarget='.klipper-build-cache/target'
          if (Test-Path -LiteralPath $sharedTarget) { $env:CARGO_TARGET_DIR=(Resolve-Path $sharedTarget).Path }
          else { Write-Host 'no shared target directory; these regressions build their own' }
          foreach ($script in @('check-native-upload-runtime.mjs','check-native-rest-rpc-runtime.mjs','check-legacy-library-upload-runtime.mjs')) {
            node "scripts/$script"
            if ($LASTEXITCODE -ne 0) { throw "Rust protocol regression failed: $script" }
          }
      - name: Verify stamped version in built artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node version-stamp/check-version-stamp.mjs --app work/app
          if ($LASTEXITCODE -ne 0) { throw 'Built artifacts do not carry the stamped version or single-instance identity' }
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.rustcache.outputs.cache-hit != 'true'
        with:
          path: work/app/.klipper-build-cache
          key: windows-neural-voice-rust198-${{ hashFiles('work/app/MANIFEST-SHA256.txt') }}
      - name: Verify installed component reuse and actual speech and understanding
        timeout-minutes: 50
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup=(Resolve-Path install-input/Klipper-Farm-Update-Delivery-setup.exe).Path
          $model=(Resolve-Path install-input/model.gguf).Path
          $pins=Get-Content work/app/scripts/voice-understanding-assets.json -Raw | ConvertFrom-Json
          $modelPins=@($pins.assets | Where-Object { $_.kind -eq 'model' })
          if ($modelPins.Count -ne 1) { throw 'Expected one pinned required understanding sidecar' }
          $modelPin=$modelPins[0]
          if ((Get-Item -LiteralPath $model).Length -ne $modelPin.bytes -or (Get-FileHash -LiteralPath $model -Algorithm SHA256).Hash.ToLowerInvariant() -cne $modelPin.sha256) { throw 'Candidate model sidecar differs from its pin' }
          $install=Join-Path $env:RUNNER_TEMP 'KF-Update-Понимание-Ксения'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File work/app/scripts/check-installed-update-components.ps1 -InstallerPath $setup -InstallRoot $install -ProofPath proof/installed-update-components.json
          if ($LASTEXITCODE -ne 0) { throw 'Clean install or /UPDATE component reuse failed' }
          $reuse=Get-Content proof/installed-update-components.json -Raw | ConvertFrom-Json
          if ($reuse.passed -ne $true) { throw 'Installed component reuse acceptance did not pass' }
          New-Item -ItemType Directory -Force proof/smoke | Out-Null
          node work/app/scripts/check-desktop-startup-smoke.mjs "$install/klipper-farm-client.exe" "$install/klipper-farmd.exe" proof/smoke
          if ($LASTEXITCODE -ne 0) { throw 'Installed application startup failed' }
          Expand-Archive r145-installed-voice-audio.zip voice-audio
          python -c "import wave;from pathlib import Path;p=Path('voice-audio/stock.wav');a=wave.open(str(p),'rb');params=a.getparams();data=a.readframes(a.getnframes());a.close();b=wave.open('voice-audio/stock-padded.wav','wb');b.setparams(params);b.writeframes(data+bytes(params.framerate*params.nchannels*params.sampwidth*4));b.close()"
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic microphone fixture preparation failed' }
          python -c "from pathlib import Path;p=Path('preview10-installed-speech.mjs');p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))"
          if ($LASTEXITCODE -ne 0) { throw 'Installed speech test normalization failed' }
          if ((Get-FileHash preview10-installed-speech.mjs).Hash.ToLowerInvariant() -ne 'd19e900dfa7acf5d07c306bf3b20aa41b4be727028bcf51769a0c48c0c8fc0e9') { throw 'Reviewed installed speech and understanding test differs' }
          # The expected identity is read from the reviewed overlay that was
          # supposed to be applied, not from a second copy of the same string.
          # A copy can go stale and then certify a build that never got it.
          $expectedBuildId=(Get-Content r226-release-sequence/changes/RELEASE-BUILD-ID.txt -Raw).Trim()
          $expectedSequence=(Get-Content r226-release-sequence/changes/UPDATE-CHANNEL.json -Raw | ConvertFrom-Json).installedSequence
          $env:KF_EXPECTED_BUILD_ID=$expectedBuildId
          node preview10-installed-speech.mjs "$install/klipper-farm-client.exe" voice-audio/stock-padded.wav proof
          if ($LASTEXITCODE -ne 0) { throw 'Installed speech pipeline failed' }
          $installed=Get-Content proof/installed-neural-speech.json -Raw | ConvertFrom-Json
          if ($installed.passed -ne $true -or $installed.semanticUnderstanding.passed -ne $true -or $installed.semanticUnderstanding.cleanExitCleanupVerified -ne $true -or $installed.semanticUnderstanding.cases.Count -ne 12) { throw 'Installed native understanding verification did not complete' }
          $candidateChannel=Get-Content work/app/UPDATE-CHANNEL.json -Raw | ConvertFrom-Json
          $candidateBuildId=(Get-Content work/app/RELEASE-BUILD-ID.txt -Raw).Trim()
          if ($candidateChannel.installedSequence -ne $expectedSequence -or $candidateBuildId -cne $expectedBuildId -or $candidateChannel.channel -cne 'stable' -or $candidateChannel.publicKeyHex -cne '28e0124c33f42704483d1aac89af829c44a00ef5dbc2e93dff630befddd495eb' -or $candidateChannel.endpoint -cne 'https://github.com/sanozhukov3737-oss/klipper-farm-updates/releases/latest/download/update-v20.json') { throw 'Production candidate embedded channel or identity differs' }
          $components=Get-Content work/app/.update-components/component-build-report.json -Raw | ConvertFrom-Json
          $modelInfo=@{fileName='model.gguf';bytes=$modelPin.bytes;sha256=$modelPin.sha256;producer=$pins.model.producer;quantizedRepository=$pins.model.repository;quantizedRevision=$pins.model.revision;sourceRepository=$pins.model.baseRepository;sourceRevision=$pins.model.baseRevision;license=$pins.model.license}
          @{preview=$true;stablePublished=$false;runtimePublished=$false;buildRunId=$env:GITHUB_RUN_ID;buildHeadSha=$env:GITHUB_SHA;productionCandidate=$true;buildId=$candidateBuildId;installedSequence=$candidateChannel.installedSequence;voice='Silero Kseniya';distribution='small-installer-with-verified-components';standaloneInstaller=$true;requiredComponentsFetchedWhenMissing=$true;model=$modelInfo;runtime=@{name=$components.name;url=$components.url;bytes=$components.bytes;sha256=$components.sha256};cleanInstallVerified=$true;updateReuseVerified=$true;actualInstalledWebView=$true;actualInstalledSemanticBridge=$true;understandingCleanupVerified=$true;physicalPrintersTested=$false;hardwareMicrophoneTested=$false;installer=@{fileName='Klipper-Farm-Update-Delivery-setup.exe';bytes=(Get-Item $setup).Length;sha256=(Get-FileHash $setup).Hash.ToLowerInvariant()}} | ConvertTo-Json -Depth 8 | Set-Content candidate/update-provenance.json -Encoding utf8NoBOM
          $candidateProof=Get-Content candidate/update-provenance.json -Raw | ConvertFrom-Json
          if ($candidateProof.installedSequence -ne $expectedSequence -or $candidateProof.installedSequence -ne $candidateChannel.installedSequence -or $candidateProof.buildId -cne $candidateBuildId) { throw 'Production candidate provenance sequence or identity differs' }
          Copy-Item candidate/update-provenance.json runtime-publish/update-provenance.json
          if (@(Get-ChildItem candidate -File).Count -ne 2 -or @(Get-ChildItem candidate -File | Where-Object { $_.Extension -in @('.zip','.gguf') }).Count -ne 0) { throw 'User installer artifact unexpectedly contains a heavy component' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-Update-Delivery-Installer
          path: candidate
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-Update-Runtime-For-Publishing
          path: runtime-publish
          compression-level: 0
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-Update-Delivery-Evidence
          path: |
            proof/*.json
            proof/*.png
            proof/*.log
            proof/smoke/*.json
            work/app/.klipper-build-cache/logs
          retention-days: 30



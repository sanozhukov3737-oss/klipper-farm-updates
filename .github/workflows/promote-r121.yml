name: Verify signed R121 recovered candidate and promote stable
on:
  workflow_dispatch:
  push:
    branches: [r121-catalog-photos]
    paths: ['r121-signed-update.json', '.github/workflows/promote-r121.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: promote-r121
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify exact public source, recovered Windows acceptance and root signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force incoming | Out-Null
          Set-Location incoming
          [IO.File]::WriteAllBytes((Join-Path $PWD 'build-pins.json'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $PWD 'candidate-pins.json'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $PWD 'reviewed-files.json'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $PWD 'reviewed-patch.json'),[Convert]::FromBase64String('W3sibmFtZSI6InIxMjEtaW1hZ2UtcGF0Y2gtMDEuanNvbiIsInNpemUiOjIwNzQxNjcsInNoYTI1NiI6ImFjYmM1NmFiY2JlNjM4YjJlYmZmOGI5ZTczMjdmNjg2NTljMWQyNmI0Yzg1MTIzYTcxZmVkODIzYjAyOTY0ODgifV0K'))
          [IO.File]::WriteAllBytes((Join-Path $PWD 'inspect-source.py'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $PWD 'source-witness.json.gz'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $PWD 'verify-r121-promotion.mjs'),[Convert]::FromBase64String(''))
          $pins = Get-Content build-pins.json -Raw | ConvertFrom-Json
          function Save-Api([string]$endpoint,[string]$name) {
            $body = gh api $endpoint
            if ($LASTEXITCODE -ne 0) { throw "Read-only metadata lookup failed: $name" }
            [IO.File]::WriteAllText((Join-Path $PWD $name),($body -join "`n"),[Text.UTF8Encoding]::new($false))
          }
          Save-Api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($pins.runId)" 'build-run.json'
          Save-Api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($pins.runId)/jobs?per_page=100" 'build-jobs.json'
          Save-Api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($pins.validationRunId)" 'validation-run.json'
          Save-Api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($pins.validationRunId)/jobs?per_page=100" 'validation-jobs.json'
          Save-Api "repos/$env:GITHUB_REPOSITORY/releases/tags/r121" 'release.json'
          foreach ($file in @(
            @{name='build-workflow.yml';path='.github/workflows/windows-r121.yml';head=$pins.headSha},
            @{name='validation-workflow.yml';path='.github/workflows/validate-r121-recovery.yml';head=$pins.validationHeadSha},
            @{name='update-v20.json';path='r121-signed-update.json';head=$env:GITHUB_SHA}
          )) {
            $encoded = gh api "repos/$env:GITHUB_REPOSITORY/contents/$($file.path)?ref=$($file.head)" --jq .content
            if ($LASTEXITCODE -ne 0 -or -not $encoded) { throw 'Reviewed source retrieval failed' }
            [IO.File]::WriteAllBytes((Join-Path $PWD $file.name),[Convert]::FromBase64String(($encoded -join '')))
          }
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/r121" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Tag lookup failed' }
          $object = $tag.object
          if ($object.type -eq 'tag') {
            $annotated = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Annotated tag lookup failed' }
            $object = $annotated.object
          }
          if ($object.type -ne 'commit') { throw 'Tag does not resolve to commit' }
          @{commitSha=$object.sha} | ConvertTo-Json | Set-Content tag-commit.json -Encoding utf8NoBOM
          gh release download r121 --repo $env:GITHUB_REPOSITORY --dir . --pattern Klipper-Farm-R121-setup.exe --pattern KF-R121-FULL.zip --pattern R121-UI-proof.zip --pattern provenance.json --pattern exact-validation.json --pattern minimized-telemetry-r118.json
          if ($LASTEXITCODE -ne 0) { throw 'Public exact candidate download failed' }
          $assets = Get-Content candidate-pins.json -Raw | ConvertFrom-Json
          foreach ($asset in $assets.PSObject.Properties) {
            if ((Get-Item $asset.Name).Length -ne $asset.Value.sizeBytes -or (Get-FileHash $asset.Name).Hash.ToLowerInvariant() -ne $asset.Value.sha256) { throw "Public asset differs: $($asset.Name)" }
          }
          python inspect-source.py . source-witness.json.gz
          if ($LASTEXITCODE -ne 0) { throw 'Complete pinned source inspection failed' }
          node verify-r121-promotion.mjs .
          if ($LASTEXITCODE -ne 0) { throw 'Signed recovered chain verification failed' }
          @'
          В каталоге 500 моделей: добавлены ещё 11 точных изображений. Теперь 482 фотографии и 5 сохранённых иллюстраций; всего изображения есть у 487 моделей, для 13 оставлен условный силуэт. Изображения доступны без интернета.

          Проверено на Windows: 15 сценариев каталога, все 482 локальные фотографии без внешних запросов, обновление поверх R120 с сохранением данных, четыре сценария завершения, три двойных запуска и телеметрия при сворачивании с потерей и восстановлением связи. Для проверки связи использован синтетический локальный принтер.

          Нативная сборка и каталог проверены в исходной успешной задаче сборки 39062628135. Установка и работа приложения повторно проверены отдельным validate-r121-recovery.yml на тех же байтах установщика после исправления сборки тестовой папки кеша. Обе проверки отражены в provenance.json и exact-validation.json.

          Установка: Klipper-Farm-R121-setup.exe или штатное обновление. Исходники: KF-R121-FULL.zip. Подписанное обновление: stable, последовательность 121. Для подключения требуется доступный Klipper/Moonraker.
          '@ | Set-Content release-notes-ru.md -Encoding utf8NoBOM
          New-Item -ItemType Directory -Force ../verified | Out-Null
          Copy-Item update-v20.json,SHA256SUMS.txt,promotion-attestation.json,release-notes-ru.md,build-pins.json ../verified/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-R121-Promotion-Verified
          path: verified/
          if-no-files-found: error
          retention-days: 30
  promote:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Klipper-Farm-R121-Promotion-Verified
          path: verified
      - name: Recheck public candidate and publish verified signed stable update
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location verified
          $proof = Get-Content promotion-attestation.json -Raw | ConvertFrom-Json
          $pins = Get-Content build-pins.json -Raw | ConvertFrom-Json
          if ($proof.exactCompiledPatchFiles -ne 19 -or $proof.photoModels -ne 482 -or $proof.preservedIllustrations -ne 5 -or $proof.remainingSilhouettes -ne 13 -or $proof.catalogUiCases -ne 15 -or -not $proof.offlinePhotosVerified) { throw 'Missing verified R121 photo/source acceptance' }
          if ($proof.buildRunId -ne $pins.runId -or $proof.buildHeadSha -ne $pins.headSha -or $proof.buildWorkflowSha256 -ne $pins.workflowSha256 -or $proof.patchSha256 -ne $pins.patchSha256 -or $proof.sourceAndInstalledValidationSameRun -or -not $proof.recoveredArtifactChainVerified -or $proof.validationRunId -ne $pins.validationRunId -or $proof.validationHeadSha -ne $pins.validationHeadSha -or $proof.validationWorkflowSha256 -ne $pins.validationWorkflowSha256 -or -not $proof.ed25519SignatureVerified -or $proof.printerCatalogModelCount -ne 500) { throw 'Wrong verified promotion artifact' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/r121" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Final prerelease lookup failed' }
          if ($release.id -ne $proof.releaseId -or -not $release.prerelease -or $release.draft -or $release.target_commitish -ne $pins.headSha) { throw 'Candidate release changed after verification' }
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/r121" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Final release tag lookup failed' }
          $object = $tag.object
          if ($object.type -eq 'tag') {
            $annotated = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Final annotated release tag lookup failed' }
            $object = $annotated.object
          }
          if ($object.type -ne 'commit' -or $object.sha -ne $pins.headSha) { throw 'Candidate tag changed after verification' }
          foreach ($name in @('Klipper-Farm-R121-setup.exe','KF-R121-FULL.zip','R121-UI-proof.zip','provenance.json','exact-validation.json','minimized-telemetry-r118.json')) {
            $expected = $proof.assets.$name
            $assets = @($release.assets | Where-Object name -eq $name)
            if ($assets.Count -ne 1 -or $assets[0].digest -ne ('sha256:'+$expected.sha256) -or $assets[0].size -ne $expected.sizeBytes) { throw "Public asset changed after verification: $name" }
          }
          if ((Get-FileHash update-v20.json).Hash.ToLowerInvariant() -ne $proof.assets.'update-v20.json'.sha256 -or (Get-Item update-v20.json).Length -ne $proof.assets.'update-v20.json'.sizeBytes) { throw 'Verified signed manifest changed' }
          $upload = @{}
          foreach ($name in @('update-v20.json','SHA256SUMS.txt','promotion-attestation.json')) { $upload[$name] = @{sha256=(Get-FileHash $name).Hash.ToLowerInvariant();sizeBytes=(Get-Item $name).Length} }
          gh release upload r121 update-v20.json SHA256SUMS.txt promotion-attestation.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Verified public manifest upload failed' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/r121" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.id -ne $proof.releaseId -or -not $release.prerelease -or $release.draft -or $release.target_commitish -ne $pins.headSha) { throw 'Uploaded candidate identity changed' }
          foreach ($name in $upload.Keys) {
            $assets = @($release.assets | Where-Object name -eq $name)
            if ($assets.Count -ne 1 -or $assets[0].digest -ne ('sha256:'+$upload[$name].sha256) -or $assets[0].size -ne $upload[$name].sizeBytes) { throw "Uploaded verified asset differs: $name" }
          }
          foreach ($name in @('Klipper-Farm-R121-setup.exe','KF-R121-FULL.zip','R121-UI-proof.zip','provenance.json','exact-validation.json','minimized-telemetry-r118.json')) {
            $expected = $proof.assets.$name
            $assets = @($release.assets | Where-Object name -eq $name)
            if ($assets.Count -ne 1 -or $assets[0].digest -ne ('sha256:'+$expected.sha256) -or $assets[0].size -ne $expected.sizeBytes) { throw "Candidate asset changed during verified manifest upload: $name" }
          }
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/r121" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Immediate pre-promotion tag lookup failed' }
          $object = $tag.object
          if ($object.type -eq 'tag') {
            $annotated = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Immediate annotated tag lookup failed' }
            $object = $annotated.object
          }
          if ($object.type -ne 'commit' -or $object.sha -ne $pins.headSha) { throw 'Candidate tag changed during verified manifest upload' }
          gh release edit r121 --repo $env:GITHUB_REPOSITORY --prerelease=false --latest --title 'Klipper Farm R121 — изображения 487 моделей принтеров' --notes-file release-notes-ru.md
          if ($LASTEXITCODE -ne 0) { throw 'Verified stable promotion failed' }

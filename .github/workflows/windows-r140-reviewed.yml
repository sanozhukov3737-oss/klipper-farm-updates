name: Build and validate reviewed R140 TV spotlight, approved spool and cameras (candidate only)
# Release input hashes are preserved byte for byte by the R140 .gitattributes rules.
'on':
  push:
    branches:
    - r140-tv-spotlight
    paths:
    - .github/workflows/windows-r140-reviewed.yml
    - r140-build/**
    - r140-release-identity.json
    - r140-release-identity.sha256
    - r139-required-tests.json
    - apply-r140-release.py
    - apply-r140-tv.py
    - r140-tv-feature-patch.json
    - r140-tv-feature-patch.sha256
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: windows-r140-reviewed-candidate
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Restore exact published R139 and apply approved R140 TV plus release identity
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        if ((Get-FileHash r140-tv-feature-patch.json).Hash.ToLowerInvariant() -ne 'f0bedbb970a385d8da1772277a8fbf915feb581b1f932f52fa558ccdf3350a03') { throw 'Approved R140 feature patch differs' }
        if ((Get-FileHash r140-release-identity.json).Hash.ToLowerInvariant() -ne '5f632e3efd2e28869f8f6122bf5b5ac8ff1067c9ca80b0a15e9862261bf39019') { throw 'Approved R140 release identity differs' }
        if ((Get-FileHash r139-required-tests.json).Hash.ToLowerInvariant() -ne 'a90a901d5211fd53d9e526380766ef3a6b8461f9ef96d0a0d550eda5036322eb') { throw 'Reviewed R139 test contract differs' }
        Copy-Item r140-build ci -Recurse
        New-Item -ItemType Directory -Force incoming,proof | Out-Null
        gh release download r139-ota --repo $env:GITHUB_REPOSITORY --pattern KF-R139-FULL.zip --dir incoming
        if ($LASTEXITCODE -ne 0) { throw 'Published R139 source download failed' }
        if ((Get-Item incoming/KF-R139-FULL.zip).Length -ne 582356862 -or (Get-FileHash incoming/KF-R139-FULL.zip).Hash.ToLowerInvariant() -ne '125bb78054cb6366242eaf505f2178bdc72f6e916b8888ff001df6a3ade3922e') { throw 'Published R139 archive differs' }
        python apply-r140-release.py incoming/KF-R139-FULL.zip work/app --proof proof/source-delta.json
        if ($LASTEXITCODE -ne 0) { throw 'Approved R140 application failed' }
        python apply-r140-release.py --verify work/app --proof proof/source-delta.json
        if ($LASTEXITCODE -ne 0) { throw 'Unreviewed source changed' }
        python r140-build/check-r139-acceptance.py r139-required-tests.json --source-root work/app
        if ($LASTEXITCODE -ne 0) { throw 'R139 test contract is incomplete or names missing source' }
    - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
      with:
        toolchain: 1.98.0
        components: clippy
    - name: Check approved accounting, automatic launch recovery and existing regressions
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        Set-Location work/app
        npm ci --no-audit --no-fund
        if ($LASTEXITCODE -ne 0) { throw 'Locked dependencies failed' }
        node node_modules/typescript/bin/tsc --noEmit
        if ($LASTEXITCODE -ne 0) { throw 'TypeScript failed' }
        $env:KF_R128_FINISH_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r139-finish-core.json'
        $env:KF_R127_PRINT_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r139-print-start.json'
        $env:KF_R127_SOUND_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r139-sound-core.json'
        $env:KF_R138_VISUAL_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r139-visual-activity.json'
        $env:KF_R127_CORE_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r139-filament-core.json'
        node scripts/check-approved-filament.mjs | Tee-Object -FilePath (Join-Path $env:GITHUB_WORKSPACE 'proof/r139-approved-accounting.json')
        if ($LASTEXITCODE -ne 0) { throw 'Approved filament accounting failed' }
        foreach ($script in @('check-r138-visual-activity.mjs','check-r128-finish.mjs','check-r127-print-confirmation.mjs','check-r127-notification-sound.mjs','check-r127-filament.mjs','check-r126-files-profile.mjs','check-r126-file-sync.mjs','check-printer-catalog.mjs','check-printer-catalog-images.mjs','check-search-art.mjs','check-gcode-validation.mjs','check-printer-config-persistence.mjs','check-security.mjs','check-moonraker-compat.mjs','check-filament-inventory.mjs','check-filament-telemetry.mjs','check-local-library.mjs','check-print-start-confirmation.mjs','check-r9-clean-installer.mjs','check-update-gate.mjs')) {
         node "scripts/$script"
         if ($LASTEXITCODE -ne 0) { throw "Regression failed: $script" }
        }

        $env:KF_AUTO_RETRY_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r139-auto-retry-core.json'
        node scripts/check-filament-auto-retry.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Automatic late-data accounting failed' }
        $env:KF_NATIVE_POLICY_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r139-native-history-policy.json'
        node scripts/check-filament-history-policy.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Native single-job history permission checks failed' }

        foreach ($script in @('check-legacy-library-routing.mjs','check-upload-actor-identity.mjs','check-local-library-print-target.mjs','check-printer-files-start-recovery.mjs','check-print-filename-preservation.mjs')) {
         node "scripts/$script"
         if ($LASTEXITCODE -ne 0) { throw "Print transfer regression failed: $script" }
        }

        $env:KF_R135_CLIENT_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r139-client-start-runtime.json'
        foreach ($script in @('check-launch-auto-recovery.mjs','check-r135-print-start-runtime.mjs')) {
         node "scripts/$script"
         if ($LASTEXITCODE -ne 0) { throw "R139 launch regression failed: $script" }
        }
    - name: Check inherited R139 controls and current R140 TV, approved spool and cameras
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $contract=Join-Path $env:GITHUB_WORKSPACE 'r139-required-tests.json'
        $proof=Join-Path $env:GITHUB_WORKSPACE 'proof'
        $required=Get-Content $contract -Raw | ConvertFrom-Json
        Set-Location work/app
        foreach ($check in $required.nodeChecks) {
         [Environment]::SetEnvironmentVariable($check.proofEnv,(Join-Path $proof $check.report),'Process')
         node $check.script
         if ($LASTEXITCODE -ne 0) { throw "R139 acceptance failed: $($check.script)" }
        }
        npm ci --prefix ui-tests --no-audit --no-fund
        if ($LASTEXITCODE -ne 0) { throw 'Locked browser test dependencies failed' }
        $env:CHROMIUM_EXECUTABLE=Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
        $playwrightPath=(Resolve-Path ui-tests/node_modules/playwright/index.mjs).Path
        $env:PLAYWRIGHT_MODULE_PATH=([System.Uri]::new($playwrightPath)).AbsoluteUri
        $env:KF_UI_SCREENSHOTS=$proof
        $env:KF_R139_UI_PROOF_DIR=$proof
        $env:KF_R138_REVIEW_PATCH=Join-Path $env:GITHUB_WORKSPACE 'r138-live-ui-patch.json'
        foreach ($check in $required.browserChecks) {
         [Environment]::SetEnvironmentVariable($check.proofEnv,(Join-Path $proof $check.report),'Process')
         node $check.script
         if ($LASTEXITCODE -ne 0) { throw "R139 browser acceptance failed: $($check.script)" }
        }
        $env:KF_TV_SPOTLIGHT_PROOF=Join-Path $proof 'tv-spotlight-data.json'
        node scripts/check-tv-spotlight.mjs
        if ($LASTEXITCODE -ne 0) { throw 'R140 actual ledger projection checks failed' }
        $env:KF_R140_TV_PROOF_DIR=$proof
        $env:KF_R140_TV_UI_PROOF=Join-Path $proof 'tv-spotlight-r140-report.json'
        node ui-tests/tv-spotlight-r140.mjs
        if ($LASTEXITCODE -ne 0) { throw 'R140 TV exact approved spool and automatic camera browser checks failed' }
        node ui-tests/tv-camera.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Existing TV and camera guard browser checks failed' }
        Remove-Item ui-tests/node_modules -Recurse -Force
        Set-Location $env:GITHUB_WORKSPACE
        python r140-build/check-r139-acceptance.py $contract --source-root work/app --proof-directory proof
        if ($LASTEXITCODE -ne 0) { throw 'Current R139 report contract differs' }
        python r140-build/check-r140-tv.py --source-root work/app --proof-directory proof --patch r140-tv-feature-patch.json
        if ($LASTEXITCODE -ne 0) { throw 'Current R140 exact-source TV report contract differs' }
      timeout-minutes: 15
    - name: Compile frontend and freeze complete R140 source
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        Set-Location work/app
        npm run build
        if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
        node scripts/lock-v20-6-dist.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Frontend source contract failed' }
        node scripts/generate-release-manifests.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Manifest generation failed' }
        node scripts/check-release-portability.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Source portability failed' }
        $env:KF_ARCHIVE_ROOT='Klipper-Farm-R140'
        $env:KF_SOURCE_ZIP=Join-Path $env:GITHUB_WORKSPACE 'candidate/KF-R140-FULL.zip'
        New-Item -ItemType Directory -Force (Split-Path $env:KF_SOURCE_ZIP) | Out-Null
        node scripts/build-reproducible-zip.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Complete R140 source archive failed' }
    - name: Build Windows installer and retain exact candidate
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        Set-Location work/app
        node scripts/build-and-install-windows.mjs --build-only
        if ($LASTEXITCODE -ne 0) { throw 'Windows native checks and build failed' }
        $nativeLog=Join-Path $PWD '.klipper-build-cache/target/v20-rust-tests-last.log'
        $nativeText=Get-Content $nativeLog -Raw
        if ((Get-FileHash ../../r137-required-tests.json).Hash.ToLowerInvariant() -ne 'd4f5077a0573aa5060ed584b4310fae0f801b757cd05d58d900530dd66af8050') { throw 'Required R139 native test contract differs' }
        $required=Get-Content ../../r137-required-tests.json -Raw | ConvertFrom-Json
        if ($required.expectedRootPassed -ne 214 -or $required.expectedRootIgnored -ne 2 -or $required.tests.Count -ne 11) { throw 'Required R139 native counts differ' }
        $current=Get-Content ../../r139-required-tests.json -Raw | ConvertFrom-Json
        $wire=@('acknowledged_start_recovers_observation_over_rest_after_ws_failure','preadmission_disconnected_ws_dispatches_exactly_one_rest_start','admitted_or_ambiguous_ws_start_is_never_dispatched_again_over_rest','expired_queued_print_start_never_reaches_the_websocket_wire')
        foreach ($test in @($wire)+@($required.tests)+@($current.tests)) {
         if ($nativeText -notmatch ([regex]::Escape($test)+' \.\.\. ok')) { throw "Required native regression was not executed: $test" }
        }
        $expected='test result: ok\. '+$current.expectedRootPassed+' passed; 0 failed; 2 ignored;'
        if ([regex]::Matches($nativeText,$expected).Count -ne 1 -or $nativeText -match 'test result: FAILED\.') { throw 'R139 native root tests differ' }
        Copy-Item $nativeLog ../../proof/r139-native-tests.log
        $release=Join-Path $PWD '.klipper-build-cache/target/release'
        New-Item -ItemType Directory -Force ../../candidate/release,../../candidate/scripts | Out-Null
        foreach ($file in @('klipper-farm-client.exe','klipper-farmd.exe','klipper-farm-ipc-probe.exe')) { Copy-Item (Join-Path $release $file) ../../candidate/release/ }
        foreach ($file in @('check-desktop-startup-smoke.mjs','check-headless-telemetry-runtime.mjs','hardware-emulator.mjs')) { Copy-Item "scripts/$file" ../../candidate/scripts/ }
        Copy-Item ../../ci/r140-upgrade-data.py,../../ci/r140-check-installed-payload.mjs ../../candidate/scripts/
        $setup=@(Get-ChildItem INSTALLER -Filter '*.exe')
        if ($setup.Count -ne 1) { throw 'Expected exactly one R140 installer' }
        Copy-Item $setup[0].FullName ../../candidate/Klipper-Farm-R140-setup.exe
        Copy-Item ../../proof ../../candidate/proof -Recurse
        $manifest=@{}
        foreach ($name in @('Klipper-Farm-R140-setup.exe','KF-R140-FULL.zip')) { $item=Get-Item "../../candidate/$name"; $manifest[$name]=@{sha256=(Get-FileHash $item.FullName).Hash.ToLowerInvariant();sizeBytes=$item.Length} }
        @{release='R140';sequence=140;baselineSequence=139;buildId=(Get-Content RELEASE-BUILD-ID.txt -Raw).Trim();headSha=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;patchSha256='f0bedbb970a385d8da1772277a8fbf915feb581b1f932f52fa558ccdf3350a03';releaseIdentitySha256='5f632e3efd2e28869f8f6122bf5b5ac8ff1067c9ca80b0a15e9862261bf39019';assets=$manifest} | ConvertTo-Json -Depth 8 | Set-Content ../../candidate/provenance.json -Encoding utf8NoBOM
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: r140-ota-candidate
        path: candidate
        retention-days: 14
        compression-level: 0
    - name: Retain build evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: r140-ota-build-evidence
        path: |-
          proof
          work/app/.klipper-build-cache/*.log
          work/app/.klipper-build-cache/target/*last.log
          work/app/.klipper-build-cache/logs/*
        retention-days: 14
        include-hidden-files: true
  validate:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: r140-ota-candidate
        path: candidate
    - name: Extract exact NSIS payload for complete installed-byte comparison
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $seven=Join-Path $env:ProgramFiles '7-Zip/7z.exe'
        if (-not (Test-Path $seven)) { $seven=(Get-Command 7z.exe -ErrorAction Stop).Source }
        & $seven x '-y' '-ocandidate/extracted-nsis' candidate/Klipper-Farm-R140-setup.exe
        if ($LASTEXITCODE -ne 0) { throw 'Could not extract exact NSIS installer payload' }
        foreach ($name in @('klipper-farm-client.exe','klipper-farmd.exe')) {
          $items=@(Get-ChildItem candidate/extracted-nsis -Recurse -File -Filter $name)
          if ($items.Count -ne 1) { throw "Expected one extracted NSIS payload: $name" }
          Write-Host "EXTRACTED $name size=$($items[0].Length) sha256=$((Get-FileHash $items[0].FullName).Hash.ToLowerInvariant())"
        }
    - name: Clean install R140 and verify exact native payload and real WebView
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        Set-Location candidate
        $installDir=Join-Path $env:RUNNER_TEMP 'KF-R140-clean'
        New-Item -ItemType Directory -Force clean-smoke | Out-Null
        $setup=(Resolve-Path Klipper-Farm-R140-setup.exe).Path
        $process=Start-Process $setup -ArgumentList ('/S /D='+$installDir) -Wait -PassThru
        if ($process.ExitCode -ne 0) { throw 'R140 clean install failed' }
        node scripts/r140-check-installed-payload.mjs $installDir "$PWD/extracted-nsis" "$PWD/proof/clean-installed-payload.json"
        if ($LASTEXITCODE -ne 0) { throw 'Clean installed bytes differ from exact NSIS bundle payload' }
        node scripts/check-desktop-startup-smoke.mjs "$installDir/klipper-farm-client.exe" "$installDir/klipper-farmd.exe" clean-smoke
        if ($LASTEXITCODE -ne 0) { throw 'Clean installed R140 actual WebView startup failed' }
    - name: Install R140 over R139 and verify exact payload, data and desktop restart
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        Set-Location candidate
        $installDir=Join-Path $env:RUNNER_TEMP 'KF-R140-upgrade'
        New-Item -ItemType Directory -Force old,smoke | Out-Null
        gh release download r139-ota --repo $env:GITHUB_REPOSITORY --pattern Klipper-Farm-R139-setup.exe --dir old
        if ($LASTEXITCODE -ne 0) { throw 'R139 installer download failed' }
        $old=(Resolve-Path old/Klipper-Farm-R139-setup.exe).Path
        if ((Get-Item $old).Length -ne 233598652 -or (Get-FileHash $old).Hash.ToLowerInvariant() -ne '82a3bb544c47bd6d1acc2e2fbbd542f7b6a3fe6b9da5c834539ba346da1ed14c') { throw 'R139 installer differs' }
        $process=Start-Process $old -ArgumentList ('/S /D='+$installDir) -Wait -PassThru
        if ($process.ExitCode -ne 0) { throw 'R139 install failed' }
        node scripts/check-desktop-startup-smoke.mjs "$installDir/klipper-farm-client.exe" "$installDir/klipper-farmd.exe" smoke
        if ($LASTEXITCODE -ne 0) { throw 'Published R139 actual WebView startup failed' }

        $dataDir=Join-Path $env:APPDATA 'app.klipper.farm'
        New-Item -ItemType Directory -Force $dataDir | Out-Null
        $marker=Join-Path $dataDir 'r140-preservation.txt'
        [IO.File]::WriteAllText($marker,'preserve-existing-data')
        python scripts/r140-upgrade-data.py seed --database (Join-Path $dataDir 'farm.sqlite3') --proof proof/upgrade-data-seed.json
        if ($LASTEXITCODE -ne 0) { throw 'Legacy seed failed' }
        $setup=(Resolve-Path Klipper-Farm-R140-setup.exe).Path
        $process=Start-Process $setup -ArgumentList ('/S /D='+$installDir) -Wait -PassThru
        if ($process.ExitCode -ne 0) { throw 'R140 install over R139 failed' }
        node scripts/r140-check-installed-payload.mjs $installDir "$PWD/extracted-nsis" "$PWD/proof/installed-payload.json"
        if ($LASTEXITCODE -ne 0) { throw 'Installed bytes differ from exact NSIS bundle payload' }
        if ((Get-Content $marker -Raw) -ne 'preserve-existing-data') { throw 'Existing app data lost' }
        node scripts/check-desktop-startup-smoke.mjs "$installDir/klipper-farm-client.exe" "$installDir/klipper-farmd.exe" smoke
        if ($LASTEXITCODE -ne 0) { throw 'Installed WebView main-window smoke failed' }
        node scripts/check-headless-telemetry-runtime.mjs --daemon "$installDir/klipper-farmd.exe" --probe "$PWD/release/klipper-farm-ipc-probe.exe" --report "$PWD/proof/headless-runtime.json"
        if ($LASTEXITCODE -ne 0) { throw 'Installed telemetry regression failed' }
        python scripts/r140-upgrade-data.py verify --database (Join-Path $dataDir 'farm.sqlite3') --proof proof/upgrade-data-preserved.json
        if ($LASTEXITCODE -ne 0) { throw 'Printer configuration, stocks, usage, reserves or spools changed during upgrade' }

        node scripts/check-desktop-startup-smoke.mjs "$installDir/klipper-farm-client.exe" "$installDir/klipper-farmd.exe" smoke
        if ($LASTEXITCODE -ne 0) { throw 'Installed R140 second actual WebView startup failed' }
        python scripts/r140-upgrade-data.py verify --database (Join-Path $dataDir 'farm.sqlite3') --proof proof/upgrade-data-after-restart.json
        if ($LASTEXITCODE -ne 0) { throw 'Existing printer or filament data changed after installed app restart' }
        node scripts/r140-check-installed-payload.mjs $installDir "$PWD/extracted-nsis" "$PWD/proof/installed-payload-after-restart.json"
        if ($LASTEXITCODE -ne 0) { throw 'Installed exact payload changed after restart' }
        @{release='R140';installedSequence=140;embeddedUpdateChannelVerified=$true;passed=$true;runId=$env:GITHUB_RUN_ID;headSha=$env:GITHUB_SHA;upgradeFrom=139;exactInstallerPayloadVerified=$true;installedBinaryHashesMatch=$true;desktopWebViewLoaded=$true;legacyDataPreserved=$true;printerConfigurationPreserved=$true;filamentInventoryPreserved=$true;costSettingsPreserved=$true;installedRestartVerified=$true;cleanInstallVerified=$true} | ConvertTo-Json | Set-Content exact-validation.json -Encoding utf8NoBOM
        Compress-Archive proof,smoke,clean-smoke R140-UI-proof.zip
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: r140-ota-validated
        path: |-
          candidate/Klipper-Farm-R140-setup.exe
          candidate/KF-R140-FULL.zip
          candidate/provenance.json
          candidate/exact-validation.json
          candidate/R140-UI-proof.zip
        retention-days: 14
        compression-level: 0
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: r140-ota-installed-evidence
        path: |-
          candidate/proof
          candidate/smoke
          candidate/clean-smoke
        retention-days: 14
    - name: Retain reviewed installer separately
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: r140-reviewed-installer
        path: |-
          candidate/Klipper-Farm-R140-setup.exe
          candidate/provenance.json
          candidate/exact-validation.json
        retention-days: 14
        compression-level: 0

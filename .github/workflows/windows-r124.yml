      run: |
        New-Item -ItemType Directory -Force out | Out-Null
        Copy-Item candidate/Klipper-Farm-R124-setup.exe,candidate/SHA256SUMS.txt,candidate/provenance.json,candidate/exact-validation.json,candidate/minimized-telemetry-proof/minimized-telemetry-r118.json out/
        Copy-Item candidate/main-window-proof/main-window-lifecycle-r117.json,candidate/startup-instance-proof/startup-instance-r117.json,candidate/inline-window-proof/upgrade-inline-window-r117.json out/
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Klipper-Farm-R124-Exact-Candidate-Validated
        path: out/
        if-no-files-found: error
        retention-days: 30
    - name: Retain test diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Klipper-Farm-R124-Exact-Candidate-Validation-logs
        path: |
          candidate/install-result.txt
          candidate/helper-stdout.txt
          candidate/helper-stderr.txt
          candidate/smoke/
          candidate/startup-instance-proof/
          candidate/minimized-telemetry-proof/
          candidate/main-window-proof/
          candidate/inline-window-proof/
          candidate/exact-validation.json
        if-no-files-found: warn
  publish-candidate:
    needs:
    - build
    - validate
    runs-on: windows-2022
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: Klipper-Farm-R124-Exact-Candidate-Validated
        path: release-candidate
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: Klipper-Farm-R124-Reviewed-Source
        path: release-source
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: Klipper-Farm-R124-Offline-Photos-UI-proof
        path: release-ui-proof/offline-photos
    - name: Publish exact validated R124 UI prerelease candidate for independent signing
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $source = @(Get-ChildItem release-source -Recurse -Filter 'KF-R124-FULL.zip')
        if ($source.Count -ne 1) { throw 'Expected one frozen reviewed source archive' }
        Copy-Item $source[0].FullName release-candidate/KF-R124-FULL.zip
        Compress-Archive -Path release-ui-proof/* -DestinationPath release-candidate/R124-UI-proof.zip
        Set-Location release-candidate
        $provenance = Get-Content provenance.json -Raw | ConvertFrom-Json
        $validation = Get-Content exact-validation.json -Raw | ConvertFrom-Json
        if ($provenance.workflowCommit -ne $env:GITHUB_SHA -or $provenance.sequence -ne 124 -or $provenance.baselineSequence -ne 123) { throw 'Wrong candidate build provenance' }
        if ($validation.candidateBuildHeadSha -ne $env:GITHUB_SHA -or -not $validation.fullR123UpgradeVerified -or -not $validation.minimizedTelemetryDisconnectReconnectRestoreVerified) { throw 'Candidate physical validation proof is missing' }
        $photoProof = Get-Content ../release-ui-proof/offline-photos/r124-images-ui-summary.json -Raw | ConvertFrom-Json
        $sourceLedger = Get-Content ../release-ui-proof/offline-photos/reviewed-photo-ledger.json -Raw | ConvertFrom-Json
        if (-not $photoProof.passed -or $photoProof.windowsEdgeUICases -ne 15 -or $photoProof.offlinePhotoModels -ne 482 -or $photoProof.externalImageRequests -ne 0 -or $provenance.photoLedgerSha256 -ne 'bd52a8444169582ae47a021d05261b2637015d2d1df26f0d47260b60345942cd' -or $provenance.photoModelCount -ne 482 -or -not $validation.offlinePhotosVerified -or $validation.catalogUiCases -ne 15 -or $sourceLedger.imageModels -ne 482) { throw 'Offline photo acceptance is incomplete' }
        if ($provenance.patchSha256 -ne '193a4ded73c754815105ddf7da4b84a735c573ffa1f664cb10e4c1701718bd8f' -or $validation.patchSha256 -ne '193a4ded73c754815105ddf7da4b84a735c573ffa1f664cb10e4c1701718bd8f') { throw 'Published candidate patch-set differs' }
        if ($provenance.coverageSha256 -ne '0048de960a5b43d341f5995b053c84c876f5d1d2cb57d4bab2cd58b5c4faddd1' -or $validation.coverageSha256 -ne '0048de960a5b43d341f5995b053c84c876f5d1d2cb57d4bab2cd58b5c4faddd1' -or $provenance.appendedPhotoModels -ne 0) { throw 'Frozen transparent display coverage changed before publication' }
        if ($photoProof.transparentCutoutModels -ne 142 -or $provenance.transparentCutoutModels -ne 142 -or $validation.transparentCutoutModels -ne 142 -or $provenance.cutoutLedgerSha256 -ne 'aa58af6c30363a02198d472cddf4b67d4e73fda05be42ad9a2f493ad31c180a9' -or -not $photoProof.cutoutCanvasAlphaVerified -or -not $photoProof.whiteBodyPreserved -or -not $photoProof.cutoutDarkLightVerified) { throw 'Missing complete transparent-display acceptance evidence' }
        if ($provenance.reviewedFilesSha256 -ne '198dcdae43422ed85ad1b1d600109bb31cde04cb032826d1514aa9543d609e7f' -or $validation.reviewedFilesSha256 -ne '198dcdae43422ed85ad1b1d600109bb31cde04cb032826d1514aa9543d609e7f' -or $provenance.reviewedFeatureFiles -ne 7 -or -not $provenance.filamentInventoryVerified -or -not $validation.filamentInventoryVerified -or $validation.filamentNativeTests -ne 5 -or -not $validation.legacySpoolPreservation.legacySpoolBytesPreserved) { throw 'Reviewed filament feature/transaction/upgrade proof missing' }
        $filament = Get-Content ../release-ui-proof/offline-photos/r124-filament-summary.json -Raw | ConvertFrom-Json
        if (-not $filament.passed -or $filament.uiCases -ne $provenance.filamentUiCases -or $filament.coreCases -ne $provenance.filamentCoreCases) { throw 'Published filament acceptance differs from build' }
        foreach ($proof in @($provenance,$validation,$filament)) {
          if (-not $proof.actualProductionParentVerified -or -not $proof.themedFieldsVerified -or -not $proof.stockAndSpoolFormsVerified -or -not $proof.focusVisibleVerified -or $proof.themedResponsiveCases -ne 6) { throw 'Complete actual production-parent stock/spool themed field and keyboard focus proof missing before publication' }
        }
        if (-not $provenance.allNativeAndAccountingBytesUnchanged -or -not $validation.allNativeAndAccountingBytesUnchanged) { throw 'Native/accounting files changed outside the reviewed UI scope' }
        $setupHash = (Get-FileHash Klipper-Farm-R124-setup.exe).Hash.ToLowerInvariant()
        $sourceHash = (Get-FileHash KF-R124-FULL.zip).Hash.ToLowerInvariant()
        $uiProofHash = (Get-FileHash R124-UI-proof.zip).Hash.ToLowerInvariant()
        if ($setupHash -ne $provenance.setupSha256 -or $sourceHash -ne $provenance.sourceSha256) { throw 'Candidate asset hash differs from validated build' }
        if ((Get-Item Klipper-Farm-R124-setup.exe).Length -gt 512MB) { throw 'Installer exceeds updater limit' }
        "$setupHash *Klipper-Farm-R124-setup.exe`n$sourceHash *KF-R124-FULL.zip`n$uiProofHash *R124-UI-proof.zip" | Set-Content SHA256SUMS.txt -Encoding utf8NoBOM
        @'
        R124 candidate: themed inventory text/number inputs match select controls in both themes. Native code, filament accounting, catalog images and model identities remain byte-identical to actual published R123.

        The exact minimal reviewed UI/release source and installer passed the retained actual Windows inventory/catalog UI cases, 33 accounting/store checks, all five named native transaction/security tests, and physical R123 to R124 upgrade with legacy spool bytes preserved, four original lifecycle modes, three double launches and minimized telemetry reconnect/restore.

        Для подключения требуется доступный Klipper/Moonraker. Наличие изображения модели не подтверждает совместимость штатной прошивки. Stable signing follows independent verification of these exact public assets.
        '@ | Set-Content candidate-notes.md -Encoding utf8NoBOM
        gh release view r124 --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
        if ($LASTEXITCODE -eq 0) { throw 'R124 already exists; review it before replacing or promoting any asset' }
        gh release create r124 Klipper-Farm-R124-setup.exe KF-R124-FULL.zip R124-UI-proof.zip SHA256SUMS.txt provenance.json exact-validation.json minimized-telemetry-r118.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'Klipper Farm R124 candidate — themed inventory fields' --notes-file candidate-notes.md
        if ($LASTEXITCODE -ne 0) { throw 'Validated prerelease publication failed' }
'on':
  workflow_dispatch: null
  push:
    branches:
    - r124-ui-fields
    paths:
    - .github/workflows/windows-r124.yml

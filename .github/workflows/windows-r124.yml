name: Build and validate R124 themed inventory fields
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-r124-ui-fields
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
    - name: Use pinned Python setup
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Restore exact published R123 source and reviewed UI field fragments
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:GITHUB_REPOSITORY -ne 'sanozhukov3737-oss/klipper-farm-updates') { throw 'Unexpected repository' }
        New-Item -ItemType Directory -Force incoming,proof,ci | Out-Null
        gh release download r123 --repo $env:GITHUB_REPOSITORY --pattern KF-R123-FULL.zip --dir incoming
        if ($LASTEXITCODE -ne 0) { throw 'Published R123 source download failed' }
        if ((Get-Item incoming/KF-R123-FULL.zip).Length -ne 580088306 -or (Get-FileHash incoming/KF-R123-FULL.zip).Hash.ToLowerInvariant() -ne '7556286685f7c6531eba67af8c32cd3bb64c61b82c2800a0a6b6cac46369af44') { throw 'Published R123 source size/SHA mismatch' }
        Expand-Archive incoming/KF-R123-FULL.zip work
        Rename-Item work/Klipper-Farm-R123 app
        [IO.File]::WriteAllBytes("$PWD/ci/fragment-pins.json",[Convert]::FromBase64String('W3sibmFtZSI6InIxMjQtdWktZmllbGRzLXBhdGNoLTAxLmpzb24iLCJzaXplIjo3NzEyNiwic2hhMjU2IjoiYTI1NjdmOTVhYjU1Y2JkZDNmN2FkNWIzMTFhNTlmM2ZiZDk1NDliMjViOWQwMjQ3ZGM4ZjljNTg5OGRlODRjNCJ9XQo='))
        if ((Get-FileHash ci/fragment-pins.json).Hash.ToLowerInvariant() -ne '193a4ded73c754815105ddf7da4b84a735c573ffa1f664cb10e4c1701718bd8f') { throw 'Embedded immutable input SHA mismatch: ci/fragment-pins.json' }
        [IO.File]::WriteAllBytes("$PWD/ci/reviewed-files.json",[Convert]::FromBase64String(''))
        if ((Get-FileHash ci/reviewed-files.json).Hash.ToLowerInvariant() -ne '198dcdae43422ed85ad1b1d600109bb31cde04cb032826d1514aa9543d609e7f') { throw 'Embedded immutable input SHA mismatch: ci/reviewed-files.json' }
        [IO.File]::WriteAllBytes("$PWD/ci/coverage.json",[Convert]::FromBase64String(''))
        if ((Get-FileHash ci/coverage.json).Hash.ToLowerInvariant() -ne '0048de960a5b43d341f5995b053c84c876f5d1d2cb57d4bab2cd58b5c4faddd1') { throw 'Embedded immutable input SHA mismatch: ci/coverage.json' }
        [IO.File]::WriteAllBytes("$PWD/ci/source_scope.py",[Convert]::FromBase64String(''))
        if ((Get-FileHash ci/source_scope.py).Hash.ToLowerInvariant() -ne 'e2c21d88ab41736e58d7859c8829931e77310f99f0bda405cbbf7ce15dfb9890') { throw 'Embedded immutable input SHA mismatch: ci/source_scope.py' }
        [IO.File]::WriteAllBytes("$PWD/ci/check-feature-scope.py",[Convert]::FromBase64String(''))
        if ((Get-FileHash ci/check-feature-scope.py).Hash.ToLowerInvariant() -ne 'd662c19c87f96da801da65c4c2a4d5f73aa5709f9edc6ec482618c33324196f2') { throw 'Embedded immutable input SHA mismatch: ci/check-feature-scope.py' }
        [IO.File]::WriteAllBytes("$PWD/ci/check-catalog-proof.py",[Convert]::FromBase64String(''))
        if ((Get-FileHash ci/check-catalog-proof.py).Hash.ToLowerInvariant() -ne 'a7a8df58d9fee2e56badbca825b4a2fa0302af5010f62da0e65996b7d75ea7d3') { throw 'Embedded immutable input SHA mismatch: ci/check-catalog-proof.py' }
        [IO.File]::WriteAllBytes("$PWD/ci/check-filament-proof.py",[Convert]::FromBase64String(''))
        if ((Get-FileHash ci/check-filament-proof.py).Hash.ToLowerInvariant() -ne '042e6f4eac0a81c22448fd8b38602bb9e42c08cb320fd92946057684707edf73') { throw 'Embedded immutable input SHA mismatch: ci/check-filament-proof.py' }
        [IO.File]::WriteAllBytes("$PWD/ci/check-native-proof.py",[Convert]::FromBase64String(''))
        if ((Get-FileHash ci/check-native-proof.py).Hash.ToLowerInvariant() -ne 'd5537be14eff28bc819bb269ef58ddb41343fdeaa38ac05297616f7a19904108') { throw 'Embedded immutable input SHA mismatch: ci/check-native-proof.py' }
        [IO.File]::WriteAllBytes("$PWD/ci/legacy-spools-proof.py",[Convert]::FromBase64String(''))
        if ((Get-FileHash ci/legacy-spools-proof.py).Hash.ToLowerInvariant() -ne '7d676d1630ae468079e8741952f5f69cbeff43a1cb6c9aad8246089090c48248') { throw 'Embedded immutable input SHA mismatch: ci/legacy-spools-proof.py' }
        Copy-Item ci/coverage.json proof/frozen-coverage.json
        $pins = Get-Content ci/fragment-pins.json -Raw | ConvertFrom-Json
        $treeJson = gh api "repos/$env:GITHUB_REPOSITORY/git/trees/$env:GITHUB_SHA"
        if ($LASTEXITCODE -ne 0) { throw 'Exact-head Git tree fetch failed' }
        $tree = ($treeJson -join "`n") | ConvertFrom-Json
        if ($tree.truncated) { throw 'Truncated Git tree' }
        foreach ($pin in $pins) {
          $entries = @($tree.tree | Where-Object { $_.path -ceq $pin.name -and $_.type -eq 'blob' -and $_.mode -eq '100644' })
          if ($entries.Count -ne 1) { throw 'Missing unique immutable patch Git blob' }
          $encoded = gh api "repos/$env:GITHUB_REPOSITORY/git/blobs/$($entries[0].sha)" --jq .content
          if ($LASTEXITCODE -ne 0) { throw 'Patch Git blob fetch failed' }
          $destination = Join-Path "$PWD/incoming" $pin.name
          [IO.File]::WriteAllBytes($destination,[Convert]::FromBase64String(($encoded -join '')))
          if ((Get-Item $destination).Length -ne $pin.size -or $pin.size -gt 23068672 -or (Get-FileHash $destination).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'Exact-head patch size/SHA differs' }
        }
        Copy-Item ci/fragment-pins.json,ci/reviewed-files.json proof/
        [IO.File]::WriteAllText("$PWD/proof/ci-origin.json",(@{repository=$env:GITHUB_REPOSITORY;headSha=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;workflow='windows-r124.yml';baselineSha256='7556286685f7c6531eba67af8c32cd3bb64c61b82c2800a0a6b6cac46369af44';uiOnly=$false} | ConvertTo-Json),[Text.UTF8Encoding]::new($false))
        Copy-Item ci/fragment-pins.json incoming/r124-patch-manifest.json
    - name: Apply exact UI/release edits and prove all native, accounting and other R123 source bytes unchanged
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $parts = Get-Content ci/fragment-pins.json -Raw | ConvertFrom-Json
        $arguments = @('ci/check-feature-scope.py','--baseline','incoming/KF-R123-FULL.zip','--source','work/app','--pins','ci/fragment-pins.json','--allowlist','ci/reviewed-files.json','--proof','proof','--coverage','ci/coverage.json')
        foreach ($part in $parts) { $arguments += @('--patch',("incoming/" + $part.name)) }
        & python @arguments
        if ($LASTEXITCODE -ne 0) { throw 'Immutable global patch/scope verification failed' }
    - name: Install locked frontend dependencies
      shell: pwsh
      run: |
        Set-Location work/app
        npm ci --no-audit --no-fund
        if ($LASTEXITCODE -ne 0) { throw 'Locked frontend installation failed' }
    - name: Verify TypeScript, preserved controls/security and original catalog image bytes
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Set-Location work/app
        node node_modules/typescript/bin/tsc --noEmit
        if ($LASTEXITCODE -ne 0) { throw 'TypeScript check failed' }
        node scripts/check-printer-catalog.mjs
        if ($LASTEXITCODE -ne 0) { throw '500 catalog identities/selection regression failed' }
        $qa = & node scripts/check-printer-catalog-images.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Offline original photo QA failed' }
        $qa | ForEach-Object { Write-Host $_ }
        [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'proof/images-qa.json'),($qa -join "`n"),[Text.UTF8Encoding]::new($false))
        Copy-Item public/printer-catalog-credits/IMAGES.json (Join-Path $env:GITHUB_WORKSPACE 'proof/reviewed-photo-ledger.json')
        node scripts/check-creality-light.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Preserved Creality light invariants failed' }
        node scripts/check-security.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Preserved security invariants failed' }
        Copy-Item public/printer-catalog-credits/CUTOUTS.json (Join-Path $env:GITHUB_WORKSPACE 'proof/reviewed-cutout-ledger.json')
        $env:KF_FILAMENT_PROOF = Join-Path $env:GITHUB_WORKSPACE 'proof/filament-inventory-core-r123-report.json'
        node scripts/check-filament-inventory.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Filament accounting/store/migration regression failed' }
        $telemetry = & node scripts/check-filament-telemetry.mjs
        if ($LASTEXITCODE -ne 0 -or -not (($telemetry -join "`n").Contains('Filament telemetry OK:'))) { throw 'Filament telemetry/history reconciliation regression failed' }
        $telemetry | ForEach-Object { Write-Host $_ }
    - name: Rebuild frontend and freeze complete reviewed source
      id: frontend
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Set-Location work/app
        node scripts/check-light-readback-r116.cjs
        if ($LASTEXITCODE -ne 0) { throw 'R124 light readback regression failed' }
        node scripts/check-background-camera-r118.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Background camera decoded-frame sampling regression failed' }
        node scripts/check-printer-open-r117.cjs
        if ($LASTEXITCODE -ne 0) { throw 'First detail open read-only preview regression failed' }
        node scripts/prepare-camera-detector.mjs --download
        if ($LASTEXITCODE -ne 0) { throw 'Pinned local camera model or ONNX runtime staging failed' }
        node scripts/check-legacy-library-routing.mjs
        if ($LASTEXITCODE -ne 0) { throw 'R94 native routing regression failed' }
        node scripts/check-print-start-confirmation.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Print start confirmation regression failed' }
        node scripts/check-upload-actor-identity.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Upload identity regression failed' }
        node scripts/check-moonraker-compat.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Compatibility regression failed' }
        node scripts/check-printer-connection-bridge.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Actor bridge regression failed' }
        node scripts/check-maintenance.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Maintenance countdown and notification regression failed' }
        node scripts/check-camera-guard.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Camera guard state and pause regression failed' }
        node scripts/check-tv-dashboard.mjs
        if ($LASTEXITCODE -ne 0) { throw 'TV dashboard state regression failed' }
        npm run build
        if ($LASTEXITCODE -ne 0) { throw 'Frontend compilation failed' }
        node scripts/lock-v20-6-dist.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Frontend provenance check failed' }
        node scripts/generate-release-manifests.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Manifest generation failed' }
        node scripts/check-release-portability.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Portable release checks failed' }
        Push-Location $env:GITHUB_WORKSPACE
        python ci/check-feature-scope.py --baseline incoming/KF-R123-FULL.zip --source work/app --pins ci/fragment-pins.json --allowlist ci/reviewed-files.json --coverage ci/coverage.json --proof proof --verify-only --allow-generated-dist
        if ($LASTEXITCODE -ne 0) { throw 'Post-build source scope mismatch' }
        Pop-Location
        New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'checked-source') | Out-Null
        $env:KF_ARCHIVE_ROOT = 'Klipper-Farm-R124'
        $env:KF_SOURCE_ZIP = Join-Path $env:GITHUB_WORKSPACE 'checked-source/KF-R124-FULL.zip'
        node scripts/build-reproducible-zip.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Reviewed source freeze failed' }
    - name: Install locked browser acceptance dependencies after reviewed source freeze
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Set-Location work/app
        npm ci --prefix ui-tests --no-audit --no-fund
        if ($LASTEXITCODE -ne 0) { throw 'Locked browser test dependencies failed' }
    - name: Run actual Windows Edge catalog and filament inventory UI acceptance
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Set-Location work/app
        $env:PLAYWRIGHT_MODULE_PATH = './node_modules/playwright/index.mjs'
        $env:CHROMIUM_EXECUTABLE = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
        if (-not (Test-Path $env:CHROMIUM_EXECUTABLE -PathType Leaf)) { throw 'Preinstalled Windows Edge missing' }
        $env:KF_UI_SCREENSHOTS = Join-Path $env:GITHUB_WORKSPACE 'proof'
        node ui-tests/printer-catalog.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Actual Windows UI/photo acceptance failed' }
        node ui-tests/filament-inventory.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Actual Windows filament inventory UI acceptance failed' }
        Set-Location $env:GITHUB_WORKSPACE
        python ci/check-catalog-proof.py --proof proof --source work/app
        if ($LASTEXITCODE -ne 0) { throw 'Positive UI/image proof is incomplete' }
        python ci/check-filament-proof.py --proof proof
        if ($LASTEXITCODE -ne 0) { throw 'Positive filament UI/core evidence incomplete' }
    - name: Retain actual UI field/inventory/catalog proof and protected-source evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Klipper-Farm-R124-Offline-Photos-UI-proof
        path: proof/
        if-no-files-found: error
        retention-days: 14
    - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
      with:
        toolchain: 1.98.0
        components: clippy
    - name: Compile actual Windows Hello desktop binding
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Set-Location work/app
        tar -xzf offline-tools/rust/rust-vendor-v1144.tar.gz -C .
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'rv/windows-0.61.3/Cargo.toml')) { throw 'Offline Windows SDK extraction failed' }
        [IO.File]::WriteAllText((Join-Path $PWD 'rv/.kf-v1144-complete'),"verified")
        $mini = Join-Path $PWD '.klipper-build-cache/hello-binding-check'
        New-Item -ItemType Directory -Force "$mini/src" | Out-Null
        @'
        [package]
        name="kf-hello-binding-check"
        version="0.1.0"
        edition="2021"
        [dependencies]
        windows={version="=0.61.3",features=["Security_Credentials_UI","Win32_System_WinRT"]}
        windows-future="=0.2.1"
        '@ | Set-Content "$mini/Cargo.toml" -Encoding utf8NoBOM
        '#[path="../../../src-tauri/src/windows_hello.rs"] mod windows_hello; fn main() {}' | Set-Content "$mini/src/main.rs" -Encoding utf8NoBOM
        $env:CARGO_TARGET_DIR = Join-Path $PWD '.klipper-build-cache/target'
        cargo check --offline --manifest-path "$mini/Cargo.toml"
        if ($LASTEXITCODE -ne 0) { throw 'Actual desktop Windows Hello API binding failed to compile' }
    - name: Verify HTTP boundary regression
      shell: pwsh
      run: |
        Set-Location work/app
        node scripts/check-http-keepalive.mjs
        if ($LASTEXITCODE -ne 0) { throw 'HTTP boundary regression failed' }
    - name: Build and run native Windows checks
      shell: pwsh
      run: |
        Set-Location work/app
        node scripts/build-and-install-windows.mjs --build-only
        if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
        Set-Location $env:GITHUB_WORKSPACE
        python ci/check-native-proof.py --log work/app/.klipper-build-cache/target/v20-rust-tests-last.log --out proof/filament-native-r124-report.json
        if ($LASTEXITCODE -ne 0) { throw 'New filament transaction/security native tests were not executed successfully' }
    - name: Verify actual R94 native library uploader
      shell: pwsh
      run: |
        Set-Location work/app
        $env:CARGO_TARGET_DIR = Join-Path $PWD '.klipper-build-cache/target'
        $env:CARGO_HOME = Join-Path $PWD '.klipper-build-cache/cargo'
        node scripts/check-legacy-library-upload-runtime.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Actual R94 native uploader regression failed' }
    - name: Collect candidate and validation tools
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force candidate/release,candidate/scripts | Out-Null
        $project = Join-Path $PWD 'work/app'
        $release = Join-Path $project '.klipper-build-cache/target/release'
        foreach ($name in @('klipper-farm-client.exe','klipper-farmd.exe','klipper-farm-ipc-probe.exe')) { Copy-Item (Join-Path $release $name) candidate/release/ }
        foreach ($name in @('apply-online-update.ps1','check-desktop-startup-smoke.mjs','check-desktop-exit.ps1','check-headless-telemetry-runtime.mjs','hardware-emulator.mjs','check-startup-instance-r117.ps1')) { Copy-Item (Join-Path $project "scripts/$name") candidate/scripts/ }
        $setup = @(Get-ChildItem work/app/INSTALLER -Filter '*.exe')
        if ($setup.Count -ne 1) { throw 'Expected one installer' }
        Copy-Item $setup[0].FullName candidate/Klipper-Farm-R124-setup.exe
        $hash = (Get-FileHash candidate/Klipper-Farm-R124-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
        "$hash *Klipper-Farm-R124-setup.exe" | Set-Content candidate/SHA256SUMS.txt -Encoding utf8NoBOM
        $sourceHash = (Get-FileHash checked-source/KF-R124-FULL.zip).Hash.ToLowerInvariant()
        $html = Get-Content work/app/dist/index.html -Raw
        $js = [regex]::Match($html,'assets/index-[^" ]+\.js').Value
        $css = [regex]::Match($html,'assets/index-[^" ]+\.css').Value
        if (-not $js -or -not $css) { throw 'Missing checked frontend bundle identity' }
        $cameraWorkers = @(Get-ChildItem work/app/dist/assets -Filter 'cameraDetectorWorker-*.js')
        if ($cameraWorkers.Count -ne 1) { throw 'Expected one local detector module worker' }
        $cameraWorker = 'assets/' + $cameraWorkers[0].Name
        $detector = Get-Content work/app/dist/camera-detector/MODEL.json -Raw | ConvertFrom-Json
        if ($detector.sha256 -ne '0a6ebd8e30dbf6a450c50f9c0a5406f04ba7eb1c99fd5996e888c78bb383b9aa' -or $detector.size -ne 202223918 -or $detector.runtime -ne 'onnxruntime-web@1.23.2') { throw 'Packaged local detector provenance mismatch' }
        if ((Get-Item candidate/Klipper-Farm-R124-setup.exe).Length -gt 512MB) { throw 'Candidate exceeds the supported update installer size' }
        $catalog = Get-Content work/app/src/data/printerCatalog.json -Raw -Encoding UTF8 | ConvertFrom-Json
        if ($catalog.schemaVersion -ne 1 -or @($catalog.models).Count -lt 500) { throw 'Packaged printer catalog requires schema 1 and at least 500 models' }
        $catalogHash = (Get-FileHash work/app/src/data/printerCatalog.json).Hash.ToLowerInvariant()
        $photos = Get-Content proof/r124-images-ui-summary.json -Raw | ConvertFrom-Json
        $filament = Get-Content proof/r124-filament-summary.json -Raw | ConvertFrom-Json
        $sourceScope = Get-Content proof/source-parity.json -Raw | ConvertFrom-Json
        if (-not $sourceScope.allNativeAndAccountingBytesUnchanged -or -not $filament.actualProductionParentVerified -or -not $filament.themedFieldsVerified -or -not $filament.stockAndSpoolFormsVerified -or -not $filament.focusVisibleVerified -or $filament.themedResponsiveCases -ne 6) { throw 'Actual production-parent themed field/focus evidence or protected native/accounting parity missing' }

        $nativeFilament = Get-Content proof/filament-native-r124-report.json -Raw | ConvertFrom-Json
        if (-not $filament.passed -or -not $nativeFilament.passed -or $nativeFilament.caseCount -ne 5) { throw 'Filament positive UI/core/native proof missing' }
        Copy-Item proof/filament-native-r124-report.json candidate/
        Copy-Item ci/legacy-spools-proof.py candidate/scripts/

        $images = Get-Content proof/images-qa.json -Raw | ConvertFrom-Json
        $registryHash = (Get-FileHash work/app/src/lib/printerCatalogArtwork.ts).Hash.ToLowerInvariant()
        if ($registryHash -ne '30ffe13a3ca2bea94952ae898ec75e3028f7a7ce46bdc002df314376bba92565' -or (Get-FileHash proof/frozen-coverage.json).Hash.ToLowerInvariant() -ne '0048de960a5b43d341f5995b053c84c876f5d1d2cb57d4bab2cd58b5c4faddd1') { throw 'Frozen registry/coverage proof differs after source freeze' }
        $ledgerHash = (Get-FileHash work/app/public/printer-catalog-credits/IMAGES.json).Hash.ToLowerInvariant()
        if (-not $photos.passed -or $photos.windowsEdgeUICases -ne 15 -or $photos.offlinePhotoModels -ne 482 -or $ledgerHash -ne 'bd52a8444169582ae47a021d05261b2637015d2d1df26f0d47260b60345942cd' -or $photos.externalImageRequests -ne 0) { throw 'Frozen offline photo UI proof/count/ledger mismatch' }
        if ((Get-FileHash incoming/r124-patch-manifest.json).Hash.ToLowerInvariant() -ne '193a4ded73c754815105ddf7da4b84a735c573ffa1f664cb10e4c1701718bd8f') { throw 'Frozen complete patch-set identity mismatch' }
        if ($photos.transparentCutoutModels -ne 142 -or -not $photos.cutoutCanvasAlphaVerified -or -not $photos.whiteBodyPreserved -or -not $photos.cutoutDarkLightVerified -or (Get-FileHash work/app/public/printer-catalog-credits/CUTOUTS.json).Hash.ToLowerInvariant() -ne 'aa58af6c30363a02198d472cddf4b67d4e73fda05be42ad9a2f493ad31c180a9') { throw 'Cutout alpha/two-theme/ledger evidence differs' }

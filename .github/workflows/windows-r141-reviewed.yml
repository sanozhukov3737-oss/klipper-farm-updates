# Reviewed release inputs are SHA-pinned before application. Candidate only: no signing or promotion.
name: Build and validate reviewed R141 performance, telemetry and TV fullscreen (candidate only)
'on':
  push:
    branches:
    - r141-performance
    paths:
    - .github/workflows/windows-r141-reviewed.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: windows-r141-reviewed-candidate
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Restore exact published R140 and apply frozen R141 feature32 plus identity5
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $pins=[ordered]@{
          'prepare-r141-identity.py'='2a90158e8e297ad1c91cb6240b343facb7dd1f68bf8ac11b38aa385d6ff34afb'
          'apply-r141-release.py'='0ca4f4f01b9b73daf52b22350d5a19d2eecad9d41fca4dd4c86f580f2062221f'
          'r141-release-identity.json'='254a34bb0d1656d551f3d46c503e656e3a358eb28b231b56c0110a2e4795146c'
          'r141-release-identity.sha256'='0fe4fe43754f0c256b4ffa0395fb6ded4d5b640026c2b6eec07684d3f675d703'
          'r141-required-tests.json'='d235ac2b198aeeb158e2f62930ba156f6b563964dd60da02176364b9d0532d22'
          'r141-required-tests.sha256'='b30de62aa7b0e0f08a281dc35f36a6c4e56f542a978840ff981439a6033bf689'
          'r141-build/check-r141-acceptance.py'='c430fa69545a312d5487f58dfb5fc1e77c05fcaba1fed4ac27a6e37085ccab54'
          'r141-build/r141-upgrade-data.py'='dd4a86d65885c28fe836376808bf5043cc49302a8430d942d24038dd259668d9'
          'r141-build/r141-check-installed-payload.mjs'='d5067f4c290ca8983e55055794e540a85c182a427b04e3f533903af4f059886c'
          'r141-build/check-r141-installed-fullscreen.mjs'='d5fba83e6f85fe205f348f210c9152d9060e3ea86d6a25f79ab0412ce7920da5'
          'r141-build/check-r141-installed-fullscreen-window.ps1'='51a3d4153823d96357a5ded493a8758e955f981dd4f3d6889a64e2aea0a81375'
          'r141-performance-patch.json'='aa815014c1868d5b748693cde4da180a0a17e1707b99c5b65d06ca897648f0ca'
          'r141-performance-patch.sha256'='49d0e6ce13af00fea61841b2c7b03f48d874cf5a94ff265d28146514e04d0db7'
          'r141-performance-report.json'='057c069a9cefd06d2c67257de136574a0f3ac5b9af394a404b6a504c426ce659'
          'r141-performance-build.json'='777f9d44ab662df068eafbd896885aa74d45eb5eced3fa66af215684dcb422c3'
        }
        foreach ($entry in $pins.GetEnumerator()) {
         if ((Get-FileHash $entry.Key).Hash.ToLowerInvariant() -ne $entry.Value) { throw "Reviewed release input differs: $($entry.Key)" }
        }
        Copy-Item r141-build ci -Recurse
        New-Item -ItemType Directory -Force incoming,proof | Out-Null
        Copy-Item r141-performance-report.json,r141-performance-build.json proof/
        gh release download r140-ota --repo $env:GITHUB_REPOSITORY --pattern KF-R140-FULL.zip --dir incoming
        if ($LASTEXITCODE -ne 0) { throw 'Published R140 source download failed' }
        if ((Get-Item incoming/KF-R140-FULL.zip).Length -ne 582390782 -or (Get-FileHash incoming/KF-R140-FULL.zip).Hash.ToLowerInvariant() -ne 'cbbc7d2c2d043cacd953191281d0c7d5ce8d650064576263ad87a5a8c544cf04') { throw 'Published R140 archive differs' }
        python apply-r141-release.py incoming/KF-R140-FULL.zip work/app --proof proof/source-delta.json
        if ($LASTEXITCODE -ne 0) { throw 'Approved R141 feature32 and identity5 application failed' }
        python apply-r141-release.py --verify work/app --proof proof/source-delta.json
        if ($LASTEXITCODE -ne 0) { throw 'Unreviewed source changed' }
        python r141-build/check-r141-acceptance.py r141-required-tests.json --source-root work/app --patch r141-performance-patch.json --identity r141-release-identity.json
        if ($LASTEXITCODE -ne 0) { throw 'R141 source or native test declaration contract differs' }
    - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
      with:
        toolchain: 1.98.0
        components: clippy
    - name: Check approved accounting, automatic launch recovery and existing regressions
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        Set-Location work/app
        npm ci --no-audit --no-fund
        if ($LASTEXITCODE -ne 0) { throw 'Locked dependencies failed' }
        node node_modules/typescript/bin/tsc --noEmit
        if ($LASTEXITCODE -ne 0) { throw 'TypeScript failed' }
        $env:KF_R128_FINISH_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r139-finish-core.json'
        $env:KF_R127_PRINT_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r139-print-start.json'
        $env:KF_R127_SOUND_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r139-sound-core.json'
        $env:KF_R138_VISUAL_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r139-visual-activity.json'
        $env:KF_R127_CORE_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r139-filament-core.json'
        node scripts/check-approved-filament.mjs | Tee-Object -FilePath (Join-Path $env:GITHUB_WORKSPACE 'proof/r139-approved-accounting.json')
        if ($LASTEXITCODE -ne 0) { throw 'Approved filament accounting failed' }
        foreach ($script in @('check-r138-visual-activity.mjs','check-r128-finish.mjs','check-r127-print-confirmation.mjs','check-r127-notification-sound.mjs','check-r127-filament.mjs','check-r126-files-profile.mjs','check-r126-file-sync.mjs','check-printer-catalog.mjs','check-printer-catalog-images.mjs','check-search-art.mjs','check-gcode-validation.mjs','check-printer-config-persistence.mjs','check-security.mjs','check-moonraker-compat.mjs','check-filament-inventory.mjs','check-filament-telemetry.mjs','check-local-library.mjs','check-print-start-confirmation.mjs','check-r9-clean-installer.mjs','check-update-gate.mjs')) {
         node "scripts/$script"
         if ($LASTEXITCODE -ne 0) { throw "Regression failed: $script" }
        }

        $env:KF_AUTO_RETRY_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r139-auto-retry-core.json'
        node scripts/check-filament-auto-retry.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Automatic late-data accounting failed' }
        $env:KF_NATIVE_POLICY_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r139-native-history-policy.json'
        node scripts/check-filament-history-policy.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Native single-job history permission checks failed' }

        foreach ($script in @('check-legacy-library-routing.mjs','check-upload-actor-identity.mjs','check-local-library-print-target.mjs','check-printer-files-start-recovery.mjs','check-print-filename-preservation.mjs')) {
         node "scripts/$script"
         if ($LASTEXITCODE -ne 0) { throw "Print transfer regression failed: $script" }
        }

        $env:KF_R135_CLIENT_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r139-client-start-runtime.json'
        foreach ($script in @('check-launch-auto-recovery.mjs','check-r135-print-start-runtime.mjs')) {
         node "scripts/$script"
         if ($LASTEXITCODE -ne 0) { throw "R139 launch regression failed: $script" }
        }
    - name: Check current R141 and inherited node/browser reports plus retained Linux performance
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $contract=Join-Path $env:GITHUB_WORKSPACE 'r141-required-tests.json'
        $checker=Join-Path $env:GITHUB_WORKSPACE 'r141-build/check-r141-acceptance.py'
        $patch=Join-Path $env:GITHUB_WORKSPACE 'r141-performance-patch.json'
        $identity=Join-Path $env:GITHUB_WORKSPACE 'r141-release-identity.json'
        $source=Join-Path $env:GITHUB_WORKSPACE 'work/app'
        $proof=Join-Path $env:GITHUB_WORKSPACE 'proof'
        python $checker $contract --source-root $source --proof-directory $proof --patch $patch --identity $identity --run-checks node
        if ($LASTEXITCODE -ne 0) { throw 'Current R141 and inherited node acceptance failed' }
        Set-Location $source
        npm ci --prefix ui-tests --no-audit --no-fund
        if ($LASTEXITCODE -ne 0) { throw 'Locked browser test dependencies failed' }
        $env:CHROMIUM_EXECUTABLE=Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
        $playwrightPath=(Resolve-Path ui-tests/node_modules/playwright/index.mjs).Path
        $env:PLAYWRIGHT_MODULE_PATH=([System.Uri]::new($playwrightPath)).AbsoluteUri
        $env:KF_UI_SCREENSHOTS=$proof
        $env:KF_R138_REVIEW_PATCH=Join-Path $env:GITHUB_WORKSPACE 'r138-live-ui-patch.json'
        python $checker $contract --source-root $source --proof-directory $proof --patch $patch --identity $identity --run-checks browser
        if ($LASTEXITCODE -ne 0) { throw 'Current R141 and inherited browser acceptance failed' }
        Remove-Item ui-tests/node_modules -Recurse -Force
        Set-Location $env:GITHUB_WORKSPACE
        python $checker $contract --source-root work/app --patch r141-performance-patch.json --identity r141-release-identity.json
        if ($LASTEXITCODE -ne 0) { throw 'Exact source changed during current acceptance checks' }
      timeout-minutes: 20
    - name: Compile frontend and freeze complete R141 source
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        Set-Location work/app
        npm run build
        if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
        node scripts/lock-v20-6-dist.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Frontend source contract failed' }
        node scripts/generate-release-manifests.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Manifest generation failed' }
        node scripts/check-release-portability.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Source portability failed' }
        $env:KF_ARCHIVE_ROOT='Klipper-Farm-R141'
        $env:KF_SOURCE_ZIP=Join-Path $env:GITHUB_WORKSPACE 'candidate/KF-R141-FULL.zip'
        New-Item -ItemType Directory -Force (Split-Path $env:KF_SOURCE_ZIP) | Out-Null
        node scripts/build-reproducible-zip.mjs
        if ($LASTEXITCODE -ne 0) { throw 'Complete R141 source archive failed' }
    - name: Build Windows installer and verify complete native232/2 acceptance
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        Set-Location work/app
        Copy-Item src-tauri/Cargo.toml ../../proof/r141-cargo-before-build.toml
        node scripts/build-and-install-windows.mjs --build-only
        if ($LASTEXITCODE -ne 0) { throw 'Windows native checks and build failed' }
        Copy-Item src-tauri/Cargo.toml ../../proof/r141-cargo-after-build.toml
        # Tauri CLI 2.11.4 reformats Cargo.toml during bundle generation.
        # Restore reviewed bytes only when the complete parsed TOML is identical.
        @'
        import hashlib,json,tomllib
        from pathlib import Path
        before=Path('../../proof/r141-cargo-before-build.toml').read_bytes()
        after=Path('src-tauri/Cargo.toml').read_bytes()
        assert hashlib.sha256(before).hexdigest()=='b88b67da331cc78cbbf7f5e30c353bb4065e75fefe63ca24531c78810943eb02', 'Reviewed Cargo manifest differs before build'
        assert tomllib.loads(before.decode())==tomllib.loads(after.decode()), 'Tauri changed Cargo manifest semantics; do not restore or publish'
        Path('src-tauri/Cargo.toml').write_bytes(before)
        report={'passed':True,'completeTomlSemanticsEqual':True,'reviewedBytesRestored':True,'beforeSha256':hashlib.sha256(before).hexdigest(),'afterBuildSha256':hashlib.sha256(after).hexdigest(),'restoredSha256':hashlib.sha256(Path('src-tauri/Cargo.toml').read_bytes()).hexdigest()}
        Path('../../proof/r141-cargo-normalization.json').write_text(json.dumps(report,indent=2)+'\n')
        print(json.dumps(report))
        '@ | python -
        if ($LASTEXITCODE -ne 0) { throw 'Tauri Cargo manifest semantic or exact-source restoration check failed' }
        $nativeLog=Join-Path $PWD '.klipper-build-cache/target/v20-rust-tests-last.log'
        Copy-Item $nativeLog ../../proof/r141-native-tests.log
        Set-Location $env:GITHUB_WORKSPACE
        python r141-build/check-r141-acceptance.py r141-required-tests.json --source-root work/app --proof-directory proof --patch r141-performance-patch.json --identity r141-release-identity.json --native-log proof/r141-native-tests.log
        if ($LASTEXITCODE -ne 0) { throw 'Native232/2, all reviewed native cases or current acceptance reports differ' }
        Set-Location work/app
        $release=Join-Path $PWD '.klipper-build-cache/target/release'
        New-Item -ItemType Directory -Force ../../candidate/release,../../candidate/scripts | Out-Null
        foreach ($file in @('klipper-farm-client.exe','klipper-farmd.exe','klipper-farm-ipc-probe.exe')) { Copy-Item (Join-Path $release $file) ../../candidate/release/ }
        foreach ($file in @('check-desktop-startup-smoke.mjs','check-headless-telemetry-runtime.mjs','hardware-emulator.mjs')) { Copy-Item "scripts/$file" ../../candidate/scripts/ }
        foreach ($file in @('r141-upgrade-data.py','r141-check-installed-payload.mjs','check-r141-installed-fullscreen.mjs','check-r141-installed-fullscreen-window.ps1')) { Copy-Item "../../ci/$file" ../../candidate/scripts/ }
        $setup=@(Get-ChildItem INSTALLER -Filter '*.exe')
        if ($setup.Count -ne 1) { throw 'Expected exactly one R141 installer' }
        Copy-Item $setup[0].FullName ../../candidate/Klipper-Farm-R141-setup.exe
        Copy-Item ../../proof ../../candidate/proof -Recurse
        $manifest=@{}
        foreach ($name in @('Klipper-Farm-R141-setup.exe','KF-R141-FULL.zip')) { $item=Get-Item "../../candidate/$name"; $manifest[$name]=@{sha256=(Get-FileHash $item.FullName).Hash.ToLowerInvariant();sizeBytes=$item.Length} }
        @{release='R141';sequence=141;baselineSequence=140;buildId=(Get-Content RELEASE-BUILD-ID.txt -Raw).Trim();headSha=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;patchSha256='aa815014c1868d5b748693cde4da180a0a17e1707b99c5b65d06ca897648f0ca';releaseIdentitySha256='254a34bb0d1656d551f3d46c503e656e3a358eb28b231b56c0110a2e4795146c';requiredTestsSha256='d235ac2b198aeeb158e2f62930ba156f6b563964dd60da02176364b9d0532d22';assets=$manifest} | ConvertTo-Json -Depth 8 | Set-Content ../../candidate/provenance.json -Encoding utf8NoBOM
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: r141-ota-candidate
        path: candidate
        retention-days: 14
        compression-level: 0
    - name: Retain build evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: r141-ota-build-evidence
        path: |-
          proof
          work/app/.klipper-build-cache/*.log
          work/app/.klipper-build-cache/target/*last.log
          work/app/.klipper-build-cache/logs/*
        retention-days: 14
        include-hidden-files: true
  validate:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: r141-ota-candidate
        path: candidate
    - name: Extract exact NSIS payload for complete installed-byte comparison
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $seven=Join-Path $env:ProgramFiles '7-Zip/7z.exe'
        if (-not (Test-Path $seven)) { $seven=(Get-Command 7z.exe -ErrorAction Stop).Source }
        & $seven x '-y' '-ocandidate/extracted-nsis' candidate/Klipper-Farm-R141-setup.exe
        if ($LASTEXITCODE -ne 0) { throw 'Could not extract exact NSIS installer payload' }
        foreach ($name in @('klipper-farm-client.exe','klipper-farmd.exe')) {
          $items=@(Get-ChildItem candidate/extracted-nsis -Recurse -File -Filter $name)
          if ($items.Count -ne 1) { throw "Expected one extracted NSIS payload: $name" }
          Write-Host "EXTRACTED $name size=$($items[0].Length) sha256=$((Get-FileHash $items[0].FullName).Hash.ToLowerInvariant())"
        }
    - name: Clean install R141 and verify exact native payload and real WebView
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        Set-Location candidate
        $installDir=Join-Path $env:RUNNER_TEMP 'KF-R141-clean'
        New-Item -ItemType Directory -Force clean-smoke | Out-Null
        $setup=(Resolve-Path Klipper-Farm-R141-setup.exe).Path
        $process=Start-Process $setup -ArgumentList ('/S /D='+$installDir) -Wait -PassThru
        if ($process.ExitCode -ne 0) { throw 'R141 clean install failed' }
        node scripts/r141-check-installed-payload.mjs $installDir "$PWD/extracted-nsis" "$PWD/proof/clean-installed-payload.json"
        if ($LASTEXITCODE -ne 0) { throw 'Clean installed bytes differ from exact NSIS bundle payload' }
        node scripts/check-desktop-startup-smoke.mjs "$installDir/klipper-farm-client.exe" "$installDir/klipper-farmd.exe" clean-smoke
        if ($LASTEXITCODE -ne 0) { throw 'Clean installed R141 actual WebView startup failed' }
    - name: Upgrade from exact R140 and verify payload, seven printers, stock and actual installed TV fullscreen
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        Set-Location candidate
        $installDir=Join-Path $env:RUNNER_TEMP 'KF-R141-upgrade'
        New-Item -ItemType Directory -Force old,smoke | Out-Null
        gh release download r140-ota --repo $env:GITHUB_REPOSITORY --pattern Klipper-Farm-R140-setup.exe --dir old
        if ($LASTEXITCODE -ne 0) { throw 'R140 installer download failed' }
        $old=(Resolve-Path old/Klipper-Farm-R140-setup.exe).Path
        if ((Get-Item $old).Length -ne 233591012 -or (Get-FileHash $old).Hash.ToLowerInvariant() -ne 'bb2a13681a16253ca3910c951053b2aa9ed781728fcec496803fb2a4e2fb9829') { throw 'R140 installer differs' }
        $process=Start-Process $old -ArgumentList ('/S /D='+$installDir) -Wait -PassThru
        if ($process.ExitCode -ne 0) { throw 'R140 install failed' }
        node scripts/check-desktop-startup-smoke.mjs "$installDir/klipper-farm-client.exe" "$installDir/klipper-farmd.exe" smoke
        if ($LASTEXITCODE -ne 0) { throw 'Published R140 actual WebView startup failed' }

        $dataDir=Join-Path $env:APPDATA 'app.klipper.farm'
        New-Item -ItemType Directory -Force $dataDir | Out-Null
        $marker=Join-Path $dataDir 'r141-preservation.txt'
        [IO.File]::WriteAllText($marker,'preserve-existing-data')
        python scripts/r141-upgrade-data.py seed --database (Join-Path $dataDir 'farm.sqlite3') --proof proof/upgrade-data-seed.json
        if ($LASTEXITCODE -ne 0) { throw 'Legacy seed failed' }
        $setup=(Resolve-Path Klipper-Farm-R141-setup.exe).Path
        $process=Start-Process $setup -ArgumentList ('/S /D='+$installDir) -Wait -PassThru
        if ($process.ExitCode -ne 0) { throw 'R141 install over R140 failed' }
        node scripts/r141-check-installed-payload.mjs $installDir "$PWD/extracted-nsis" "$PWD/proof/installed-payload.json"
        if ($LASTEXITCODE -ne 0) { throw 'Installed bytes differ from exact NSIS bundle payload' }
        if ((Get-Content $marker -Raw) -ne 'preserve-existing-data') { throw 'Existing app data lost' }
        node scripts/check-desktop-startup-smoke.mjs "$installDir/klipper-farm-client.exe" "$installDir/klipper-farmd.exe" smoke
        if ($LASTEXITCODE -ne 0) { throw 'Installed WebView main-window smoke failed' }
        node scripts/check-headless-telemetry-runtime.mjs --daemon "$installDir/klipper-farmd.exe" --probe "$PWD/release/klipper-farm-ipc-probe.exe" --report "$PWD/proof/headless-runtime.json"
        if ($LASTEXITCODE -ne 0) { throw 'Installed telemetry regression failed' }
        python scripts/r141-upgrade-data.py verify --database (Join-Path $dataDir 'farm.sqlite3') --proof proof/upgrade-data-before-fullscreen.json
        if ($LASTEXITCODE -ne 0) { throw 'Printer configuration, stocks, usage, reserves or spools changed during upgrade' }
        node scripts/check-r141-installed-fullscreen.mjs "$installDir/klipper-farm-client.exe" "$PWD/proof/installed-fullscreen"
        if ($LASTEXITCODE -ne 0) { throw 'Installed Windows TV fullscreen lifecycle failed' }
        $fullscreen=Get-Content proof/installed-fullscreen/installed-fullscreen-report.json -Raw | ConvertFrom-Json
        if ($fullscreen.passed -ne $true -or $fullscreen.passedCases -ne 5 -or @($fullscreen.cases).Count -ne 5 -or @($fullscreen.cases | Where-Object { $_.passed -ne $true }).Count -ne 0) { throw 'Expected five passed installed fullscreen cases' }
        if ($fullscreen.actualFullscreenStateVerified -ne $true -or $fullscreen.actualInstalledWebView -ne $true -or $fullscreen.actualWindowsWindowManager -ne $true -or $fullscreen.nativeWindowCallsReal -ne $true -or $fullscreen.domFullscreenNeverUsed -ne $true -or $fullscreen.configuredPrinters -ne 7) { throw 'Actual Windows fullscreen evidence is incomplete' }
        python scripts/r141-upgrade-data.py verify --database (Join-Path $dataDir 'farm.sqlite3') --proof proof/upgrade-data-preserved.json
        if ($LASTEXITCODE -ne 0) { throw 'Printer or filament data changed during installed TV fullscreen checks' }

        node scripts/check-desktop-startup-smoke.mjs "$installDir/klipper-farm-client.exe" "$installDir/klipper-farmd.exe" smoke
        if ($LASTEXITCODE -ne 0) { throw 'Installed R141 second actual WebView startup failed' }
        python scripts/r141-upgrade-data.py verify --database (Join-Path $dataDir 'farm.sqlite3') --proof proof/upgrade-data-after-restart.json
        if ($LASTEXITCODE -ne 0) { throw 'Existing printer or filament data changed after installed app restart' }
        node scripts/r141-check-installed-payload.mjs $installDir "$PWD/extracted-nsis" "$PWD/proof/installed-payload-after-restart.json"
        if ($LASTEXITCODE -ne 0) { throw 'Installed exact payload changed after restart' }
        @{release='R141';installedSequence=141;embeddedUpdateChannelVerified=$true;passed=$true;runId=$env:GITHUB_RUN_ID;headSha=$env:GITHUB_SHA;upgradeFrom=140;exactInstallerPayloadVerified=$true;installedBinaryHashesMatch=$true;desktopWebViewLoaded=$true;legacyDataPreserved=$true;printerConfigurationPreserved=$true;filamentInventoryPreserved=$true;costSettingsPreserved=$true;installedRestartVerified=$true;cleanInstallVerified=$true;actualFullscreenStateVerified=$true;installedTvFullscreenVerified=$true;actualWindowsWindowManagerVerified=$true;installedTvFullscreenCases=5} | ConvertTo-Json | Set-Content exact-validation.json -Encoding utf8NoBOM
        Compress-Archive proof,smoke,clean-smoke R141-UI-proof.zip
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:

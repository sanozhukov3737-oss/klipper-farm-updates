          assert.equal(event('minimized-disconnected').connected,false);assert.equal(event('minimized-reconnected').connected,true);
          assert(event('minimized-reconnected').lastSeenAt>previous);assert.equal(event('restored-fresh-sample').connected,true);assert(event('restored-fresh-sample').lastSeenAt>event('minimized-reconnected').lastSeenAt);
          const manifest=readJson('update-v20.json',64*1024);
          assert.deepEqual(Object.keys(manifest).sort(),['schemaVersion','channel','sequence','version','publishedAt','artifact','releaseNotes','signerKeyId','signatureHex'].sort());
          assert.deepEqual(Object.keys(manifest.artifact).sort(),['url','sha256','sizeBytes'].sort());

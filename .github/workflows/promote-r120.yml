name: Verify signed R120 catalog candidate and promote stable
on:
  workflow_dispatch:
  push:
    branches: [r120-catalog-photos]
    paths: ['r120-signed-update.json', '.github/workflows/promote-r120.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: promote-r120
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Read exact successful build and reviewed public candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force incoming | Out-Null
          @'
          {
            "runId": "39055368056",
            "headSha": "4f2e632cd31efac61ef63fe671c6bbcd825f5970",
            "workflowSha256": "8c71f024b42af008e4a33b75fe62e2a43e9f8448d04e5d43f38f61875d6d8287",
            "patchSha256": "1379fa55aba7187a46335d3c93e1dd97b8c2deb04067f63dfa3823f355403c8c"
          }
          '@ | Set-Content incoming/build-pins.json -Encoding utf8NoBOM
          @'
          {
            "KF-R120-FULL.zip": {
              "sha256": "5daf1624acfba53aa91a45b00fd26777a9351efe19714de9519a40b1a6e50804",
              "sizeBytes": 589788469
            },
            "Klipper-Farm-R120-setup.exe": {
              "sha256": "d325bc14695fca4ecdbc285b0476992d013fb8c3da988dca3724c7be2ef97e95",
              "sizeBytes": 248297141
            },
            "R120-UI-proof.zip": {
              "sha256": "2d1dd8605a7904311d2090a4e9d431a65aeae3beb8d6351bf89799494f303b0a",
              "sizeBytes": 1375138
            },
            "provenance.json": {
              "sha256": "e87ac63350cbee5a24e37d407f9df8187204554c501e042904f8a9612a1ba2ed",
              "sizeBytes": 2019
            },
            "exact-validation.json": {
              "sha256": "991a8fdbc0edf42f547045bbb56398cf33817be6a31b4ae242e78deda1c67fba",
              "sizeBytes": 2006
            },
            "minimized-telemetry-r118.json": {
              "sha256": "fd5d500e73dcd3df7b96359fa65b8705052a34ede1442e470365c878f759625e",
              "sizeBytes": 2050
            }
          }
          '@ | Set-Content incoming/candidate-pins.json -Encoding utf8NoBOM
          $pins = Get-Content incoming/build-pins.json -Raw | ConvertFrom-Json
          if ($pins.runId -notmatch '^[1-9][0-9]+$' -or $pins.headSha -notmatch '^[0-9a-f]{40}$' -or $pins.workflowSha256 -notmatch '^[0-9a-f]{64}$' -or $pins.patchSha256 -notmatch '^[0-9a-f]{64}$') { throw 'Pin the successful final R120 run, head, workflow and patch before promotion' }
          foreach ($request in @(
            @{name='build-run.json';url="repos/$env:GITHUB_REPOSITORY/actions/runs/$($pins.runId)"},
            @{name='build-jobs.json';url="repos/$env:GITHUB_REPOSITORY/actions/runs/$($pins.runId)/jobs?per_page=100"},
            @{name='release.json';url="repos/$env:GITHUB_REPOSITORY/releases/tags/r120"}
          )) {
            $body = gh api $request.url
            if ($LASTEXITCODE -ne 0) { throw "Read-only verification request failed: $($request.name)" }
            [IO.File]::WriteAllText((Join-Path "$PWD/incoming" $request.name),($body -join [Environment]::NewLine),[Text.UTF8Encoding]::new($false))
          }
          foreach ($file in @(
            @{name='build-workflow.yml';path='.github/workflows/windows-r120.yml';head=$pins.headSha},
            @{name='update-v20.json';path='r120-signed-update.json';head=$env:GITHUB_SHA}
          )) {
            $encoded = gh api "repos/$env:GITHUB_REPOSITORY/contents/$($file.path)?ref=$($file.head)" --jq .content
            if ($LASTEXITCODE -ne 0 -or -not $encoded) { throw "Reviewed source retrieval failed: $($file.name)" }
            [IO.File]::WriteAllBytes((Join-Path "$PWD/incoming" $file.name),[Convert]::FromBase64String(($encoded -join '')))
          }
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/r120" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Release tag lookup failed' }
          $object = $tag.object
          if ($object.type -eq 'tag') {
            $annotated = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Annotated release tag lookup failed' }
            $object = $annotated.object
          }
          if ($object.type -ne 'commit') { throw 'Release tag does not resolve to a commit' }
          @{commitSha=$object.sha} | ConvertTo-Json | Set-Content incoming/tag-commit.json -Encoding utf8NoBOM
          gh release download r120 --repo $env:GITHUB_REPOSITORY --dir incoming --pattern Klipper-Farm-R120-setup.exe --pattern KF-R120-FULL.zip --pattern R120-UI-proof.zip --pattern provenance.json --pattern exact-validation.json --pattern minimized-telemetry-r118.json
          if ($LASTEXITCODE -ne 0) { throw 'Public exact candidate download failed' }
          $assetPins = Get-Content incoming/candidate-pins.json -Raw | ConvertFrom-Json
          foreach ($asset in $assetPins.PSObject.Properties) {
            $download = Join-Path "$PWD/incoming" $asset.Name
            if (-not (Test-Path $download -PathType Leaf) -or (Get-Item $download).Length -ne $asset.Value.sizeBytes -or (Get-FileHash $download).Hash.ToLowerInvariant() -ne $asset.Value.sha256) { throw "Public candidate bytes differ before ZIP inspection: $($asset.Name)" }
          }
          [IO.File]::WriteAllBytes((Join-Path $PWD 'incoming/reviewed-patch.json'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $PWD 'incoming/reviewed-files.json'),[Convert]::FromBase64String(''))
          Add-Type -AssemblyName System.IO.Compression.ZipFile
          function Assert-UniqueArchive($archive) {
            $names = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            foreach ($entry in $archive.Entries) {
              if (-not $names.Add($entry.FullName) -or $entry.FullName.Contains([char]92) -or $entry.FullName.StartsWith('/') -or @($entry.FullName.Split('/') | Where-Object { $_ -eq '..' -or $_ -eq '.' }).Count -gt 0) { throw 'Unsafe or duplicate archive path' }
            }
          }
          function Copy-BoundedEntry($archive,[string]$entryName,[string]$outputName,[long]$limit) {
            $entry = $archive.GetEntry($entryName)
            if (-not $entry -or $entry.Length -le 0 -or $entry.Length -gt $limit) { throw "Missing or oversized verified metadata: $entryName" }
            $inputStream = $entry.Open()
            $outputStream = [IO.File]::Create((Join-Path "$PWD/incoming" $outputName))
            try {
              $buffer = [byte[]]::new(65536); [long]$total = 0
              while (($count = $inputStream.Read($buffer,0,$buffer.Length)) -gt 0) {
                $total += $count
                if ($total -gt $limit -or $total -gt $entry.Length) { throw "Archive metadata exceeds its bounded declared size: $entryName" }
                $outputStream.Write($buffer,0,$count)
              }
              if ($total -ne $entry.Length) { throw "Truncated archive metadata: $entryName" }
            } finally { $outputStream.Dispose(); $inputStream.Dispose() }
          }
          $archive = [IO.Compression.ZipFile]::OpenRead((Join-Path $PWD 'incoming/KF-R120-FULL.zip'))
          try {
            Assert-UniqueArchive $archive
            if (@($archive.Entries | Where-Object { -not $_.FullName.StartsWith('Klipper-Farm-R120/') }).Count -ne 0) { throw 'Wrong frozen source ZIP root' }
            Copy-BoundedEntry $archive 'Klipper-Farm-R120/src/data/printerCatalog.json' 'printer-catalog.json' 2MB
            Copy-BoundedEntry $archive 'Klipper-Farm-R120/public/printer-catalog-credits/IMAGES.json' 'photo-ledger.json' 4MB
            $reviewed = Get-Content incoming/reviewed-files.json -Raw | ConvertFrom-Json
            $compiled = @()
            foreach ($file in $reviewed) {
              $entry = $archive.GetEntry('Klipper-Farm-R120/'+$file.path)
              if (-not $entry -or $entry.Length -le 0 -or $entry.Length -gt 8MB) { throw "Missing or oversized compiled reviewed source file: $($file.path)" }
              $stream = $entry.Open(); $sha = [Security.Cryptography.SHA256]::Create()
              try { $hash = [Convert]::ToHexString($sha.ComputeHash($stream)).ToLowerInvariant() } finally { $sha.Dispose(); $stream.Dispose() }
              $compiled += @{path=$file.path;sha256=$hash;sizeBytes=$entry.Length}
            }
            @{zipRoot='Klipper-Farm-R120/';sourceZipSha256=(Get-FileHash incoming/KF-R120-FULL.zip).Hash.ToLowerInvariant();regularFileCount=@($archive.Entries | Where-Object { -not $_.FullName.EndsWith('/') }).Count;files=$compiled} | ConvertTo-Json -Depth 5 | Set-Content incoming/compiled-source-files.json -Encoding utf8NoBOM
          } finally { $archive.Dispose() }
          $ui = [IO.Compression.ZipFile]::OpenRead((Join-Path $PWD 'incoming/R120-UI-proof.zip'))
          try {
            Assert-UniqueArchive $ui
            foreach ($item in @(
              @{entry='r120-images-ui-summary.json';output='ui-summary.json'},
              @{entry='printer-catalog-r119-report.json';output='ui-catalog.json'},
              @{entry='images-qa.json';output='ui-images.json'},
              @{entry='scope-report.json';output='ui-scope.json'},
              @{entry='operational-parity.json';output='ui-parity.json'},
              @{entry='ci-origin.json';output='ui-origin.json'}
            )) { Copy-BoundedEntry $ui ('offline-photos/'+$item.entry) $item.output 4MB }
          } finally { $ui.Dispose() }
      - name: Verify Ed25519, catalog and complete same-origin acceptance proofs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          
          const base=path.resolve(process.argv[2]??'.');
          const readJson=(name,max=1024*1024)=>{const file=path.join(base,name);assert(fs.statSync(file).size<=max,`${name} is too large`);return JSON.parse(fs.readFileSync(file,'utf8'))};
          const hash=async name=>{const digest=crypto.createHash('sha256');for await(const bytes of fs.createReadStream(path.join(base,name)))digest.update(bytes);return digest.digest('hex')};
          const buildPins=readJson('build-pins.json');
          assert.deepEqual(Object.keys(buildPins).sort(),['runId','headSha','workflowSha256','patchSha256'].sort());
          assert.match(buildPins.runId,/^[1-9][0-9]+$/,'Pin the successful complete R120 run before promotion');
          assert.match(buildPins.headSha,/^[0-9a-f]{40}$/,'Pin the exact complete R120 workflow commit');
          assert.match(buildPins.workflowSha256,/^[0-9a-f]{64}$/,'Pin the reviewed complete Windows workflow bytes');
          assert.match(buildPins.patchSha256,/^[0-9a-f]{64}$/,'Pin the reviewed final R120 patch bytes');
          const expectedRun=buildPins.runId,expectedHead=buildPins.headSha,expectedWorkflowSha256=buildPins.workflowSha256,expectedPatchSha256=buildPins.patchSha256;
          const patchSetSha256='1379fa55aba7187a46335d3c93e1dd97b8c2deb04067f63dfa3823f355403c8c';
          const reviewedWorkflowSha256='8c71f024b42af008e4a33b75fe62e2a43e9f8448d04e5d43f38f61875d6d8287';
          const reviewedFilesSha256='0876bb125b327717feb7cff4e0eaef01cb8a08c7a5a6ae126c758363a5dd716b';
          const photoLedgerSha256='15066da9d429a1e97007d15a9f47e057b48a9f263c30b66452b38bd93ac80a17';
          const photoRegistrySha256='70fb094e49332fcfdc4d7f3b13a2b352869bd78ded8a8ae3fe1d43a992be057c';
          assert.equal(expectedPatchSha256,patchSetSha256,'Only the frozen complete 488-file R120 patch set may be promoted');
          assert.equal(expectedWorkflowSha256,reviewedWorkflowSha256,'Only the reviewed complete Windows R120 workflow may be promoted');
          const catalogSha256='4e6a0f6b8491a417faaa35aa4252ea54742b1e2f778936f8183163e87831196b';
          const repository='sanozhukov3737-oss/klipper-farm-updates';
          const publicKeyHex='28e0124c33f42704483d1aac89af829c44a00ef5dbc2e93dff630befddd495eb';
          const files=['Klipper-Farm-R120-setup.exe','KF-R120-FULL.zip','R120-UI-proof.zip','provenance.json','exact-validation.json','minimized-telemetry-r118.json'];
          const expectedAssets=readJson('candidate-pins.json');
          assert.deepEqual(Object.keys(expectedAssets).sort(),[...files].sort(),'Provide exact reviewed hashes and sizes for every public candidate asset');
          for(const name of files){
           const pin=expectedAssets[name];assert.deepEqual(Object.keys(pin).sort(),['sha256','sizeBytes']);
           assert.match(pin.sha256,/^[0-9a-f]{64}$/,`Replace the reviewed ${name} hash placeholder`);
           assert(Number.isSafeInteger(pin.sizeBytes)&&pin.sizeBytes>0,`Replace the reviewed ${name} numeric size placeholder`);
          }
          assert(expectedAssets[files[0]].sizeBytes<=512*1024*1024,'Installer exceeds native updater size limit');
          const run=readJson('build-run.json');
          assert.equal(String(run.id),expectedRun);assert.equal(run.head_sha,expectedHead);assert.equal(run.head_branch,'r120-catalog-photos');
          assert.equal(run.event,'push');assert.equal(run.status,'completed');assert.equal(run.conclusion,'success');
          assert.equal(run.path.split('@')[0],'.github/workflows/windows-r120.yml');assert.equal(run.head_repository.full_name,repository);
          const jobs=readJson('build-jobs.json');assert.equal(jobs.jobs.length,3,'Exactly the three reviewed candidate workflow jobs are required');
          for(const name of ['build','validate','publish-candidate']){
           const matches=jobs.jobs.filter(job=>job.name===name);assert.equal(matches.length,1,`Exactly one ${name} job is required`);
           const job=matches[0];assert.equal(job.status,'completed');assert.equal(job.conclusion,'success');
           assert(job.steps.length>0&&job.steps.every(step=>step.status==='completed'&&step.conclusion==='success'),`Every ${name} step must have passed`);
          }
          assert.equal(await hash('build-workflow.yml'),expectedWorkflowSha256,'Reviewed complete build and acceptance workflow differs');
          assert.equal(await hash('reviewed-patch.json'),expectedPatchSha256,'Reviewed R120 patch differs');
          const fragments=readJson('reviewed-patch.json');
          assert.deepEqual(fragments,[
           {name:'r120-image-patch-01.json',size:23022996,sha256:'d481e6d36da3cfbf0fd34b8a626579c821bd208a0c1149e05b0e03fdfd29c391'},
           {name:'r120-image-patch-02.json',size:23046252,sha256:'ddc41a432a9f2f241414df9b6d1d58db32a56927d59eecc942f6d0b710917142'},
           {name:'r120-image-patch-03.json',size:16391736,sha256:'d0f03dcea357c355d5072710ce9f131f6ee5afb74b8c483733ce79461a304720'},
          ]);
          assert.equal(await hash('reviewed-files.json'),reviewedFilesSha256,'The frozen source file review differs');
          const reviewedFiles=readJson('reviewed-files.json'),compiled=readJson('compiled-source-files.json',2*1024*1024);
          assert.equal(reviewedFiles.length,488);assert.equal(new Set(reviewedFiles.map(row=>row.path.toLowerCase())).size,488);
          assert.equal(compiled.zipRoot,'Klipper-Farm-R120/');assert.equal(compiled.sourceZipSha256,expectedAssets['KF-R120-FULL.zip'].sha256);
          assert(Number.isSafeInteger(compiled.regularFileCount)&&compiled.regularFileCount>=1062,'Incomplete frozen source inventory');
          assert.equal(compiled.files.length,488);assert.equal(new Set(compiled.files.map(row=>row.path.toLowerCase())).size,488);
          const compiledByPath=new Map(compiled.files.map(row=>[row.path,row]));
          for(const row of reviewedFiles){
           const actual=compiledByPath.get(row.path);assert(actual,`Missing compiled reviewed file: ${row.path}`);
           assert.deepEqual(Object.keys(actual).sort(),['path','sha256','sizeBytes']);assert.equal(actual.sha256,row.afterSha256,`Compiled source differs: ${row.path}`);
           assert(Number.isSafeInteger(actual.sizeBytes)&&actual.sizeBytes>0,`Empty compiled reviewed file: ${row.path}`);
          }
          const release=readJson('release.json');assert.equal(release.tag_name,'r120');assert.equal(release.prerelease,true);assert.equal(release.draft,false);assert.equal(release.target_commitish,expectedHead);
          assert.equal(readJson('tag-commit.json').commitSha,expectedHead,'Release tag points to a different source commit');
          const provenance=readJson('provenance.json'),validation=readJson('exact-validation.json'),minimized=readJson('minimized-telemetry-r118.json');
          assert.equal(provenance.workflowCommit,expectedHead);assert.equal(provenance.sequence,120);assert.equal(provenance.baselineSequence,119);
          assert.equal(provenance.buildId,'V20.6-R12.0-CATALOG-IMAGES-2026-10-17');assert.equal(provenance.patchSha256,expectedPatchSha256);
          assert.equal(provenance.baselineSourceSha256,'d2d4feb12370a707ae38ec4638f037bdaae57631e2097f03c25aa0fc4a0b60f5');
          assert.equal(provenance.baselineSetupSha256,'ce69dc1f9a530c247daa3d71a395e08480c925e0ab51f0b97f28e9be32f3ef62');
          assert.equal(provenance.setupSha256,expectedAssets[files[0]].sha256);assert.equal(provenance.sourceSha256,expectedAssets[files[1]].sha256);
          assert.equal(provenance.printerCatalogSha256,catalogSha256);assert.equal(provenance.printerCatalogSchemaVersion,1);assert.equal(provenance.printerCatalogModelCount,500);
          assert.deepEqual(provenance.patchFragments,fragments);assert.equal(provenance.photoLedgerSha256,photoLedgerSha256);assert.equal(provenance.photoRegistrySha256,photoRegistrySha256);
          assert.equal(provenance.photoModelCount,471);assert.equal(provenance.photoPreservedIllustrations,5);assert.equal(provenance.photoRemainingSilhouettes,24);
          assert.equal(provenance.catalogUiCases,15);assert.equal(provenance.offlinePhotosVerified,true);
          assert(Number.isSafeInteger(provenance.photoBytes)&&provenance.photoBytes>0&&provenance.photoBytes<=48*1024*1024);
          assert.equal(await hash('printer-catalog.json'),catalogSha256,'The catalog extracted from reviewed source differs');
          const catalog=readJson('printer-catalog.json',2*1024*1024);assert.equal(catalog.schemaVersion,1);assert.equal(catalog.models.length,500);
          assert.equal(new Set(catalog.models.map(model=>model.id)).size,500,'Catalog IDs must remain unique');
          assert.equal(await hash('photo-ledger.json'),photoLedgerSha256,'Frozen original image and credit ledger differs');
          const ledger=readJson('photo-ledger.json',4*1024*1024);assert.equal(ledger.schemaVersion,1);assert.equal(ledger.catalogModels,500);assert.equal(ledger.imageModels,471);assert.equal(ledger.existingArtworkModels,5);assert.equal(ledger.images.length,471);
          assert.equal(new Set(ledger.images.map(row=>row.catalogId)).size,471);const catalogIds=new Set(catalog.models.map(row=>row.id));
          for(const photo of ledger.images){assert(catalogIds.has(photo.catalogId));assert.equal(compiledByPath.get(photo.asset)?.sha256,photo.sha256,`Original image bytes changed: ${photo.catalogId}`);assert.equal(compiledByPath.get(photo.asset)?.sizeBytes,photo.sizeBytes);assert.equal(photo.bytesModified,false);}
          assert.equal(ledger.images.reduce((sum,row)=>sum+row.sizeBytes,0),provenance.photoBytes);
          const uiSummary=readJson('ui-summary.json'),ui=readJson('ui-catalog.json'),images=readJson('ui-images.json'),scope=readJson('ui-scope.json'),parity=readJson('ui-parity.json'),origin=readJson('ui-origin.json');
          assert.equal(uiSummary.passed,true);assert.equal(uiSummary.windowsEdgeUICases,15);assert.equal(uiSummary.offlinePhotoModels,471);assert.equal(uiSummary.remainingSilhouettes,24);assert.equal(uiSummary.preservedIllustrations,5);assert.equal(uiSummary.externalImageRequests,0);assert.equal(uiSummary.productionFrontendBuilt,true);assert.equal(uiSummary.operationalParity,true);assert(uiSummary.screenshots>=9);
          assert.equal(ui.passed,15);assert.equal(ui.offline,true);assert.equal(ui.report.length,15);assert(ui.report.every(row=>row.passed===true));
          assert.equal(new Set(ui.report.map(row=>JSON.stringify([row.case,row.theme??null,row.width??null]))).size,15,'Duplicate UI acceptance case');
          assert.deepEqual(ui.report.filter(row=>row.case==='picker').map(row=>[row.theme,row.width]).sort(),['dark','light'].flatMap(theme=>[390,910,1536].map(width=>[theme,width])).sort());
          assert.deepEqual(ui.report.filter(row=>row.case==='setup-layout').map(row=>row.width).sort((a,b)=>a-b),[390,910]);
          assert.deepEqual([...new Set(ui.report.map(row=>row.case))].sort(),['picker','local-model-images-offline','setup-layout','settings-save-reload-cancel','settings-late-detection','settings-change-during-key-validation','settings-close-during-key-validation','first-setup','discovery'].sort());
          for(const row of ui.report.filter(row=>row.case==='picker')){assert.equal(row.models,500);assert.equal(row.mounted,24);assert.equal(row.offlineSearch,true);}
          for(const row of ui.report.filter(row=>row.case==='setup-layout')){assert.equal(row.headerReachable,true);assert.equal(row.footerReachable,true);}
          const uiCase=name=>ui.report.find(row=>row.case===name);
          for(const [name,flags] of Object.entries({'settings-save-reload-cancel':['metadataOnly'],'settings-late-detection':['manualChoicePreserved'],'settings-change-during-key-validation':['staleDraftNotSaved','retrySavesLatestModel'],'settings-close-during-key-validation':['closedDraftNotSaved'],'first-setup':['lateVerificationIgnored','unknownDetectionPreservesChoice'],'discovery':['perDeviceChoice','selectionSurvivesDetection']}))for(const flag of flags)assert.equal(uiCase(name)[flag],true,`Missing actual positive UI proof ${name}.${flag}`);
          assert.equal(uiCase('settings-save-reload-cancel').runtimePresets,5);assert.equal(uiCase('first-setup').nativePreset,'custom');
          const photoCase=uiCase('local-model-images-offline');assert.equal(photoCase.firstPageImages,24);assert.equal(photoCase.externalImageRequests,0);assert.equal(photoCase.registeredImages,471);assert.equal(photoCase.filteredImageModels,471);assert(photoCase.decodedImageInstances>=495);assert.equal(uiSummary.decodedImageInstances,photoCase.decodedImageInstances);
          assert.equal(images.passed,true);assert.equal(images.offlineAssets,true);assert.equal(images.reviewedBytesPreserved,true);assert.equal(images.reviewedPhotoModels,471);assert.equal(images.preservedIllustrations,5);assert.equal(images.remainingSilhouettes,24);assert.equal(images.imageBytes,provenance.photoBytes);
          assert.equal(scope.passed,true);assert.equal(scope.baselineSha256,provenance.baselineSourceSha256);assert.equal(scope.reviewedFiles,488);assert.equal(scope.nativeAndOperationalParity,true);assert(scope.protectedUnchangedFiles>=574);
          assert.equal(parity.passed,true);assert.equal(parity.unchangedOperationalStatements,26);assert.equal(parity.allowedArtworkBodies,1);assert.equal(parity.allowedRegistryImports,1);assert.equal(parity.selectionProfilesSearchConnectionHintsUnchanged,true);
          assert.equal(origin.repository,repository);assert.equal(origin.headSha,expectedHead);assert.equal(String(origin.runId),expectedRun);assert.equal(origin.workflow,'windows-r120.yml');assert.equal(origin.baselineSha256,provenance.baselineSourceSha256);assert.equal(origin.uiOnly,false);
          assert.equal(validation.candidateBuildHeadSha,expectedHead);assert.equal(String(validation.candidateBuildRunId),expectedRun);assert.equal(String(validation.validationRunId),expectedRun);
          assert.equal(validation.patchSha256,expectedPatchSha256);assert.equal(validation.setupSha256,provenance.setupSha256);assert.equal(validation.sourceSha256,provenance.sourceSha256);
          assert.equal(validation.baselineSequence,119);assert.equal(validation.sequence,120);assert.equal(validation.baselineSourceSha256,provenance.baselineSourceSha256);assert.equal(validation.baselineSetupSha256,provenance.baselineSetupSha256);
          assert.deepEqual(validation.patchFragments,fragments);assert.equal(validation.photoLedgerSha256,photoLedgerSha256);assert.equal(validation.photoModelCount,471);assert.equal(validation.catalogUiCases,15);assert.equal(validation.offlinePhotosVerified,true);
          assert.equal(validation.minimizedHarnessSha256,'cdf740bd7e09dde834a10ef649045addb48ca07fe442d6a53bbd879df09e19ff');

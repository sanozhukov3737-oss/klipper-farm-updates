          for(const flag of ['fullR119UpgradeVerified','dataPreservationVerified','originalFourLifecycleModesVerified','allThreeDoubleLaunchesVerified','installedSmokeVerified','minimizedTelemetryDisconnectReconnectRestoreVerified'])assert.equal(validation[flag],true,`${flag} is missing`);

          const unsigned={schemaVersion:manifest.schemaVersion,channel:manifest.channel,sequence:manifest.sequence,version:manifest.version,publishedAt:manifest.publishedAt,artifact:{url:manifest.artifact.url,sha256:manifest.artifact.sha256,sizeBytes:manifest.artifact.sizeBytes},releaseNotes:manifest.releaseNotes,signerKeyId:manifest.signerKeyId};
          const publicKey=crypto.createPublicKey({key:Buffer.concat([Buffer.from('302a300506032b6570032100','hex'),Buffer.from(publicKeyHex,'hex')]),type:'spki',format:'der'});
          const signingBytes=Buffer.concat([Buffer.from('klipper-farm-update-manifest-v1\0'),Buffer.from(JSON.stringify(unsigned))]);
          assert(crypto.verify(null,signingBytes,publicKey,Buffer.from(manifest.signatureHex,'hex')),'The Ed25519 signature does not match the installed publisher public key');
          const hashes={};
          for(const name of files){
           const sha=await hash(name),size=fs.statSync(path.join(base,name)).size,assets=release.assets.filter(value=>value.name===name);
           assert.deepEqual({sha256:sha,sizeBytes:size},expectedAssets[name],`Public asset differs from exact reviewed candidate: ${name}`);
           assert.equal(assets.length,1,`Exactly one public release asset ${name} is required`);assert.equal(assets[0].digest,`sha256:${sha}`);assert.equal(assets[0].size,size);
           hashes[name]={sha256:sha,sizeBytes:size};
          }
          assert.equal(hashes[files[0]].sha256,manifest.artifact.sha256);assert.equal(hashes[files[0]].sizeBytes,manifest.artifact.sizeBytes);
          hashes['update-v20.json']={sha256:await hash('update-v20.json'),sizeBytes:fs.statSync(path.join(base,'update-v20.json')).size};
          fs.writeFileSync(path.join(base,'SHA256SUMS.txt'),Object.entries(hashes).map(([name,entry])=>`${entry.sha256} *${name}`).join('\n')+'\n');
          fs.writeFileSync(path.join(base,'promotion-attestation.json'),JSON.stringify({schemaVersion:1,buildRunId:expectedRun,buildHeadSha:expectedHead,buildWorkflowSha256:expectedWorkflowSha256,patchSha256:expectedPatchSha256,patchFragments:fragments,reviewedFilesSha256,exactCompiledPatchFiles:488,sourceAndInstalledValidationSameRun:true,printerCatalogSha256:catalogSha256,printerCatalogModelCount:500,photoLedgerSha256,photoRegistrySha256,photoModels:471,preservedIllustrations:5,remainingSilhouettes:24,catalogUiCases:15,offlinePhotosVerified:true,releaseId:release.id,publicKeyHex,ed25519SignatureVerified:true,assets:hashes},null,2)+'\n');
          console.log('R120 promotion verification passed: complete same-origin build/installed validation/publication, 488 exact compiled patch files, 471 offline original photos and 15 UI cases, R119 upgrade/minimized proof, Ed25519 signature and exact public installer/source hashes.');
          '@ | Set-Content verify-r120-promotion.mjs -Encoding utf8NoBOM
          node verify-r120-promotion.mjs incoming
          if ($LASTEXITCODE -ne 0) { throw 'Signed exact candidate verification failed' }
          @'
          В каталог 500 моделей добавлены 471 локальное изображение. Вместе с 5 сохранёнными иллюстрациями изображение есть у 476 моделей; для 24 оставлен явный условный силуэт. Изображения и сведения об источниках доступны без интернета.

          Выбранная карточка сохраняет название и изображение модели. Рабочий профиль, команды печати, подключение, авторизация и управление подсветкой сохранены. Наличие карточки или изображения не подтверждает поддержку штатной прошивки; требуется доступный Klipper/Moonraker.

          Проверено на Windows: 15 сценариев каталога, декодирование всех 471 новых изображений без внешних запросов, обновление поверх R119 с сохранением данных, четыре сценария завершения, три двойных запуска и телеметрия при сворачивании с потерей и восстановлением связи. Проверки устройств используют синтетический локальный принтер; реальные принтеры проверяются на пользовательском ПК.

          Установка: Klipper-Farm-R120-setup.exe или штатное обновление. Исходники: KF-R120-FULL.zip. Подписанное обновление: stable, последовательность 120.
          '@ | Set-Content incoming/release-notes-ru.md -Encoding utf8NoBOM
          New-Item -ItemType Directory -Force verified | Out-Null
          Copy-Item incoming/update-v20.json,incoming/SHA256SUMS.txt,incoming/promotion-attestation.json,incoming/release-notes-ru.md,incoming/build-pins.json verified/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-R120-Promotion-Verified
          path: verified/
          if-no-files-found: error
          retention-days: 30
  promote:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Klipper-Farm-R120-Promotion-Verified
          path: verified
      - name: Recheck public candidate and publish verified signed stable update
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location verified
          $proof = Get-Content promotion-attestation.json -Raw | ConvertFrom-Json
          $pins = Get-Content build-pins.json -Raw | ConvertFrom-Json
          if ($proof.exactCompiledPatchFiles -ne 488 -or $proof.photoModels -ne 471 -or $proof.preservedIllustrations -ne 5 -or $proof.remainingSilhouettes -ne 24 -or $proof.catalogUiCases -ne 15 -or -not $proof.offlinePhotosVerified) { throw 'Missing verified R120 photo/source acceptance' }
          if ($proof.buildRunId -ne $pins.runId -or $proof.buildHeadSha -ne $pins.headSha -or $proof.buildWorkflowSha256 -ne $pins.workflowSha256 -or $proof.patchSha256 -ne $pins.patchSha256 -or -not $proof.sourceAndInstalledValidationSameRun -or -not $proof.ed25519SignatureVerified -or $proof.printerCatalogModelCount -ne 500) { throw 'Wrong verified promotion artifact' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/r120" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Final prerelease lookup failed' }
          if ($release.id -ne $proof.releaseId -or -not $release.prerelease -or $release.draft -or $release.target_commitish -ne $pins.headSha) { throw 'Candidate release changed after verification' }
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/r120" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Final release tag lookup failed' }
          $object = $tag.object
          if ($object.type -eq 'tag') {
            $annotated = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Final annotated release tag lookup failed' }
            $object = $annotated.object
          }
          if ($object.type -ne 'commit' -or $object.sha -ne $pins.headSha) { throw 'Candidate tag changed after verification' }
          foreach ($name in @('Klipper-Farm-R120-setup.exe','KF-R120-FULL.zip','R120-UI-proof.zip','provenance.json','exact-validation.json','minimized-telemetry-r118.json')) {
            $expected = $proof.assets.$name
            $assets = @($release.assets | Where-Object name -eq $name)
            if ($assets.Count -ne 1 -or $assets[0].digest -ne ('sha256:'+$expected.sha256) -or $assets[0].size -ne $expected.sizeBytes) { throw "Public asset changed after verification: $name" }
          }
          if ((Get-FileHash update-v20.json).Hash.ToLowerInvariant() -ne $proof.assets.'update-v20.json'.sha256 -or (Get-Item update-v20.json).Length -ne $proof.assets.'update-v20.json'.sizeBytes) { throw 'Verified signed manifest changed' }
          $upload = @{}
          foreach ($name in @('update-v20.json','SHA256SUMS.txt','promotion-attestation.json')) { $upload[$name] = @{sha256=(Get-FileHash $name).Hash.ToLowerInvariant();sizeBytes=(Get-Item $name).Length} }
          gh release upload r120 update-v20.json SHA256SUMS.txt promotion-attestation.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Verified public manifest upload failed' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/r120" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.id -ne $proof.releaseId -or -not $release.prerelease -or $release.draft -or $release.target_commitish -ne $pins.headSha) { throw 'Uploaded candidate identity changed' }
          foreach ($name in $upload.Keys) {
            $assets = @($release.assets | Where-Object name -eq $name)
            if ($assets.Count -ne 1 -or $assets[0].digest -ne ('sha256:'+$upload[$name].sha256) -or $assets[0].size -ne $upload[$name].sizeBytes) { throw "Uploaded verified asset differs: $name" }
          }
          foreach ($name in @('Klipper-Farm-R120-setup.exe','KF-R120-FULL.zip','R120-UI-proof.zip','provenance.json','exact-validation.json','minimized-telemetry-r118.json')) {
            $expected = $proof.assets.$name
            $assets = @($release.assets | Where-Object name -eq $name)
            if ($assets.Count -ne 1 -or $assets[0].digest -ne ('sha256:'+$expected.sha256) -or $assets[0].size -ne $expected.sizeBytes) { throw "Candidate asset changed during verified manifest upload: $name" }
          }
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/r120" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Immediate pre-promotion tag lookup failed' }
          $object = $tag.object
          if ($object.type -eq 'tag') {
            $annotated = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Immediate annotated tag lookup failed' }
            $object = $annotated.object
          }
          if ($object.type -ne 'commit' -or $object.sha -ne $pins.headSha) { throw 'Candidate tag changed during verified manifest upload' }
          gh release edit r120 --repo $env:GITHUB_REPOSITORY --prerelease=false --latest --title 'Klipper Farm R120 — изображения 476 моделей принтеров' --notes-file release-notes-ru.md
          if ($LASTEXITCODE -ne 0) { throw 'Verified stable promotion failed' }

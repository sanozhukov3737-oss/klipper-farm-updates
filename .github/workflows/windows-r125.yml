reach ($marker in @($provenance.javascript,$provenance.stylesheet,$provenance.cameraWorker,'camera-detector/obico-failure-5a6b1be1fa.onnx','camera-detector/ort-wasm-simd-threaded.wasm','\"installedSequence\": 125','28e0124c33f42704483d1aac89af829c44a00ef5dbc2e93dff630befddd495eb')) {\n  if (-not $desktopText.Contains($marker)) { throw \"Installed R125 resource or channel missing: $marker\" }\n}\nnode scripts/check-headless-telemetry-runtime.mjs --daemon \"$installDir/klipper-farmd.exe\" --probe \"$release/klipper-farm-ipc-probe.exe\"\nif ($LASTEXITCODE -ne 0) { throw 'Installed telemetry failed' }\ngh release download r124 --repo $env:GITHUB_REPOSITORY --pattern Klipper-Farm-R124-setup.exe --dir old\nif ($LASTEXITCODE -ne 0) { throw 'Published R124 download failed' }\n$oldSetup = (Resolve-Path old/Klipper-Farm-R124-setup.exe).Path\nif ((Get-Item $oldSetup).Length -ne 232487108) { throw 'R124 installer size mismatch' }\nif ((Get-FileHash $oldSetup -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f1e0b36ae0ea9ee25ad7f582bf53d8cb67cec722b8cf75ae2f84c35cac934dc1') { throw 'R124 hash mismatch' }\n$oldInstall = Start-Process $oldSetup -ArgumentList ('/S /D=' + $installDir) -Wait -PassThru\nif ($oldInstall.ExitCode -ne 0) { throw 'R124 baseline install failed' }\n$baseline = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($desktop))\nif ($baseline -notmatch '\"installedSequence\"\\s*:\\s*124') { throw 'R124 baseline is not physically installed' }\n$dataDir = Join-Path $env:APPDATA 'app.klipper.farm'\nNew-Item -ItemType Directory -Force $dataDir | Out-Null\n$marker = Join-Path $dataDir 'updater-r124-preserve.txt'\n[IO.File]::WriteAllText($marker,'preserve-r124-data')\npython scripts/legacy-spools-proof.py seed --database (Join-Path $dataDir 'farm.sqlite3') --proof legacy-spools-seed.json\nif ($LASTEXITCODE -ne 0) { throw 'Could not seed actual R124 legacy spool data' }\n\n$cacheRoot = Join-Path $env:LOCALAPPDATA 'app.klipper.farm/verified-updates'\n$cleanupProbe = Join-Path $cacheRoot ([guid]::NewGuid().ToString('N'))\nNew-Item -ItemType Directory -Force $cleanupProbe | Out-Null\n[IO.File]::WriteAllText((Join-Path $cleanupProbe 'installer.exe'),'unprotected-test-cache-fixture')\n$oldDesktop = Start-Process $desktop -PassThru\nWait-UpgradeActualWindow -Process $oldDesktop -Case 'R124-before-update-helper' -OutputDirectory $inlineProof\n$cleanupDeadline = [DateTime]::UtcNow.AddSeconds(12)\nwhile ((Test-Path $cleanupProbe) -and [DateTime]::UtcNow -lt $cleanupDeadline) { Start-Sleep -Milliseconds 100 }\n\"Synthetic cache survives startup: $(Test-Path $cleanupProbe)\"\n$startupLog = Join-Path $env:APPDATA 'app.klipper.farm/logs/desktop-startup.log'\nif (Test-Path $startupLog) { Get-Content $startupLog -Tail 25 }\n$helperText = Get-Content scripts/apply-online-update.ps1 -Raw -Encoding UTF8\nif (-not $desktopText.Contains($helperText)) { throw 'Candidate helper differs from the one embedded in R125' }\n# Validation-only fixture correction. Run after R124 actual-window confirmation.\n# Build fixture trees outside the live cache so startup cleanup never sees\n# partially constructed directories. All test assertions remain unchanged.\n$cacheRoot = Join-Path $env:LOCALAPPDATA 'app.klipper.farm/verified-updates'\n[IO.Directory]::CreateDirectory($cacheRoot) | Out-Null\n$stageRoot = Join-Path $env:LOCALAPPDATA ('Klipper Farm R125 fixture staging ' + [guid]::NewGuid().ToString('N'))\n[IO.Directory]::CreateDirectory($stageRoot) | Out-Null\n$attemptName = [guid]::NewGuid().ToString('N')\n$legacyName = [guid]::NewGuid().ToString('N')\n$partialName = [guid]::NewGuid().ToString('N')\n$attemptStage = Join-Path $stageRoot $attemptName\n$legacyStage = Join-Path $stageRoot $legacyName\n$partialStage = Join-Path $stageRoot $partialName\nforeach ($directory in @($attemptStage,$legacyStage,$partialStage)) {\n  [IO.Directory]::CreateDirectory($directory) | Out-Null\n}\n$attempt = Join-Path $cacheRoot $attemptName\n$legacy = Join-Path $cacheRoot $legacyName\n$partial = Join-Path $cacheRoot $partialName\n$cachedSetup = Join-Path $attempt 'installer.exe'\n$ready = Join-Path $attempt 'helper-ready'\ntry {\n  Copy-Item $setup (Join-Path $attemptStage 'installer.exe')\n  [IO.File]::WriteAllText((Join-Path $attemptStage 'manifest.json'),'synthetic-signed-manifest-fixture')\n  # The active owner is already alive before this attempt enters the live cache.\n  [IO.File]::WriteAllText((Join-Path $attemptStage 'helper-ready'),(@{helperPid=$PID} | ConvertTo-Json -Compress))\n  foreach ($directory in @($legacyStage,$partialStage)) {\n    [IO.File]::WriteAllText((Join-Path $directory 'installer.exe'),'abandoned-cache-fixture')\n  }\n  [IO.File]::WriteAllText((Join-Path $legacyStage 'helper-ready'),'ready')\n  [IO.File]::WriteAllText((Join-Path $legacyStage 'install-result.txt'),'Installed successfully')\n  # Same-volume directory moves expose each completed fixture atomically.\n  [IO.Directory]::Move($attemptStage,$attempt)\n  [IO.Directory]::Move($legacyStage,$legacy)\n  [IO.Directory]::Move($partialStage,$partial)\n} finally {\n  if (Test-Path -LiteralPath $stageRoot) {\n    Remove-Item -LiteralPath $stageRoot -Recurse -Force\n  }\n}\n$keep = Join-Path (Split-Path -Parent $cacheRoot) 'keep-update-cache-test.txt'\n[IO.File]::WriteAllText($keep,'preserve-unrelated-file')\n# Continue unchanged: payload, helper handshake, R124 close, physical update,\n# cleanup assertions, unchanged neighbor/data, lifecycle and telemetry proofs.\n$payload = @{parentPid=$oldDesktop.Id;executable=$desktop;installer=$cachedSetup;sha256=$provenance.setupSha256;sizeBytes=(Get-Item $setup).Length;ready=$ready;cacheRoot=$cacheRoot} | ConvertTo-Json -Compress\n$start = [Diagnostics.ProcessStartInfo]::new()\n$start.FileName = \"$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe\"\n$start.UseShellExecute = $false\n$start.RedirectStandardInput = $true\n$start.RedirectStandardOutput = $true\n$start.RedirectStandardError = $true\n$start.CreateNoWindow = $true\n$start.EnvironmentVariables.Remove('PSModulePath')\n$helperDebugPrefix = '$ProgressPreference = ''SilentlyContinue''; Set-PSDebug -Trace 1;' + [Environment]::NewLine\nforeach ($argument in @('-NoProfile','-NonInteractive','-Command',($helperDebugPrefix + $helperText))) { $start.ArgumentList.Add($argument) }\n$helper = [Diagnostics.Process]::Start($start)\n$outRead = $helper.StandardOutput.ReadToEndAsync()\n$errRead = $helper.StandardError.ReadToEndAsync()\n$handshakeStarted = [Diagnostics.Stopwatch]::StartNew()\n$helper.StandardInput.Write($payload)\n$helper.StandardInput.Close()\n$actualHelperReady = {\n  if (-not (Test-Path $ready)) { return $false }\n  try { return (Get-Content $ready -Raw | ConvertFrom-Json).helperPid -eq $helper.Id } catch { return $false }\n}\n$deadline = [DateTime]::UtcNow.AddSeconds(15)\nwhile (-not (& $actualHelperReady) -and -not $helper.HasExited -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 100 }\nif (-not (& $actualHelperReady)) {\n  Write-Host ('HELPER process: ' + ($helper | Select-Object Id,MainWindowTitle,TotalProcessorTime,StartTime | ConvertTo-Json -Compress))\n  Get-ChildItem $cacheRoot -Recurse -Force | Select-Object FullName,Length | ConvertTo-Json -Compress | Write-Host\n  if (Test-Path (Join-Path $cacheRoot 'last-error.txt')) { Get-Content (Join-Path $cacheRoot 'last-error.txt') }\n  Write-Host \"HELPER handshake elapsedMs=$($handshakeStarted.ElapsedMilliseconds) exited=$($helper.HasExited)\"\n  if (Test-Path install-result.txt) { Get-Content install-result.txt }\n  if (-not $helper.HasExited) { $helper.Kill(); $helper.WaitForExit(10000) | Out-Null }\n  $null = $outRead.Wait(5000)\n  $null = $errRead.Wait(5000)\n  if ($outRead.IsCompleted) { $outRead.Result | Set-Content helper-stdout.txt; Write-Host $outRead.Result }\n  if ($errRead.IsCompleted) { $errRead.Result | Set-Content helper-stderr.txt; Write-Host $errRead.Result }\n  throw 'Updater handshake failed'\n}\n\"HELPER ready elapsedMs=$($handshakeStarted.ElapsedMilliseconds)\"\nif (-not (Close-UpgradeActualWindow -Process $oldDesktop -Case 'R124-close-for-upgrade' -OutputDirectory $inlineProof) -or -not $oldDesktop.WaitForExit(20000)) { throw 'R124 did not close cleanly' }\nif (-not $helper.WaitForExit(120000)) { $helper.Kill(); throw 'Update helper timeout' }\nif ($helper.ExitCode -ne 0) { $outRead.Result; $errRead.Result; throw 'Update helper failed' }\n$deadline = [DateTime]::UtcNow.AddSeconds(12)\nwhile (((Test-Path $attempt) -or (Test-Path $legacy) -or (Test-Path $partial)) -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 150 }\nforeach ($path in @($attempt,$legacy,$partial)) { if (Test-Path $path) { throw \"Update cache was not cleaned: $path\" } }\nif ((Get-Content -LiteralPath $keep -Raw) -ne 'preserve-unrelated-file') { throw 'Unrelated cache neighbor was changed' }\n'Update cache runtime OK: active installer attempt, legacy completed update and partial download removed; unrelated file preserved'\nforeach ($name in @('klipper-farm-client.exe','klipper-farmd.exe')) {\n  $hash = (Get-FileHash (Join-Path $installDir $name)).Hash\n  \"UPDATED $name hash=$hash matchesR125=$($hash -eq $expected[$name])\"\n  if ($hash -ne $expected[$name]) { throw \"Wrong installed R125 payload: $name\" }\n}\nif ((Get-Content $marker -Raw) -ne 'preserve-r124-data') { throw 'App data was removed' }\n$restarted = @(Get-Process -Name klipper-farm-client -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $desktop })\nif ($restarted.Count -eq 0) { throw 'R125 was not relaunched' }\nforeach ($process in $restarted) {\n  Wait-UpgradeActualWindow -Process $process -Case 'R125-relaunched-before-close' -OutputDirectory $inlineProof\n  if ($process.HasExited -or -not (Close-UpgradeActualWindow -Process $process -Case 'R125-relaunched-close' -OutputDirectory $inlineProof) -or -not $process.WaitForExit(20000)) { throw 'R125 window lifecycle failed' }\n}\nforeach ($process in @(Get-Process -Name klipper-farmd -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq (Join-Path $installDir 'klipper-farmd.exe') })) { if (-not $process.WaitForExit(10000)) { throw 'Sidecar survived desktop shutdown' } }\n& scripts/check-desktop-exit-actual-window-r117.ps1 -Desktop $desktop -OutputDirectory (Join-Path $PWD 'main-window-proof')\nNew-Item -ItemType Directory -Force smoke | Out-Null\nnode scripts/check-desktop-startup-smoke.mjs \"$installDir/klipper-farm-client.exe\" \"$installDir/klipper-farmd.exe\" \"$PWD/smoke\"\nif ($LASTEXITCODE -ne 0) { throw 'Installed desktop smoke failed' }\n$minimizedProof = Join-Path $env:RUNNER_TEMP 'R125 minimized private validation'\n& scripts/check-minimized-telemetry-r118.ps1 -DesktopExe $desktop -ProbeExe (Join-Path $release 'klipper-farm-ipc-probe.exe') -EmulatorScript (Join-Path $PWD 'scripts/hardware-emulator.mjs') -OutputDirectory $minimizedProof\nif (-not $?) { throw 'Installed desktop minimize/restore telemetry proof failed' }\nNew-Item -ItemType Directory -Force minimized-telemetry-proof | Out-Null\nCopy-Item (Join-Path $minimizedProof 'minimized-telemetry-r118.json') minimized-telemetry-proof/\n$startupProof = Join-Path $env:RUNNER_TEMP 'R125 startup private validation'\n& scripts/check-startup-instance-r117.ps1 -DesktopExe $desktop -OutputDirectory $startupProof\nif (-not $?) { throw 'Actual installed desktop concurrent startup regression failed' }\nNew-Item -ItemType Directory -Force startup-instance-proof | Out-Null\nCopy-Item (Join-Path $startupProof 'startup-instance-r117.json') startup-instance-proof/\n$windowProof = Get-Content main-window-proof/main-window-lifecycle-r117.json -Raw | ConvertFrom-Json\nif (($windowProof.completedModes -join ',') -ne 'close-during-startup,normal-close,force-desktop,recovery-close' -or $windowProof.exitWaitMs -ne 20000 -or $windowProof.earlyCloseWaitsForPageReady -ne $false) { throw 'Complete original lifecycle coverage or timing changed' }\n$startup = Get-Content startup-instance-proof/startup-instance-r117.json -Raw | ConvertFrom-Json\nif ($startup.cases.Count -ne 3) { throw 'Three real double-launch proofs are required' }\npython scripts/legacy-spools-proof.py verify --database (Join-Path $dataDir 'farm.sqlite3') --proof legacy-spools-r125-report.json\nif ($LASTEXITCODE -ne 0) { throw 'Physical R124 to R125 upgrade changed legacy spool bytes' }\n$legacySpools = Get-Content legacy-spools-r125-report.json -Raw | ConvertFrom-Json\n$nativeFilament = Get-Content filament-native-r125-report.json -Raw | ConvertFrom-Json\nif (-not $legacySpools.passed -or -not $legacySpools.legacySpoolBytesPreserved -or -not $nativeFilament.passed -or $nativeFilament.caseCount -ne 5) { throw 'Actual preservation or native transaction proof missing' }\n$external = @{schemaVersion=1;newRegressionProof=$provenance.newRegressionProof;acceptanceContractSha256=$provenance.acceptanceContractSha256;newRegressionSummarySha256=$provenance.newRegressionSummarySha256;identityVerified=$provenance.identityVerified;printerStoreVerified=$provenance.printerStoreVerified;actualNativeRuntimeRestartVerified=$provenance.actualNativeRuntimeRestartVerified;fullFarmStartupVerified=$provenance.fullFarmStartupVerified;allUnreviewedNativeBytesUnchanged=$provenance.allUnreviewedNativeBytesUnchanged;allFilamentAccountingBytesUnchanged=$provenance.allFilamentAccountingBytesUnchanged;actualProductionParentVerified=$provenance.actualProductionParentVerified;themedFieldsVerified=$provenance.themedFieldsVerified;stockAndSpoolFormsVerified=$provenance.stockAndSpoolFormsVerified;focusVisibleVerified=$provenance.focusVisibleVerified;themedResponsiveCases=$provenance.themedResponsiveCases;reviewedFilesSha256=$provenance.reviewedFilesSha256;reviewedFeatureFiles=$provenance.reviewedFeatureFiles;filamentInventoryVerified=$provenance.filamentInventoryVerified;filamentCoreCases=$provenance.filamentCoreCases;filamentUiCases=$provenance.filamentUiCases;filamentNativeTests=5;filamentNativeProof=$nativeFilament;legacySpoolPreservation=$legacySpools;cutoutLedgerSha256=$provenance.cutoutLedgerSha256;transparentCutoutModels=$provenance.transparentCutoutModels;cutoutCanvasAlphaVerified=$provenance.cutoutCanvasAlphaVerified;whiteBodyPreserved=$provenance.whiteBodyPreserved;cutoutDarkLightVerified=$provenance.cutoutDarkLightVerified;candidateBuildRunId=[long]$env:GITHUB_RUN_ID;candidateBuildHeadSha=$env:GITHUB_SHA;patchSha256=$provenance.patchSha256;patchFragments=$provenance.patchFragments;coverageSha256=$provenance.coverageSha256;baselinePhotoModels=$provenance.baselinePhotoModels;appendedPhotoModels=$provenance.appendedPhotoModels;photoLedgerSha256=$provenance.photoLedgerSha256;photoModelCount=$provenance.photoModelCount;catalogUiCases=$provenance.catalogUiCases;offlinePhotosVerified=$provenance.offlinePhotosVerified;setupSha256=$provenance.setupSha256;sourceSha256=$provenance.sourceSha256;baselineSourceSha256='9964a0495dff2b23e6753e6db604584a4352bd3d5ec68068a9fb3b99f58c8afc';baselineSetupSha256='f1e0b36ae0ea9ee25ad7f582bf53d8cb67cec722b8cf75ae2f84c35cac934dc1';baselineSequence=124;sequence=125;validationRunId=[long]$env:GITHUB_RUN_ID;correctedLifecycleScriptSha256='c1f1c3bc66abef1d4a298274c99d7882db8fef742b99572f0abef815bd850ac1';inlineWindowHelperSha256='34fe9c122199eb4e7aa91b219496e6c818a6a19c41b97583d4b5a5e2276ade5d';minimizedHarnessSha256='cdf740bd7e09dde834a10ef649045addb48ca07fe442d6a53bbd879df09e19ff';fullR124UpgradeVerified=$true;dataPreservationVerified=$true;originalFourLifecycleModesVerified=$true;earlyCloseWaitsForPageReady=$false;exitWaitMs=20000;allThreeDoubleLaunchesVerified=$true;installedSmokeVerified=$true;minimizedTelemetryDisconnectReconnectRestoreVerified=$true}\n$external | ConvertTo-Json -Depth 6 | Set-Content exact-validation.json -Encoding utf8NoBOM\n'R124 to R125 physical upgrade, data preservation, relaunch and telemetry passed'\n"

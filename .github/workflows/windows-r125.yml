      run: "$ErrorActionPreference = 'Stop'\n$source = @(Get-ChildItem release-source -Recurse -Filter 'KF-R125-FULL.zip')\nif ($source.Count -ne 1) { throw 'Expected one frozen reviewed source archive' }\nCopy-Item $source[0].FullName release-candidate/KF-R125-FULL.zip\nCompress-Archive -Path release-ui-proof/* -DestinationPath release-candidate/R125-UI-proof.zip\nSet-Location release-candidate\n$provenance = Get-Content provenance.json -Raw | ConvertFrom-Json\n$newProof = Get-Content ../release-ui-proof/offline-photos/r125-new-proof-summary.json -Raw | ConvertFrom-Json\nif (-not $newProof.passed -or $newProof.acceptanceContractSha256 -ne 'c31d2861af781de875e763c6bb6146e1d0ca660da9eb15cf89f80cf93937a28b' -or -not $newProof.identityVerified -or -not $newProof.printerStoreVerified -or -not $newProof.actualNativeRuntimeRestartVerified -or -not $newProof.fullFarmStartupVerified -or (Get-FileHash ../release-ui-proof/offline-photos/r125-new-proof-summary.json).Hash.ToLowerInvariant() -ne $provenance.newRegressionSummarySha256) { throw 'Published actual R125 regression evidence differs from compiled source' }\n$validation = Get-Content exact-validation.json -Raw | ConvertFrom-Json\nif ($provenance.workflowCommit -ne $env:GITHUB_SHA -or $provenance.sequence -ne 125 -or $provenance.baselineSequence -ne 124) { throw 'Wrong candidate build provenance' }\nif ($validation.candidateBuildHeadSha -ne $env:GITHUB_SHA -or -not $validation.fullR124UpgradeVerified -or -not $validation.minimizedTelemetryDisconnectReconnectRestoreVerified) { throw 'Candidate physical validation proof is missing' }\n$photoProof = Get-Content ../release-ui-proof/offline-photos/r125-images-ui-summary.json -Raw | ConvertFrom-Json\n$sourceLedger = Get-Content ../release-ui-proof/offline-photos/reviewed-photo-ledger.json -Raw | ConvertFrom-Json\nif (-not $photoProof.passed -or $photoProof.windowsEdgeUICases -ne 15 -or $photoProof.offlinePhotoModels -ne 482 -or $photoProof.externalImageRequests -ne 0 -or $provenance.photoLedgerSha256 -ne 'bd52a8444169582ae47a021d05261b2637015d2d1df26f0d47260b60345942cd' -or $provenance.photoModelCount -ne 482 -or -not $validation.offlinePhotosVerified -or $validation.catalogUiCases -ne 15 -or $sourceLedger.imageModels -ne 482) { throw 'Offline photo acceptance is incomplete' }\nif ($provenance.patchSha256 -ne 'a88eb7946758a176cc8a2e1cc0a79620b7a92495a9cc15b51fd412fbe759f040' -or $validation.patchSha256 -ne 'a88eb7946758a176cc8a2e1cc0a79620b7a92495a9cc15b51fd412fbe759f040') { throw 'Published candidate patch-set differs' }\nif ($provenance.coverageSha256 -ne '0048de960a5b43d341f5995b053c84c876f5d1d2cb57d4bab2cd58b5c4faddd1' -or $validation.coverageSha256 -ne '0048de960a5b43d341f5995b053c84c876f5d1d2cb57d4bab2cd58b5c4faddd1' -or $provenance.appendedPhotoModels -ne 0) { throw 'Frozen transparent display coverage changed before publication' }\nif ($photoProof.transparentCutoutModels -ne 142 -or $provenance.transparentCutoutModels -ne 142 -or $validation.transparentCutoutModels -ne 142 -or $provenance.cutoutLedgerSha256 -ne 'aa58af6c30363a02198d472cddf4b67d4e73fda05be42ad9a2f493ad31c180a9' -or -not $photoProof.cutoutCanvasAlphaVerified -or -not $photoProof.whiteBodyPreserved -or -not $photoProof.cutoutDarkLightVerified) { throw 'Missing complete transparent-display acceptance evidence' }\nif ($provenance.reviewedFilesSha256 -ne '0b2d862cf878f7a8b4d53d6358f77243a9d37da789de41e64f76453d74d36cff' -or $validation.reviewedFilesSha256 -ne '0b2d862cf878f7a8b4d53d6358f77243a9d37da789de41e64f76453d74d36cff' -or $provenance.reviewedFeatureFiles -ne 26 -or -not $provenance.filamentInventoryVerified -or -not $validation.filamentInventoryVerified -or $validation.filamentNativeTests -ne 5 -or -not $validation.legacySpoolPreservation.legacySpoolBytesPreserved) { throw 'Reviewed filament feature/transaction/upgrade proof missing' }\n$filament = Get-Content ../release-ui-proof/offline-photos/r125-filament-summary.json -Raw | ConvertFrom-Json\nif (-not $filament.passed -or $filament.uiCases -ne $provenance.filamentUiCases -or $filament.coreCases -ne $provenance.filamentCoreCases) { throw 'Published filament acceptance differs from build' }\nforeach ($proof in @($provenance,$validation,$filament)) {\n  if (-not $proof.actualProductionParentVerified -or -not $proof.themedFieldsVerified -or -not $proof.stockAndSpoolFormsVerified -or -not $proof.focusVisibleVerified -or $proof.themedResponsiveCases -ne 6) { throw 'Complete actual production-parent stock/spool themed field and keyboard focus proof missing before publication' }\n}\nif (-not $provenance.allUnreviewedNativeBytesUnchanged -or -not $provenance.allFilamentAccountingBytesUnchanged -or -not $validation.allUnreviewedNativeBytesUnchanged -or -not $validation.allFilamentAccountingBytesUnchanged) { throw 'Unreviewed native files or protected filament accounting implementation changed outside ROOT-reviewed source scope' }\n$setupHash = (Get-FileHash Klipper-Farm-R125-setup.exe).Hash.ToLowerInvariant()\n$sourceHash = (Get-FileHash KF-R125-FULL.zip).Hash.ToLowerInvariant()\n$uiProofHash = (Get-FileHash R125-UI-proof.zip).Hash.ToLowerInvariant()\nif ($setupHash -ne $provenance.setupSha256 -or $sourceHash -ne $provenance.sourceSha256) { throw 'Candidate asset hash differs from validated build' }\nif ((Get-Item Klipper-Farm-R125-setup.exe).Length -gt 512MB) { throw 'Installer exceeds updater limit' }\n\"$setupHash *Klipper-Farm-R125-setup.exe`n$sourceHash *KF-R125-FULL.zip`n$uiProofHash *R125-UI-proof.zip\" | Set-Content SHA256SUMS.txt -Encoding utf8NoBOM\n@'\nR125 candidate: selected catalog identity is authoritative, saved printer configuration survives restart, and seven-printer runtime with durable outbox sequencing is verified. Every unreviewed source file plus all filament accounting and catalog image bytes remain pinned to actual R124.\n\nThe exact reviewed identity, configuration persistence and native actor/scheduler source and installer passed the retained actual Windows inventory/catalog UI cases, 33 accounting/store checks, all five named filament transaction/security tests plus six named runtime-generation/telemetry-reserve tests, and physical R124 to R125 upgrade with legacy spool bytes preserved, four original lifecycle modes, three double launches and minimized telemetry reconnect/restore.\n\nДля подключения требуется доступный Klipper/Moonraker. Наличие изображения модели не подтверждает совместимость штатной прошивки. Stable signing follows independent verification of these exact public assets.\n'@ | Set-Content candidate-notes.md -Encoding utf8NoBOM\ngh release view r125 --repo $env:GITHUB_REPOSITORY --json tagName 2>$null\nif ($LASTEXITCODE -eq 0) { throw 'R125 already exists; review it before replacing or promoting any asset' }\ngh release create r125 Klipper-Farm-R125-setup.exe KF-R125-FULL.zip R125-UI-proof.zip SHA256SUMS.txt provenance.json exact-validation.json minimized-telemetry-r118.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'Klipper Farm R125 candidate — printer identity, restart persistence and fleet runtime' --notes-file candidate-notes.md\nif ($LASTEXITCODE -ne 0) { throw 'Validated prerelease publication failed' }\n"

name: Build and validate R125 printer identity, restart persistence and fleet runtime
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-r125-identity-restart
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
    - name: Use pinned Python setup
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Restore exact published R124 source and reviewed identity, persistence and runtime fragments
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "$ErrorActionPreference = 'Stop'\nif ($env:GITHUB_REPOSITORY -ne 'sanozhukov3737-oss/klipper-farm-updates') { throw 'Unexpected repository' }\nNew-Item -ItemType Directory -Force incoming,proof,ci | Out-Null\ngh release download r124 --repo $env:GITHUB_REPOSITORY --pattern KF-R124-FULL.zip --dir incoming\nif ($LASTEXITCODE -ne 0) { throw 'Published R124 source download failed' }\nif ((Get-Item incoming/KF-R124-FULL.zip).Length -ne 580090191 -or (Get-FileHash incoming/KF-R124-FULL.zip).Hash.ToLowerInvariant() -ne '9964a0495dff2b23e6753e6db604584a4352bd3d5ec68068a9fb3b99f58c8afc') { throw 'Published R124 source size/SHA mismatch' }\nExpand-Archive incoming/KF-R124-FULL.zip work\nRename-Item work/Klipper-Farm-R124 app\n[IO.File]::WriteAllBytes(\"$PWD/ci/fragment-pins.json\",[Convert]::FromBase64String('W3sibmFtZSI6InIxMjUtaWRlbnRpdHktcmVzdGFydC1wYXRjaC0wMS5qc29uIiwic2l6ZSI6NTI0MzQ2LCJzaGEyNTYiOiJjMDk0ZjkzYTQyOTg0YzA3Mjk4YTMyMmM5MzJlMDA0Y2IyMzVjZDMxNzE1OTdkOWRlYWFiOTI0ODJjNmY4MzYxIn1dCg=='))\nif ((Get-FileHash ci/fragment-pins.json).Hash.ToLowerInvariant() -ne 'a88eb7946758a176cc8a2e1cc0a79620b7a92495a9cc15b51fd412fbe759f040') { throw 'Frozen embedded input SHA differs: ci/fragment-pins.json' }\n[IO.File]::WriteAllBytes(\"$PWD/ci/reviewed-files.json\",[Convert]::FromBase64String(''))\nif ((Get-FileHash ci/reviewed-files.json).Hash.ToLowerInvariant() -ne '0b2d862cf878f7a8b4d53d6358f77243a9d37da789de41e64f76453d74d36cff') { throw 'Frozen embedded input SHA differs: ci/reviewed-files.json' }\n[IO.File]::WriteAllBytes(\"$PWD/ci/coverage.json\",[Convert]::FromBase64String(''))\nif ((Get-FileHash ci/coverage.json).Hash.ToLowerInvariant() -ne '0048de960a5b43d341f5995b053c84c876f5d1d2cb57d4bab2cd58b5c4faddd1') { throw 'Frozen embedded input SHA differs: ci/coverage.json' }\n[IO.File]::WriteAllBytes(\"$PWD/ci/source_scope.py\",[Convert]::FromBase64String(''))\nif ((Get-FileHash ci/source_scope.py).Hash.ToLowerInvariant() -ne '41142bee48fad95f4081dd4f5a5cc2079ad323da578db1097492b0c481055bf6') { throw 'Frozen embedded input SHA differs: ci/source_scope.py' }\n[IO.File]::WriteAllBytes(\"$PWD/ci/check-feature-scope.py\",[Convert]::FromBase64String(''))\nif ((Get-FileHash ci/check-feature-scope.py).Hash.ToLowerInvariant() -ne '8c891c9454dab0ca9706df2b85f1b7bed5e1ee55e325fef0c022a948a5bb8a1c') { throw 'Frozen embedded input SHA differs: ci/check-feature-scope.py' }\n[IO.File]::WriteAllBytes(\"$PWD/ci/check-catalog-proof.py\",[Convert]::FromBase64String(''))\nif ((Get-FileHash ci/check-catalog-proof.py).Hash.ToLowerInvariant() -ne '214ec6df8d556d50321531cb1df3ba8c74f723d3ab89ac42973029106cd4d431') { throw 'Frozen embedded input SHA differs: ci/check-catalog-proof.py' }\n[IO.File]::WriteAllBytes(\"$PWD/ci/check-filament-proof.py\",[Convert]::FromBase64String(''))\nif ((Get-FileHash ci/check-filament-proof.py).Hash.ToLowerInvariant() -ne 'bb6e08c87dfe9cba0b0b272e8b84aaf1524cd20cb079eee0542a3da6b53eb4b9') { throw 'Frozen embedded input SHA differs: ci/check-filament-proof.py' }\n[IO.File]::WriteAllBytes(\"$PWD/ci/check-native-proof.py\",[Convert]::FromBase64String(''))\nif ((Get-FileHash ci/check-native-proof.py).Hash.ToLowerInvariant() -ne 'd5537be14eff28bc819bb269ef58ddb41343fdeaa38ac05297616f7a19904108') { throw 'Frozen embedded input SHA differs: ci/check-native-proof.py' }\n[IO.File]::WriteAllBytes(\"$PWD/ci/legacy-spools-proof.py\",[Convert]::FromBase64String(''))\nif ((Get-FileHash ci/legacy-spools-proof.py).Hash.ToLowerInvariant() -ne '7d676d1630ae468079e8741952f5f69cbeff43a1cb6c9aad8246089090c48248') { throw 'Frozen embedded input SHA differs: ci/legacy-spools-proof.py' }\n[IO.File]::WriteAllBytes(\"$PWD/ci/acceptance_contract.py\",[Convert]::FromBase64String(''))\nif ((Get-FileHash ci/acceptance_contract.py).Hash.ToLowerInvariant() -ne 'f66b93293f2b38a66b43d05e99ef048705386c56dd57bd8e65c2706af59711f6') { throw 'Frozen embedded input SHA differs: ci/acceptance_contract.py' }\n[IO.File]::WriteAllBytes(\"$PWD/ci/run-proof.py\",[Convert]::FromBase64String(''))\nif ((Get-FileHash ci/run-proof.py).Hash.ToLowerInvariant() -ne 'ab96804789804297c83ba190b93227800d85350ed5b1b4c5544600fbdab38677') { throw 'Frozen embedded input SHA differs: ci/run-proof.py' }\n[IO.File]::WriteAllBytes(\"$PWD/ci/check-new-proof.py\",[Convert]::FromBase64String(''))\nif ((Get-FileHash ci/check-new-proof.py).Hash.ToLowerInvariant() -ne '7dccd945df1ada2531c9e1c7c6b1862007e29b54e24841b44090c96d9fa42970') { throw 'Frozen embedded input SHA differs: ci/check-new-proof.py' }\n[IO.File]::WriteAllBytes(\"$PWD/ci/check-runtime-native-proof.py\",[Convert]::FromBase64String(''))\nif ((Get-FileHash ci/check-runtime-native-proof.py).Hash.ToLowerInvariant() -ne '538a558cb16fc879b8595fdf4e5f9233805b84942a3cfd1a69adb59a4fb53bf9') { throw 'Frozen embedded input SHA differs: ci/check-runtime-native-proof.py' }\n[IO.File]::WriteAllBytes(\"$PWD/ci/acceptance-contract.json\",[Convert]::FromBase64String(''))\nif ((Get-FileHash ci/acceptance-contract.json).Hash.ToLowerInvariant() -ne 'c31d2861af781de875e763c6bb6146e1d0ca660da9eb15cf89f80cf93937a28b') { throw 'Frozen embedded input SHA differs: ci/acceptance-contract.json' }\nCopy-Item ci/acceptance-contract.json proof/acceptance-contract.json\nCopy-Item ci/coverage.json proof/frozen-coverage.json\n$pins = Get-Content ci/fragment-pins.json -Raw | ConvertFrom-Json\n$treeJson = gh api \"repos/$env:GITHUB_REPOSITORY/git/trees/$env:GITHUB_SHA\"\nif ($LASTEXITCODE -ne 0) { throw 'Exact-head Git tree fetch failed' }\n$tree = ($treeJson -join \"`n\") | ConvertFrom-Json\nif ($tree.truncated) { throw 'Truncated Git tree' }\nforeach ($pin in $pins) {\n  $entries = @($tree.tree | Where-Object { $_.path -ceq $pin.name -and $_.type -eq 'blob' -and $_.mode -eq '100644' })\n  if ($entries.Count -ne 1) { throw 'Missing unique immutable patch Git blob' }\n  $encoded = gh api \"repos/$env:GITHUB_REPOSITORY/git/blobs/$($entries[0].sha)\" --jq .content\n  if ($LASTEXITCODE -ne 0) { throw 'Patch Git blob fetch failed' }\n  $destination = Join-Path \"$PWD/incoming\" $pin.name\n  [IO.File]::WriteAllBytes($destination,[Convert]::FromBase64String(($encoded -join '')))\n  if ((Get-Item $destination).Length -ne $pin.size -or $pin.size -gt 23068672 -or (Get-FileHash $destination).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'Exact-head patch size/SHA differs' }\n}\nCopy-Item ci/fragment-pins.json,ci/reviewed-files.json proof/\n[IO.File]::WriteAllText(\"$PWD/proof/ci-origin.json\",(@{repository=$env:GITHUB_REPOSITORY;headSha=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;workflow='windows-r125.yml';baselineSha256='9964a0495dff2b23e6753e6db604584a4352bd3d5ec68068a9fb3b99f58c8afc';uiOnly=$false} | ConvertTo-Json),[Text.UTF8Encoding]::new($false))\nCopy-Item ci/fragment-pins.json incoming/r125-patch-manifest.json\n"
    - name: Apply exact reviewed R125 delta and prove every unreviewed source byte plus all filament implementation preserved
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        $parts = Get-Content ci/fragment-pins.json -Raw | ConvertFrom-Json

        $arguments = @(''ci/check-feature-scope.py'',''--baseline'',''incoming/KF-R124-FULL.zip'',''--source'',''work/app'',''--pins'',''ci/fragment-pins.json'',''--allowlist'',''ci/reviewed-files.json'',''--proof'',''proof'',''--coverage'',''ci/coverage.json'')

        foreach ($part in $parts) { $arguments += @(''--patch'',("incoming/" + $part.name)) }

        & python @arguments

        if ($LASTEXITCODE -ne 0) { throw ''Immutable global patch/scope verification failed'' }

        '
    - name: Install locked frontend dependencies
      shell: pwsh
      run: 'Set-Location work/app

        npm ci --no-audit --no-fund

        if ($LASTEXITCODE -ne 0) { throw ''Locked frontend installation failed'' }

        '
    - name: Verify TypeScript, preserved controls/security and original catalog image bytes
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        Set-Location work/app

        node node_modules/typescript/bin/tsc --noEmit

        if ($LASTEXITCODE -ne 0) { throw ''TypeScript check failed'' }

        node scripts/check-printer-catalog.mjs

        if ($LASTEXITCODE -ne 0) { throw ''500 catalog identities/selection regression failed'' }

        $qa = & node scripts/check-printer-catalog-images.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Offline original photo QA failed'' }

        $qa | ForEach-Object { Write-Host $_ }

        [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE ''proof/images-qa.json''),($qa -join "`n"),[Text.UTF8Encoding]::new($false))

        Copy-Item public/printer-catalog-credits/IMAGES.json (Join-Path $env:GITHUB_WORKSPACE ''proof/reviewed-photo-ledger.json'')

        node scripts/check-creality-light.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Preserved Creality light invariants failed'' }

        node scripts/check-security.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Preserved security invariants failed'' }

        Copy-Item public/printer-catalog-credits/CUTOUTS.json (Join-Path $env:GITHUB_WORKSPACE ''proof/reviewed-cutout-ledger.json'')

        $env:KF_FILAMENT_PROOF = Join-Path $env:GITHUB_WORKSPACE ''proof/filament-inventory-core-r123-report.json''

        node scripts/check-filament-inventory.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Filament accounting/store/migration regression failed'' }

        $telemetry = & node scripts/check-filament-telemetry.mjs

        if ($LASTEXITCODE -ne 0 -or -not (($telemetry -join "`n").Contains(''Filament telemetry OK:''))) { throw ''Filament telemetry/history reconciliation regression failed'' }

        $telemetry | ForEach-Object { Write-Host $_ }

        '
    - name: Run actual R125 printer identity and durable configuration checks
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        python ci/run-proof.py --contract ci/acceptance-contract.json --source work/app --proof proof --phase frontend

        if ($LASTEXITCODE -ne 0) { throw ''Actual R125 frontend proof failed'' }

        '
    - name: Rebuild frontend and freeze complete reviewed source
      id: frontend
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        Set-Location work/app

        node scripts/check-light-readback-r116.cjs

        if ($LASTEXITCODE -ne 0) { throw ''R125 light readback regression failed'' }

        node scripts/check-background-camera-r118.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Background camera decoded-frame sampling regression failed'' }

        node scripts/check-printer-open-r117.cjs

        if ($LASTEXITCODE -ne 0) { throw ''First detail open read-only preview regression failed'' }

        node scripts/prepare-camera-detector.mjs --download

        if ($LASTEXITCODE -ne 0) { throw ''Pinned local camera model or ONNX runtime staging failed'' }

        node scripts/check-legacy-library-routing.mjs

        if ($LASTEXITCODE -ne 0) { throw ''R94 native routing regression failed'' }

        node scripts/check-print-start-confirmation.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Print start confirmation regression failed'' }

        node scripts/check-upload-actor-identity.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Upload identity regression failed'' }

        node scripts/check-moonraker-compat.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Compatibility regression failed'' }

        node scripts/check-printer-connection-bridge.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Actor bridge regression failed'' }

        node scripts/check-maintenance.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Maintenance countdown and notification regression failed'' }

        node scripts/check-camera-guard.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Camera guard state and pause regression failed'' }

        node scripts/check-tv-dashboard.mjs

        if ($LASTEXITCODE -ne 0) { throw ''TV dashboard state regression failed'' }

        npm run build

        if ($LASTEXITCODE -ne 0) { throw ''Frontend compilation failed'' }

        node scripts/lock-v20-6-dist.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Frontend provenance check failed'' }

        node scripts/generate-release-manifests.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Manifest generation failed'' }

        node scripts/check-release-portability.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Portable release checks failed'' }

        Push-Location $env:GITHUB_WORKSPACE

        python ci/check-feature-scope.py --baseline incoming/KF-R124-FULL.zip --source work/app --pins ci/fragment-pins.json --allowlist ci/reviewed-files.json --coverage ci/coverage.json --proof proof --verify-only --allow-generated-dist

        if ($LASTEXITCODE -ne 0) { throw ''Post-build source scope mismatch'' }

        Pop-Location

        New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE ''checked-source'') | Out-Null

        $env:KF_ARCHIVE_ROOT = ''Klipper-Farm-R125''

        $env:KF_SOURCE_ZIP = Join-Path $env:GITHUB_WORKSPACE ''checked-source/KF-R125-FULL.zip''

        node scripts/build-reproducible-zip.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Reviewed source freeze failed'' }

        '
    - name: Install locked browser acceptance dependencies after reviewed source freeze
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        Set-Location work/app

        npm ci --prefix ui-tests --no-audit --no-fund

        if ($LASTEXITCODE -ne 0) { throw ''Locked browser test dependencies failed'' }

        '
    - name: Run actual Windows Edge catalog and filament inventory UI acceptance
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        Set-Location work/app

        $env:PLAYWRIGHT_MODULE_PATH = ''./node_modules/playwright/index.mjs''

        $env:CHROMIUM_EXECUTABLE = Join-Path ${env:ProgramFiles(x86)} ''Microsoft/Edge/Application/msedge.exe''

        if (-not (Test-Path $env:CHROMIUM_EXECUTABLE -PathType Leaf)) { throw ''Preinstalled Windows Edge missing'' }

        $env:KF_UI_SCREENSHOTS = Join-Path $env:GITHUB_WORKSPACE ''proof''

        node ui-tests/printer-catalog.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Actual Windows UI/photo acceptance failed'' }

        node ui-tests/filament-inventory.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Actual Windows filament inventory UI acceptance failed'' }

        Set-Location $env:GITHUB_WORKSPACE

        python ci/check-catalog-proof.py --proof proof --source work/app

        if ($LASTEXITCODE -ne 0) { throw ''Positive UI/image proof is incomplete'' }

        python ci/check-filament-proof.py --proof proof

        if ($LASTEXITCODE -ne 0) { throw ''Positive filament UI/core evidence incomplete'' }

        '
    - name: Run actual Windows Edge R125 printer identity and reopen acceptance
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        $env:PLAYWRIGHT_MODULE_PATH = ''./node_modules/playwright/index.mjs''

        $env:CHROMIUM_EXECUTABLE = Join-Path ${env:ProgramFiles(x86)} ''Microsoft/Edge/Application/msedge.exe''

        if (-not (Test-Path $env:CHROMIUM_EXECUTABLE -PathType Leaf)) { throw ''Actual Windows Edge browser missing for new identity acceptance'' }

        $env:KF_UI_SCREENSHOTS = Join-Path $env:GITHUB_WORKSPACE ''proof''

        python ci/run-proof.py --contract ci/acceptance-contract.json --source work/app --proof proof --phase ui

        if ($LASTEXITCODE -ne 0) { throw ''Actual R125 ui proof failed'' }

        '
    - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
      with:
        toolchain: 1.98.0
        components: clippy
    - name: Compile actual Windows Hello desktop binding
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        Set-Location work/app

        tar -xzf offline-tools/rust/rust-vendor-v1144.tar.gz -C .

        if ($LASTEXITCODE -ne 0 -or -not (Test-Path ''rv/windows-0.61.3/Cargo.toml'')) { throw ''Offline Windows SDK extraction failed'' }

        [IO.File]::WriteAllText((Join-Path $PWD ''rv/.kf-v1144-complete''),"verified")

        $mini = Join-Path $PWD ''.klipper-build-cache/hello-binding-check''

        New-Item -ItemType Directory -Force "$mini/src" | Out-Null

        @''

        [package]

        name="kf-hello-binding-check"

        version="0.1.0"

        edition="2021"

        [dependencies]

        windows={version="=0.61.3",features=["Security_Credentials_UI","Win32_System_WinRT"]}

        windows-future="=0.2.1"

        ''@ | Set-Content "$mini/Cargo.toml" -Encoding utf8NoBOM

        ''#[path="../../../src-tauri/src/windows_hello.rs"] mod windows_hello; fn main() {}'' | Set-Content "$mini/src/main.rs" -Encoding utf8NoBOM

        $env:CARGO_TARGET_DIR = Join-Path $PWD ''.klipper-build-cache/target''

        cargo check --offline --manifest-path "$mini/Cargo.toml"

        if ($LASTEXITCODE -ne 0) { throw ''Actual desktop Windows Hello API binding failed to compile'' }

        '
    - name: Verify HTTP boundary regression
      shell: pwsh
      run: 'Set-Location work/app

        node scripts/check-http-keepalive.mjs

        if ($LASTEXITCODE -ne 0) { throw ''HTTP boundary regression failed'' }

        '
    - name: Build and run native Windows checks
      shell: pwsh
      run: 'Set-Location work/app

        node scripts/build-and-install-windows.mjs --build-only

        if ($LASTEXITCODE -ne 0) { throw ''Windows build failed'' }

        Set-Location $env:GITHUB_WORKSPACE

        python ci/check-native-proof.py --log work/app/.klipper-build-cache/target/v20-rust-tests-last.log --out proof/filament-native-r125-report.json

        if ($LASTEXITCODE -ne 0) { throw ''New filament transaction/security native tests were not executed successfully'' }

        '
    - name: Run actual compiled Windows seven-printer runtime and restart sequence proof
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        python ci/check-runtime-native-proof.py --log work/app/.klipper-build-cache/target/v20-rust-tests-last.log --out proof/printer-runtime-native-r125.json

        if ($LASTEXITCODE -ne 0) { throw ''Six actual new R125 durable-generation and telemetry-reserve native tests missing'' }

        $ErrorActionPreference = ''Stop''

        python ci/run-proof.py --contract ci/acceptance-contract.json --source work/app --proof proof --phase native

        if ($LASTEXITCODE -ne 0) { throw ''Actual R125 native proof failed'' }

        python ci/check-new-proof.py --contract ci/acceptance-contract.json --proof proof

        if ($LASTEXITCODE -ne 0) { throw ''Complete five-role R125 positive proof missing'' }

        '
    - name: Verify actual R94 native library uploader
      shell: pwsh
      run: 'Set-Location work/app

        $env:CARGO_TARGET_DIR = Join-Path $PWD ''.klipper-build-cache/target''

        $env:CARGO_HOME = Join-Path $PWD ''.klipper-build-cache/cargo''

        node scripts/check-legacy-library-upload-runtime.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Actual R94 native uploader regression failed'' }

        '
    - name: Collect candidate and validation tools
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        New-Item -ItemType Directory -Force candidate/release,candidate/scripts | Out-Null

        $project = Join-Path $PWD ''work/app''

        $release = Join-Path $project ''.klipper-build-cache/target/release''

        foreach ($name in @(''klipper-farm-client.exe'',''klipper-farmd.exe'',''klipper-farm-ipc-probe.exe'')) { Copy-Item (Join-Path $release $name) candidate/release/ }

        foreach ($name in @(''apply-online-update.ps1'',''check-desktop-startup-smoke.mjs'',''check-desktop-exit.ps1'',''check-headless-telemetry-runtime.mjs'',''hardware-emulator.mjs'',''check-startup-instance-r117.ps1'')) { Copy-Item (Join-Path $project "scripts/$name") candidate/scripts/ }

        $setup = @(Get-ChildItem work/app/INSTALLER -Filter ''*.exe'')

        if ($setup.Count -ne 1) { throw ''Expected one installer'' }

        Copy-Item $setup[0].FullName candidate/Klipper-Farm-R125-setup.exe

        $hash = (Get-FileHash candidate/Klipper-Farm-R125-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()

        "$hash *Klipper-Farm-R125-setup.exe" | Set-Content candidate/SHA256SUMS.txt -Encoding utf8NoBOM

        $sourceHash = (Get-FileHash checked-source/KF-R125-FULL.zip).Hash.ToLowerInvariant()

        $html = Get-Content work/app/dist/index.html -Raw

        $js = [regex]::Match($html,''assets/index-[^" ]+\.js'').Value

        $css = [regex]::Match($html,''assets/index-[^" ]+\.css'').Value

        if (-not $js -or -not $css) { throw ''Missing checked frontend bundle identity'' }

        $cameraWorkers = @(Get-ChildItem work/app/dist/assets -Filter ''cameraDetectorWorker-*.js'')

        if ($cameraWorkers.Count -ne 1) { throw ''Expected one local detector module worker'' }

        $cameraWorker = ''assets/'' + $cameraWorkers[0].Name

        $detector = Get-Content work/app/dist/camera-detector/MODEL.json -Raw | ConvertFrom-Json

        if ($detector.sha256 -ne ''0a6ebd8e30dbf6a450c50f9c0a5406f04ba7eb1c99fd5996e888c78bb383b9aa'' -or $detector.size -ne 202223918 -or $detector.runtime -ne ''onnxruntime-web@1.23.2'') { throw ''Packaged local detector provenance mismatch'' }

        if ((Get-Item candidate/Klipper-Farm-R125-setup.exe).Length -gt 512MB) { throw ''Candidate exceeds the supported update installer size'' }

        $catalog = Get-Content work/app/src/data/printerCatalog.json -Raw -Encoding UTF8 | ConvertFrom-Json

        if ($catalog.schemaVersion -ne 1 -or @($catalog.models).Count -lt 500) { throw ''Packaged printer catalog requires schema 1 and at least 500 models'' }

        $catalogHash = (Get-FileHash work/app/src/data/printerCatalog.json).Hash.ToLowerInvariant()

        $photos = Get-Content proof/r125-images-ui-summary.json -Raw | ConvertFrom-Json

        $newProof = Get-Content proof/r125-new-proof-summary.json -Raw | ConvertFrom-Json

        if (-not $newProof.passed -or $newProof.acceptanceContractSha256 -ne ''c31d2861af781de875e763c6bb6146e1d0ca660da9eb15cf89f80cf93937a28b'' -or -not $newProof.identityVerified -or -not $newProof.printerStoreVerified -or -not $newProof.actualNativeRuntimeRestartVerified -or -not $newProof.fullFarmStartupVerified -or @($newProof.proofs.PSObject.Properties).Count -ne 5) { throw ''Actual new R125 identity/store/runtime evidence incomplete'' }

        Copy-Item proof/r125-new-proof-summary.json candidate/

        $filament = Get-Content proof/r125-filament-summary.json -Raw | ConvertFrom-Json

        $sourceScope = Get-Content proof/source-parity.json -Raw | ConvertFrom-Json


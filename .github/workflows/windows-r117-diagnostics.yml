name: Diagnose exact R117 Windows lifecycle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-r117-diagnostics.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-r117-lifecycle-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Restore exact immutable R117 candidate and install unchanged payload
        id: install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force incoming,candidate,diagnostic,proof | Out-Null
          $meta = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/12096149161" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Exact candidate metadata download failed' }
          if ($meta.id -ne 12096149161 -or $meta.workflow_run.id -ne 39018659353 -or $meta.workflow_run.head_sha -ne '0f01d1fbc28ba52493c1b998f6ef1825e005d06b') { throw 'Candidate run or head differs' }
          if ($meta.size_in_bytes -ne 407022915 -or $meta.digest -ne 'sha256:19c8d873faa0e6191ad3814a18a8dd3e35d08ccb1115541688f3c56cdb461929') { throw 'Candidate artifact identity differs' }
          & curl.exe --fail --location --silent --show-error --header "Authorization: Bearer $env:GH_TOKEN" --header 'Accept: application/vnd.github+json' --output incoming/candidate.zip "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/12096149161/zip"
          if ($LASTEXITCODE -ne 0) { throw 'Exact immutable candidate download failed' }
          if ((Get-Item incoming/candidate.zip).Length -ne 407022915 -or (Get-FileHash incoming/candidate.zip).Hash.ToLowerInvariant() -ne '19c8d873faa0e6191ad3814a18a8dd3e35d08ccb1115541688f3c56cdb461929') { throw 'Candidate ZIP size or digest differs' }
          Expand-Archive incoming/candidate.zip candidate
          $setup = (Resolve-Path candidate/Klipper-Farm-R117-setup.exe).Path
          if ((Get-FileHash $setup).Hash.ToLowerInvariant() -ne '8a86c490d7da7f23ee77637e25b926645146e8a6a942f94d252c963a1fa6bbd7') { throw 'Setup identity differs' }
          $p = Get-Content candidate/provenance.json -Raw | ConvertFrom-Json
          if ($p.workflowCommit -ne '0f01d1fbc28ba52493c1b998f6ef1825e005d06b' -or $p.patchSha256 -ne '69df1c0ac185b5b5ffb7a8bad3f551be75e2dace7026120577d7280bfbf053c3' -or $p.sequence -ne 117) { throw 'Compiled source provenance differs' }
          Copy-Item candidate/provenance.json proof/provenance.json
          # Self-contained diagnostic harness. The decoded UTF-8 source is also
          # reviewable locally as r117-diagnostic-harness.ps1; no product edits.
          [IO.File]::WriteAllBytes("$PWD/diagnostic/harness.ps1", [Convert]::FromBase64String(''))
          if ((Get-FileHash diagnostic/harness.ps1).Hash.ToLowerInvariant() -ne '5d0cec327a52c81445844009efd330c1a21eb871347ed31be79b6d907131a41a') { throw 'Diagnostic harness identity differs' }
          $parseTokens = $null; $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/diagnostic/harness.ps1",[ref]$parseTokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ('Diagnostic harness parse failed: ' + (($parseErrors | ForEach-Object Message) -join '; ')) }
          $installDir = Join-Path $env:RUNNER_TEMP 'R117 exact lifecycle diagnostic'
          $installed = Start-Process $setup -ArgumentList ('/S /D=' + $installDir) -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw 'Exact R117 installation failed' }
          foreach ($name in @('klipper-farm-client.exe','klipper-farmd.exe')) { if (-not (Test-Path (Join-Path $installDir $name))) { throw "Installed payload missing: $name" } }
          [IO.File]::WriteAllText("$PWD/diagnostic/install-path.txt",$installDir)
          'Exact candidate installed; no new build, source changes or signing performed.'
      - name: Run original four lifecycle assertions with live failure evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Get-Content diagnostic/install-path.txt -Raw
          & diagnostic/harness.ps1 -Mode lifecycle -Desktop (Join-Path $installDir 'klipper-farm-client.exe') -CandidateRoot "$PWD/candidate" -ProofRoot "$PWD/proof/lifecycle"
      - name: Diagnose normal close after actual WebView and authenticated daemon readiness
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Get-Content diagnostic/install-path.txt -Raw
          & diagnostic/harness.ps1 -Mode normal-ready -Desktop (Join-Path $installDir 'klipper-farm-client.exe') -CandidateRoot "$PWD/candidate" -ProofRoot "$PWD/proof/normal-ready"
      - name: Run original three real double-launch assertions with failure evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Get-Content diagnostic/install-path.txt -Raw
          & diagnostic/harness.ps1 -Mode startup -Desktop (Join-Path $installDir 'klipper-farm-client.exe') -CandidateRoot "$PWD/candidate" -ProofRoot "$PWD/proof/startup"
      - name: Run unchanged installed WebView startup smoke
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Get-Content diagnostic/install-path.txt -Raw
          New-Item -ItemType Directory -Force proof/smoke | Out-Null
          node candidate/scripts/check-desktop-startup-smoke.mjs (Join-Path $installDir 'klipper-farm-client.exe') (Join-Path $installDir 'klipper-farmd.exe') "$PWD/proof/smoke"
          if ($LASTEXITCODE -ne 0) { throw 'Unchanged installed smoke failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: R117-Exact-Candidate-Lifecycle-Diagnostics
          path: proof/
          if-no-files-found: error
          retention-days: 14

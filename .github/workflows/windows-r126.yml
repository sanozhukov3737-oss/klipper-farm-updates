name: Build R126 Flashforge profiles, compatible file listing and clean artwork
'on':
  push:
    branches:
    - r126-flashforge-files
    paths:
    - .github/workflows/windows-r126.yml
    - r126-patch.json
    - ci/apply-r126.py
    - r126-transfer/**
    - ci/assemble-r126.py
    - ci/r126-upgrade-data.py
    - KF-R126-release-checkpoint.zip
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: windows-r126
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - &id001
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
    - &id002
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Restore exact review files from uploaded checkpoint
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        if ((Get-FileHash KF-R126-release-checkpoint.zip).Hash.ToLowerInvariant() -ne ''c0ab6e573aaa4ae0bcb0854c2ccf4412f692d7ab2ff1ad8ec0ccc1d5895447a0'')
        { throw ''Reviewed checkpoint archive differs'' }

        Expand-Archive -LiteralPath KF-R126-release-checkpoint.zip -DestinationPath .r126-checkpoint

        Copy-Item .r126-checkpoint/release/ci -Destination ci -Recurse

        Copy-Item .r126-checkpoint/release/r126-transfer -Destination r126-transfer -Recurse

        '
    - name: Restore exact R125 and apply reviewed R126 source
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        New-Item -ItemType Directory -Force incoming,proof | Out-Null

        gh release download r125 --repo $env:GITHUB_REPOSITORY --pattern KF-R125-FULL.zip --dir incoming

        if ($LASTEXITCODE -ne 0) { throw ''R125 source download failed'' }

        if ((Get-Item incoming/KF-R125-FULL.zip).Length -ne 580130075 -or (Get-FileHash incoming/KF-R125-FULL.zip).Hash.ToLowerInvariant() -ne
        ''86f99a8945fa35eedc31975db40cafb481647e55b142b5315ed0d67ddf36360c'') { throw ''Published source identity differs'' }

        python ci/assemble-r126.py

        if ($LASTEXITCODE -ne 0) { throw ''R126 package reassembly failed'' }

        if ((Get-FileHash r126-patch.json).Hash.ToLowerInvariant() -ne ''20d20017dfa46ccbb53ffca6b243aeb4691a88e4f4c8c670f3fda83512ddfeae'') {
        throw ''R126 reviewed patch differs'' }

        Expand-Archive incoming/KF-R125-FULL.zip work

        Rename-Item work/Klipper-Farm-R125 app

        python ci/apply-r126.py work/app r126-patch.json proof incoming/KF-R125-FULL.zip

        if ($LASTEXITCODE -ne 0) { throw ''Source parity check failed'' }

        '
    - name: Check production profile, file APIs and preserved behavior
      shell: pwsh
      run: "$ErrorActionPreference='Stop'\nSet-Location work/app\nnpm ci --no-audit --no-fund\nif ($LASTEXITCODE -ne 0) { throw 'Locked dependencies\
        \ failed' }\nnode node_modules/typescript/bin/tsc --noEmit\nif ($LASTEXITCODE -ne 0) { throw 'TypeScript failed' }\n$env:KF_R126_PROOF=Join-Path\
        \ $env:GITHUB_WORKSPACE 'proof/r126-files-profile.json'\n$env:KF_R126_FILE_SYNC_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r126-file-sync.json'\n\
        foreach ($script in @('check-r126-files-profile.mjs','check-r126-file-sync.mjs','check-printer-catalog.mjs','check-printer-catalog-images.mjs','check-gcode-validation.mjs','check-printer-config-persistence.mjs','check-security.mjs','check-moonraker-compat.mjs','check-filament-inventory.mjs','check-filament-telemetry.mjs','check-print-start-confirmation.mjs'))\
        \ {\n node \"scripts/$script\"\n if ($LASTEXITCODE -ne 0) { throw \"Regression failed: $script\" }\n}\n"
    - name: Verify actual settings, artwork, discovery and print workflow in Windows Edge
      shell: pwsh
      run: "$ErrorActionPreference='Stop'\nSet-Location work/app\nnpm ci --prefix ui-tests --no-audit --no-fund\nif ($LASTEXITCODE -ne 0) { throw\
        \ 'UI dependencies failed' }\n$env:CHROMIUM_EXECUTABLE=Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'\n$env:KF_UI_SCREENSHOTS=Join-Path\
        \ $env:GITHUB_WORKSPACE 'proof'\n$env:KF_R126_APP_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r126-profile-app.json'\n$env:KF_R126_FILE_UI_PROOF=Join-Path\
        \ $env:GITHUB_WORKSPACE 'proof/r126-file-ui.json'\n$env:KF_R126_UI_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r126-ui-artwork.json'\n\
        $env:KF_R126_DISCOVERY_PROOF=Join-Path $env:GITHUB_WORKSPACE 'proof/r126-discovery.json'\nforeach ($script in @('r126-profile.mjs','r126-profile-app.mjs','r126-files.mjs','r126-ui.mjs','discovery-layout.mjs','file-workflow.mjs'))\
        \ {\n node \"ui-tests/$script\"\n if ($LASTEXITCODE -ne 0) { throw \"Actual Windows Edge acceptance failed: $script\" }\n}\nRemove-Item\
        \ ui-tests/node_modules -Recurse -Force\n"
    - name: Compile frontend and freeze complete source
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        Set-Location work/app

        npm run build

        if ($LASTEXITCODE -ne 0) { throw ''Frontend build failed'' }

        node scripts/lock-v20-6-dist.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Frontend lock failed'' }

        node scripts/generate-release-manifests.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Manifest generation failed'' }

        node scripts/check-release-portability.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Source portability failed'' }

        $env:KF_ARCHIVE_ROOT=''Klipper-Farm-R126''

        $env:KF_SOURCE_ZIP=Join-Path $env:GITHUB_WORKSPACE ''candidate/KF-R126-FULL.zip''

        New-Item -ItemType Directory -Force (Split-Path $env:KF_SOURCE_ZIP) | Out-Null

        node scripts/build-reproducible-zip.mjs

        if ($LASTEXITCODE -ne 0) { throw ''Source archive failed'' }

        '
    - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
      with:
        toolchain: 1.98.0
        components: clippy
    - name: Build Windows installer and run native checks
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        Set-Location work/app

        node scripts/build-and-install-windows.mjs --build-only

        if ($LASTEXITCODE -ne 0) { throw ''Windows build and native checks failed'' }

        $release=Join-Path $PWD ''.klipper-build-cache/target/release''

        New-Item -ItemType Directory -Force ../../candidate/release,../../candidate/scripts | Out-Null

        foreach ($file in @(''klipper-farm-client.exe'',''klipper-farmd.exe'',''klipper-farm-ipc-probe.exe'')) { Copy-Item (Join-Path $release
        $file) ../../candidate/release/ }

        foreach ($file in @(''check-desktop-startup-smoke.mjs'',''check-headless-telemetry-runtime.mjs'',''hardware-emulator.mjs'')) { Copy-Item
        "scripts/$file" ../../candidate/scripts/ }

        Copy-Item ../../ci/r126-upgrade-data.py ../../candidate/scripts/

        $setup=@(Get-ChildItem INSTALLER -Filter ''*.exe'')

        if ($setup.Count -ne 1) { throw ''Expected one installer'' }

        Copy-Item $setup[0].FullName ../../candidate/Klipper-Farm-R126-setup.exe

        Copy-Item ../../proof ../../candidate/proof -Recurse

        $manifest=@{}

        foreach ($name in @(''Klipper-Farm-R126-setup.exe'',''KF-R126-FULL.zip'')) { $item=Get-Item "../../candidate/$name"; $manifest[$name]=@{sha256=(Get-FileHash
        $item.FullName).Hash.ToLowerInvariant();sizeBytes=$item.Length} }

        @{release=''R126'';sequence=126;baselineSequence=125;headSha=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;assets=$manifest} | ConvertTo-Json
        -Depth 8 | Set-Content ../../candidate/provenance.json -Encoding utf8NoBOM

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: r126-candidate
        path: candidate
        retention-days: 7
    - name: Retain failure evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: r126-build-evidence
        path: 'proof

          work/app/.klipper-build-cache/*.log

          work/app/.klipper-build-cache/target/*last.log'
        retention-days: 7
  validate:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - *id001
    - *id002
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: r126-candidate
        path: candidate
    - name: Install over R125, verify data, native telemetry and real desktop window
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        Set-Location candidate

        $installDir=Join-Path $env:RUNNER_TEMP ''KF-R126-upgrade''

        New-Item -ItemType Directory -Force old,smoke | Out-Null

        gh release download r125 --repo $env:GITHUB_REPOSITORY --pattern Klipper-Farm-R125-setup.exe --dir old

        if ($LASTEXITCODE -ne 0) { throw ''R125 installer download failed'' }

        $old=(Resolve-Path old/Klipper-Farm-R125-setup.exe).Path

        if ((Get-FileHash $old).Hash.ToLowerInvariant() -ne ''7a2d12bf1fafd9232be32ca7ee534027ee9948ea0d636040e8cf05ae40cd7fdf'') { throw ''R125
        installer differs'' }

        $process=Start-Process $old -ArgumentList (''/S /D=''+$installDir) -Wait -PassThru

        if ($process.ExitCode -ne 0) { throw ''R125 install failed'' }

        node scripts/check-desktop-startup-smoke.mjs "$installDir/klipper-farm-client.exe" "$installDir/klipper-farmd.exe" smoke

        if ($LASTEXITCODE -ne 0) { throw ''Published R125 actual WebView startup failed'' }


        $dataDir=Join-Path $env:APPDATA ''app.klipper.farm''

        New-Item -ItemType Directory -Force $dataDir | Out-Null

        $marker=Join-Path $dataDir ''r126-preservation.txt''

        [IO.File]::WriteAllText($marker,''preserve-existing-data'')

        python scripts/r126-upgrade-data.py seed --database (Join-Path $dataDir ''farm.sqlite3'') --proof proof/upgrade-data-seed.json

        if ($LASTEXITCODE -ne 0) { throw ''Legacy seed failed'' }

        $setup=(Resolve-Path Klipper-Farm-R126-setup.exe).Path

        $process=Start-Process $setup -ArgumentList (''/S /D=''+$installDir) -Wait -PassThru

        if ($process.ExitCode -ne 0) { throw ''R126 install over R125 failed'' }

        foreach ($name in @(''klipper-farm-client.exe'',''klipper-farmd.exe'')) { if ((Get-FileHash "$installDir/$name").Hash -ne (Get-FileHash
        "release/$name").Hash) { throw "Installed binary differs: $name" } }

        if ((Get-Content $marker -Raw) -ne ''preserve-existing-data'') { throw ''Existing app data lost'' }

        node scripts/check-desktop-startup-smoke.mjs "$installDir/klipper-farm-client.exe" "$installDir/klipper-farmd.exe" smoke

        if ($LASTEXITCODE -ne 0) { throw ''Installed WebView main-window smoke failed'' }

        node scripts/check-headless-telemetry-runtime.mjs --daemon "$installDir/klipper-farmd.exe" --probe "$PWD/release/klipper-farm-ipc-probe.exe"
        --report "$PWD/proof/headless-runtime.json"

        if ($LASTEXITCODE -ne 0) { throw ''Installed telemetry regression failed'' }

        python scripts/r126-upgrade-data.py verify --database (Join-Path $dataDir ''farm.sqlite3'') --proof proof/upgrade-data-preserved.json

        if ($LASTEXITCODE -ne 0) { throw ''Printer configuration, stocks, usage, reserves or spools changed during upgrade'' }


        node scripts/check-desktop-startup-smoke.mjs "$installDir/klipper-farm-client.exe" "$installDir/klipper-farmd.exe" smoke

        if ($LASTEXITCODE -ne 0) { throw ''Installed R126 second actual WebView startup failed'' }

        python scripts/r126-upgrade-data.py verify --database (Join-Path $dataDir ''farm.sqlite3'') --proof proof/upgrade-data-after-restart.json

        if ($LASTEXITCODE -ne 0) { throw ''Existing printer or filament data changed after installed app restart'' }

        @{release=''R126'';passed=$true;runId=$env:GITHUB_RUN_ID;headSha=$env:GITHUB_SHA;upgradeFrom=125;installedBinaryHashesMatch=$true;desktopWebViewLoaded=$true;legacyDataPreserved=$true;printerConfigurationPreserved=$true;filamentInventoryPreserved=$true;installedRestartVerified=$true}
        | ConvertTo-Json | Set-Content exact-validation.json -Encoding utf8NoBOM

        Compress-Archive proof,smoke R126-UI-proof.zip

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: r126-validated
        path: candidate
        retention-days: 7
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: r126-installed-evidence
        path: 'candidate/proof

          candidate/smoke'
        retention-days: 7
  publish:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: r126-validated
        path: candidate
    - name: Publish exact validated R126 candidate
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        Set-Location candidate

        $proof=Get-Content exact-validation.json -Raw | ConvertFrom-Json

        $origin=Get-Content provenance.json -Raw | ConvertFrom-Json

        if (-not $proof.passed -or $proof.runId -ne $env:GITHUB_RUN_ID -or $origin.headSha -ne $env:GITHUB_SHA -or $proof.headSha -ne $origin.headSha)
        { throw ''Validation provenance differs'' }

        foreach ($asset in $origin.assets.PSObject.Properties) { if ((Get-FileHash $asset.Name).Hash.ToLowerInvariant() -ne $asset.Value.sha256
        -or (Get-Item $asset.Name).Length -ne $asset.Value.sizeBytes) { throw ''Validated bytes changed'' } }

        @''

        Исправлены профиль Flashforge Adventurer 5M, загрузка списка файлов при HTTP 404 и оформление диагностики поиска. Убраны белые остатки
        фона у K1C 2025 и Flashforge 5M. Для сохранённого рассогласования модели и профиля откройте настройки, нажмите «Применить профиль» и сохраните.
        Проверено на Windows Edge и установкой поверх R125 с сохранением данных.

        ''@ | Set-Content notes.md -Encoding utf8NoBOM

        gh release create r126 Klipper-Farm-R126-setup.exe KF-R126-FULL.zip provenance.json exact-validation.json R126-UI-proof.zip --target $env:GITHUB_SHA
        --repo $env:GITHUB_REPOSITORY --prerelease --title ''Klipper Farm R126 — Flashforge, файлы и оформление'' --notes-file notes.md

        if ($LASTEXITCODE -ne 0) { throw ''Candidate publication failed'' }

        '

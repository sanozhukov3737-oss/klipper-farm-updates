name: Build and validate R118
on:
  workflow_dispatch:
  push:
    branches: [r118-background-panels]
    paths: ['.github/workflows/windows-r118.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-r118
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: 1.98.0
          components: clippy
      - name: Restore verified published R117 and apply reviewed R118 changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download r117 --repo $env:GITHUB_REPOSITORY --pattern KF-R117-FULL.zip --dir incoming
          if ($LASTEXITCODE -ne 0) { throw 'Source download failed' }
          if ((Get-Item incoming/KF-R117-FULL.zip).Length -ne 500171480) { throw 'Baseline source size mismatch' }
          if ((Get-FileHash incoming/KF-R117-FULL.zip).Hash.ToLowerInvariant() -ne '2164e5398b0bdef4ecc733b43ece25c8e8252d31b017056e6229b55d48c6e5bf') { throw 'Source checksum mismatch' }
          Expand-Archive incoming/KF-R117-FULL.zip work
          Rename-Item work/Klipper-Farm-R117 app
          New-Item -ItemType Directory -Force baseline | Out-Null
          Copy-Item work/app/src baseline/src -Recurse
          Copy-Item work/app/src-tauri baseline/native -Recurse
          $blob = gh api "repos/$env:GITHUB_REPOSITORY/git/trees/$env:GITHUB_SHA" --jq '.tree[] | select(.path == "r118-patch.json") | .sha'
          if ($LASTEXITCODE -ne 0 -or -not $blob) { throw 'Patch blob resolution failed' }
          $encoded = gh api "repos/$env:GITHUB_REPOSITORY/git/blobs/$blob" --jq .content
          if ($LASTEXITCODE -ne 0) { throw 'Patch download failed' }
          [IO.File]::WriteAllBytes("$PWD/incoming/r118-patch.json",[Convert]::FromBase64String(($encoded -join '')))
          if ((Get-FileHash incoming/r118-patch.json).Hash.ToLowerInvariant() -ne '0f74eb5339e9316ba1cc1896d09b9729190a941065aa8178883957c1f112e81c') { throw 'Reviewed R118 patch checksum mismatch' }
          $patch = Get-Content incoming/r118-patch.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $root = [IO.Path]::GetFullPath("$PWD/work/app") + [IO.Path]::DirectorySeparatorChar
          $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($item in $patch) {
            if (-not $item.path -or $item.path.Contains('\') -or [IO.Path]::IsPathRooted($item.path) -or $item.path.Contains(':') -or -not $seen.Add($item.path)) { throw 'Invalid or duplicate patch path' }
            if ($item.afterSha256 -notmatch '^[0-9a-f]{64}$') { throw 'Missing reviewed final file hash' }
            $file = [IO.Path]::GetFullPath((Join-Path $root $item.path))
            if (-not $file.StartsWith($root,[StringComparison]::OrdinalIgnoreCase)) { throw 'Patch path escapes source' }
            if ($item.beforeSha256) {
              if ((Get-FileHash $file).Hash.ToLowerInvariant() -ne $item.beforeSha256) { throw "Baseline file differs: $($item.path)" }
            } elseif (Test-Path $file) { throw "Unexpected existing patch file: $($item.path)" }
            [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($file)) | Out-Null
            [IO.File]::WriteAllText($file,$item.content,[Text.UTF8Encoding]::new($false))
            if ((Get-FileHash $file).Hash.ToLowerInvariant() -ne $item.afterSha256) { throw "Applied content differs: $($item.path)" }
          }
      - name: Restore locked frontend dependencies for AST scope and runtime checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location work/app
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked frontend dependencies failed' }
      - name: Verify performance and background scope against published R117 baseline
        shell: pwsh
        run: |
          Set-Location work/app
          $env:KF_R118_BASELINE = Join-Path $env:GITHUB_WORKSPACE 'baseline'
          node scripts/check-r118-scope.mjs
          if ($LASTEXITCODE -ne 0) { throw 'R118 intended scope validation failed' }
          node scripts/check-creality-light.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Creality light invariants failed' }
          node scripts/check-security.mjs
          if ($LASTEXITCODE -ne 0) { throw 'R118 security invariants failed' }
      - name: Compile actual Windows Hello desktop binding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location work/app
          tar -xzf offline-tools/rust/rust-vendor-v1144.tar.gz -C .
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'rv/windows-0.61.3/Cargo.toml')) { throw 'Offline Windows SDK extraction failed' }
          [IO.File]::WriteAllText((Join-Path $PWD 'rv/.kf-v1144-complete'),"verified")
          $mini = Join-Path $PWD '.klipper-build-cache/hello-binding-check'
          New-Item -ItemType Directory -Force "$mini/src" | Out-Null
          @'
          [package]
          name="kf-hello-binding-check"
          version="0.1.0"
          edition="2021"
          [dependencies]
          windows={version="=0.61.3",features=["Security_Credentials_UI","Win32_System_WinRT"]}
          windows-future="=0.2.1"
          '@ | Set-Content "$mini/Cargo.toml" -Encoding utf8NoBOM
          '#[path="../../../src-tauri/src/windows_hello.rs"] mod windows_hello; fn main() {}' | Set-Content "$mini/src/main.rs" -Encoding utf8NoBOM
          $env:CARGO_TARGET_DIR = Join-Path $PWD '.klipper-build-cache/target'
          cargo check --offline --manifest-path "$mini/Cargo.toml"
          if ($LASTEXITCODE -ne 0) { throw 'Actual desktop Windows Hello API binding failed to compile' }
      - name: Verify HTTP boundary regression
        shell: pwsh
        run: |
          Set-Location work/app
          node scripts/check-http-keepalive.mjs
          if ($LASTEXITCODE -ne 0) { throw 'HTTP boundary regression failed' }
      - name: Rebuild frontend and freeze complete reviewed source
        id: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location work/app
          node scripts/check-light-readback-r116.cjs
          if ($LASTEXITCODE -ne 0) { throw 'R118 light readback regression failed' }
          node scripts/check-background-camera-r118.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Background camera decoded-frame sampling regression failed' }
          node scripts/check-printer-open-r117.cjs
          if ($LASTEXITCODE -ne 0) { throw 'First detail open read-only preview regression failed' }
          node scripts/prepare-camera-detector.mjs --download
          if ($LASTEXITCODE -ne 0) { throw 'Pinned local camera model or ONNX runtime staging failed' }
          node scripts/check-legacy-library-routing.mjs
          if ($LASTEXITCODE -ne 0) { throw 'R94 native routing regression failed' }
          node scripts/check-print-start-confirmation.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Print start confirmation regression failed' }
          node scripts/check-upload-actor-identity.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Upload identity regression failed' }
          node scripts/check-moonraker-compat.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Compatibility regression failed' }
          node scripts/check-printer-connection-bridge.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Actor bridge regression failed' }
          node scripts/check-maintenance.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Maintenance countdown and notification regression failed' }
          node scripts/check-camera-guard.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Camera guard state and pause regression failed' }
          node scripts/check-tv-dashboard.mjs
          if ($LASTEXITCODE -ne 0) { throw 'TV dashboard state regression failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend compilation failed' }
          node scripts/lock-v20-6-dist.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Frontend provenance check failed' }
          node scripts/generate-release-manifests.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Manifest generation failed' }
          node scripts/check-release-portability.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Portable release checks failed' }
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'checked-source') | Out-Null
          $env:KF_ARCHIVE_ROOT = 'Klipper-Farm-R118'
          $env:KF_SOURCE_ZIP = Join-Path $env:GITHUB_WORKSPACE 'checked-source/KF-R118-FULL.zip'
          node scripts/build-reproducible-zip.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed source freeze failed' }
      - name: Verify file workflow UI success and error states
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location work/app
          npm ci --prefix ui-tests --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked browser test dependencies failed' }
          $env:PLAYWRIGHT_MODULE_PATH = './node_modules/playwright/index.mjs'
          $env:CHROMIUM_EXECUTABLE = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          if (-not (Test-Path $env:CHROMIUM_EXECUTABLE)) { throw 'Preinstalled Edge not found' }
          $env:KF_FILE_WORKFLOW_ONLY = '1'
          foreach ($case in @('normal-start','duplicate-click','changed-source','native-upload-failure','cancel-upload','start-unknown')) {
            $env:KF_FILE_TEST = $case
            node ui-tests/file-workflow.mjs
            if ($LASTEXITCODE -ne 0) { throw "File workflow UI failed: $case" }
          }
      - name: Verify discovery dialog appearance
        shell: pwsh
        run: |
          Set-Location work/app
          $env:PLAYWRIGHT_MODULE_PATH = './node_modules/playwright/index.mjs'
          $env:CHROMIUM_EXECUTABLE = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $env:KF_UI_SCREENSHOTS = Join-Path $env:GITHUB_WORKSPACE 'discovery-preview'
          node ui-tests/discovery-layout.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Discovery appearance checks failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Klipper-Farm-R118-Discovery-preview
          path: discovery-preview/
          if-no-files-found: error
          retention-days: 30
      - name: Verify dispatcher reliability maintenance and queue appearance
        shell: pwsh
        run: |
          Set-Location work/app
          $env:PLAYWRIGHT_MODULE_PATH = './node_modules/playwright/index.mjs'
          $env:CHROMIUM_EXECUTABLE = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $env:KF_UI_SCREENSHOTS = Join-Path $env:GITHUB_WORKSPACE 'panels-preview'
          node ui-tests/panels-layout.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Panel appearance checks failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Klipper-Farm-R118-Panels-preview
          path: panels-preview/
          if-no-files-found: error
          retention-days: 30
      - name: Verify TV dashboard and camera controls
        shell: pwsh
        run: |
          Set-Location work/app
          $env:PLAYWRIGHT_MODULE_PATH = './node_modules/playwright/index.mjs'
          $env:CHROMIUM_EXECUTABLE = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $env:KF_UI_SCREENSHOTS = Join-Path $env:GITHUB_WORKSPACE 'tv-camera-preview'
          node ui-tests/tv-camera.mjs
          if ($LASTEXITCODE -ne 0) { throw 'TV and camera UI checks failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Klipper-Farm-R118-TV-Camera-preview
          path: tv-camera-preview/
          if-no-files-found: error
          retention-days: 30
      - name: Verify actual local camera inference under production CSP
        shell: pwsh
        run: |
          Set-Location work/app
          $env:PLAYWRIGHT_MODULE_PATH = './node_modules/playwright/index.mjs'
          $env:CHROMIUM_EXECUTABLE = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $env:KF_UI_SCREENSHOTS = Join-Path $env:GITHUB_WORKSPACE 'camera-detector-proof'
          node ui-tests/camera-detector.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual model worker inference under app CSP failed' }
          node ui-tests/camera-guard-chain.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual captured frame to model to guarded pause chain failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Klipper-Farm-R118-Camera-Detector-proof
          path: camera-detector-proof/
          if-no-files-found: error
          retention-days: 30
      - name: Verify single-method login and actual printer light controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location work/app
          $env:PLAYWRIGHT_MODULE_PATH = './node_modules/playwright/index.mjs'
          $env:CHROMIUM_EXECUTABLE = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $failures = @()
          foreach ($check in @(@{script='access-light.mjs';output='access-light-preview'},@{script='light-notifications-r100.mjs';output='light-regression-preview'},@{script='light-compact-r116.mjs';output='light-compact-preview'})) {
            $env:KF_UI_SCREENSHOTS = Join-Path $env:GITHUB_WORKSPACE $check.output
            node (Join-Path 'ui-tests' $check.script)
            if ($LASTEXITCODE -ne 0) { $failures += $check.script }
          }
          if ($failures.Count -gt 0) { throw ('Light acceptance checks failed: ' + ($failures -join ', ')) }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Klipper-Farm-R118-Access-Light-proof
          path: |
            access-light-preview/
            light-regression-preview/
            light-compact-preview/
          if-no-files-found: error
      - name: Verify first printer detail opens before optional preview work
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location work/app
          $env:PLAYWRIGHT_MODULE_PATH = './node_modules/playwright/index.mjs'
          $env:CHROMIUM_EXECUTABLE = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $env:KF_UI_SCREENSHOTS = Join-Path $env:GITHUB_WORKSPACE 'printer-open-proof'
          node ui-tests/printer-open-r117.mjs
          if ($LASTEXITCODE -ne 0) { throw 'First printer detail open UI regression failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Klipper-Farm-R118-Printer-Open-proof
          path: printer-open-proof/
          if-no-files-found: error
          retention-days: 30
      - name: Verify responsive heavy panels and hidden-window telemetry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location work/app
          $env:PLAYWRIGHT_MODULE_PATH = './node_modules/playwright/index.mjs'
          $env:CHROMIUM_EXECUTABLE = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $env:KF_UI_SCREENSHOTS = Join-Path $env:GITHUB_WORKSPACE 'performance-background-proof'
          node ui-tests/heavy-screens-r118.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Heavy screens responsiveness and bounded history regression failed' }
          $env:PLAYWRIGHT_MODULE_PATH = Join-Path $PWD 'ui-tests/node_modules/playwright/index.mjs'
          node scripts/check-background-camera-browser-r118.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Real WebRTC hidden receiver and frozen-stream evidence regression failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Klipper-Farm-R118-Performance-Background-proof
          path: performance-background-proof/
          if-no-files-found: error
          retention-days: 30
      - name: Build and run native Windows checks
        shell: pwsh
        run: |
          Set-Location work/app
          node scripts/build-and-install-windows.mjs --build-only
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Verify actual R94 native library uploader
        shell: pwsh
        run: |
          Set-Location work/app
          $env:CARGO_TARGET_DIR = Join-Path $PWD '.klipper-build-cache/target'
          $env:CARGO_HOME = Join-Path $PWD '.klipper-build-cache/cargo'
          node scripts/check-legacy-library-upload-runtime.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual R94 native uploader regression failed' }
      - name: Collect candidate and validation tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force candidate/release,candidate/scripts | Out-Null
          $project = Join-Path $PWD 'work/app'
          $release = Join-Path $project '.klipper-build-cache/target/release'
          foreach ($name in @('klipper-farm-client.exe','klipper-farmd.exe','klipper-farm-ipc-probe.exe')) { Copy-Item (Join-Path $release $name) candidate/release/ }
          foreach ($name in @('apply-online-update.ps1','check-desktop-startup-smoke.mjs','check-desktop-exit.ps1','check-headless-telemetry-runtime.mjs','hardware-emulator.mjs','check-startup-instance-r117.ps1')) { Copy-Item (Join-Path $project "scripts/$name") candidate/scripts/ }
          $setup = @(Get-ChildItem work/app/INSTALLER -Filter '*.exe')
          if ($setup.Count -ne 1) { throw 'Expected one installer' }
          Copy-Item $setup[0].FullName candidate/Klipper-Farm-R118-setup.exe
          $hash = (Get-FileHash candidate/Klipper-Farm-R118-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *Klipper-Farm-R118-setup.exe" | Set-Content candidate/SHA256SUMS.txt -Encoding utf8NoBOM
          $sourceHash = (Get-FileHash checked-source/KF-R118-FULL.zip).Hash.ToLowerInvariant()
          $html = Get-Content work/app/dist/index.html -Raw
          $js = [regex]::Match($html,'assets/index-[^" ]+\.js').Value
          $css = [regex]::Match($html,'assets/index-[^" ]+\.css').Value
          if (-not $js -or -not $css) { throw 'Missing checked frontend bundle identity' }
          $cameraWorkers = @(Get-ChildItem work/app/dist/assets -Filter 'cameraDetectorWorker-*.js')
          if ($cameraWorkers.Count -ne 1) { throw 'Expected one local detector module worker' }
          $cameraWorker = 'assets/' + $cameraWorkers[0].Name
          $detector = Get-Content work/app/dist/camera-detector/MODEL.json -Raw | ConvertFrom-Json
          if ($detector.sha256 -ne '0a6ebd8e30dbf6a450c50f9c0a5406f04ba7eb1c99fd5996e888c78bb383b9aa' -or $detector.size -ne 202223918 -or $detector.runtime -ne 'onnxruntime-web@1.23.2') { throw 'Packaged local detector provenance mismatch' }
          if ((Get-Item candidate/Klipper-Farm-R118-setup.exe).Length -gt 512MB) { throw 'Candidate exceeds the supported update installer size' }
          @{sourceSha256=$sourceHash;baselineSourceSha256='2164e5398b0bdef4ecc733b43ece25c8e8252d31b017056e6229b55d48c6e5bf';baselineSetupSha256='8a86c490d7da7f23ee77637e25b926645146e8a6a942f94d252c963a1fa6bbd7';baselineSequence=117;sequence=118;patchSha256=(Get-FileHash incoming/r118-patch.json).Hash.ToLowerInvariant();workflowCommit=$env:GITHUB_SHA;setupSha256=$hash;buildId='V20.6-R11.8-BACKGROUND-PANELS-2026-10-17';javascript=$js;stylesheet=$css;cameraModelSha256=$detector.sha256;cameraModelSizeBytes=$detector.size;cameraRuntime=$detector.runtime;cameraWorker=$cameraWorker} | ConvertTo-Json | Set-Content candidate/provenance.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-R118-Candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-R118-Reviewed-Source
          path: checked-source/KF-R118-FULL.zip
          if-no-files-found: error
          retention-days: 30
      - name: Retain build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-R118-Build-logs
          path: |
            work/app/.klipper-build-cache/logs/
            work/app/.klipper-build-cache/target/v20-rust-tests-last.log
          include-hidden-files: true
          if-no-files-found: warn
  validate:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Klipper-Farm-R118-Candidate
          path: candidate
      - name: Prepare verified actual-window validation harnesses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This new validation-only file corrects cached HWND selection. The
          # original shipped script and every executable remain unchanged.
          [IO.File]::WriteAllBytes("$PWD/candidate/scripts/check-desktop-exit-actual-window-r117.ps1",[Convert]::FromBase64String(''))
          if ((Get-FileHash candidate/scripts/check-desktop-exit-actual-window-r117.ps1).Hash.ToLowerInvariant() -ne 'c1f1c3bc66abef1d4a298274c99d7882db8fef742b99572f0abef815bd850ac1') { throw 'Corrected window-selection harness differs' }
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/candidate/scripts/check-desktop-exit-actual-window-r117.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ('Harness parse failed: ' + (($errors | ForEach-Object Message) -join '; ')) }
          [IO.File]::WriteAllBytes("$PWD/candidate/scripts/upgrade-actual-window-r117.ps1",[Convert]::FromBase64String(''))
          if ((Get-FileHash candidate/scripts/upgrade-actual-window-r117.ps1).Hash.ToLowerInvariant() -ne '34fe9c122199eb4e7aa91b219496e6c818a6a19c41b97583d4b5a5e2276ade5d') { throw 'Inline upgrade window helper differs' }
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/candidate/scripts/upgrade-actual-window-r117.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ('Inline helper parse failed: ' + (($errors | ForEach-Object Message) -join '; ')) }
          [IO.File]::WriteAllBytes("$PWD/candidate/scripts/check-minimized-telemetry-r118.ps1",[Convert]::FromBase64String(''))
          if ((Get-FileHash candidate/scripts/check-minimized-telemetry-r118.ps1).Hash.ToLowerInvariant() -ne 'e4c8413be6a928681ae95e5b200467defe8ff4cacea2e600c00d4a82c3571804') { throw 'Minimized telemetry harness differs' }
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/candidate/scripts/check-minimized-telemetry-r118.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ('Minimized harness parse failed: ' + (($errors | ForEach-Object Message) -join '; ')) }
      - name: Verify upgrade from published R117 and installed runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue

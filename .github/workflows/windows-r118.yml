  publish-candidate:
    needs: [build, validate]
    runs-on: windows-2022
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Klipper-Farm-R118-Exact-Candidate-Validated
          path: release-candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Klipper-Farm-R118-Reviewed-Source
          path: release-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Klipper-Farm-R118-Performance-Background-proof
          path: release-ui-proof
      - name: Publish validated R118 prerelease candidate for signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = @(Get-ChildItem release-source -Recurse -Filter 'KF-R118-FULL.zip')
          if ($source.Count -ne 1) { throw 'Expected one frozen reviewed source archive' }
          Copy-Item $source[0].FullName release-candidate/KF-R118-FULL.zip
          Compress-Archive -Path release-ui-proof/* -DestinationPath release-candidate/R118-UI-proof.zip
          Set-Location release-candidate
          $provenance = Get-Content provenance.json -Raw | ConvertFrom-Json
          $validation = Get-Content exact-validation.json -Raw | ConvertFrom-Json
          if ($provenance.workflowCommit -ne $env:GITHUB_SHA -or $provenance.sequence -ne 118 -or $provenance.baselineSequence -ne 117) { throw 'Wrong candidate build provenance' }
          if ($validation.candidateBuildHeadSha -ne $env:GITHUB_SHA -or -not $validation.fullR117UpgradeVerified -or -not $validation.minimizedTelemetryDisconnectReconnectRestoreVerified) { throw 'Candidate physical validation proof is missing' }
          $setupHash = (Get-FileHash Klipper-Farm-R118-setup.exe).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash KF-R118-FULL.zip).Hash.ToLowerInvariant()
          $uiProofHash = (Get-FileHash R118-UI-proof.zip).Hash.ToLowerInvariant()
          if ($setupHash -ne $provenance.setupSha256 -or $sourceHash -ne $provenance.sourceSha256) { throw 'Candidate asset hash differs from validated build' }
          if ((Get-Item Klipper-Farm-R118-setup.exe).Length -gt 512MB) { throw 'Installer exceeds updater limit' }
          "$setupHash *Klipper-Farm-R118-setup.exe`n$sourceHash *KF-R118-FULL.zip`n$uiProofHash *R118-UI-proof.zip" | Set-Content SHA256SUMS.txt -Encoding utf8NoBOM
          @'
          R118 candidate: responsive heavy panels and continuous background monitoring.

          This prerelease contains the exact Windows installer and source verified by this workflow. Automated checks include the installed R117 to R118 upgrade with preserved data, four window lifecycle modes, three real double launches, and actual desktop minimize/disconnect/reconnect/restore telemetry against a synthetic localhost printer.

          The stable update manifest will be signed and published separately after verifying these exact assets. Physical printers and the user's fingerprint reader are outside this build environment.
          '@ | Set-Content candidate-notes.md -Encoding utf8NoBOM
          gh release view r118 --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'R118 already exists; review it before replacing or promoting any asset' }
          gh release create r118 Klipper-Farm-R118-setup.exe KF-R118-FULL.zip R118-UI-proof.zip SHA256SUMS.txt provenance.json exact-validation.json minimized-telemetry-r118.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'Klipper Farm R118 candidate — background and panels' --notes-file candidate-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Validated prerelease publication failed' }

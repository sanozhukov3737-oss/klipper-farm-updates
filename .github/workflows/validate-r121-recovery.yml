name: Validate and publish exact existing R121 build
'on':
  workflow_dispatch: null
  push:
    branches:
    - r121-catalog-photos
    paths:
    - .github/workflows/validate-r121-recovery.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: r121-validation-recovery
  cancel-in-progress: false
jobs:
  reuse-build:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Verify successful original build and reuse only exact immutable artifacts
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:GITHUB_REPOSITORY -ne 'sanozhukov3737-oss/klipper-farm-updates') { throw 'Unexpected repository' }
        New-Item -ItemType Directory -Force incoming,bridge-evidence,candidate,checked-source,ui-proof | Out-Null
        function Read-Api([string]$path) {
          $raw = gh api $path
          if ($LASTEXITCODE -ne 0) { throw "GitHub metadata fetch failed: $path" }
          return ($raw -join "`n") | ConvertFrom-Json
        }
        $originalRun = Read-Api "repos/$env:GITHUB_REPOSITORY/actions/runs/39062628135"
        if ($originalRun.id -ne 39062628135 -or $originalRun.head_sha -ne 'aba69f49d990b1cf7d30f84dc1ec02eb71c1b421' -or $originalRun.head_branch -ne 'r121-catalog-photos' -or $originalRun.path -ne '.github/workflows/windows-r121.yml' -or $originalRun.status -ne 'completed' -or $originalRun.conclusion -ne 'failure' -or $originalRun.repository.full_name -ne $env:GITHUB_REPOSITORY) { throw 'Original build run identity/status changed' }
        $originalJobs = Read-Api "repos/$env:GITHUB_REPOSITORY/actions/runs/39062628135/jobs?per_page=100"
        if ($originalJobs.total_count -ne 3 -or $originalJobs.jobs.Count -ne 3) { throw 'Unexpected original workflow job count' }
        $build = @($originalJobs.jobs | Where-Object { $_.id -eq 117483563322 -and $_.name -ceq 'build' })
        if ($build.Count -ne 1 -or $build[0].status -ne 'completed' -or $build[0].conclusion -ne 'success') { throw 'Original native build did not succeed' }
        foreach ($required in @('Restore exact R120 source and retrieve every pinned photo fragment','Apply exact fragments and prove every other baseline file unchanged','Verify operational AST parity, TypeScript, metadata and original photo bytes','Rebuild frontend and freeze complete reviewed source','Run all 15 actual Windows Edge catalog and offline photo cases','Compile actual Windows Hello desktop binding','Verify HTTP boundary regression','Build and run native Windows checks','Verify actual R94 native library uploader','Collect candidate and validation tools')) {
          $steps = @($build[0].steps | Where-Object { $_.name -ceq $required -and $_.status -eq 'completed' -and $_.conclusion -eq 'success' })
          if ($steps.Count -ne 1) { throw "Required original build step failed or missing: $required" }
        }
        $failedValidation = @($originalJobs.jobs | Where-Object { $_.id -eq 117489663683 -and $_.name -ceq 'validate' -and $_.conclusion -eq 'failure' })
        if ($failedValidation.Count -ne 1 -or @($failedValidation[0].steps | Where-Object { $_.name -ceq 'Verify upgrade from published R120 and installed runtime' -and $_.conclusion -eq 'failure' }).Count -ne 1) { throw 'Original known failed validation stage changed' }
        $skippedPublish = @($originalJobs.jobs | Where-Object { $_.id -eq 117490419440 -and $_.name -ceq 'publish-candidate' -and $_.conclusion -eq 'skipped' })
        if ($skippedPublish.Count -ne 1) { throw 'Original candidate publication must remain skipped' }
        $originalWorkflow = Read-Api "repos/$env:GITHUB_REPOSITORY/contents/.github/workflows/windows-r121.yml?ref=aba69f49d990b1cf7d30f84dc1ec02eb71c1b421"
        [IO.File]::WriteAllBytes("$PWD/bridge-evidence/windows-r121-original.yml",[Convert]::FromBase64String($originalWorkflow.content))
        if ((Get-FileHash bridge-evidence/windows-r121-original.yml).Hash.ToLowerInvariant() -ne 'cc6068c519e1e2a917ea58766afabaee325a6fa131f1e4bacdb79787e96d9456') { throw 'Original complete build workflow differs' }
        $originalRun | ConvertTo-Json -Depth 30 | Set-Content bridge-evidence/original-run.json -Encoding utf8NoBOM
        $originalJobs | ConvertTo-Json -Depth 30 | Set-Content bridge-evidence/original-jobs.json -Encoding utf8NoBOM
        $pins = @(
          @{id=12112008819;name='Klipper-Farm-R121-Candidate';size=498096408;sha256='cd05f873074b92376ed8477fba98d96d5c14e832d28ba73ed8453bc448074d71';destination='candidate'},
          @{id=12113275016;name='Klipper-Farm-R121-Reviewed-Source';size=591596909;sha256='464d67f115e580e68fac9dd0279cdbe9977b6e601e4f70a40541151a1fad6ba1';destination='checked-source'},
          @{id=12112291633;name='Klipper-Farm-R121-Offline-Photos-UI-proof';size=1355655;sha256='90227f90a07dc98b4d260d5ad5ac9fec15f81fda9dd947261e55eb67873e510c';destination='ui-proof'}
        )
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        foreach ($pin in $pins) {
          $metadata = Read-Api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($pin.id)"
          if ($metadata.id -ne $pin.id -or $metadata.name -cne $pin.name -or $metadata.expired -or $metadata.size_in_bytes -ne $pin.size -or $metadata.digest -cne ('sha256:' + $pin.sha256) -or $metadata.workflow_run.id -ne 39062628135 -or $metadata.workflow_run.head_sha -ne 'aba69f49d990b1cf7d30f84dc1ec02eb71c1b421') { throw "Original artifact metadata differs: $($pin.name)" }
          $metadata | ConvertTo-Json -Depth 20 | Set-Content ("bridge-evidence/artifact-"+$pin.id+'.json') -Encoding utf8NoBOM
          $zipPath = Join-Path "$PWD/incoming" ($pin.id.ToString()+'.zip')
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($pin.id)/zip" -Headers @{Authorization=('Bearer '+$env:GH_TOKEN);Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'} -OutFile $zipPath
          if ((Get-Item $zipPath).Length -ne $pin.size -or (Get-FileHash $zipPath).Hash.ToLowerInvariant() -ne $pin.sha256) { throw "Original full artifact ZIP bytes differ: $($pin.name)" }
          $archive = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            if ($archive.Entries.Count -gt 12000) { throw 'Artifact entry count exceeds bound' }
            $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            [long]$expanded=0
            foreach ($entry in $archive.Entries) {
              $name=$entry.FullName
              if (-not $name -or $name.StartsWith('/') -or $name.Contains('\') -or $name.Contains(':') -or (($name -split '/') -contains '..') -or (($name -split '/') -contains '.') -or -not $seen.Add($name.TrimEnd('/'))) { throw "Unsafe or duplicate artifact path: $name" }
              if ((($entry.ExternalAttributes -shr 16) -band 0xF000) -eq 0xA000) { throw 'Artifact symlink rejected' }
              if ($entry.Length -gt 768MB) { throw 'Artifact entry size exceeds bound' }
              $expanded += $entry.Length
              if ($expanded -gt 4GB) { throw 'Artifact expanded size exceeds bound' }
            }
          } finally { $archive.Dispose() }
          [IO.Compression.ZipFile]::ExtractToDirectory($zipPath,(Join-Path $PWD $pin.destination),$false)
        }
        $source = @(Get-ChildItem checked-source -Recurse -File -Filter KF-R121-FULL.zip)
        if ($source.Count -ne 1 -or @(Get-ChildItem checked-source -Recurse -File).Count -ne 1) { throw 'Reviewed source artifact must contain exactly one complete source ZIP' }
        $provenance = Get-Content candidate/provenance.json -Raw | ConvertFrom-Json
        if ((Get-FileHash candidate/provenance.json).Hash.ToLowerInvariant() -ne '7b3cd516fa160d4b442536ff93d546a501e51e4203bb69037a1ee91103662535') { throw 'Original provenance bytes differ' }
        if ($provenance.workflowCommit -cne 'aba69f49d990b1cf7d30f84dc1ec02eb71c1b421' -or $provenance.buildId -cne 'V20.6-R12.1-CATALOG-IMAGES-2026-10-17' -or $provenance.sequence -ne 121 -or $provenance.baselineSequence -ne 120) { throw 'Reused compiled candidate provenance mismatch' }
        if ((Get-FileHash candidate/Klipper-Farm-R121-setup.exe).Hash.ToLowerInvariant() -ne $provenance.setupSha256 -or (Get-FileHash $source[0].FullName).Hash.ToLowerInvariant() -ne $provenance.sourceSha256) { throw 'Reused setup/source do not match original provenance' }
        if ((Get-Item candidate/Klipper-Farm-R121-setup.exe).Length -ne 249221378 -or $provenance.setupSha256 -cne '01f51b401fadb17be4e4051c745d8fb1ccd1e48a79b377193523347b34358305' -or (Get-Item $source[0].FullName).Length -ne 591627913 -or $provenance.sourceSha256 -cne 'f8d3b70238c2d03879a5efdd13f0c5d395d8c7528d1f67fcda623268e47d801d') { throw 'Exact locally recovered original setup/source pins differ' }
        $origin=Get-Content ui-proof/ci-origin.json -Raw | ConvertFrom-Json
        if ($origin.workflow -cne 'windows-r121.yml' -or $origin.headSha -cne 'aba69f49d990b1cf7d30f84dc1ec02eb71c1b421' -or $origin.runId -cne '39062628135' -or $origin.repository -cne $env:GITHUB_REPOSITORY -or $origin.uiOnly -ne $false -or $origin.baselineSha256 -cne '5daf1624acfba53aa91a45b00fd26777a9351efe19714de9519a40b1a6e50804') { throw 'Original offline UI run identity differs' }
        $photoProof=Get-Content ui-proof/r121-images-ui-summary.json -Raw | ConvertFrom-Json
        $ledger=Get-Content ui-proof/reviewed-photo-ledger.json -Raw | ConvertFrom-Json
        if (-not $photoProof.passed -or $photoProof.windowsEdgeUICases -ne 15 -or $photoProof.offlinePhotoModels -ne 482 -or $photoProof.externalImageRequests -ne 0 -or $ledger.imageModels -ne 482 -or $provenance.photoLedgerSha256 -cne 'bd52a8444169582ae47a021d05261b2637015d2d1df26f0d47260b60345942cd' -or $provenance.photoRegistrySha256 -cne '30d7e26747db76e9d25726420b41021c1b54db32ef6a14073cc07d3bf6bd4295' -or $provenance.photoModelCount -ne 482 -or $provenance.catalogUiCases -ne 15 -or -not $provenance.offlinePhotosVerified -or $provenance.appendedPhotoModels -ne 11 -or $provenance.coverageSha256 -cne '46a7e79842fcfdb67f828b117825f4068c3bc0cd227172f38e003c1c85f0dd8d' -or $provenance.patchSha256 -cne '2227e3697662d60b7c5acaa233594a24e57cf23b480503ef1f963af1d2cae68e') { throw 'Original offline photo/UI/frozen coverage proof is incomplete' }
        $proof=[ordered]@{schemaVersion=1;repository=$env:GITHUB_REPOSITORY;buildRunId=[long]39062628135;buildJobId=[long]117483563322;buildHeadSha='aba69f49d990b1cf7d30f84dc1ec02eb71c1b421';buildWorkflowSha256='cc6068c519e1e2a917ea58766afabaee325a6fa131f1e4bacdb79787e96d9456';originalRunConclusion='failure';originalBuildJobConclusion='success';originalValidationJobConclusion='failure';originalPublishJobConclusion='skipped';recoveryRunId=[long]$env:GITHUB_RUN_ID;recoveryHeadSha=$env:GITHUB_SHA;recoveryWorkflow='validate-r121-recovery.yml';artifactPins=$pins;fullOriginalArtifactZipDigestsVerified=$true;compiledSetupUnchanged=$true;reviewedSourceUnchanged=$true;offlineUIProofUnchanged=$true;nativeBuildNotRepeated=$true;setupSha256=$provenance.setupSha256;sourceSha256=$provenance.sourceSha256;provenanceSha256=(Get-FileHash candidate/provenance.json).Hash.ToLowerInvariant()}
        $proof | ConvertTo-Json -Depth 12 | Set-Content candidate/reused-build-proof.json -Encoding utf8NoBOM
        Copy-Item candidate/reused-build-proof.json bridge-evidence/
        'Exact original native build, source and offline UI artifacts verified for validation-only recovery'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Klipper-Farm-R121-Candidate
        path: candidate/
        if-no-files-found: error
        retention-days: 30
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Klipper-Farm-R121-Reviewed-Source
        path: checked-source/KF-R121-FULL.zip
        if-no-files-found: error
        retention-days: 30
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Klipper-Farm-R121-Offline-Photos-UI-proof
        path: ui-proof/
        if-no-files-found: error
        retention-days: 30
    - name: Retain exact build reuse evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Klipper-Farm-R121-Reused-Build-Evidence
        path: bridge-evidence/
        if-no-files-found: warn
        retention-days: 30
  validate:
    needs: reuse-build
    runs-on: windows-2022
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: Klipper-Farm-R121-Candidate
        path: candidate
    - name: Prepare verified actual-window validation harnesses
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        # This new validation-only file corrects cached HWND selection. The
        # original shipped script and every executable remain unchanged.
        [IO.File]::WriteAllBytes("$PWD/candidate/scripts/check-desktop-exit-actual-window-r117.ps1",[Convert]::FromBase64String(''))
        if ((Get-FileHash candidate/scripts/check-desktop-exit-actual-window-r117.ps1).Hash.ToLowerInvariant() -ne 'c1f1c3bc66abef1d4a298274c99d7882db8fef742b99572f0abef815bd850ac1') { throw 'Corrected window-selection harness differs' }
        $tokens = $null; $errors = $null
        [System.Management.Automation.Language.Parser]::ParseFile("$PWD/candidate/scripts/check-desktop-exit-actual-window-r117.ps1",[ref]$tokens,[ref]$errors) | Out-Null
        if ($errors.Count -gt 0) { throw ('Harness parse failed: ' + (($errors | ForEach-Object Message) -join '; ')) }
        [IO.File]::WriteAllBytes("$PWD/candidate/scripts/upgrade-actual-window-r117.ps1",[Convert]::FromBase64String(''))
        if ((Get-FileHash candidate/scripts/upgrade-actual-window-r117.ps1).Hash.ToLowerInvariant() -ne '34fe9c122199eb4e7aa91b219496e6c818a6a19c41b97583d4b5a5e2276ade5d') { throw 'Inline upgrade window helper differs' }
        $tokens = $null; $errors = $null
        [System.Management.Automation.Language.Parser]::ParseFile("$PWD/candidate/scripts/upgrade-actual-window-r117.ps1",[ref]$tokens,[ref]$errors) | Out-Null
        if ($errors.Count -gt 0) { throw ('Inline helper parse failed: ' + (($errors | ForEach-Object Message) -join '; ')) }
        [IO.File]::WriteAllBytes("$PWD/candidate/scripts/check-minimized-telemetry-r118.ps1",[Convert]::FromBase64String(''))
        if ((Get-FileHash candidate/scripts/check-minimized-telemetry-r118.ps1).Hash.ToLowerInvariant() -ne 'cdf740bd7e09dde834a10ef649045addb48ca07fe442d6a53bbd879df09e19ff') { throw 'Minimized telemetry harness differs' }
        $tokens = $null; $errors = $null
        [System.Management.Automation.Language.Parser]::ParseFile("$PWD/candidate/scripts/check-minimized-telemetry-r118.ps1",[ref]$tokens,[ref]$errors) | Out-Null
        if ($errors.Count -gt 0) { throw ('Minimized harness parse failed: ' + (($errors | ForEach-Object Message) -join '; ')) }
    - name: Verify upgrade from published R120 and installed runtime
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
        & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
        if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell startup probe failed' }
        Set-Location candidate
        . scripts/upgrade-actual-window-r117.ps1
        $inlineProof = Join-Path $PWD 'inline-window-proof'
        $setup = (Resolve-Path Klipper-Farm-R121-setup.exe).Path
        $release = (Resolve-Path release).Path
        $provenance = Get-Content provenance.json -Raw | ConvertFrom-Json
        if ($provenance.workflowCommit -ne 'aba69f49d990b1cf7d30f84dc1ec02eb71c1b421' -or $provenance.buildId -ne 'V20.6-R12.1-CATALOG-IMAGES-2026-10-17' -or $provenance.sequence -ne 121 -or $provenance.baselineSequence -ne 120) { throw 'Wrong compiled candidate provenance' }
        if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $provenance.setupSha256) { throw 'Candidate hash mismatch' }
        $installDir = Join-Path $env:RUNNER_TEMP 'Klipper Farm upgrade test'
        $installed = Start-Process $setup -ArgumentList ('/S /D=' + $installDir) -Wait -PassThru
        if ($installed.ExitCode -ne 0) { throw 'Initial R121 install failed' }
        $expected = @{}
        foreach ($name in @('klipper-farm-client.exe','klipper-farmd.exe')) { $expected[$name] = (Get-FileHash (Join-Path $installDir $name)).Hash }
        $desktop = Join-Path $installDir 'klipper-farm-client.exe'
        $desktopText = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($desktop))
        foreach ($marker in @($provenance.javascript,$provenance.stylesheet,$provenance.cameraWorker,'camera-detector/obico-failure-5a6b1be1fa.onnx','camera-detector/ort-wasm-simd-threaded.wasm','"installedSequence": 121','28e0124c33f42704483d1aac89af829c44a00ef5dbc2e93dff630befddd495eb')) {
          if (-not $desktopText.Contains($marker)) { throw "Installed R121 resource or channel missing: $marker" }
        }
        node scripts/check-headless-telemetry-runtime.mjs --daemon "$installDir/klipper-farmd.exe" --probe "$release/klipper-farm-ipc-probe.exe"
        if ($LASTEXITCODE -ne 0) { throw 'Installed telemetry failed' }
        gh release download r120 --repo $env:GITHUB_REPOSITORY --pattern Klipper-Farm-R120-setup.exe --dir old
        if ($LASTEXITCODE -ne 0) { throw 'Published R120 download failed' }
        $oldSetup = (Resolve-Path old/Klipper-Farm-R120-setup.exe).Path
        if ((Get-Item $oldSetup).Length -ne 248297141) { throw 'R120 installer size mismatch' }
        if ((Get-FileHash $oldSetup -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd325bc14695fca4ecdbc285b0476992d013fb8c3da988dca3724c7be2ef97e95') { throw 'R120 hash mismatch' }
        $oldInstall = Start-Process $oldSetup -ArgumentList ('/S /D=' + $installDir) -Wait -PassThru
        if ($oldInstall.ExitCode -ne 0) { throw 'R120 baseline install failed' }
        $baseline = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($desktop))
        if ($baseline -notmatch '"installedSequence"\s*:\s*120') { throw 'R120 baseline is not physically installed' }
        $dataDir = Join-Path $env:APPDATA 'app.klipper.farm'
        New-Item -ItemType Directory -Force $dataDir | Out-Null
        $marker = Join-Path $dataDir 'updater-r120-preserve.txt'
        [IO.File]::WriteAllText($marker,'preserve-r120-data')
        $cacheRoot = Join-Path $env:LOCALAPPDATA 'app.klipper.farm/verified-updates'
        $cleanupProbe = Join-Path $cacheRoot ([guid]::NewGuid().ToString('N'))
        New-Item -ItemType Directory -Force $cleanupProbe | Out-Null
        [IO.File]::WriteAllText((Join-Path $cleanupProbe 'installer.exe'),'unprotected-test-cache-fixture')
        $oldDesktop = Start-Process $desktop -PassThru
        Wait-UpgradeActualWindow -Process $oldDesktop -Case 'R120-before-update-helper' -OutputDirectory $inlineProof
        $cleanupDeadline = [DateTime]::UtcNow.AddSeconds(12)
        while ((Test-Path $cleanupProbe) -and [DateTime]::UtcNow -lt $cleanupDeadline) { Start-Sleep -Milliseconds 100 }
        "Synthetic cache survives startup: $(Test-Path $cleanupProbe)"
        $startupLog = Join-Path $env:APPDATA 'app.klipper.farm/logs/desktop-startup.log'
        if (Test-Path $startupLog) { Get-Content $startupLog -Tail 25 }
        $helperText = Get-Content scripts/apply-online-update.ps1 -Raw -Encoding UTF8
        if (-not $desktopText.Contains($helperText)) { throw 'Candidate helper differs from the one embedded in R121' }
        # Validation-only fixture correction. Run after R120 actual-window confirmation.
        # Build fixture trees outside the live cache so startup cleanup never sees
        # partially constructed directories. All test assertions remain unchanged.
        $cacheRoot = Join-Path $env:LOCALAPPDATA 'app.klipper.farm/verified-updates'
        [IO.Directory]::CreateDirectory($cacheRoot) | Out-Null
        $stageRoot = Join-Path $env:LOCALAPPDATA ('Klipper Farm R121 fixture staging ' + [guid]::NewGuid().ToString('N'))
        [IO.Directory]::CreateDirectory($stageRoot) | Out-Null
        $attemptName = [guid]::NewGuid().ToString('N')
        $legacyName = [guid]::NewGuid().ToString('N')
        $partialName = [guid]::NewGuid().ToString('N')
        $attemptStage = Join-Path $stageRoot $attemptName
        $legacyStage = Join-Path $stageRoot $legacyName
        $partialStage = Join-Path $stageRoot $partialName
        foreach ($directory in @($attemptStage,$legacyStage,$partialStage)) {
          [IO.Directory]::CreateDirectory($directory) | Out-Null
        }
        $attempt = Join-Path $cacheRoot $attemptName
        $legacy = Join-Path $cacheRoot $legacyName
        $partial = Join-Path $cacheRoot $partialName
        $cachedSetup = Join-Path $attempt 'installer.exe'
        $ready = Join-Path $attempt 'helper-ready'
        try {
          Copy-Item $setup (Join-Path $attemptStage 'installer.exe')
          [IO.File]::WriteAllText((Join-Path $attemptStage 'manifest.json'),'synthetic-signed-manifest-fixture')
          # The active owner is already alive before this attempt enters the live cache.
          [IO.File]::WriteAllText((Join-Path $attemptStage 'helper-ready'),(@{helperPid=$PID} | ConvertTo-Json -Compress))
          foreach ($directory in @($legacyStage,$partialStage)) {
            [IO.File]::WriteAllText((Join-Path $directory 'installer.exe'),'abandoned-cache-fixture')
          }
          [IO.File]::WriteAllText((Join-Path $legacyStage 'helper-ready'),'ready')
          [IO.File]::WriteAllText((Join-Path $legacyStage 'install-result.txt'),'Installed successfully')
          # Same-volume directory moves expose each completed fixture atomically.
          [IO.Directory]::Move($attemptStage,$attempt)
          [IO.Directory]::Move($legacyStage,$legacy)
          [IO.Directory]::Move($partialStage,$partial)
        } finally {
          if (Test-Path -LiteralPath $stageRoot) {
            Remove-Item -LiteralPath $stageRoot -Recurse -Force
          }
        }
        $keep = Join-Path (Split-Path -Parent $cacheRoot) 'keep-update-cache-test.txt'
        [IO.File]::WriteAllText($keep,'preserve-unrelated-file')
        # Continue unchanged: payload, helper handshake, R120 close, physical update,
        # cleanup assertions, unchanged neighbor/data, lifecycle and telemetry proofs.
        $payload = @{parentPid=$oldDesktop.Id;executable=$desktop;installer=$cachedSetup;sha256=$provenance.setupSha256;sizeBytes=(Get-Item $setup).Length;ready=$ready;cacheRoot=$cacheRoot} | ConvertTo-Json -Compress
        $start = [Diagnostics.ProcessStartInfo]::new()
        $start.FileName = "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe"
        $start.UseShellExecute = $false
        $start.RedirectStandardInput = $true
        $start.RedirectStandardOutput = $true
        $start.RedirectStandardError = $true
        $start.CreateNoWindow = $true
        $start.EnvironmentVariables.Remove('PSModulePath')
        $helperDebugPrefix = '$ProgressPreference = ''SilentlyContinue''; Set-PSDebug -Trace 1;' + [Environment]::NewLine
        foreach ($argument in @('-NoProfile','-NonInteractive','-Command',($helperDebugPrefix + $helperText))) { $start.ArgumentList.Add($argument) }
        $helper = [Diagnostics.Process]::Start($start)
        $outRead = $helper.StandardOutput.ReadToEndAsync()
        $errRead = $helper.StandardError.ReadToEndAsync()
        $handshakeStarted = [Diagnostics.Stopwatch]::StartNew()
        $helper.StandardInput.Write($payload)
        $helper.StandardInput.Close()
        $actualHelperReady = {
          if (-not (Test-Path $ready)) { return $false }
          try { return (Get-Content $ready -Raw | ConvertFrom-Json).helperPid -eq $helper.Id } catch { return $false }
        }
        $deadline = [DateTime]::UtcNow.AddSeconds(15)
        while (-not (& $actualHelperReady) -and -not $helper.HasExited -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 100 }
        if (-not (& $actualHelperReady)) {
          Write-Host ('HELPER process: ' + ($helper | Select-Object Id,MainWindowTitle,TotalProcessorTime,StartTime | ConvertTo-Json -Compress))
          Get-ChildItem $cacheRoot -Recurse -Force | Select-Object FullName,Length | ConvertTo-Json -Compress | Write-Host
          if (Test-Path (Join-Path $cacheRoot 'last-error.txt')) { Get-Content (Join-Path $cacheRoot 'last-error.txt') }
          Write-Host "HELPER handshake elapsedMs=$($handshakeStarted.ElapsedMilliseconds) exited=$($helper.HasExited)"
          if (Test-Path install-result.txt) { Get-Content install-result.txt }
          if (-not $helper.HasExited) { $helper.Kill(); $helper.WaitForExit(10000) | Out-Null }
          $null = $outRead.Wait(5000)
          $null = $errRead.Wait(5000)
          if ($outRead.IsCompleted) { $outRead.Result | Set-Content helper-stdout.txt; Write-Host $outRead.Result }
          if ($errRead.IsCompleted) { $errRead.Result | Set-Content helper-stderr.txt; Write-Host $errRead.Result }
          throw 'Updater handshake failed'
        }
        "HELPER ready elapsedMs=$($handshakeStarted.ElapsedMilliseconds)"
        if (-not (Close-UpgradeActualWindow -Process $oldDesktop -Case 'R120-close-for-upgrade' -OutputDirectory $inlineProof) -or -not $oldDesktop.WaitForExit(20000)) { throw 'R120 did not close cleanly' }
        if (-not $helper.WaitForExit(120000)) { $helper.Kill(); throw 'Update helper timeout' }
        if ($helper.ExitCode -ne 0) { $outRead.Result; $errRead.Result; throw 'Update helper failed' }
        $deadline = [DateTime]::UtcNow.AddSeconds(12)
        while (((Test-Path $attempt) -or (Test-Path $legacy) -or (Test-Path $partial)) -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 150 }
        foreach ($path in @($attempt,$legacy,$partial)) { if (Test-Path $path) { throw "Update cache was not cleaned: $path" } }
        if ((Get-Content -LiteralPath $keep -Raw) -ne 'preserve-unrelated-file') { throw 'Unrelated cache neighbor was changed' }
        'Update cache runtime OK: active installer attempt, legacy completed update and partial download removed; unrelated file preserved'
        foreach ($name in @('klipper-farm-client.exe','klipper-farmd.exe')) {
          $hash = (Get-FileHash (Join-Path $installDir $name)).Hash
          "UPDATED $name hash=$hash matchesR121=$($hash -eq $expected[$name])"
          if ($hash -ne $expected[$name]) { throw "Wrong installed R121 payload: $name" }
        }
        if ((Get-Content $marker -Raw) -ne 'preserve-r120-data') { throw 'App data was removed' }
        $restarted = @(Get-Process -Name klipper-farm-client -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $desktop })
        if ($restarted.Count -eq 0) { throw 'R121 was not relaunched' }
        foreach ($process in $restarted) {
          Wait-UpgradeActualWindow -Process $process -Case 'R121-relaunched-before-close' -OutputDirectory $inlineProof
          if ($process.HasExited -or -not (Close-UpgradeActualWindow -Process $process -Case 'R121-relaunched-close' -OutputDirectory $inlineProof) -or -not $process.WaitForExit(20000)) { throw 'R121 window lifecycle failed' }
        }
        foreach ($process in @(Get-Process -Name klipper-farmd -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq (Join-Path $installDir 'klipper-farmd.exe') })) { if (-not $process.WaitForExit(10000)) { throw 'Sidecar survived desktop shutdown' } }
        & scripts/check-desktop-exit-actual-window-r117.ps1 -Desktop $desktop -OutputDirectory (Join-Path $PWD 'main-window-proof')
        New-Item -ItemType Directory -Force smoke | Out-Null
        node scripts/check-desktop-startup-smoke.mjs "$installDir/klipper-farm-client.exe" "$installDir/klipper-farmd.exe" "$PWD/smoke"
        if ($LASTEXITCODE -ne 0) { throw 'Installed desktop smoke failed' }
        $minimizedProof = Join-Path $env:RUNNER_TEMP 'R121 minimized private validation'
        & scripts/check-minimized-telemetry-r118.ps1 -DesktopExe $desktop -ProbeExe (Join-Path $release 'klipper-farm-ipc-probe.exe') -EmulatorScript (Join-Path $PWD 'scripts/hardware-emulator.mjs') -OutputDirectory $minimizedProof
        if (-not $?) { throw 'Installed desktop minimize/restore telemetry proof failed' }
        New-Item -ItemType Directory -Force minimized-telemetry-proof | Out-Null
        Copy-Item (Join-Path $minimizedProof 'minimized-telemetry-r118.json') minimized-telemetry-proof/
        $startupProof = Join-Path $env:RUNNER_TEMP 'R121 startup private validation'
        & scripts/check-startup-instance-r117.ps1 -DesktopExe $desktop -OutputDirectory $startupProof
        if (-not $?) { throw 'Actual installed desktop concurrent startup regression failed' }
        New-Item -ItemType Directory -Force startup-instance-proof | Out-Null
        Copy-Item (Join-Path $startupProof 'startup-instance-r117.json') startup-instance-proof/
        $windowProof = Get-Content main-window-proof/main-window-lifecycle-r117.json -Raw | ConvertFrom-Json
        if (($windowProof.completedModes -join ',') -ne 'close-during-startup,normal-close,force-desktop,recovery-close' -or $windowProof.exitWaitMs -ne 20000 -or $windowProof.earlyCloseWaitsForPageReady -ne $false) { throw 'Complete original lifecycle coverage or timing changed' }
        $startup = Get-Content startup-instance-proof/startup-instance-r117.json -Raw | ConvertFrom-Json
        if ($startup.cases.Count -ne 3) { throw 'Three real double-launch proofs are required' }
        $external = @{schemaVersion=1;candidateBuildRunId=[long]39062628135;candidateBuildHeadSha='aba69f49d990b1cf7d30f84dc1ec02eb71c1b421';patchSha256=$provenance.patchSha256;patchFragments=$provenance.patchFragments;coverageSha256=$provenance.coverageSha256;baselinePhotoModels=$provenance.baselinePhotoModels;appendedPhotoModels=$provenance.appendedPhotoModels;photoLedgerSha256=$provenance.photoLedgerSha256;photoModelCount=$provenance.photoModelCount;catalogUiCases=$provenance.catalogUiCases;offlinePhotosVerified=$provenance.offlinePhotosVerified;setupSha256=$provenance.setupSha256;sourceSha256=$provenance.sourceSha256;baselineSourceSha256='5daf1624acfba53aa91a45b00fd26777a9351efe19714de9519a40b1a6e50804';baselineSetupSha256='d325bc14695fca4ecdbc285b0476992d013fb8c3da988dca3724c7be2ef97e95';baselineSequence=120;sequence=121;validationRunId=[long]$env:GITHUB_RUN_ID;validationHeadSha=$env:GITHUB_SHA;validationWorkflow='validate-r121-recovery.yml';fixtureAssembly='complete-outside-cache-then-atomic-move';reusedBuildProof=(Get-Content reused-build-proof.json -Raw | ConvertFrom-Json);correctedLifecycleScriptSha256='c1f1c3bc66abef1d4a298274c99d7882db8fef742b99572f0abef815bd850ac1';inlineWindowHelperSha256='34fe9c122199eb4e7aa91b219496e6c818a6a19c41b97583d4b5a5e2276ade5d';minimizedHarnessSha256='cdf740bd7e09dde834a10ef649045addb48ca07fe442d6a53bbd879df09e19ff';fullR120UpgradeVerified=$true;dataPreservationVerified=$true;originalFourLifecycleModesVerified=$true;earlyCloseWaitsForPageReady=$false;exitWaitMs=20000;allThreeDoubleLaunchesVerified=$true;installedSmokeVerified=$true;minimizedTelemetryDisconnectReconnectRestoreVerified=$true}
        $external | ConvertTo-Json -Depth 6 | Set-Content exact-validation.json -Encoding utf8NoBOM
        'R120 to R121 physical upgrade, data preservation, relaunch and telemetry passed'
    - name: Retain validated installer
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force out | Out-Null
        Copy-Item candidate/Klipper-Farm-R121-setup.exe,candidate/SHA256SUMS.txt,candidate/provenance.json,candidate/exact-validation.json,candidate/minimized-telemetry-proof/minimized-telemetry-r118.json out/
        Copy-Item candidate/main-window-proof/main-window-lifecycle-r117.json,candidate/startup-instance-proof/startup-instance-r117.json,candidate/inline-window-proof/upgrade-inline-window-r117.json out/
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Klipper-Farm-R121-Exact-Candidate-Validated
        path: out/
        if-no-files-found: error
        retention-days: 30
    - name: Retain test diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Klipper-Farm-R121-Exact-Candidate-Validation-logs
        path: |
          candidate/install-result.txt
          candidate/helper-stdout.txt
          candidate/helper-stderr.txt
          candidate/smoke/
          candidate/startup-instance-proof/
          candidate/minimized-telemetry-proof/
          candidate/main-window-proof/
          candidate/inline-window-proof/
          candidate/exact-validation.json
        if-no-files-found: warn
  publish-candidate:
    needs:
    - reuse-build
    - validate
    runs-on: windows-2022
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: Klipper-Farm-R121-Exact-Candidate-Validated
        path: release-candidate
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: Klipper-Farm-R121-Reviewed-Source
        path: release-source
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: Klipper-Farm-R121-Offline-Photos-UI-proof
        path: release-ui-proof/offline-photos
    - name: Publish validated R121 prerelease candidate for signing
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $source = @(Get-ChildItem release-source -Recurse -Filter 'KF-R121-FULL.zip')
        if ($source.Count -ne 1) { throw 'Expected one frozen reviewed source archive' }
        Copy-Item $source[0].FullName release-candidate/KF-R121-FULL.zip
        Compress-Archive -Path release-ui-proof/* -DestinationPath release-candidate/R121-UI-proof.zip
        Set-Location release-candidate
        $provenance = Get-Content provenance.json -Raw | ConvertFrom-Json
        $validation = Get-Content exact-validation.json -Raw | ConvertFrom-Json
        if ($provenance.workflowCommit -ne 'aba69f49d990b1cf7d30f84dc1ec02eb71c1b421' -or $provenance.sequence -ne 121 -or $provenance.baselineSequence -ne 120) { throw 'Wrong candidate build provenance' }
        if ($validation.candidateBuildHeadSha -ne 'aba69f49d990b1cf7d30f84dc1ec02eb71c1b421' -or $validation.candidateBuildRunId -ne 39062628135 -or $validation.validationRunId -ne [long]$env:GITHUB_RUN_ID -or $validation.validationHeadSha -ne $env:GITHUB_SHA -or $validation.reusedBuildProof.buildRunId -ne 39062628135 -or $validation.reusedBuildProof.recoveryHeadSha -ne $env:GITHUB_SHA -or -not $validation.fullR120UpgradeVerified -or -not $validation.minimizedTelemetryDisconnectReconnectRestoreVerified) { throw 'Candidate physical validation proof is missing' }
        $photoProof = Get-Content ../release-ui-proof/offline-photos/r121-images-ui-summary.json -Raw | ConvertFrom-Json
        $sourceLedger = Get-Content ../release-ui-proof/offline-photos/reviewed-photo-ledger.json -Raw | ConvertFrom-Json
        if (-not $photoProof.passed -or $photoProof.windowsEdgeUICases -ne 15 -or $photoProof.offlinePhotoModels -ne 482 -or $photoProof.externalImageRequests -ne 0 -or $provenance.photoLedgerSha256 -ne 'bd52a8444169582ae47a021d05261b2637015d2d1df26f0d47260b60345942cd' -or $provenance.photoModelCount -ne 482 -or -not $validation.offlinePhotosVerified -or $validation.catalogUiCases -ne 15 -or $sourceLedger.imageModels -ne 482) { throw 'Offline photo acceptance is incomplete' }
        if ($provenance.patchSha256 -ne '2227e3697662d60b7c5acaa233594a24e57cf23b480503ef1f963af1d2cae68e' -or $validation.patchSha256 -ne '2227e3697662d60b7c5acaa233594a24e57cf23b480503ef1f963af1d2cae68e') { throw 'Published candidate patch-set differs' }
        if ($provenance.coverageSha256 -ne '46a7e79842fcfdb67f828b117825f4068c3bc0cd227172f38e003c1c85f0dd8d' -or $validation.coverageSha256 -ne '46a7e79842fcfdb67f828b117825f4068c3bc0cd227172f38e003c1c85f0dd8d' -or $provenance.appendedPhotoModels -ne 11) { throw 'Frozen append-only coverage changed before publication' }
        $setupHash = (Get-FileHash Klipper-Farm-R121-setup.exe).Hash.ToLowerInvariant()
        $sourceHash = (Get-FileHash KF-R121-FULL.zip).Hash.ToLowerInvariant()
        $uiProofHash = (Get-FileHash R121-UI-proof.zip).Hash.ToLowerInvariant()
        if ($setupHash -ne $provenance.setupSha256 -or $sourceHash -ne $provenance.sourceSha256) { throw 'Candidate asset hash differs from validated build' }
        if ((Get-Item Klipper-Farm-R121-setup.exe).Length -gt 512MB) { throw 'Installer exceeds updater limit' }
        "$setupHash *Klipper-Farm-R121-setup.exe`n$sourceHash *KF-R121-FULL.zip`n$uiProofHash *R121-UI-proof.zip" | Set-Content SHA256SUMS.txt -Encoding utf8NoBOM
        @'
        R121 candidate: 11 additional exact-model photographs extend the unchanged R120 collection to 482 local photos plus 5 preserved illustrations (487 of 500 models). The remaining 13 models retain an explicit silhouette fallback. All prior 471 photographs, credits and mappings remain unchanged.

        The exact source and installer passed complete append-only ZIP scope, the 15-case Windows Edge catalog/photo suite, original photo QA, native build checks, and the actual installed R120 to R121 upgrade with preserved data, four lifecycle modes, three double launches, and minimize/disconnect/reconnect/restore telemetry against a synthetic localhost printer. The unchanged historical heavy-panel implementation retains its prior validation.

        Для подключения требуется доступный Klipper/Moonraker. Наличие изображения модели не подтверждает совместимость штатной прошивки. Build, native checks and offline UI proof remain bound to original successful build job 117483563322 in run 39062628135 at commit aba69f49d990b1cf7d30f84dc1ec02eb71c1b421. Physical runtime validation was performed separately by validate-r121-recovery.yml on the exact same artifact bytes after correcting only cache fixture assembly. Both identities are preserved in exact-validation.json. Stable signing follows independent verification of these exact public assets.
        '@ | Set-Content candidate-notes.md -Encoding utf8NoBOM
        gh release view r121 --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
        if ($LASTEXITCODE -eq 0) { throw 'R121 already exists; review it before replacing or promoting any asset' }
        gh release create r121 Klipper-Farm-R121-setup.exe KF-R121-FULL.zip R121-UI-proof.zip SHA256SUMS.txt provenance.json exact-validation.json minimized-telemetry-r118.json --repo $env:GITHUB_REPOSITORY --target 'aba69f49d990b1cf7d30f84dc1ec02eb71c1b421' --prerelease --title 'Klipper Farm R121 candidate — offline model photos' --notes-file candidate-notes.md
        if ($LASTEXITCODE -ne 0) { throw 'Validated prerelease publication failed' }

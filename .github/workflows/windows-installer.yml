name: Windows installer
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Source prerelease tag
        required: true
        default: source-r98
      source_sha256:
        description: SHA-256 of KF-R98-FULL.zip
        required: true
permissions:
  contents: read
concurrency:
  group: windows-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KF_SOURCE_TAG: ${{ inputs.source_tag }}
      KF_SOURCE_SHA256: ${{ inputs.source_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: 1.98.0
          components: clippy
      - name: Download and verify pinned source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:KF_SOURCE_TAG -notmatch '^[A-Za-z0-9._-]{1,80}$') { throw 'Invalid source tag' }
          if ($env:KF_SOURCE_SHA256 -notmatch '^[a-f0-9]{64}$') { throw 'Invalid source checksum' }
          gh release download $env:KF_SOURCE_TAG --repo $env:GITHUB_REPOSITORY --pattern KF-R98-FULL.zip --dir incoming
          if ($LASTEXITCODE -ne 0) { throw 'Source download failed' }
          $archive = Join-Path $PWD 'incoming/KF-R98-FULL.zip'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:KF_SOURCE_SHA256) { throw 'Source checksum mismatch' }
          Expand-Archive $archive -DestinationPath work
          $project = (Get-ChildItem work -Directory).FullName
          if (@($project).Count -ne 1) { throw 'Expected one source root' }
          "KF_PROJECT=$project" >> $env:GITHUB_ENV
      - name: Verify source and frontend
        shell: pwsh
        run: |
          Set-Location $env:KF_PROJECT
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          node scripts/verification-lab-r9.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Verification failed' }
      - name: Restore Windows PowerShell modules and apply reviewed compatibility fix
        shell: pwsh
        run: |
          Set-Location $env:KF_PROJECT
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/verify-release-manifest.ps1 -ManifestPath MANIFEST-SHA256.txt -RootPath $PWD -Kind release
          if ($LASTEXITCODE -ne 0) { throw 'Original source manifest failed' }
          $builder = Join-Path $PWD 'scripts/build-and-install-windows.mjs'
          $text = [IO.File]::ReadAllText($builder)
          $needle = 'const verifyManifest='
          if (-not $text.Contains($needle)) { throw 'Unexpected build script' }
          $insert = "for(const name of Object.keys(buildEnv))if(name.toLowerCase()==='psmodulepath')delete buildEnv[name];"
          [IO.File]::WriteAllText($builder, $text.Replace($needle, $insert + [char]10 + $needle), [Text.UTF8Encoding]::new($false))
          $text = [IO.File]::ReadAllText($builder)
          $needle = "const tempRoot=path.join(cacheRoot,'temp');"
          if (-not $text.Contains($needle)) { throw 'Unexpected temporary directory' }
          $insert = "const tempRoot=process.platform==='win32'?path.join((await import('node:os')).default.tmpdir(),'kf-build',(await import('node:crypto')).createHash('sha256').update(root).digest('hex').slice(0,16)):path.join(cacheRoot,'temp');"
          [IO.File]::WriteAllText($builder, $text.Replace($needle, $insert), [Text.UTF8Encoding]::new($false))
          $native = Join-Path $PWD 'src-tauri/src/online_updates.rs'
          $text = [IO.File]::ReadAllText($native)
          $needle = '        command.args(["-NoProfile", "-NonInteractive", "-Command", include_str!'
          if (-not $text.Contains($needle)) { throw 'Unexpected updater launcher' }
          $insert = '        command.env_remove("PSModulePath");'
          [IO.File]::WriteAllText($native, $text.Replace($needle, $insert + [char]10 + $needle), [Text.UTF8Encoding]::new($false))
          $database = Join-Path $PWD 'src-tauri/src/database.rs'
          $text = [IO.File]::ReadAllText($database)
          $needle = 'let connection = Connection::open(path).map_err(|error| error.to_string())?;'
          if (-not $text.Contains($needle)) { throw 'Unexpected database opener' }
          $insert = 'let connection = Connection::open(path).map_err(|error| format!("SQLite open {}: {error:?}", path.display()))?;'
          [IO.File]::WriteAllText($database, $text.Replace($needle, $insert), [Text.UTF8Encoding]::new($false))
          $core = Join-Path $PWD 'src-tauri/src/transactional_core/mod.rs'
          $text = [IO.File]::ReadAllText($core)
          $needle = '            Journal::new(path)'
          if (-not $text.Contains($needle)) { throw 'Unexpected journal opener' }
          $insert = '            Journal::new(path).map_err(|error| format!("SQLite journal {}: {error}", path.display()))'
          [IO.File]::WriteAllText($core, $text.Replace($needle, $insert), [Text.UTF8Encoding]::new($false))
          Copy-Item "$env:GITHUB_WORKSPACE/.github/workflows/run-rust-tests.mjs" "$PWD/scripts/run-rust-tests.mjs"
          node scripts/generate-release-manifests.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Patched source manifest failed' }
      - name: Compile and test native Windows code and build NSIS
        shell: pwsh
        run: |
          Set-Location $env:KF_PROJECT
          node scripts/build-and-install-windows.mjs --build-only
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Preserve compiled candidate for independent Windows validation
        shell: pwsh
        run: |
          Set-Location $env:KF_PROJECT
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/candidate/release" | Out-Null
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/candidate/scripts" | Out-Null
          $release = Join-Path $PWD '.klipper-build-cache/target/release'
          foreach ($name in @('klipper-farm-client.exe','klipper-farmd.exe','klipper-farm-ipc-probe.exe')) {
            Copy-Item (Join-Path $release $name) "$env:GITHUB_WORKSPACE/candidate/release/$name"
          }
          $setup = @(Get-ChildItem INSTALLER -Filter '*.exe')
          if ($setup.Count -ne 1) { throw 'Expected one candidate installer' }
          Copy-Item $setup[0].FullName "$env:GITHUB_WORKSPACE/candidate/Klipper-Farm-R98-setup.exe"
          foreach ($name in @('check-headless-telemetry-runtime.mjs','check-desktop-startup-smoke.mjs','hardware-emulator.mjs','apply-online-update.ps1')) {
            Copy-Item "scripts/$name" "$env:GITHUB_WORKSPACE/candidate/scripts/$name"
          }
          @{sourceSha256=$env:KF_SOURCE_SHA256; workflowCommit=$env:GITHUB_SHA; buildId=(Get-Content RELEASE-BUILD-ID.txt -Raw).Trim()} | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE/candidate/provenance.json" -Encoding utf8NoBOM
      - name: Retain candidate without publishing a release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-R98-Candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 30
      - name: Exercise desktop and updater helper
        timeout-minutes: 4
        shell: pwsh
        run: |
          Set-Location $env:KF_PROJECT
          $release = Join-Path $PWD '.klipper-build-cache/target/release'
          node scripts/check-headless-telemetry-runtime.mjs --daemon "$release/klipper-farmd.exe" --probe "$release/klipper-farm-ipc-probe.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Headless telemetry failed' }
          New-Item -ItemType Directory -Force "$PWD/.klipper-build-cache/smoke" | Out-Null
          node scripts/check-desktop-startup-smoke.mjs "$release/klipper-farm-client.exe" "$release/klipper-farmd.exe" "$PWD/.klipper-build-cache/smoke"
          if ($LASTEXITCODE -ne 0) { throw 'Desktop smoke failed' }
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/apply-online-update.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw 'Updater helper syntax failed' }
      - name: Exercise silent update over an existing installation
        timeout-minutes: 3
        shell: pwsh
        run: |
          Set-Location $env:KF_PROJECT
          $release = Join-Path $PWD '.klipper-build-cache/target/release'
          $setup = @(Get-ChildItem INSTALLER -Filter '*.exe')[0].FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'Klipper Farm update test'
          $first = Start-Process -FilePath $setup -ArgumentList ('/S /D=' + $installDir) -Wait -PassThru
          if ($first.ExitCode -ne 0) { throw 'Initial install failed' }
          $expected = @{}
          foreach ($name in @('klipper-farm-client.exe','klipper-farmd.exe')) { $expected[$name] = (Get-FileHash (Join-Path $installDir $name)).Hash }
          $exe = Join-Path $installDir 'klipper-farm-client.exe'
          $sidecar = Join-Path $installDir 'klipper-farmd.exe'
          if (-not (Test-Path $exe)) { throw 'Installed desktop missing' }
          $dataDir = Join-Path $env:APPDATA 'app.klipper.farm'
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $marker = Join-Path $dataDir 'updater-config-preserve.txt'
          [IO.File]::WriteAllText($marker, 'preserve')
          [IO.File]::WriteAllText($exe, 'old desktop')
          [IO.File]::WriteAllText($sidecar, 'old daemon')
          $dead = Start-Process -FilePath "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -ArgumentList '-NoProfile -NonInteractive -Command exit 0' -Wait -PassThru
          $payload = @{parentPid=$dead.Id; executable=$exe; installer=$setup; sha256=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant(); sizeBytes=(Get-Item $setup).Length; ready=(Join-Path $env:RUNNER_TEMP 'updater-helper-ready')} | ConvertTo-Json -Compress
          $start = [Diagnostics.ProcessStartInfo]::new()
          $start.FileName = "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe"
          $start.UseShellExecute = $false
          $start.RedirectStandardInput = $true
          $start.CreateNoWindow = $true
          $start.EnvironmentVariables.Remove("PSModulePath")
          $helperText = Get-Content scripts/apply-online-update.ps1 -Raw -Encoding UTF8
          $start.Arguments = '-NoProfile -NonInteractive -EncodedCommand ' + [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($helperText))
          $helper = [Diagnostics.Process]::Start($start)
          $helper.StandardInput.Write($payload)
          $helper.StandardInput.Close()
          if (-not $helper.WaitForExit(120000)) { $helper.Kill(); throw 'Updater helper timeout' }
          if ($helper.ExitCode -ne 0) { throw 'Updater helper failed' }
          foreach ($name in @('klipper-farm-client.exe','klipper-farmd.exe')) {
            if ((Get-FileHash (Join-Path $installDir $name)).Hash -ne $expected[$name]) { throw "Update did not overwrite $name" }
          }
          if ((Get-Content $marker -Raw) -ne 'preserve') { throw 'Existing settings were removed' }
      - name: Collect tested installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $installer = @(Get-ChildItem "$env:KF_PROJECT/INSTALLER" -Filter '*.exe')
          if ($installer.Count -ne 1) { throw 'Expected one tested installer' }
          Copy-Item $installer[0].FullName out/Klipper-Farm-R98-setup.exe
          $hash = (Get-FileHash out/Klipper-Farm-R98-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *Klipper-Farm-R98-setup.exe" | Set-Content -Encoding utf8NoBOM out/SHA256SUMS.txt
      - name: Retain evidence and installer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-R98-Windows
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          path: |
            out/
            work/**/.klipper-build-cache/logs/
            work/**/.klipper-build-cache/target/v20-rust-tests-last.log
            work/**/.klipper-build-cache/smoke/

name: Build and validate R120
on:
  workflow_dispatch:
  push:
    branches: [r120-catalog-photos]
    paths: ['.github/workflows/windows-r120.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-r120
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Use pinned Python setup
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Restore exact R119 source and retrieve every pinned photo fragment
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'sanozhukov3737-oss/klipper-farm-updates') { throw 'Unexpected repository' }
          New-Item -ItemType Directory -Force incoming,proof,ci | Out-Null
          gh release download r119 --repo $env:GITHUB_REPOSITORY --pattern KF-R119-FULL.zip --dir incoming
          if ($LASTEXITCODE -ne 0) { throw 'Published R119 source download failed' }
          if ((Get-Item incoming/KF-R119-FULL.zip).Length -ne 500254340) { throw 'R119 source size mismatch' }
          if ((Get-FileHash incoming/KF-R119-FULL.zip).Hash.ToLowerInvariant() -ne 'd2d4feb12370a707ae38ec4638f037bdaae57631e2097f03c25aa0fc4a0b60f5') { throw 'R119 source SHA mismatch' }
          Expand-Archive incoming/KF-R119-FULL.zip work
          Rename-Item work/Klipper-Farm-R119 app
          [IO.File]::WriteAllBytes("$PWD/ci/fragment-pins.json",[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes("$PWD/ci/reviewed-files.json",[Convert]::FromBase64String(''))
          $pins = Get-Content ci/fragment-pins.json -Raw | ConvertFrom-Json
          $treeJson = gh api "repos/$env:GITHUB_REPOSITORY/git/trees/$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Exact-head Git tree fetch failed' }
          $tree = ($treeJson -join "`n") | ConvertFrom-Json
          if ($tree.truncated) { throw 'Truncated Git tree' }
          foreach ($pin in $pins) {
            $fragmentEntries = @($tree.tree | Where-Object { $_.path -ceq $pin.name -and $_.type -eq 'blob' -and $_.mode -eq '100644' })
            if ($fragmentEntries.Count -ne 1) { throw "Missing unique fragment Git blob: $($pin.name)" }
            $encoded = gh api "repos/$env:GITHUB_REPOSITORY/git/blobs/$($fragmentEntries[0].sha)" --jq .content
            if ($LASTEXITCODE -ne 0) { throw "Fragment fetch failed: $($pin.name)" }
            $destination = Join-Path "$PWD/incoming" $pin.name
            [IO.File]::WriteAllBytes($destination,[Convert]::FromBase64String(($encoded -join '')))
            if ((Get-Item $destination).Length -ne $pin.size -or (Get-Item $destination).Length -gt 23068672) { throw "Fragment size mismatch: $($pin.name)" }
            if ((Get-FileHash $destination).Hash.ToLowerInvariant() -ne $pin.sha256) { throw "Fragment SHA mismatch: $($pin.name)" }
          }
          [IO.File]::WriteAllBytes("$PWD/ci/check-images-scope.py",[Convert]::FromBase64String(''))
          if ((Get-FileHash ci/check-images-scope.py).Hash.ToLowerInvariant() -ne '21269224ff22ab6620dfbe462c3c3d7422d1e76d5096d3eb43dd61cae4ff0f00') { throw 'Embedded helper SHA mismatch' }
          [IO.File]::WriteAllBytes("$PWD/ci/check-operational-parity.mjs",[Convert]::FromBase64String(''))
          if ((Get-FileHash ci/check-operational-parity.mjs).Hash.ToLowerInvariant() -ne '88d25ce2f9da865582027d8556299f5ec5ca67c8ce5099172b940b32afb51c2d') { throw 'Embedded helper SHA mismatch' }
          [IO.File]::WriteAllBytes("$PWD/ci/check-ui-proof.py",[Convert]::FromBase64String(''))
          if ((Get-FileHash ci/check-ui-proof.py).Hash.ToLowerInvariant() -ne 'f72f57511db73c8c64db0d0dbedf4afe063a60a6c63e7fd0c1afdef541f1afe3') { throw 'Embedded helper SHA mismatch' }
          Copy-Item ci/fragment-pins.json,ci/reviewed-files.json proof/
          [IO.File]::WriteAllText("$PWD/proof/ci-origin.json",(@{repository=$env:GITHUB_REPOSITORY;headSha=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;workflow='windows-r120.yml';baselineSha256='d2d4feb12370a707ae38ec4638f037bdaae57631e2097f03c25aa0fc4a0b60f5';uiOnly=$false} | ConvertTo-Json),[Text.UTF8Encoding]::new($false))
          Copy-Item ci/fragment-pins.json incoming/r120-patch-manifest.json
      - name: Apply exact fragments and prove every other baseline file unchanged
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-Content ci/fragment-pins.json -Raw | ConvertFrom-Json
          $arguments = @('ci/check-images-scope.py','--baseline','incoming/KF-R119-FULL.zip','--source','work/app','--pins','ci/fragment-pins.json','--allowlist','ci/reviewed-files.json','--proof','proof','--release')
          foreach ($part in $parts) { $arguments += @('--patch',("incoming/" + $part.name)) }
          & python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Immutable global patch/scope verification failed' }
      - name: Install locked frontend dependencies
        shell: pwsh
        run: |
          Set-Location work/app
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked frontend installation failed' }
      - name: Verify operational AST parity, TypeScript, metadata and original photo bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node ci/check-operational-parity.mjs work/app proof/baseline-printerCatalog.ts proof/operational-parity.json
          if ($LASTEXITCODE -ne 0) { throw 'Operational catalog AST changed' }
          Set-Location work/app
          node node_modules/typescript/bin/tsc --noEmit
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript check failed' }
          node scripts/check-printer-catalog.mjs
          if ($LASTEXITCODE -ne 0) { throw '500 catalog identities/selection regression failed' }
          $qa = & node scripts/check-printer-catalog-images.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Offline original photo QA failed' }
          $qa | ForEach-Object { Write-Host $_ }
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'proof/images-qa.json'),($qa -join "`n"),[Text.UTF8Encoding]::new($false))
          Copy-Item public/printer-catalog-credits/IMAGES.json (Join-Path $env:GITHUB_WORKSPACE 'proof/reviewed-photo-ledger.json')
          node scripts/check-creality-light.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Preserved Creality light invariants failed' }
          node scripts/check-security.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Preserved security invariants failed' }
      - name: Rebuild frontend and freeze complete reviewed source
        id: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location work/app
          node scripts/check-light-readback-r116.cjs
          if ($LASTEXITCODE -ne 0) { throw 'R120 light readback regression failed' }
          node scripts/check-background-camera-r118.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Background camera decoded-frame sampling regression failed' }
          node scripts/check-printer-open-r117.cjs
          if ($LASTEXITCODE -ne 0) { throw 'First detail open read-only preview regression failed' }
          node scripts/prepare-camera-detector.mjs --download
          if ($LASTEXITCODE -ne 0) { throw 'Pinned local camera model or ONNX runtime staging failed' }
          node scripts/check-legacy-library-routing.mjs
          if ($LASTEXITCODE -ne 0) { throw 'R94 native routing regression failed' }
          node scripts/check-print-start-confirmation.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Print start confirmation regression failed' }
          node scripts/check-upload-actor-identity.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Upload identity regression failed' }
          node scripts/check-moonraker-compat.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Compatibility regression failed' }
          node scripts/check-printer-connection-bridge.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Actor bridge regression failed' }
          node scripts/check-maintenance.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Maintenance countdown and notification regression failed' }
          node scripts/check-camera-guard.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Camera guard state and pause regression failed' }
          node scripts/check-tv-dashboard.mjs
          if ($LASTEXITCODE -ne 0) { throw 'TV dashboard state regression failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend compilation failed' }
          node scripts/lock-v20-6-dist.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Frontend provenance check failed' }
          node scripts/generate-release-manifests.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Manifest generation failed' }
          node scripts/check-release-portability.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Portable release checks failed' }
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'checked-source') | Out-Null
          $env:KF_ARCHIVE_ROOT = 'Klipper-Farm-R120'
          $env:KF_SOURCE_ZIP = Join-Path $env:GITHUB_WORKSPACE 'checked-source/KF-R120-FULL.zip'
          node scripts/build-reproducible-zip.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed source freeze failed' }
      - name: Install locked browser acceptance dependencies after reviewed source freeze
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location work/app
          npm ci --prefix ui-tests --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked browser test dependencies failed' }
      - name: Run all 15 actual Windows Edge catalog and offline photo cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location work/app
          $env:PLAYWRIGHT_MODULE_PATH = './node_modules/playwright/index.mjs'
          $env:CHROMIUM_EXECUTABLE = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          if (-not (Test-Path $env:CHROMIUM_EXECUTABLE -PathType Leaf)) { throw 'Preinstalled Windows Edge missing' }
          $env:KF_UI_SCREENSHOTS = Join-Path $env:GITHUB_WORKSPACE 'proof'
          node ui-tests/printer-catalog.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows UI/photo acceptance failed' }
          Set-Location $env:GITHUB_WORKSPACE
          python ci/check-ui-proof.py --proof proof --source work/app
          if ($LASTEXITCODE -ne 0) { throw 'Positive UI/image proof is incomplete' }
      - name: Retain UI proof, image ledger and scope evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-R120-Offline-Photos-UI-proof
          path: proof/
          if-no-files-found: error
          retention-days: 14
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: 1.98.0
          components: clippy
      - name: Compile actual Windows Hello desktop binding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location work/app
          tar -xzf offline-tools/rust/rust-vendor-v1144.tar.gz -C .
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'rv/windows-0.61.3/Cargo.toml')) { throw 'Offline Windows SDK extraction failed' }
          [IO.File]::WriteAllText((Join-Path $PWD 'rv/.kf-v1144-complete'),"verified")
          $mini = Join-Path $PWD '.klipper-build-cache/hello-binding-check'
          New-Item -ItemType Directory -Force "$mini/src" | Out-Null
          @'
          [package]
          name="kf-hello-binding-check"
          version="0.1.0"
          edition="2021"
          [dependencies]
          windows={version="=0.61.3",features=["Security_Credentials_UI","Win32_System_WinRT"]}
          windows-future="=0.2.1"
          '@ | Set-Content "$mini/Cargo.toml" -Encoding utf8NoBOM
          '#[path="../../../src-tauri/src/windows_hello.rs"] mod windows_hello; fn main() {}' | Set-Content "$mini/src/main.rs" -Encoding utf8NoBOM
          $env:CARGO_TARGET_DIR = Join-Path $PWD '.klipper-build-cache/target'
          cargo check --offline --manifest-path "$mini/Cargo.toml"
          if ($LASTEXITCODE -ne 0) { throw 'Actual desktop Windows Hello API binding failed to compile' }
      - name: Verify HTTP boundary regression
        shell: pwsh
        run: |
          Set-Location work/app
          node scripts/check-http-keepalive.mjs
          if ($LASTEXITCODE -ne 0) { throw 'HTTP boundary regression failed' }
      - name: Build and run native Windows checks
        shell: pwsh
        run: |
          Set-Location work/app
          node scripts/build-and-install-windows.mjs --build-only
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Verify actual R94 native library uploader
        shell: pwsh
        run: |
          Set-Location work/app
          $env:CARGO_TARGET_DIR = Join-Path $PWD '.klipper-build-cache/target'
          $env:CARGO_HOME = Join-Path $PWD '.klipper-build-cache/cargo'
          node scripts/check-legacy-library-upload-runtime.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual R94 native uploader regression failed' }
      - name: Collect candidate and validation tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force candidate/release,candidate/scripts | Out-Null
          $project = Join-Path $PWD 'work/app'
          $release = Join-Path $project '.klipper-build-cache/target/release'
          foreach ($name in @('klipper-farm-client.exe','klipper-farmd.exe','klipper-farm-ipc-probe.exe')) { Copy-Item (Join-Path $release $name) candidate/release/ }
          foreach ($name in @('apply-online-update.ps1','check-desktop-startup-smoke.mjs','check-desktop-exit.ps1','check-headless-telemetry-runtime.mjs','hardware-emulator.mjs','check-startup-instance-r117.ps1')) { Copy-Item (Join-Path $project "scripts/$name") candidate/scripts/ }
          $setup = @(Get-ChildItem work/app/INSTALLER -Filter '*.exe')
          if ($setup.Count -ne 1) { throw 'Expected one installer' }
          Copy-Item $setup[0].FullName candidate/Klipper-Farm-R120-setup.exe
          $hash = (Get-FileHash candidate/Klipper-Farm-R120-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *Klipper-Farm-R120-setup.exe" | Set-Content candidate/SHA256SUMS.txt -Encoding utf8NoBOM
          $sourceHash = (Get-FileHash checked-source/KF-R120-FULL.zip).Hash.ToLowerInvariant()
          $html = Get-Content work/app/dist/index.html -Raw
          $js = [regex]::Match($html,'assets/index-[^" ]+\.js').Value
          $css = [regex]::Match($html,'assets/index-[^" ]+\.css').Value
          if (-not $js -or -not $css) { throw 'Missing checked frontend bundle identity' }
          $cameraWorkers = @(Get-ChildItem work/app/dist/assets -Filter 'cameraDetectorWorker-*.js')
          if ($cameraWorkers.Count -ne 1) { throw 'Expected one local detector module worker' }
          $cameraWorker = 'assets/' + $cameraWorkers[0].Name
          $detector = Get-Content work/app/dist/camera-detector/MODEL.json -Raw | ConvertFrom-Json
          if ($detector.sha256 -ne '0a6ebd8e30dbf6a450c50f9c0a5406f04ba7eb1c99fd5996e888c78bb383b9aa' -or $detector.size -ne 202223918 -or $detector.runtime -ne 'onnxruntime-web@1.23.2') { throw 'Packaged local detector provenance mismatch' }
          if ((Get-Item candidate/Klipper-Farm-R120-setup.exe).Length -gt 512MB) { throw 'Candidate exceeds the supported update installer size' }
          $catalog = Get-Content work/app/src/data/printerCatalog.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($catalog.schemaVersion -ne 1 -or @($catalog.models).Count -lt 500) { throw 'Packaged printer catalog requires schema 1 and at least 500 models' }
          $catalogHash = (Get-FileHash work/app/src/data/printerCatalog.json).Hash.ToLowerInvariant()
          $photos = Get-Content proof/r120-images-ui-summary.json -Raw | ConvertFrom-Json
          $images = Get-Content proof/images-qa.json -Raw | ConvertFrom-Json
          $ledgerHash = (Get-FileHash work/app/public/printer-catalog-credits/IMAGES.json).Hash.ToLowerInvariant()
          if (-not $photos.passed -or $photos.windowsEdgeUICases -ne 15 -or $photos.offlinePhotoModels -ne 471 -or $ledgerHash -ne '15066da9d429a1e97007d15a9f47e057b48a9f263c30b66452b38bd93ac80a17' -or $photos.externalImageRequests -ne 0) { throw 'Frozen offline photo UI proof/count/ledger mismatch' }
          if ((Get-FileHash incoming/r120-patch-manifest.json).Hash.ToLowerInvariant() -ne '1379fa55aba7187a46335d3c93e1dd97b8c2deb04067f63dfa3823f355403c8c') { throw 'Frozen complete patch-set identity mismatch' }
          @{sourceSha256=$sourceHash;baselineSourceSha256='d2d4feb12370a707ae38ec4638f037bdaae57631e2097f03c25aa0fc4a0b60f5';baselineSetupSha256='ce69dc1f9a530c247daa3d71a395e08480c925e0ab51f0b97f28e9be32f3ef62';baselineSequence=119;sequence=120;patchSha256=(Get-FileHash incoming/r120-patch-manifest.json).Hash.ToLowerInvariant();patchFragments=(Get-Content incoming/r120-patch-manifest.json -Raw | ConvertFrom-Json);workflowCommit=$env:GITHUB_SHA;setupSha256=$hash;buildId='V20.6-R12.0-CATALOG-IMAGES-2026-10-17';javascript=$js;stylesheet=$css;cameraModelSha256=$detector.sha256;cameraModelSizeBytes=$detector.size;cameraRuntime=$detector.runtime;cameraWorker=$cameraWorker;printerCatalogSha256=$catalogHash;printerCatalogSchemaVersion=$catalog.schemaVersion;printerCatalogModelCount=@($catalog.models).Count;photoLedgerSha256=$ledgerHash;photoRegistrySha256=(Get-FileHash work/app/src/lib/printerCatalogArtwork.ts).Hash.ToLowerInvariant();photoModelCount=$photos.offlinePhotoModels;photoPreservedIllustrations=$photos.preservedIllustrations;photoRemainingSilhouettes=$photos.remainingSilhouettes;photoBytes=$images.imageBytes;catalogUiCases=$photos.windowsEdgeUICases;offlinePhotosVerified=$true} | ConvertTo-Json -Depth 6 | Set-Content candidate/provenance.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-R120-Candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-R120-Reviewed-Source
          path: checked-source/KF-R120-FULL.zip
          if-no-files-found: error
          retention-days: 30
      - name: Retain build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-R120-Build-logs
          path: |
            work/app/.klipper-build-cache/logs/
            work/app/.klipper-build-cache/target/v20-rust-tests-last.log
          include-hidden-files: true
          if-no-files-found: warn
  validate:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Klipper-Farm-R120-Candidate
          path: candidate
      - name: Prepare verified actual-window validation harnesses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This new validation-only file corrects cached HWND selection. The
          # original shipped script and every executable remain unchanged.
          [IO.File]::WriteAllBytes("$PWD/candidate/scripts/check-desktop-exit-actual-window-r117.ps1",[Convert]::FromBase64String(''))
          if ((Get-FileHash candidate/scripts/check-desktop-exit-actual-window-r117.ps1).Hash.ToLowerInvariant() -ne 'c1f1c3bc66abef1d4a298274c99d7882db8fef742b99572f0abef815bd850ac1') { throw 'Corrected window-selection harness differs' }
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/candidate/scripts/check-desktop-exit-actual-window-r117.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ('Harness parse failed: ' + (($errors | ForEach-Object Message) -join '; ')) }
          [IO.File]::WriteAllBytes("$PWD/candidate/scripts/upgrade-actual-window-r117.ps1",[Convert]::FromBase64String(''))
          if ((Get-FileHash candidate/scripts/upgrade-actual-window-r117.ps1).Hash.ToLowerInvariant() -ne '34fe9c122199eb4e7aa91b219496e6c818a6a19c41b97583d4b5a5e2276ade5d') { throw 'Inline upgrade window helper differs' }
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/candidate/scripts/upgrade-actual-window-r117.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ('Inline helper parse failed: ' + (($errors | ForEach-Object Message) -join '; ')) }
          [IO.File]::WriteAllBytes("$PWD/candidate/scripts/check-minimized-telemetry-r118.ps1",[Convert]::FromBase64String(''))
          if ((Get-FileHash candidate/scripts/check-minimized-telemetry-r118.ps1).Hash.ToLowerInvariant() -ne 'cdf740bd7e09dde834a10ef649045addb48ca07fe442d6a53bbd879df09e19ff') { throw 'Minimized telemetry harness differs' }
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/candidate/scripts/check-minimized-telemetry-r118.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ('Minimized harness parse failed: ' + (($errors | ForEach-Object Message) -join '; ')) }
      - name: Verify upgrade from published R119 and installed runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell startup probe failed' }
          Set-Location candidate
          . scripts/upgrade-actual-window-r117.ps1
          $inlineProof = Join-Path $PWD 'inline-window-proof'
          $setup = (Resolve-Path Klipper-Farm-R120-setup.exe).Path
          $release = (Resolve-Path release).Path
          $provenance = Get-Content provenance.json -Raw | ConvertFrom-Json
          if ($provenance.workflowCommit -ne $env:GITHUB_SHA -or $provenance.buildId -ne 'V20.6-R12.0-CATALOG-IMAGES-2026-10-17' -or $provenance.sequence -ne 120 -or $provenance.baselineSequence -ne 119) { throw 'Wrong compiled candidate provenance' }
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $provenance.setupSha256) { throw 'Candidate hash mismatch' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Klipper Farm upgrade test'
          $installed = Start-Process $setup -ArgumentList ('/S /D=' + $installDir) -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw 'Initial R120 install failed' }
          $expected = @{}
          foreach ($name in @('klipper-farm-client.exe','klipper-farmd.exe')) { $expected[$name] = (Get-FileHash (Join-Path $installDir $name)).Hash }
          $desktop = Join-Path $installDir 'klipper-farm-client.exe'
          $desktopText = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($desktop))
          foreach ($marker in @($provenance.javascript,$provenance.stylesheet,$provenance.cameraWorker,'camera-detector/obico-failure-5a6b1be1fa.onnx','camera-detector/ort-wasm-simd-threaded.wasm','"installedSequence": 120','28e0124c33f42704483d1aac89af829c44a00ef5dbc2e93dff630befddd495eb')) {
            if (-not $desktopText.Contains($marker)) { throw "Installed R120 resource or channel missing: $marker" }
          }
          node scripts/check-headless-telemetry-runtime.mjs --daemon "$installDir/klipper-farmd.exe" --probe "$release/klipper-farm-ipc-probe.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed telemetry failed' }
          gh release download r119 --repo $env:GITHUB_REPOSITORY --pattern Klipper-Farm-R119-setup.exe --dir old
          if ($LASTEXITCODE -ne 0) { throw 'Published R119 download failed' }
          $oldSetup = (Resolve-Path old/Klipper-Farm-R119-setup.exe).Path
          if ((Get-Item $oldSetup).Length -ne 203515253) { throw 'R119 installer size mismatch' }
          if ((Get-FileHash $oldSetup -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ce69dc1f9a530c247daa3d71a395e08480c925e0ab51f0b97f28e9be32f3ef62') { throw 'R119 hash mismatch' }
          $oldInstall = Start-Process $oldSetup -ArgumentList ('/S /D=' + $installDir) -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw 'R119 baseline install failed' }
          $baseline = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($desktop))
          if ($baseline -notmatch '"installedSequence"\s*:\s*119') { throw 'R119 baseline is not physically installed' }
          $dataDir = Join-Path $env:APPDATA 'app.klipper.farm'
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $marker = Join-Path $dataDir 'updater-r119-preserve.txt'
          [IO.File]::WriteAllText($marker,'preserve-r119-data')
          $cacheRoot = Join-Path $env:LOCALAPPDATA 'app.klipper.farm/verified-updates'
          $cleanupProbe = Join-Path $cacheRoot ([guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force $cleanupProbe | Out-Null
          [IO.File]::WriteAllText((Join-Path $cleanupProbe 'installer.exe'),'unprotected-test-cache-fixture')
          $oldDesktop = Start-Process $desktop -PassThru
          Wait-UpgradeActualWindow -Process $oldDesktop -Case 'R119-before-update-helper' -OutputDirectory $inlineProof
          $cleanupDeadline = [DateTime]::UtcNow.AddSeconds(12)
          while ((Test-Path $cleanupProbe) -and [DateTime]::UtcNow -lt $cleanupDeadline) { Start-Sleep -Milliseconds 100 }
          "Synthetic cache survives startup: $(Test-Path $cleanupProbe)"
          $startupLog = Join-Path $env:APPDATA 'app.klipper.farm/logs/desktop-startup.log'
          if (Test-Path $startupLog) { Get-Content $startupLog -Tail 25 }
          $helperText = Get-Content scripts/apply-online-update.ps1 -Raw -Encoding UTF8
          if (-not $desktopText.Contains($helperText)) { throw 'Candidate helper differs from the one embedded in R120' }
          $cacheRoot = Join-Path $env:LOCALAPPDATA 'app.klipper.farm/verified-updates'
          $attempt = Join-Path $cacheRoot ([guid]::NewGuid().ToString('N'))
          $legacy = Join-Path $cacheRoot ([guid]::NewGuid().ToString('N'))
          $partial = Join-Path $cacheRoot ([guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force $attempt,$legacy,$partial | Out-Null
          $cachedSetup = Join-Path $attempt 'installer.exe'
          Copy-Item $setup $cachedSetup
          [IO.File]::WriteAllText((Join-Path $attempt 'manifest.json'),'synthetic-signed-manifest-fixture')
          foreach ($path in @($legacy,$partial)) { [IO.File]::WriteAllText((Join-Path $path 'installer.exe'),'abandoned-cache-fixture') }
          [IO.File]::WriteAllText((Join-Path $legacy 'helper-ready'),'ready')
          [IO.File]::WriteAllText((Join-Path $legacy 'install-result.txt'),'Installed successfully')
          $keep = Join-Path (Split-Path -Parent $cacheRoot) 'keep-update-cache-test.txt'
          [IO.File]::WriteAllText($keep,'preserve-unrelated-file')
          $ready = Join-Path $attempt 'helper-ready'
          # Production update_apply holds UpdateState's lease/prepared path.
          # This external harness has no app state. Use the supported active-owner
          # marker to preserve its fixture until the actual helper takes over.
          [IO.File]::WriteAllText($ready,(@{helperPid=$PID} | ConvertTo-Json -Compress))
          $payload = @{parentPid=$oldDesktop.Id;executable=$desktop;installer=$cachedSetup;sha256=$provenance.setupSha256;sizeBytes=(Get-Item $setup).Length;ready=$ready;cacheRoot=$cacheRoot} | ConvertTo-Json -Compress
          $start = [Diagnostics.ProcessStartInfo]::new()
          $start.FileName = "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe"
          $start.UseShellExecute = $false
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $start.CreateNoWindow = $true
          $start.EnvironmentVariables.Remove('PSModulePath')
          $helperDebugPrefix = '$ProgressPreference = ''SilentlyContinue''; Set-PSDebug -Trace 1;' + [Environment]::NewLine
          foreach ($argument in @('-NoProfile','-NonInteractive','-Command',($helperDebugPrefix + $helperText))) { $start.ArgumentList.Add($argument) }
          $helper = [Diagnostics.Process]::Start($start)
          $outRead = $helper.StandardOutput.ReadToEndAsync()
          $errRead = $helper.StandardError.ReadToEndAsync()
          $handshakeStarted = [Diagnostics.Stopwatch]::StartNew()
          $helper.StandardInput.Write($payload)
          $helper.StandardInput.Close()
          $actualHelperReady = {
            if (-not (Test-Path $ready)) { return $false }
            try { return (Get-Content $ready -Raw | ConvertFrom-Json).helperPid -eq $helper.Id } catch { return $false }
          }
          $deadline = [DateTime]::UtcNow.AddSeconds(15)
          while (-not (& $actualHelperReady) -and -not $helper.HasExited -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 100 }
          if (-not (& $actualHelperReady)) {
            Write-Host ('HELPER process: ' + ($helper | Select-Object Id,MainWindowTitle,TotalProcessorTime,StartTime | ConvertTo-Json -Compress))
            Get-ChildItem $cacheRoot -Recurse -Force | Select-Object FullName,Length | ConvertTo-Json -Compress | Write-Host
            if (Test-Path (Join-Path $cacheRoot 'last-error.txt')) { Get-Content (Join-Path $cacheRoot 'last-error.txt') }
            Write-Host "HELPER handshake elapsedMs=$($handshakeStarted.ElapsedMilliseconds) exited=$($helper.HasExited)"
            if (Test-Path install-result.txt) { Get-Content install-result.txt }
            if (-not $helper.HasExited) { $helper.Kill(); $helper.WaitForExit(10000) | Out-Null }
            $null = $outRead.Wait(5000)
            $null = $errRead.Wait(5000)
            if ($outRead.IsCompleted) { $outRead.Result | Set-Content helper-stdout.txt; Write-Host $outRead.Result }
            if ($errRead.IsCompleted) { $errRead.Result | Set-Content helper-stderr.txt; Write-Host $errRead.Result }
            throw 'Updater handshake failed'
          }
          "HELPER ready elapsedMs=$($handshakeStarted.ElapsedMilliseconds)"
          if (-not (Close-UpgradeActualWindow -Process $oldDesktop -Case 'R119-close-for-upgrade' -OutputDirectory $inlineProof) -or -not $oldDesktop.WaitForExit(20000)) { throw 'R119 did not close cleanly' }
          if (-not $helper.WaitForExit(120000)) { $helper.Kill(); throw 'Update helper timeout' }
          if ($helper.ExitCode -ne 0) { $outRead.Result; $errRead.Result; throw 'Update helper failed' }
          $deadline = [DateTime]::UtcNow.AddSeconds(12)
          while (((Test-Path $attempt) -or (Test-Path $legacy) -or (Test-Path $partial)) -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 150 }
          foreach ($path in @($attempt,$legacy,$partial)) { if (Test-Path $path) { throw "Update cache was not cleaned: $path" } }
          if ((Get-Content -LiteralPath $keep -Raw) -ne 'preserve-unrelated-file') { throw 'Unrelated cache neighbor was changed' }
          'Update cache runtime OK: active installer attempt, legacy completed update and partial download removed; unrelated file preserved'
          foreach ($name in @('klipper-farm-client.exe','klipper-farmd.exe')) {
            $hash = (Get-FileHash (Join-Path $installDir $name)).Hash
            "UPDATED $name hash=$hash matchesR120=$($hash -eq $expected[$name])"
            if ($hash -ne $expected[$name]) { throw "Wrong installed R120 payload: $name" }
          }
          if ((Get-Content $marker -Raw) -ne 'preserve-r119-data') { throw 'App data was removed' }
          $restarted = @(Get-Process -Name klipper-farm-client -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $desktop })
          if ($restarted.Count -eq 0) { throw 'R120 was not relaunched' }
          foreach ($process in $restarted) {
            Wait-UpgradeActualWindow -Process $process -Case 'R120-relaunched-before-close' -OutputDirectory $inlineProof
            if ($process.HasExited -or -not (Close-UpgradeActualWindow -Process $process -Case 'R120-relaunched-close' -OutputDirectory $inlineProof) -or -not $process.WaitForExit(20000)) { throw 'R120 window lifecycle failed' }
          }
          foreach ($process in @(Get-Process -Name klipper-farmd -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq (Join-Path $installDir 'klipper-farmd.exe') })) { if (-not $process.WaitForExit(10000)) { throw 'Sidecar survived desktop shutdown' } }
          & scripts/check-desktop-exit-actual-window-r117.ps1 -Desktop $desktop -OutputDirectory (Join-Path $PWD 'main-window-proof')
          New-Item -ItemType Directory -Force smoke | Out-Null
          node scripts/check-desktop-startup-smoke.mjs "$installDir/klipper-farm-client.exe" "$installDir/klipper-farmd.exe" "$PWD/smoke"
          if ($LASTEXITCODE -ne 0) { throw 'Installed desktop smoke failed' }
          $minimizedProof = Join-Path $env:RUNNER_TEMP 'R120 minimized private validation'
          & scripts/check-minimized-telemetry-r118.ps1 -DesktopExe $desktop -ProbeExe (Join-Path $release 'klipper-farm-ipc-probe.exe') -EmulatorScript (Join-Path $PWD 'scripts/hardware-emulator.mjs') -OutputDirectory $minimizedProof
          if (-not $?) { throw 'Installed desktop minimize/restore telemetry proof failed' }
          New-Item -ItemType Directory -Force minimized-telemetry-proof | Out-Null
          Copy-Item (Join-Path $minimizedProof 'minimized-telemetry-r118.json') minimized-telemetry-proof/
          $startupProof = Join-Path $env:RUNNER_TEMP 'R120 startup private validation'
          & scripts/check-startup-instance-r117.ps1 -DesktopExe $desktop -OutputDirectory $startupProof
          if (-not $?) { throw 'Actual installed desktop concurrent startup regression failed' }
          New-Item -ItemType Directory -Force startup-instance-proof | Out-Null
          Copy-Item (Join-Path $startupProof 'startup-instance-r117.json') startup-instance-proof/
          $windowProof = Get-Content main-window-proof/main-window-lifecycle-r117.json -Raw | ConvertFrom-Json
          if (($windowProof.completedModes -join ',') -ne 'close-during-startup,normal-close,force-desktop,recovery-close' -or $windowProof.exitWaitMs -ne 20000 -or $windowProof.earlyCloseWaitsForPageReady -ne $false) { throw 'Complete original lifecycle coverage or timing changed' }
          $startup = Get-Content startup-instance-proof/startup-instance-r117.json -Raw | ConvertFrom-Json
          if ($startup.cases.Count -ne 3) { throw 'Three real double-launch proofs are required' }
          $external = @{schemaVersion=1;candidateBuildRunId=[long]$env:GITHUB_RUN_ID;candidateBuildHeadSha=$env:GITHUB_SHA;patchSha256=$provenance.patchSha256;patchFragments=$provenance.patchFragments;photoLedgerSha256=$provenance.photoLedgerSha256;photoModelCount=$provenance.photoModelCount;catalogUiCases=$provenance.catalogUiCases;offlinePhotosVerified=$provenance.offlinePhotosVerified;setupSha256=$provenance.setupSha256;sourceSha256=$provenance.sourceSha256;baselineSourceSha256='d2d4feb12370a707ae38ec4638f037bdaae57631e2097f03c25aa0fc4a0b60f5';baselineSetupSha256='ce69dc1f9a530c247daa3d71a395e08480c925e0ab51f0b97f28e9be32f3ef62';baselineSequence=119;sequence=120;validationRunId=[long]$env:GITHUB_RUN_ID;correctedLifecycleScriptSha256='c1f1c3bc66abef1d4a298274c99d7882db8fef742b99572f0abef815bd850ac1';inlineWindowHelperSha256='34fe9c122199eb4e7aa91b219496e6c818a6a19c41b97583d4b5a5e2276ade5d';minimizedHarnessSha256='cdf740bd7e09dde834a10ef649045addb48ca07fe442d6a53bbd879df09e19ff';fullR119UpgradeVerified=$true;dataPreservationVerified=$true;originalFourLifecycleModesVerified=$true;earlyCloseWaitsForPageReady=$false;exitWaitMs=20000;allThreeDoubleLaunchesVerified=$true;installedSmokeVerified=$true;minimizedTelemetryDisconnectReconnectRestoreVerified=$true}
          $external | ConvertTo-Json -Depth 6 | Set-Content exact-validation.json -Encoding utf8NoBOM
          'R119 to R120 physical upgrade, data preservation, relaunch and telemetry passed'
      - name: Retain validated installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item candidate/Klipper-Farm-R120-setup.exe,candidate/SHA256SUMS.txt,candidate/provenance.json,candidate/exact-validation.json,candidate/minimized-telemetry-proof/minimized-telemetry-r118.json out/
          Copy-Item candidate/main-window-proof/main-window-lifecycle-r117.json,candidate/startup-instance-proof/startup-instance-r117.json,candidate/inline-window-proof/upgrade-inline-window-r117.json out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-R120-Exact-Candidate-Validated
          path: out/
          if-no-files-found: error
          retention-days: 30
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-R120-Exact-Candidate-Validation-logs
          path: |
            candidate/install-result.txt
            candidate/helper-stdout.txt
            candidate/helper-stderr.txt
            candidate/smoke/
            candidate/startup-instance-proof/
            candidate/minimized-telemetry-proof/
            candidate/main-window-proof/
            candidate/inline-window-proof/
            candidate/exact-validation.json
          if-no-files-found: warn

  publish-candidate:
    needs: [build, validate]
    runs-on: windows-2022
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Klipper-Farm-R120-Exact-Candidate-Validated
          path: release-candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Klipper-Farm-R120-Reviewed-Source
          path: release-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Klipper-Farm-R120-Offline-Photos-UI-proof
          path: release-ui-proof/offline-photos
      - name: Publish validated R120 prerelease candidate for signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = @(Get-ChildItem release-source -Recurse -Filter 'KF-R120-FULL.zip')
          if ($source.Count -ne 1) { throw 'Expected one frozen reviewed source archive' }
          Copy-Item $source[0].FullName release-candidate/KF-R120-FULL.zip
          Compress-Archive -Path release-ui-proof/* -DestinationPath release-candidate/R120-UI-proof.zip
          Set-Location release-candidate
          $provenance = Get-Content provenance.json -Raw | ConvertFrom-Json
          $validation = Get-Content exact-validation.json -Raw | ConvertFrom-Json
          if ($provenance.workflowCommit -ne $env:GITHUB_SHA -or $provenance.sequence -ne 120 -or $provenance.baselineSequence -ne 119) { throw 'Wrong candidate build provenance' }
          if ($validation.candidateBuildHeadSha -ne $env:GITHUB_SHA -or -not $validation.fullR119UpgradeVerified -or -not $validation.minimizedTelemetryDisconnectReconnectRestoreVerified) { throw 'Candidate physical validation proof is missing' }
          $photoProof = Get-Content ../release-ui-proof/offline-photos/r120-images-ui-summary.json -Raw | ConvertFrom-Json
          $sourceLedger = Get-Content ../release-ui-proof/offline-photos/reviewed-photo-ledger.json -Raw | ConvertFrom-Json
          if (-not $photoProof.passed -or $photoProof.windowsEdgeUICases -ne 15 -or $photoProof.offlinePhotoModels -ne 471 -or $photoProof.externalImageRequests -ne 0 -or $provenance.photoLedgerSha256 -ne '15066da9d429a1e97007d15a9f47e057b48a9f263c30b66452b38bd93ac80a17' -or $provenance.photoModelCount -ne 471 -or -not $validation.offlinePhotosVerified -or $validation.catalogUiCases -ne 15 -or $sourceLedger.imageModels -ne 471) { throw 'Offline photo acceptance is incomplete' }
          if ($provenance.patchSha256 -ne '1379fa55aba7187a46335d3c93e1dd97b8c2deb04067f63dfa3823f355403c8c' -or $validation.patchSha256 -ne '1379fa55aba7187a46335d3c93e1dd97b8c2deb04067f63dfa3823f355403c8c') { throw 'Published candidate patch-set differs' }
          $setupHash = (Get-FileHash Klipper-Farm-R120-setup.exe).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash KF-R120-FULL.zip).Hash.ToLowerInvariant()
          $uiProofHash = (Get-FileHash R120-UI-proof.zip).Hash.ToLowerInvariant()
          if ($setupHash -ne $provenance.setupSha256 -or $sourceHash -ne $provenance.sourceSha256) { throw 'Candidate asset hash differs from validated build' }
          if ((Get-Item Klipper-Farm-R120-setup.exe).Length -gt 512MB) { throw 'Installer exceeds updater limit' }
          "$setupHash *Klipper-Farm-R120-setup.exe`n$sourceHash *KF-R120-FULL.zip`n$uiProofHash *R120-UI-proof.zip" | Set-Content SHA256SUMS.txt -Encoding utf8NoBOM
          @'
          R120 candidate: 471 reviewed local printer photographs plus 5 preserved illustrations cover 476 of 500 models. The remaining 24 models use an explicit silhouette fallback. Original reviewed image bytes and source credits are packaged for offline use.

          The exact installer and source passed the 15-case Windows Edge catalog/photo suite, unchanged metadata and operational scope checks, the native build checks, and the installed R119 to R120 upgrade with preserved data, four window lifecycle modes, three actual double launches, and minimize/disconnect/reconnect/restore telemetry against a synthetic localhost printer. Previously proved R119 heavy-panel browser tests apply to the byte-identical protected implementation.

          Для подключения требуется доступный Klipper/Moonraker. Наличие изображения модели не подтверждает совместимость штатной прошивки. Stable update signing follows independent verification of these exact public assets.
          '@ | Set-Content candidate-notes.md -Encoding utf8NoBOM
          gh release view r120 --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'R120 already exists; review it before replacing or promoting any asset' }
          gh release create r120 Klipper-Farm-R120-setup.exe KF-R120-FULL.zip R120-UI-proof.zip SHA256SUMS.txt provenance.json exact-validation.json minimized-telemetry-r118.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'Klipper Farm R120 candidate — offline model photos' --notes-file candidate-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Validated prerelease publication failed' }

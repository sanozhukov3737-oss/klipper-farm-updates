name: Verify signed R125 candidate and promote stable
permissions:
  contents: read
  actions: read
concurrency:
  group: promote-r125
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Verify exact public source, same-run Windows acceptance and root signature
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\nif ($env:GITHUB_REPOSITORY -ne 'sanozhukov3737-oss/klipper-farm-updates') { throw 'Unexpected repository' }\nNew-Item -ItemType Directory -Force incoming | Out-Null\nSet-Location incoming\n[IO.File]::WriteAllBytes((Join-Path $PWD 'operator-contract.json'),[Convert]::FromBase64String(''))\n[IO.File]::WriteAllBytes((Join-Path $PWD 'build-pins.json'),[Convert]::FromBase64String(''))\n[IO.File]::WriteAllBytes((Join-Path $PWD 'candidate-pins.json'),[Convert]::FromBase64String(''))\n[IO.File]::WriteAllBytes((Join-Path $PWD 'reviewed-files.json'),[Convert]::FromBase64String(''))\n[IO.File]::WriteAllBytes((Join-Path $PWD 'reviewed-patch.json'),[Convert]::FromBase64String('W3sibmFtZSI6InIxMjUtaWRlbnRpdHktcmVzdGFydC1wYXRjaC0wMS5qc29uIiwic2l6ZSI6NTI0MzQ2LCJzaGEyNTYiOiJjMDk0ZjkzYTQyOTg0YzA3Mjk4YTMyMmM5MzJlMDA0Y2IyMzVjZDMxNzE1OTdkOWRlYWFiOTI0ODJjNmY4MzYxIn1dCg=='))\n[IO.File]::WriteAllBytes((Join-Path $PWD 'inspect-source.py'),[Convert]::FromBase64String(''))\n[IO.File]::WriteAllBytes((Join-Path $PWD 'source-witness.json.gz'),[Convert]::FromBase64String(''))\n[IO.File]::WriteAllBytes((Join-Path $PWD 'source_scope.py'),[Convert]::FromBase64String(''))\n[IO.File]::WriteAllBytes((Join-Path $PWD 'check-filament-proof.py'),[Convert]::FromBase64String(''))\n[IO.File]::WriteAllBytes((Join-Path $PWD 'verify-r125-promotion.mjs'),[Convert]::FromBase64String(''))\n[IO.File]::WriteAllBytes((Join-Path $PWD 'acceptance_contract.py'),[Convert]::FromBase64String(''))\n[IO.File]::WriteAllBytes((Join-Path $PWD 'acceptance-contract.json'),[Convert]::FromBase64String(''))\n[IO.File]::WriteAllBytes((Join-Path $PWD 'check-new-proof.py'),[Convert]::FromBase64String(''))\n$pins = Get-Content build-pins.json -Raw | ConvertFrom-Json\nfunction Save-Api([string]$endpoint,[string]$name) {\n  $body = gh api $endpoint\n  if ($LASTEXITCODE -ne 0) { throw \"Read-only metadata lookup failed: $name\" }\n  [IO.File]::WriteAllText((Join-Path $PWD $name),($body -join \"`n\"),[Text.UTF8Encoding]::new($false))\n}\nSave-Api \"repos/$env:GITHUB_REPOSITORY/actions/runs/$($pins.runId)\" 'build-run.json'\nSave-Api \"repos/$env:GITHUB_REPOSITORY/actions/runs/$($pins.runId)/jobs?per_page=100\" 'build-jobs.json'\nSave-Api \"repos/$env:GITHUB_REPOSITORY/releases/tags/r125\" 'release.json'\nforeach ($file in @(\n  @{name='build-workflow.yml';path='.github/workflows/windows-r125.yml';head=$pins.headSha},\n  @{name='update-v20.json';path='r125-signed-update.json';head=$env:GITHUB_SHA}\n)) {\n  $encoded = gh api \"repos/$env:GITHUB_REPOSITORY/contents/$($file.path)?ref=$($file.head)\" --jq .content\n  if ($LASTEXITCODE -ne 0 -or -not $encoded) { throw 'Reviewed exact-head source retrieval failed' }\n  [IO.File]::WriteAllBytes((Join-Path $PWD $file.name),[Convert]::FromBase64String(($encoded -join '')))\n}\n$tag = gh api \"repos/$env:GITHUB_REPOSITORY/git/ref/tags/r125\" | ConvertFrom-Json\nif ($LASTEXITCODE -ne 0) { throw 'Tag lookup failed' }\n$object = $tag.object\nif ($object.type -eq 'tag') {\n  $annotated = gh api \"repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)\" | ConvertFrom-Json\n  if ($LASTEXITCODE -ne 0) { throw 'Annotated tag lookup failed' }\n  $object = $annotated.object\n}\nif ($object.type -ne 'commit') { throw 'Tag does not resolve to commit' }\n@{commitSha=$object.sha} | ConvertTo-Json | Set-Content tag-commit.json -Encoding utf8NoBOM\ngh release download r125 --repo $env:GITHUB_REPOSITORY --dir . --pattern Klipper-Farm-R125-setup.exe --pattern KF-R125-FULL.zip --pattern R125-UI-proof.zip --pattern provenance.json --pattern exact-validation.json --pattern minimized-telemetry-r118.json\nif ($LASTEXITCODE -ne 0) { throw 'Public exact candidate download failed' }\n$assets = Get-Content candidate-pins.json -Raw | ConvertFrom-Json\nforeach ($asset in $assets.PSObject.Properties) {\n  if ((Get-Item $asset.Name).Length -ne $asset.Value.sizeBytes -or (Get-FileHash $asset.Name).Hash.ToLowerInvariant() -ne $asset.Value.sha256) { throw \"Public asset differs: $($asset.Name)\" }\n}\npython inspect-source.py . source-witness.json.gz\nif ($LASTEXITCODE -ne 0) { throw 'Complete pinned source inspection failed' }\nnode verify-r125-promotion.mjs .\nif ($LASTEXITCODE -ne 0) { throw 'Signed exact R125 candidate verification failed' }\n@'\nИсправлено сохранение принтеров и восстановление подключений после перезапуска приложения.\n\n- Выбранная модель Flashforge теперь корректно отображается вместо прежнего автоматического названия KE. Пользовательские имена сохраняются.\n- Настройки принтеров сохраняются с подтверждением записи и восстанавливаются после повторного открытия приложения.\n- Сохранённые карточки показываются сразу, подключения выполняются независимо. Недоступный принтер не задерживает остальные.\n- Устранён конфликт старых и новых сессий подключения после перезапуска.\n\nПроверено обновление с R124 с сохранением данных, повторный запуск и работа семи подключений на тестовом стенде Windows.\n\nДля подключения требуется доступный Klipper/Moonraker. Выбор изображения модели не меняет прошивку принтера.\n'@ | Set-Content release-notes-ru.md -Encoding utf8NoBOM\nNew-Item -ItemType Directory -Force ../verified | Out-Null\nCopy-Item update-v20.json,SHA256SUMS.txt,promotion-attestation.json,release-notes-ru.md,build-pins.json,operator-contract.json ../verified/\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Klipper-Farm-R125-Promotion-Verified
        path: verified/
        if-no-files-found: error
        retention-days: 30
  promote:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: Klipper-Farm-R125-Promotion-Verified
        path: verified
    - name: Recheck public candidate and publish verified signed stable update
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\nSet-Location verified\n$proof = Get-Content promotion-attestation.json -Raw | ConvertFrom-Json\n$pins = Get-Content build-pins.json -Raw | ConvertFrom-Json\nif ($proof.exactCompiledPatchFiles -ne 26 -or $proof.photoModels -ne 482 -or $proof.preservedIllustrations -ne 5 -or $proof.remainingSilhouettes -ne 13 -or $proof.catalogUiCases -ne 15 -or -not $proof.offlinePhotosVerified) { throw 'Missing verified R125 photo/source acceptance' }\nif ($proof.buildRunId -ne $pins.runId -or $proof.buildHeadSha -ne $pins.headSha -or $proof.buildWorkflowSha256 -ne $pins.workflowSha256 -or $proof.patchSha256 -ne $pins.patchSha256 -or -not $proof.sourceAndInstalledValidationSameRun -or -not $proof.ed25519SignatureVerified -or $proof.printerCatalogModelCount -ne 500) { throw 'Wrong verified promotion artifact' }\nif ($proof.operatorContractSha256 -ne '18f0ecd6ad93e2b02eaaaa52b3bbd2665f876acea847795dc611b5591307b407' -or (Get-FileHash operator-contract.json).Hash.ToLowerInvariant() -ne '18f0ecd6ad93e2b02eaaaa52b3bbd2665f876acea847795dc611b5591307b407' -or -not $proof.allSourceEntriesPinned -or $proof.originalRawPhotosPreserved -ne 482 -or $proof.transparentCutoutModels -ne 142 -or -not $proof.registryBytesUnchanged -or -not $proof.allUnreviewedSourceBytesPreserved -or -not $proof.allCatalogImagesUnchanged -or -not $proof.allUnreviewedNativeBytesUnchanged -or -not $proof.allFilamentAccountingBytesUnchanged -or -not $proof.actualProductionParentVerified -or -not $proof.themedFieldsVerified -or -not $proof.stockAndSpoolFormsVerified -or -not $proof.focusVisibleVerified -or $proof.themedResponsiveCases -ne 6 -or -not $proof.filamentInventoryVerified -or $proof.filamentCoreCases -lt 33 -or $proof.filamentUiCases -ne 17 -or $proof.filamentNativeTests -ne 5 -or -not $proof.legacySpoolBytesPreserved -or -not $proof.cutoutCanvasAlphaVerified -or -not $proof.whiteBodyPreserved -or -not $proof.cutoutDarkLightVerified -or $proof.sourceWitnessSha256 -ne '49b5f273218cc6ee241618fdf182199c067e664edac6c15a4900de98255017d5') { throw 'Missing immutable reviewed filament/source acceptance' }\nif ($proof.acceptanceContractSha256 -ne 'c31d2861af781de875e763c6bb6146e1d0ca660da9eb15cf89f80cf93937a28b' -or -not $proof.identityVerified -or -not $proof.printerStoreVerified -or -not $proof.actualNativeRuntimeRestartVerified -or -not $proof.fullFarmStartupVerified -or $proof.runtimeNativeTests -ne 6) { throw 'Actual new R125 identity/store/runtime acceptance missing' }\n$release = gh api \"repos/$env:GITHUB_REPOSITORY/releases/tags/r125\" | ConvertFrom-Json\nif ($LASTEXITCODE -ne 0) { throw 'Final prerelease lookup failed' }\nif ($release.id -ne $proof.releaseId -or -not $release.prerelease -or $release.draft -or $release.target_commitish -ne $pins.headSha) { throw 'Candidate release changed after verification' }\n$tag = gh api \"repos/$env:GITHUB_REPOSITORY/git/ref/tags/r125\" | ConvertFrom-Json\nif ($LASTEXITCODE -ne 0) { throw 'Final release tag lookup failed' }\n$object = $tag.object\nif ($object.type -eq 'tag') {\n  $annotated = gh api \"repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)\" | ConvertFrom-Json\n  if ($LASTEXITCODE -ne 0) { throw 'Final annotated release tag lookup failed' }\n  $object = $annotated.object\n}\nif ($object.type -ne 'commit' -or $object.sha -ne $pins.headSha) { throw 'Candidate tag changed after verification' }\nforeach ($name in @('Klipper-Farm-R125-setup.exe','KF-R125-FULL.zip','R125-UI-proof.zip','provenance.json','exact-validation.json','minimized-telemetry-r118.json')) {\n  $expected = $proof.assets.$name\n  $assets = @($release.assets | Where-Object name -eq $name)\n  if ($assets.Count -ne 1 -or $assets[0].digest -ne ('sha256:'+$expected.sha256) -or $assets[0].size -ne $expected.sizeBytes) { throw \"Public asset changed after verification: $name\" }\n}\nif ((Get-FileHash update-v20.json).Hash.ToLowerInvariant() -ne $proof.assets.'update-v20.json'.sha256 -or (Get-Item update-v20.json).Length -ne $proof.assets.'update-v20.json'.sizeBytes) { throw 'Verified signed manifest changed' }\n$upload = @{}\nforeach ($name in @('update-v20.json','SHA256SUMS.txt','promotion-attestation.json')) { $upload[$name] = @{sha256=(Get-FileHash $name).Hash.ToLowerInvariant();sizeBytes=(Get-Item $name).Length} }\ngh release upload r125 update-v20.json SHA256SUMS.txt promotion-attestation.json --repo $env:GITHUB_REPOSITORY --clobber\nif ($LASTEXITCODE -ne 0) { throw 'Verified public manifest upload failed' }\n$release = gh api \"repos/$env:GITHUB_REPOSITORY/releases/tags/r125\" | ConvertFrom-Json\nif ($LASTEXITCODE -ne 0 -or $release.id -ne $proof.releaseId -or -not $release.prerelease -or $release.draft -or $release.target_commitish -ne $pins.headSha) { throw 'Uploaded candidate identity changed' }\nforeach ($name in $upload.Keys) {\n  $assets = @($release.assets | Where-Object name -eq $name)\n  if ($assets.Count -ne 1 -or $assets[0].digest -ne ('sha256:'+$upload[$name].sha256) -or $assets[0].size -ne $upload[$name].sizeBytes) { throw \"Uploaded verified asset differs: $name\" }\n}\nforeach ($name in @('Klipper-Farm-R125-setup.exe','KF-R125-FULL.zip','R125-UI-proof.zip','provenance.json','exact-validation.json','minimized-telemetry-r118.json')) {\n  $expected = $proof.assets.$name\n  $assets = @($release.assets | Where-Object name -eq $name)\n  if ($assets.Count -ne 1 -or $assets[0].digest -ne ('sha256:'+$expected.sha256) -or $assets[0].size -ne $expected.sizeBytes) { throw \"Candidate asset changed during verified manifest upload: $name\" }\n}\n$tag = gh api \"repos/$env:GITHUB_REPOSITORY/git/ref/tags/r125\" | ConvertFrom-Json\nif ($LASTEXITCODE -ne 0) { throw 'Immediate pre-promotion tag lookup failed' }\n$object = $tag.object\nif ($object.type -eq 'tag') {\n  $annotated = gh api \"repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)\" | ConvertFrom-Json\n  if ($LASTEXITCODE -ne 0) { throw 'Immediate annotated tag lookup failed' }\n  $object = $annotated.object\n}\nif ($object.type -ne 'commit' -or $object.sha -ne $pins.headSha) { throw 'Candidate tag changed during verified manifest upload' }\ngh release edit r125 --repo $env:GITHUB_REPOSITORY --prerelease=false --latest --title 'Klipper Farm R125 — модель принтера и сохранение после перезапуска' --notes-file release-notes-ru.md\nif ($LASTEXITCODE -ne 0) { throw 'Verified stable promotion failed' }\n"
'on':
  workflow_dispatch: null
  push:
    branches:
    - r125-identity-restart
    paths:
    - r125-signed-update.json
    - .github/workflows/promote-r125.yml

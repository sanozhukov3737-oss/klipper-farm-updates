name: Verify signed R124 candidate and promote stable
on:
  workflow_dispatch:
  push:
    branches: [r124-ui-fields]
    paths: ['r124-signed-update.json', '.github/workflows/promote-r124.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: promote-r124
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify exact public source, same-run Windows acceptance and root signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'sanozhukov3737-oss/klipper-farm-updates') { throw 'Unexpected repository' }
          New-Item -ItemType Directory -Force incoming | Out-Null
          Set-Location incoming
          [IO.File]::WriteAllBytes((Join-Path $PWD 'operator-contract.json'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $PWD 'build-pins.json'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $PWD 'candidate-pins.json'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $PWD 'reviewed-files.json'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $PWD 'reviewed-patch.json'),[Convert]::FromBase64String('W3sibmFtZSI6InIxMjQtdWktZmllbGRzLXBhdGNoLTAxLmpzb24iLCJzaXplIjo3NzEyNiwic2hhMjU2IjoiYTI1NjdmOTVhYjU1Y2JkZDNmN2FkNWIzMTFhNTlmM2ZiZDk1NDliMjViOWQwMjQ3ZGM4ZjljNTg5OGRlODRjNCJ9XQo='))
          [IO.File]::WriteAllBytes((Join-Path $PWD 'inspect-source.py'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $PWD 'source-witness.json.gz'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $PWD 'source_scope.py'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $PWD 'check-filament-proof.py'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $PWD 'verify-r124-promotion.mjs'),[Convert]::FromBase64String(''))
          $pins = Get-Content build-pins.json -Raw | ConvertFrom-Json
          function Save-Api([string]$endpoint,[string]$name) {
            $body = gh api $endpoint
            if ($LASTEXITCODE -ne 0) { throw "Read-only metadata lookup failed: $name" }
            [IO.File]::WriteAllText((Join-Path $PWD $name),($body -join "`n"),[Text.UTF8Encoding]::new($false))
          }
          Save-Api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($pins.runId)" 'build-run.json'
          Save-Api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($pins.runId)/jobs?per_page=100" 'build-jobs.json'
          Save-Api "repos/$env:GITHUB_REPOSITORY/releases/tags/r124" 'release.json'
          foreach ($file in @(
            @{name='build-workflow.yml';path='.github/workflows/windows-r124.yml';head=$pins.headSha},
            @{name='update-v20.json';path='r124-signed-update.json';head=$env:GITHUB_SHA}
          )) {
            $encoded = gh api "repos/$env:GITHUB_REPOSITORY/contents/$($file.path)?ref=$($file.head)" --jq .content
            if ($LASTEXITCODE -ne 0 -or -not $encoded) { throw 'Reviewed exact-head source retrieval failed' }
            [IO.File]::WriteAllBytes((Join-Path $PWD $file.name),[Convert]::FromBase64String(($encoded -join '')))
          }
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/r124" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Tag lookup failed' }
          $object = $tag.object
          if ($object.type -eq 'tag') {
            $annotated = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Annotated tag lookup failed' }
            $object = $annotated.object
          }
          if ($object.type -ne 'commit') { throw 'Tag does not resolve to commit' }
          @{commitSha=$object.sha} | ConvertTo-Json | Set-Content tag-commit.json -Encoding utf8NoBOM
          gh release download r124 --repo $env:GITHUB_REPOSITORY --dir . --pattern Klipper-Farm-R124-setup.exe --pattern KF-R124-FULL.zip --pattern R124-UI-proof.zip --pattern provenance.json --pattern exact-validation.json --pattern minimized-telemetry-r118.json
          if ($LASTEXITCODE -ne 0) { throw 'Public exact candidate download failed' }
          $assets = Get-Content candidate-pins.json -Raw | ConvertFrom-Json
          foreach ($asset in $assets.PSObject.Properties) {
            if ((Get-Item $asset.Name).Length -ne $asset.Value.sizeBytes -or (Get-FileHash $asset.Name).Hash.ToLowerInvariant() -ne $asset.Value.sha256) { throw "Public asset differs: $($asset.Name)" }
          }
          python inspect-source.py . source-witness.json.gz
          if ($LASTEXITCODE -ne 0) { throw 'Complete pinned source inspection failed' }
          node verify-r124-promotion.mjs .
          if ($LASTEXITCODE -ne 0) { throw 'Signed exact R124 candidate verification failed' }
          @'
          Исправлены поля ввода в разделе «Пластик»: фон, текст, рамки, подсказки и фокус согласованы со светлой и тёмной темами. Формы добавления общего запаса и катушек проверены внутри настоящего окна «Файлы и производство» на ширине 390, 910 и 1536 пикселей.

          Учёт пластика, нативная часть, управление принтерами и все изображения каталога сохранены побайтно относительно опубликованной R123. Повторно прошли 17 сценариев интерфейса учёта и 15 сценариев каталога, 33 проверки движка/сохранения/миграции и 5 нативных проверок транзакций и прав. Фактическое обновление R123→R124 сохраняет исходные данные катушек; также проверены четыре сценария завершения, три двойных запуска и телеметрия при сворачивании с потерей и восстановлением связи на синтетическом локальном принтере.

          Установка: Klipper-Farm-R124-setup.exe или штатное обновление; stable, последовательность 124.
          '@ | Set-Content release-notes-ru.md -Encoding utf8NoBOM
          New-Item -ItemType Directory -Force ../verified | Out-Null
          Copy-Item update-v20.json,SHA256SUMS.txt,promotion-attestation.json,release-notes-ru.md,build-pins.json,operator-contract.json ../verified/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-R124-Promotion-Verified
          path: verified/
          if-no-files-found: error
          retention-days: 30
  promote:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Klipper-Farm-R124-Promotion-Verified
          path: verified
      - name: Recheck public candidate and publish verified signed stable update
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location verified
          $proof = Get-Content promotion-attestation.json -Raw | ConvertFrom-Json
          $pins = Get-Content build-pins.json -Raw | ConvertFrom-Json
          if ($proof.exactCompiledPatchFiles -ne 7 -or $proof.photoModels -ne 482 -or $proof.preservedIllustrations -ne 5 -or $proof.remainingSilhouettes -ne 13 -or $proof.catalogUiCases -ne 15 -or -not $proof.offlinePhotosVerified) { throw 'Missing verified R124 photo/source acceptance' }
          if ($proof.buildRunId -ne $pins.runId -or $proof.buildHeadSha -ne $pins.headSha -or $proof.buildWorkflowSha256 -ne $pins.workflowSha256 -or $proof.patchSha256 -ne $pins.patchSha256 -or -not $proof.sourceAndInstalledValidationSameRun -or -not $proof.ed25519SignatureVerified -or $proof.printerCatalogModelCount -ne 500) { throw 'Wrong verified promotion artifact' }
          if ($proof.operatorContractSha256 -ne '44698cff2efecaff32f3472b4e94f54b6bdabc22176583e36c283552091095df' -or (Get-FileHash operator-contract.json).Hash.ToLowerInvariant() -ne '44698cff2efecaff32f3472b4e94f54b6bdabc22176583e36c283552091095df' -or -not $proof.allSourceEntriesPinned -or $proof.originalRawPhotosPreserved -ne 482 -or $proof.transparentCutoutModels -ne 142 -or -not $proof.registryBytesUnchanged -or -not $proof.allUnreviewedSourceBytesPreserved -or -not $proof.allCatalogImagesUnchanged -or -not $proof.allNativeAndAccountingBytesUnchanged -or -not $proof.actualProductionParentVerified -or -not $proof.themedFieldsVerified -or -not $proof.stockAndSpoolFormsVerified -or -not $proof.focusVisibleVerified -or $proof.themedResponsiveCases -ne 6 -or -not $proof.filamentInventoryVerified -or $proof.filamentCoreCases -lt 33 -or $proof.filamentUiCases -ne 17 -or $proof.filamentNativeTests -ne 5 -or -not $proof.legacySpoolBytesPreserved -or -not $proof.cutoutCanvasAlphaVerified -or -not $proof.whiteBodyPreserved -or -not $proof.cutoutDarkLightVerified -or $proof.sourceWitnessSha256 -ne 'c771ff7f7cf9e33d49849814ebc766ef9fd558b748d06a2f1b5a232700a997f7') { throw 'Missing immutable reviewed filament/source acceptance' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/r124" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Final prerelease lookup failed' }
          if ($release.id -ne $proof.releaseId -or -not $release.prerelease -or $release.draft -or $release.target_commitish -ne $pins.headSha) { throw 'Candidate release changed after verification' }
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/r124" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Final release tag lookup failed' }
          $object = $tag.object
          if ($object.type -eq 'tag') {
            $annotated = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Final annotated release tag lookup failed' }
            $object = $annotated.object
          }
          if ($object.type -ne 'commit' -or $object.sha -ne $pins.headSha) { throw 'Candidate tag changed after verification' }
          foreach ($name in @('Klipper-Farm-R124-setup.exe','KF-R124-FULL.zip','R124-UI-proof.zip','provenance.json','exact-validation.json','minimized-telemetry-r118.json')) {
            $expected = $proof.assets.$name
            $assets = @($release.assets | Where-Object name -eq $name)
            if ($assets.Count -ne 1 -or $assets[0].digest -ne ('sha256:'+$expected.sha256) -or $assets[0].size -ne $expected.sizeBytes) { throw "Public asset changed after verification: $name" }
          }
          if ((Get-FileHash update-v20.json).Hash.ToLowerInvariant() -ne $proof.assets.'update-v20.json'.sha256 -or (Get-Item update-v20.json).Length -ne $proof.assets.'update-v20.json'.sizeBytes) { throw 'Verified signed manifest changed' }
          $upload = @{}
          foreach ($name in @('update-v20.json','SHA256SUMS.txt','promotion-attestation.json')) { $upload[$name] = @{sha256=(Get-FileHash $name).Hash.ToLowerInvariant();sizeBytes=(Get-Item $name).Length} }
          gh release upload r124 update-v20.json SHA256SUMS.txt promotion-attestation.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Verified public manifest upload failed' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/r124" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.id -ne $proof.releaseId -or -not $release.prerelease -or $release.draft -or $release.target_commitish -ne $pins.headSha) { throw 'Uploaded candidate identity changed' }
          foreach ($name in $upload.Keys) {
            $assets = @($release.assets | Where-Object name -eq $name)
            if ($assets.Count -ne 1 -or $assets[0].digest -ne ('sha256:'+$upload[$name].sha256) -or $assets[0].size -ne $upload[$name].sizeBytes) { throw "Uploaded verified asset differs: $name" }
          }
          foreach ($name in @('Klipper-Farm-R124-setup.exe','KF-R124-FULL.zip','R124-UI-proof.zip','provenance.json','exact-validation.json','minimized-telemetry-r118.json')) {
            $expected = $proof.assets.$name
            $assets = @($release.assets | Where-Object name -eq $name)
            if ($assets.Count -ne 1 -or $assets[0].digest -ne ('sha256:'+$expected.sha256) -or $assets[0].size -ne $expected.sizeBytes) { throw "Candidate asset changed during verified manifest upload: $name" }
          }
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/r124" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Immediate pre-promotion tag lookup failed' }
          $object = $tag.object
          if ($object.type -eq 'tag') {
            $annotated = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Immediate annotated tag lookup failed' }
            $object = $annotated.object
          }
          if ($object.type -ne 'commit' -or $object.sha -ne $pins.headSha) { throw 'Candidate tag changed during verified manifest upload' }
          gh release edit r124 --repo $env:GITHUB_REPOSITORY --prerelease=false --latest --title 'Klipper Farm R124 — цвета полей ввода в светлой и тёмной темах' --notes-file release-notes-ru.md
          if ($LASTEXITCODE -ne 0) { throw 'Verified stable promotion failed' }

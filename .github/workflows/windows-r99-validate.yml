name: Validate compiled R99 upgrade
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/windows-r99-validate.yml']
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Download the already compiled pinned candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download 38697911856 --repo $env:GITHUB_REPOSITORY --name Klipper-Farm-R99-Candidate --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
          $provenance = Get-Content candidate/provenance.json -Raw | ConvertFrom-Json
          if ($provenance.sourceSha256 -ne 'eaec8f4ee69d49f7bf1c006a2ffa3499c2c1b8f3b7cdc420c1ef97d6b527fabe' -or $provenance.workflowCommit -ne 'ebf21f1d72ea89e60da6548a58748cb0874438ba') { throw 'Candidate provenance mismatch' }
          if ((Get-FileHash candidate/Klipper-Farm-R99-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '188fabfe82de7d6c94a4516a4f6af8213af8963550f8cd7bde2f936eea657e71') { throw 'Candidate installer changed' }
      - name: Verify upgrade from published R98 and installed runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location candidate
          $setup = (Resolve-Path Klipper-Farm-R99-setup.exe).Path
          $release = (Resolve-Path release).Path
          $provenance = Get-Content provenance.json -Raw | ConvertFrom-Json
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $provenance.setupSha256) { throw 'Candidate hash mismatch' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Klipper Farm upgrade test'
          $installed = Start-Process $setup -ArgumentList ('/S /D=' + $installDir) -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw 'Initial R99 install failed' }
          $expected = @{}
          foreach ($name in @('klipper-farm-client.exe','klipper-farmd.exe')) { $expected[$name] = (Get-FileHash (Join-Path $installDir $name)).Hash }
          $desktop = Join-Path $installDir 'klipper-farm-client.exe'
          $desktopText = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($desktop))
          foreach ($marker in @('assets/index-BkqNzpJ_.js','assets/index-Bjxxag2T.css','"installedSequence": 99','28e0124c33f42704483d1aac89af829c44a00ef5dbc2e93dff630befddd495eb')) {
            if (-not $desktopText.Contains($marker)) { throw "Installed R99 resource or channel missing: $marker" }
          }
          gh release download r98 --repo $env:GITHUB_REPOSITORY --pattern Klipper-Farm-R98-setup.exe --dir old
          if ($LASTEXITCODE -ne 0) { throw 'Published R98 download failed' }
          $oldSetup = (Resolve-Path old/Klipper-Farm-R98-setup.exe).Path
          if ((Get-FileHash $oldSetup -Algorithm SHA256).Hash.ToLowerInvariant() -ne '774f757c0b1e15b904222667e196a3fafc25be686dd97d72e6539621e576ab47') { throw 'R98 hash mismatch' }
          $oldInstall = Start-Process $oldSetup -ArgumentList ('/S /D=' + $installDir) -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw 'R98 baseline install failed' }
          $baseline = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($desktop))
          if ($baseline -notmatch '"installedSequence"\s*:\s*98') { throw 'R98 baseline is not physically installed' }
          $dataDir = Join-Path $env:APPDATA 'app.klipper.farm'
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $marker = Join-Path $dataDir 'updater-r99-preserve.txt'
          [IO.File]::WriteAllText($marker,'preserve-r98-data')
          $oldDesktop = Start-Process $desktop -PassThru
          $deadline = [DateTime]::UtcNow.AddSeconds(20)
          while ($oldDesktop.MainWindowHandle -eq 0 -and -not $oldDesktop.HasExited -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 100; $oldDesktop.Refresh() }
          if ($oldDesktop.HasExited -or $oldDesktop.MainWindowHandle -eq 0) { throw 'Installed R98 did not open a window' }
          $helperText = Get-Content scripts/apply-online-update.ps1 -Raw -Encoding UTF8
          if (-not $desktopText.Contains($helperText)) { throw 'Candidate helper differs from the one embedded in R99' }
          $ready = Join-Path $env:RUNNER_TEMP 'updater-r99-ready'
          $payload = @{parentPid=$oldDesktop.Id;executable=$desktop;installer=$setup;sha256=$provenance.setupSha256;sizeBytes=(Get-Item $setup).Length;ready=$ready} | ConvertTo-Json -Compress
          $start = [Diagnostics.ProcessStartInfo]::new()
          $start.FileName = "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe"
          $start.UseShellExecute = $false
          $start.RedirectStandardInput = $true
          $start.CreateNoWindow = $true
          $start.EnvironmentVariables.Remove('PSModulePath')
          $start.Arguments = '-NoProfile -NonInteractive -EncodedCommand ' + [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($helperText))
          $helper = [Diagnostics.Process]::Start($start)
          $helper.StandardInput.Write($payload)
          $helper.StandardInput.Close()
          $deadline = [DateTime]::UtcNow.AddSeconds(15)
          while (-not (Test-Path $ready) -and -not $helper.HasExited -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 100 }
          if (-not (Test-Path $ready)) { throw 'Updater handshake failed' }
          if (-not $oldDesktop.CloseMainWindow() -or -not $oldDesktop.WaitForExit(20000)) { throw 'R98 did not close cleanly' }
          if (-not $helper.WaitForExit(120000)) { $helper.Kill(); throw 'Update helper timeout' }
          if ($helper.ExitCode -ne 0) { throw 'Update helper failed' }
          foreach ($name in @('klipper-farm-client.exe','klipper-farmd.exe')) {
            $hash = (Get-FileHash (Join-Path $installDir $name)).Hash
            "UPDATED $name hash=$hash matchesR99=$($hash -eq $expected[$name])"
            if ($hash -ne $expected[$name]) { throw "Wrong installed R99 payload: $name" }
          }
          if ((Get-Content $marker -Raw) -ne 'preserve-r98-data') { throw 'App data was removed' }
          $restarted = @(Get-Process -Name klipper-farm-client -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $desktop })
          if ($restarted.Count -eq 0) { throw 'R99 was not relaunched' }
          foreach ($process in $restarted) {
            $deadline = [DateTime]::UtcNow.AddSeconds(20)
            while ($process.MainWindowHandle -eq 0 -and -not $process.HasExited -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 100; $process.Refresh() }
            if ($process.HasExited -or -not $process.CloseMainWindow() -or -not $process.WaitForExit(20000)) { throw 'R99 window lifecycle failed' }
          }
          foreach ($process in @(Get-Process -Name klipper-farmd -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq (Join-Path $installDir 'klipper-farmd.exe') })) { if (-not $process.WaitForExit(10000)) { throw 'Sidecar survived desktop shutdown' } }
          node scripts/check-headless-telemetry-runtime.mjs --daemon "$installDir/klipper-farmd.exe" --probe "$release/klipper-farm-ipc-probe.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed telemetry failed' }
          New-Item -ItemType Directory -Force smoke | Out-Null
          node scripts/check-desktop-startup-smoke.mjs "$installDir/klipper-farm-client.exe" "$installDir/klipper-farmd.exe" "$PWD/smoke"
          if ($LASTEXITCODE -ne 0) { throw 'Installed desktop smoke failed' }
          'R98 to R99 physical upgrade, data preservation, relaunch and telemetry passed'
      - name: Retain validated installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item candidate/Klipper-Farm-R99-setup.exe,candidate/SHA256SUMS.txt,candidate/provenance.json out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-R99-Validated
          path: out/
          if-no-files-found: error
          retention-days: 30

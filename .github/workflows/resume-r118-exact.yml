name: Resume exact R118 validation and publish candidate
on:
  workflow_dispatch:
  push:
    branches: [r118-background-panels]
    paths: ['.github/workflows/resume-r118-exact.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: resume-r118-exact
  cancel-in-progress: false
env:
  R118_SOURCE_BUILD_RUN_ID: '39040985755'
  R118_SOURCE_BUILD_HEAD: 'fffc8837e8144914bca3fb69369be66b7fa6a273'
jobs:
  build:
    name: build
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Verify successful original build and download exact immutable archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force incoming,candidate,checked-source | Out-Null
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/39040985755" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Original build run lookup failed' }
          if ($run.id -ne 39040985755 -or $run.event -ne 'push' -or $run.head_repository.full_name -ne 'sanozhukov3737-oss/klipper-farm-updates' -or $run.head_sha -ne $env:R118_SOURCE_BUILD_HEAD -or $run.head_branch -ne 'r118-background-panels' -or $run.path -ne '.github/workflows/windows-r118.yml' -or $run.status -ne 'completed' -or $run.conclusion -ne 'failure') { throw 'Original immutable build identity differs' }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/39040985755/jobs?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Original build jobs lookup failed' }
          $build = @($jobs.jobs | Where-Object { $_.id -eq 117420279616 -and $_.name -eq 'build' })
          $failedValidation = @($jobs.jobs | Where-Object { $_.id -eq 117426498828 -and $_.name -eq 'validate' -and $_.conclusion -eq 'failure' })
          if ($build.Count -ne 1 -or $build[0].status -ne 'completed' -or $build[0].conclusion -ne 'success' -or $failedValidation.Count -ne 1) { throw 'Successful original build and known failed validation are required' }
          foreach ($step in $build[0].steps) { if ($step.status -ne 'completed' -or $step.conclusion -ne 'success') { throw "Original build step did not pass: $($step.name)" } }
          if (@($jobs.jobs | Where-Object { $_.conclusion -eq 'failure' -and $_.id -ne 117426498828 }).Count -ne 0) { throw 'Original run has an unexpected failed job' }
          $encoded = gh api "repos/$env:GITHUB_REPOSITORY/contents/.github/workflows/windows-r118.yml?ref=$env:R118_SOURCE_BUILD_HEAD" --jq .content
          if ($LASTEXITCODE -ne 0) { throw 'Original build workflow retrieval failed' }
          [IO.File]::WriteAllBytes("$PWD/incoming/original-windows-r118.yml",[Convert]::FromBase64String(($encoded -join '')))
          if ((Get-FileHash incoming/original-windows-r118.yml).Hash.ToLowerInvariant() -ne '11f0efe03ba4d84c761fda1f1b6511b2bdb094c9895cf8b6ea066f3b07ad6f4b') { throw 'Original reviewed build workflow differs' }
          foreach ($artifact in @(
            @{id=12104452390;name='candidate';bytes=407020101;sha='7e62fcb53cbfe2a1e91c5bbcf0fb7a1490ea941c1503b05f3a71be9fd4b371c9'},
            @{id=12104612026;name='source';bytes=500237733;sha='f6aed9ac3435af99ff09a5b36cc8bdcb64d660b4c0d0b236fd0538d7d1054296'},
            @{id=12103887892;name='ui-proof';bytes=238651;sha='8f03e659e6c2f4b0483496b9a020ab9d67ef416e9e9bfc730366f23fe9a7a57a'}
          )) {
            $meta = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($artifact.id)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Original artifact metadata lookup failed: $($artifact.name)" }
            if ($meta.id -ne $artifact.id -or $meta.workflow_run.id -ne 39040985755 -or $meta.workflow_run.head_sha -ne $env:R118_SOURCE_BUILD_HEAD -or $meta.expired -or $meta.size_in_bytes -ne $artifact.bytes -or $meta.digest -ne ('sha256:'+$artifact.sha)) { throw "Original immutable artifact metadata differs: $($artifact.name)" }
            $destination = Join-Path "$PWD/incoming" ($artifact.name+'.zip')
            & curl.exe --fail --location --silent --show-error --header "Authorization: Bearer $env:GH_TOKEN" --header 'Accept: application/vnd.github+json' --output $destination "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($artifact.id)/zip"
            if ($LASTEXITCODE -ne 0) { throw "Original artifact download failed: $($artifact.name)" }
            if ((Get-Item $destination).Length -ne $artifact.bytes -or (Get-FileHash $destination).Hash.ToLowerInvariant() -ne $artifact.sha) { throw "Original raw artifact ZIP differs: $($artifact.name)" }
          }
          Expand-Archive incoming/candidate.zip candidate
          Expand-Archive incoming/source.zip checked-source
          Copy-Item incoming/ui-proof.zip checked-source/R118-UI-proof.zip
          if ((Get-Item candidate/Klipper-Farm-R118-setup.exe).Length -ne 203541303 -or (Get-FileHash candidate/Klipper-Farm-R118-setup.exe).Hash.ToLowerInvariant() -ne '005ef7b789f6c82b62460ec92120c89846f257114b28b7dc665764a83207f13b') { throw 'Exact tested installer differs' }
          if ((Get-Item checked-source/KF-R118-FULL.zip).Length -ne 500195909 -or (Get-FileHash checked-source/KF-R118-FULL.zip).Hash.ToLowerInvariant() -ne '12659233d2a1aff1401ce60a3eef2b8c99a61bb175576383d24b54a418db04f3') { throw 'Exact reviewed source differs' }
          if ((Get-FileHash candidate/provenance.json).Hash.ToLowerInvariant() -ne '105123a91e35b63b4a50e3e5194722d02aab8640e85f201155c19ddae14377ca') { throw 'Original provenance bytes differ' }
          $expectedFiles = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('')) | ConvertFrom-Json
          foreach ($entry in $expectedFiles) {
            $file = Join-Path "$PWD/candidate" $entry.path
            if ((Get-Item -LiteralPath $file).Length -ne $entry.sizeBytes -or (Get-FileHash -LiteralPath $file).Hash.ToLowerInvariant() -ne $entry.sha256) { throw "Immutable candidate file differs: $($entry.path)" }
          }
          @{schemaVersion=1;sourceBuildRunId=39040985755;sourceBuildHeadSha=$env:R118_SOURCE_BUILD_HEAD;sourceBuildJobId=117420279616;sourceBuildWorkflowSha256='11f0efe03ba4d84c761fda1f1b6511b2bdb094c9895cf8b6ea066f3b07ad6f4b';originalBuildJobSuccess=$true;originalValidationWasOnlyFailure=$true;candidateArtifactId=12104452390;candidateArtifactSha256='7e62fcb53cbfe2a1e91c5bbcf0fb7a1490ea941c1503b05f3a71be9fd4b371c9';sourceArtifactId=12104612026;sourceArtifactSha256='f6aed9ac3435af99ff09a5b36cc8bdcb64d660b4c0d0b236fd0538d7d1054296';uiProofArtifactId=12103887892;uiProofArtifactSha256='8f03e659e6c2f4b0483496b9a020ab9d67ef416e9e9bfc730366f23fe9a7a57a';provenanceSha256='105123a91e35b63b4a50e3e5194722d02aab8640e85f201155c19ddae14377ca'} | ConvertTo-Json | Set-Content candidate/build-origin.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-R118-Candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-R118-Reviewed-Source
          path: checked-source/
          if-no-files-found: error
          retention-days: 30

  validate:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Klipper-Farm-R118-Candidate
          path: candidate
      - name: Prepare verified actual-window validation harnesses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedFiles = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('')) | ConvertFrom-Json
          foreach ($entry in $expectedFiles) {
            $file = Join-Path "$PWD/candidate" $entry.path
            if ((Get-Item -LiteralPath $file).Length -ne $entry.sizeBytes -or (Get-FileHash -LiteralPath $file).Hash.ToLowerInvariant() -ne $entry.sha256) { throw "Immutable candidate file differs: $($entry.path)" }
          }
          if ((Get-FileHash candidate/provenance.json).Hash.ToLowerInvariant() -ne '105123a91e35b63b4a50e3e5194722d02aab8640e85f201155c19ddae14377ca') { throw 'Original source provenance was modified' }
          # This new validation-only file corrects cached HWND selection. The
          # original shipped script and every executable remain unchanged.
          [IO.File]::WriteAllBytes("$PWD/candidate/scripts/check-desktop-exit-actual-window-r117.ps1",[Convert]::FromBase64String(''))
          if ((Get-FileHash candidate/scripts/check-desktop-exit-actual-window-r117.ps1).Hash.ToLowerInvariant() -ne 'c1f1c3bc66abef1d4a298274c99d7882db8fef742b99572f0abef815bd850ac1') { throw 'Corrected window-selection harness differs' }
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/candidate/scripts/check-desktop-exit-actual-window-r117.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ('Harness parse failed: ' + (($errors | ForEach-Object Message) -join '; ')) }
          [IO.File]::WriteAllBytes("$PWD/candidate/scripts/upgrade-actual-window-r117.ps1",[Convert]::FromBase64String(''))
          if ((Get-FileHash candidate/scripts/upgrade-actual-window-r117.ps1).Hash.ToLowerInvariant() -ne '34fe9c122199eb4e7aa91b219496e6c818a6a19c41b97583d4b5a5e2276ade5d') { throw 'Inline upgrade window helper differs' }
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/candidate/scripts/upgrade-actual-window-r117.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ('Inline helper parse failed: ' + (($errors | ForEach-Object Message) -join '; ')) }
          [IO.File]::WriteAllBytes("$PWD/candidate/scripts/check-minimized-telemetry-r118.ps1",[Convert]::FromBase64String(''))
          if ((Get-FileHash candidate/scripts/check-minimized-telemetry-r118.ps1).Hash.ToLowerInvariant() -ne 'cdf740bd7e09dde834a10ef649045addb48ca07fe442d6a53bbd879df09e19ff') { throw 'Minimized telemetry harness differs' }
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/candidate/scripts/check-minimized-telemetry-r118.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ('Minimized harness parse failed: ' + (($errors | ForEach-Object Message) -join '; ')) }
      - name: Verify upgrade from published R117 and installed runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell startup probe failed' }
          Set-Location candidate
          . scripts/upgrade-actual-window-r117.ps1
          $inlineProof = Join-Path $PWD 'inline-window-proof'
          $setup = (Resolve-Path Klipper-Farm-R118-setup.exe).Path
          $release = (Resolve-Path release).Path
          $provenance = Get-Content provenance.json -Raw | ConvertFrom-Json
          if ($provenance.workflowCommit -ne $env:R118_SOURCE_BUILD_HEAD -or $provenance.buildId -ne 'V20.6-R11.8-BACKGROUND-PANELS-2026-10-17' -or $provenance.sequence -ne 118 -or $provenance.baselineSequence -ne 117) { throw 'Wrong compiled candidate provenance' }
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $provenance.setupSha256) { throw 'Candidate hash mismatch' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Klipper Farm upgrade test'
          $installed = Start-Process $setup -ArgumentList ('/S /D=' + $installDir) -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw 'Initial R118 install failed' }
          $expected = @{}
          foreach ($name in @('klipper-farm-client.exe','klipper-farmd.exe')) { $expected[$name] = (Get-FileHash (Join-Path $installDir $name)).Hash }
          $desktop = Join-Path $installDir 'klipper-farm-client.exe'
          $desktopText = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($desktop))
          foreach ($marker in @($provenance.javascript,$provenance.stylesheet,$provenance.cameraWorker,'camera-detector/obico-failure-5a6b1be1fa.onnx','camera-detector/ort-wasm-simd-threaded.wasm','"installedSequence": 118','28e0124c33f42704483d1aac89af829c44a00ef5dbc2e93dff630befddd495eb')) {
            if (-not $desktopText.Contains($marker)) { throw "Installed R118 resource or channel missing: $marker" }
          }
          node scripts/check-headless-telemetry-runtime.mjs --daemon "$installDir/klipper-farmd.exe" --probe "$release/klipper-farm-ipc-probe.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed telemetry failed' }
          gh release download r117 --repo $env:GITHUB_REPOSITORY --pattern Klipper-Farm-R117-setup.exe --dir old
          if ($LASTEXITCODE -ne 0) { throw 'Published R117 download failed' }
          $oldSetup = (Resolve-Path old/Klipper-Farm-R117-setup.exe).Path
          if ((Get-Item $oldSetup).Length -ne 203546852) { throw 'R117 installer size mismatch' }
          if ((Get-FileHash $oldSetup -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8a86c490d7da7f23ee77637e25b926645146e8a6a942f94d252c963a1fa6bbd7') { throw 'R117 hash mismatch' }
          $oldInstall = Start-Process $oldSetup -ArgumentList ('/S /D=' + $installDir) -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw 'R117 baseline install failed' }
          $baseline = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($desktop))
          if ($baseline -notmatch '"installedSequence"\s*:\s*117') { throw 'R117 baseline is not physically installed' }
          $dataDir = Join-Path $env:APPDATA 'app.klipper.farm'
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $marker = Join-Path $dataDir 'updater-r117-preserve.txt'
          [IO.File]::WriteAllText($marker,'preserve-r117-data')
          $cacheRoot = Join-Path $env:LOCALAPPDATA 'app.klipper.farm/verified-updates'
          $cleanupProbe = Join-Path $cacheRoot ([guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force $cleanupProbe | Out-Null
          [IO.File]::WriteAllText((Join-Path $cleanupProbe 'installer.exe'),'unprotected-test-cache-fixture')
          $oldDesktop = Start-Process $desktop -PassThru
          Wait-UpgradeActualWindow -Process $oldDesktop -Case 'R117-before-update-helper' -OutputDirectory $inlineProof
          $cleanupDeadline = [DateTime]::UtcNow.AddSeconds(12)
          while ((Test-Path $cleanupProbe) -and [DateTime]::UtcNow -lt $cleanupDeadline) { Start-Sleep -Milliseconds 100 }
          "Synthetic cache survives startup: $(Test-Path $cleanupProbe)"
          $startupLog = Join-Path $env:APPDATA 'app.klipper.farm/logs/desktop-startup.log'
          if (Test-Path $startupLog) { Get-Content $startupLog -Tail 25 }
          $helperText = Get-Content scripts/apply-online-update.ps1 -Raw -Encoding UTF8
          if (-not $desktopText.Contains($helperText)) { throw 'Candidate helper differs from the one embedded in R118' }
          $cacheRoot = Join-Path $env:LOCALAPPDATA 'app.klipper.farm/verified-updates'
          $attempt = Join-Path $cacheRoot ([guid]::NewGuid().ToString('N'))
          $legacy = Join-Path $cacheRoot ([guid]::NewGuid().ToString('N'))
          $partial = Join-Path $cacheRoot ([guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force $attempt,$legacy,$partial | Out-Null
          $cachedSetup = Join-Path $attempt 'installer.exe'
          Copy-Item $setup $cachedSetup
          [IO.File]::WriteAllText((Join-Path $attempt 'manifest.json'),'synthetic-signed-manifest-fixture')
          foreach ($path in @($legacy,$partial)) { [IO.File]::WriteAllText((Join-Path $path 'installer.exe'),'abandoned-cache-fixture') }
          [IO.File]::WriteAllText((Join-Path $legacy 'helper-ready'),'ready')
          [IO.File]::WriteAllText((Join-Path $legacy 'install-result.txt'),'Installed successfully')
          $keep = Join-Path (Split-Path -Parent $cacheRoot) 'keep-update-cache-test.txt'
          [IO.File]::WriteAllText($keep,'preserve-unrelated-file')
          $ready = Join-Path $attempt 'helper-ready'
          # Production update_apply holds UpdateState's lease/prepared path.
          # This external harness has no app state. Use the supported active-owner
          # marker to preserve its fixture until the actual helper takes over.
          [IO.File]::WriteAllText($ready,(@{helperPid=$PID} | ConvertTo-Json -Compress))
          $payload = @{parentPid=$oldDesktop.Id;executable=$desktop;installer=$cachedSetup;sha256=$provenance.setupSha256;sizeBytes=(Get-Item $setup).Length;ready=$ready;cacheRoot=$cacheRoot} | ConvertTo-Json -Compress
          $start = [Diagnostics.ProcessStartInfo]::new()
          $start.FileName = "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe"
          $start.UseShellExecute = $false
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $start.CreateNoWindow = $true
          $start.EnvironmentVariables.Remove('PSModulePath')
          $helperDebugPrefix = '$ProgressPreference = ''SilentlyContinue''; Set-PSDebug -Trace 1;' + [Environment]::NewLine
          foreach ($argument in @('-NoProfile','-NonInteractive','-Command',($helperDebugPrefix + $helperText))) { $start.ArgumentList.Add($argument) }
          $helper = [Diagnostics.Process]::Start($start)
          $outRead = $helper.StandardOutput.ReadToEndAsync()
          $errRead = $helper.StandardError.ReadToEndAsync()
          $handshakeStarted = [Diagnostics.Stopwatch]::StartNew()
          $helper.StandardInput.Write($payload)
          $helper.StandardInput.Close()
          $actualHelperReady = {
            if (-not (Test-Path $ready)) { return $false }
            try { return (Get-Content $ready -Raw | ConvertFrom-Json).helperPid -eq $helper.Id } catch { return $false }
          }
          $deadline = [DateTime]::UtcNow.AddSeconds(15)
          while (-not (& $actualHelperReady) -and -not $helper.HasExited -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 100 }
          if (-not (& $actualHelperReady)) {
            Write-Host ('HELPER process: ' + ($helper | Select-Object Id,MainWindowTitle,TotalProcessorTime,StartTime | ConvertTo-Json -Compress))
            Get-ChildItem $cacheRoot -Recurse -Force | Select-Object FullName,Length | ConvertTo-Json -Compress | Write-Host
            if (Test-Path (Join-Path $cacheRoot 'last-error.txt')) { Get-Content (Join-Path $cacheRoot 'last-error.txt') }
            Write-Host "HELPER handshake elapsedMs=$($handshakeStarted.ElapsedMilliseconds) exited=$($helper.HasExited)"
            if (Test-Path install-result.txt) { Get-Content install-result.txt }
            if (-not $helper.HasExited) { $helper.Kill(); $helper.WaitForExit(10000) | Out-Null }
            $null = $outRead.Wait(5000)
            $null = $errRead.Wait(5000)
            if ($outRead.IsCompleted) { $outRead.Result | Set-Content helper-stdout.txt; Write-Host $outRead.Result }
            if ($errRead.IsCompleted) { $errRead.Result | Set-Content helper-stderr.txt; Write-Host $errRead.Result }
            throw 'Updater handshake failed'
          }
          "HELPER ready elapsedMs=$($handshakeStarted.ElapsedMilliseconds)"
          if (-not (Close-UpgradeActualWindow -Process $oldDesktop -Case 'R117-close-for-upgrade' -OutputDirectory $inlineProof) -or -not $oldDesktop.WaitForExit(20000)) { throw 'R117 did not close cleanly' }
          if (-not $helper.WaitForExit(120000)) { $helper.Kill(); throw 'Update helper timeout' }
          if ($helper.ExitCode -ne 0) { $outRead.Result; $errRead.Result; throw 'Update helper failed' }
          $deadline = [DateTime]::UtcNow.AddSeconds(12)
          while (((Test-Path $attempt) -or (Test-Path $legacy) -or (Test-Path $partial)) -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 150 }
          foreach ($path in @($attempt,$legacy,$partial)) { if (Test-Path $path) { throw "Update cache was not cleaned: $path" } }
          if ((Get-Content -LiteralPath $keep -Raw) -ne 'preserve-unrelated-file') { throw 'Unrelated cache neighbor was changed' }
          'Update cache runtime OK: active installer attempt, legacy completed update and partial download removed; unrelated file preserved'
          foreach ($name in @('klipper-farm-client.exe','klipper-farmd.exe')) {
            $hash = (Get-FileHash (Join-Path $installDir $name)).Hash
            "UPDATED $name hash=$hash matchesR118=$($hash -eq $expected[$name])"
            if ($hash -ne $expected[$name]) { throw "Wrong installed R118 payload: $name" }
          }
          if ((Get-Content $marker -Raw) -ne 'preserve-r117-data') { throw 'App data was removed' }
          $restarted = @(Get-Process -Name klipper-farm-client -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $desktop })
          if ($restarted.Count -eq 0) { throw 'R118 was not relaunched' }
          foreach ($process in $restarted) {
            Wait-UpgradeActualWindow -Process $process -Case 'R118-relaunched-before-close' -OutputDirectory $inlineProof
            if ($process.HasExited -or -not (Close-UpgradeActualWindow -Process $process -Case 'R118-relaunched-close' -OutputDirectory $inlineProof) -or -not $process.WaitForExit(20000)) { throw 'R118 window lifecycle failed' }
          }
          foreach ($process in @(Get-Process -Name klipper-farmd -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq (Join-Path $installDir 'klipper-farmd.exe') })) { if (-not $process.WaitForExit(10000)) { throw 'Sidecar survived desktop shutdown' } }
          & scripts/check-desktop-exit-actual-window-r117.ps1 -Desktop $desktop -OutputDirectory (Join-Path $PWD 'main-window-proof')
          New-Item -ItemType Directory -Force smoke | Out-Null
          node scripts/check-desktop-startup-smoke.mjs "$installDir/klipper-farm-client.exe" "$installDir/klipper-farmd.exe" "$PWD/smoke"
          if ($LASTEXITCODE -ne 0) { throw 'Installed desktop smoke failed' }
          $minimizedProof = Join-Path $env:RUNNER_TEMP 'R118 minimized private validation'
          & scripts/check-minimized-telemetry-r118.ps1 -DesktopExe $desktop -ProbeExe (Join-Path $release 'klipper-farm-ipc-probe.exe') -EmulatorScript (Join-Path $PWD 'scripts/hardware-emulator.mjs') -OutputDirectory $minimizedProof
          if (-not $?) { throw 'Installed desktop minimize/restore telemetry proof failed' }
          New-Item -ItemType Directory -Force minimized-telemetry-proof | Out-Null
          Copy-Item (Join-Path $minimizedProof 'minimized-telemetry-r118.json') minimized-telemetry-proof/
          $startupProof = Join-Path $env:RUNNER_TEMP 'R118 startup private validation'
          & scripts/check-startup-instance-r117.ps1 -DesktopExe $desktop -OutputDirectory $startupProof
          if (-not $?) { throw 'Actual installed desktop concurrent startup regression failed' }
          New-Item -ItemType Directory -Force startup-instance-proof | Out-Null
          Copy-Item (Join-Path $startupProof 'startup-instance-r117.json') startup-instance-proof/
          $windowProof = Get-Content main-window-proof/main-window-lifecycle-r117.json -Raw | ConvertFrom-Json
          if (($windowProof.completedModes -join ',') -ne 'close-during-startup,normal-close,force-desktop,recovery-close' -or $windowProof.exitWaitMs -ne 20000 -or $windowProof.earlyCloseWaitsForPageReady -ne $false) { throw 'Complete original lifecycle coverage or timing changed' }
          $startup = Get-Content startup-instance-proof/startup-instance-r117.json -Raw | ConvertFrom-Json
          if ($startup.cases.Count -ne 3) { throw 'Three real double-launch proofs are required' }
          $external = @{schemaVersion=1;candidateBuildRunId=39040985755;candidateBuildHeadSha=$env:R118_SOURCE_BUILD_HEAD;sourceBuildRunId=39040985755;sourceBuildHeadSha=$env:R118_SOURCE_BUILD_HEAD;sourceBuildJobId=117420279616;sourceBuildWorkflowSha256='11f0efe03ba4d84c761fda1f1b6511b2bdb094c9895cf8b6ea066f3b07ad6f4b';candidateArtifactId=12104452390;candidateArtifactSha256='7e62fcb53cbfe2a1e91c5bbcf0fb7a1490ea941c1503b05f3a71be9fd4b371c9';sourceArtifactId=12104612026;sourceArtifactSha256='f6aed9ac3435af99ff09a5b36cc8bdcb64d660b4c0d0b236fd0538d7d1054296';validationWorkflowRunId=[long]$env:GITHUB_RUN_ID;validationWorkflowHeadSha=$env:GITHUB_SHA;validationWorkflowPath='.github/workflows/resume-r118-exact.yml';originalBuildJobSuccess=$true;originalProductBytesPreserved=$true;patchSha256=$provenance.patchSha256;setupSha256=$provenance.setupSha256;sourceSha256=$provenance.sourceSha256;baselineSourceSha256='2164e5398b0bdef4ecc733b43ece25c8e8252d31b017056e6229b55d48c6e5bf';baselineSetupSha256='8a86c490d7da7f23ee77637e25b926645146e8a6a942f94d252c963a1fa6bbd7';baselineSequence=117;sequence=118;validationRunId=[long]$env:GITHUB_RUN_ID;correctedLifecycleScriptSha256='c1f1c3bc66abef1d4a298274c99d7882db8fef742b99572f0abef815bd850ac1';inlineWindowHelperSha256='34fe9c122199eb4e7aa91b219496e6c818a6a19c41b97583d4b5a5e2276ade5d';minimizedHarnessSha256='cdf740bd7e09dde834a10ef649045addb48ca07fe442d6a53bbd879df09e19ff';fullR117UpgradeVerified=$true;dataPreservationVerified=$true;originalFourLifecycleModesVerified=$true;earlyCloseWaitsForPageReady=$false;exitWaitMs=20000;allThreeDoubleLaunchesVerified=$true;installedSmokeVerified=$true;minimizedTelemetryDisconnectReconnectRestoreVerified=$true}
          $external | ConvertTo-Json | Set-Content exact-validation.json -Encoding utf8NoBOM
          'R117 to R118 physical upgrade, data preservation, relaunch and telemetry passed'
      - name: Retain validated installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item candidate/Klipper-Farm-R118-setup.exe,candidate/SHA256SUMS.txt,candidate/provenance.json,candidate/exact-validation.json,candidate/build-origin.json,candidate/minimized-telemetry-proof/minimized-telemetry-r118.json out/
          Copy-Item candidate/main-window-proof/main-window-lifecycle-r117.json,candidate/startup-instance-proof/startup-instance-r117.json,candidate/inline-window-proof/upgrade-inline-window-r117.json out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-R118-Exact-Candidate-Validated
          path: out/
          if-no-files-found: error
          retention-days: 30
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Klipper-Farm-R118-Exact-Candidate-Validation-logs
          path: |
            candidate/install-result.txt
            candidate/helper-stdout.txt
            candidate/helper-stderr.txt
            candidate/smoke/
            candidate/startup-instance-proof/
            candidate/minimized-telemetry-proof/
            candidate/main-window-proof/
            candidate/inline-window-proof/
            candidate/exact-validation.json
          if-no-files-found: warn

  publish-candidate:
    needs: [build, validate]
    runs-on: windows-2022
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Klipper-Farm-R118-Exact-Candidate-Validated
          path: release-candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Klipper-Farm-R118-Reviewed-Source
          path: release-source
      - name: Publish validated R118 prerelease candidate for signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = @(Get-ChildItem release-source -Recurse -Filter 'KF-R118-FULL.zip')
          if ($source.Count -ne 1) { throw 'Expected one frozen reviewed source archive' }
          Copy-Item $source[0].FullName release-candidate/KF-R118-FULL.zip
          Copy-Item release-source/R118-UI-proof.zip release-candidate/R118-UI-proof.zip
          Set-Location release-candidate
          $provenance = Get-Content provenance.json -Raw | ConvertFrom-Json
          $validation = Get-Content exact-validation.json -Raw | ConvertFrom-Json
          if ($provenance.workflowCommit -ne $env:R118_SOURCE_BUILD_HEAD -or $provenance.sequence -ne 118 -or $provenance.baselineSequence -ne 117) { throw 'Wrong candidate build provenance' }
          if ($validation.sourceBuildHeadSha -ne $env:R118_SOURCE_BUILD_HEAD -or $validation.sourceBuildRunId -ne 39040985755 -or $validation.validationWorkflowRunId -ne [long]$env:GITHUB_RUN_ID -or $validation.validationWorkflowHeadSha -ne $env:GITHUB_SHA -or -not $validation.fullR117UpgradeVerified -or -not $validation.minimizedTelemetryDisconnectReconnectRestoreVerified) { throw 'Candidate physical validation proof is missing' }
          $setupHash = (Get-FileHash Klipper-Farm-R118-setup.exe).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash KF-R118-FULL.zip).Hash.ToLowerInvariant()
          $uiProofHash = (Get-FileHash R118-UI-proof.zip).Hash.ToLowerInvariant()
          if ($setupHash -ne '005ef7b789f6c82b62460ec92120c89846f257114b28b7dc665764a83207f13b' -or $sourceHash -ne '12659233d2a1aff1401ce60a3eef2b8c99a61bb175576383d24b54a418db04f3' -or $uiProofHash -ne '8f03e659e6c2f4b0483496b9a020ab9d67ef416e9e9bfc730366f23fe9a7a57a' -or $setupHash -ne $provenance.setupSha256 -or $sourceHash -ne $provenance.sourceSha256) { throw 'Candidate asset hash differs from validated build' }
          if ((Get-Item Klipper-Farm-R118-setup.exe).Length -gt 512MB) { throw 'Installer exceeds updater limit' }
          "$setupHash *Klipper-Farm-R118-setup.exe`n$sourceHash *KF-R118-FULL.zip`n$uiProofHash *R118-UI-proof.zip" | Set-Content SHA256SUMS.txt -Encoding utf8NoBOM
          @'
          R118 candidate: responsive heavy panels and continuous background monitoring.

          This prerelease preserves the exact installer and source from successful build job117420279616 of run39040985755 (fffc8837e8144914bca3fb69369be66b7fa6a273). This workflow resumes physical validation with a corrected validation-only Node executable resolver; product and original provenance bytes are unchanged. Automated checks include the installed R117 to R118 upgrade with preserved data, four window lifecycle modes, three real double launches, and actual desktop minimize/disconnect/reconnect/restore telemetry against a synthetic localhost printer.

          The stable update manifest will be signed and published separately after verifying these exact assets. Physical printers and the user's fingerprint reader are outside this build environment.
          '@ | Set-Content candidate-notes.md -Encoding utf8NoBOM
          gh release view r118 --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'R118 already exists; review it before replacing or promoting any asset' }
          gh release create r118 Klipper-Farm-R118-setup.exe KF-R118-FULL.zip R118-UI-proof.zip SHA256SUMS.txt provenance.json exact-validation.json build-origin.json minimized-telemetry-r118.json --repo $env:GITHUB_REPOSITORY --target $env:R118_SOURCE_BUILD_HEAD --prerelease --title 'Klipper Farm R118 candidate — background and panels' --notes-file candidate-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Validated prerelease publication failed' }

  publish-candidate:
    needs: [build, validate]
    runs-on: windows-2022
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Klipper-Farm-R121-Exact-Candidate-Validated
          path: release-candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Klipper-Farm-R121-Reviewed-Source
          path: release-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Klipper-Farm-R121-Offline-Photos-UI-proof
          path: release-ui-proof/offline-photos
      - name: Publish validated R121 prerelease candidate for signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = @(Get-ChildItem release-source -Recurse -Filter 'KF-R121-FULL.zip')
          if ($source.Count -ne 1) { throw 'Expected one frozen reviewed source archive' }
          Copy-Item $source[0].FullName release-candidate/KF-R121-FULL.zip
          Compress-Archive -Path release-ui-proof/* -DestinationPath release-candidate/R121-UI-proof.zip
          Set-Location release-candidate
          $provenance = Get-Content provenance.json -Raw | ConvertFrom-Json
          $validation = Get-Content exact-validation.json -Raw | ConvertFrom-Json
          if ($provenance.workflowCommit -ne $env:GITHUB_SHA -or $provenance.sequence -ne 121 -or $provenance.baselineSequence -ne 120) { throw 'Wrong candidate build provenance' }
          if ($validation.candidateBuildHeadSha -ne $env:GITHUB_SHA -or -not $validation.fullR120UpgradeVerified -or -not $validation.minimizedTelemetryDisconnectReconnectRestoreVerified) { throw 'Candidate physical validation proof is missing' }
          $photoProof = Get-Content ../release-ui-proof/offline-photos/r121-images-ui-summary.json -Raw | ConvertFrom-Json
          $sourceLedger = Get-Content ../release-ui-proof/offline-photos/reviewed-photo-ledger.json -Raw | ConvertFrom-Json
          if (-not $photoProof.passed -or $photoProof.windowsEdgeUICases -ne 15 -or $photoProof.offlinePhotoModels -ne 482 -or $photoProof.externalImageRequests -ne 0 -or $provenance.photoLedgerSha256 -ne 'bd52a8444169582ae47a021d05261b2637015d2d1df26f0d47260b60345942cd' -or $provenance.photoModelCount -ne 482 -or -not $validation.offlinePhotosVerified -or $validation.catalogUiCases -ne 15 -or $sourceLedger.imageModels -ne 482) { throw 'Offline photo acceptance is incomplete' }
          if ($provenance.patchSha256 -ne '2227e3697662d60b7c5acaa233594a24e57cf23b480503ef1f963af1d2cae68e' -or $validation.patchSha256 -ne '2227e3697662d60b7c5acaa233594a24e57cf23b480503ef1f963af1d2cae68e') { throw 'Published candidate patch-set differs' }
          if ($provenance.coverageSha256 -ne '46a7e79842fcfdb67f828b117825f4068c3bc0cd227172f38e003c1c85f0dd8d' -or $validation.coverageSha256 -ne '46a7e79842fcfdb67f828b117825f4068c3bc0cd227172f38e003c1c85f0dd8d' -or $provenance.appendedPhotoModels -ne 11) { throw 'Frozen append-only coverage changed before publication' }
          $setupHash = (Get-FileHash Klipper-Farm-R121-setup.exe).Hash.ToLowerInvariant()
          $sourceHash = (Get-FileHash KF-R121-FULL.zip).Hash.ToLowerInvariant()
          $uiProofHash = (Get-FileHash R121-UI-proof.zip).Hash.ToLowerInvariant()
          if ($setupHash -ne $provenance.setupSha256 -or $sourceHash -ne $provenance.sourceSha256) { throw 'Candidate asset hash differs from validated build' }
          if ((Get-Item Klipper-Farm-R121-setup.exe).Length -gt 512MB) { throw 'Installer exceeds updater limit' }
          "$setupHash *Klipper-Farm-R121-setup.exe`n$sourceHash *KF-R121-FULL.zip`n$uiProofHash *R121-UI-proof.zip" | Set-Content SHA256SUMS.txt -Encoding utf8NoBOM
          @'
          R121 candidate: 11 additional exact-model photographs extend the unchanged R120 collection to 482 local photos plus 5 preserved illustrations (487 of 500 models). The remaining 13 models retain an explicit silhouette fallback. All prior 471 photographs, credits and mappings remain unchanged.

          The exact source and installer passed complete append-only ZIP scope, the 15-case Windows Edge catalog/photo suite, original photo QA, native build checks, and the actual installed R120 to R121 upgrade with preserved data, four lifecycle modes, three double launches, and minimize/disconnect/reconnect/restore telemetry against a synthetic localhost printer. The unchanged historical heavy-panel implementation retains its prior validation.

          Для подключения требуется доступный Klipper/Moonraker. Наличие изображения модели не подтверждает совместимость штатной прошивки. Stable signing follows independent verification of these exact public assets.
          '@ | Set-Content candidate-notes.md -Encoding utf8NoBOM
          gh release view r121 --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'R121 already exists; review it before replacing or promoting any asset' }
          gh release create r121 Klipper-Farm-R121-setup.exe KF-R121-FULL.zip R121-UI-proof.zip SHA256SUMS.txt provenance.json exact-validation.json minimized-telemetry-r118.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'Klipper Farm R121 candidate — offline model photos' --notes-file candidate-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Validated prerelease publication failed' }

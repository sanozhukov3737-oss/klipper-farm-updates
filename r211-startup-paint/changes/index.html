<!doctype html>
<html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Klipper Farm</title>
<!--
  Заставка рисуется вместе с этим файлом, до загрузки сборки стилей и React.
  Окно появляется примерно через две секунды после запуска — столько занимает
  разбор файла приложения на 278 МБ и старт WebView2. Без заставки всё это время
  оператор видит пустое белое полотно и считает, что программа зависла.
  Стили заданы прямо здесь: отдельный файл стилей ещё не загружен, и любая
  внешняя ссылка вернула бы белый экран.
-->
<style>
  html,body{margin:0;height:100%;background:#020811}
  #kfBoot{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;
    color:#edf7ff;font:14px/1.4 "Segoe UI Variable Text","Segoe UI",Arial,sans-serif;
    background:radial-gradient(120% 90% at 50% 0%,#0b1a2b 0%,#020811 60%)}
  #kfBoot .kfBootCard{display:grid;gap:14px;justify-items:center;text-align:center}
  #kfBoot .kfBootMark{width:52px;height:52px;border-radius:14px;
    background:linear-gradient(140deg,#2ad4ff,#0a6cff);opacity:.92}
  #kfBoot .kfBootName{font-size:16px;letter-spacing:.4px;font-weight:600}
  #kfBoot .kfBootState{font-size:12px;color:#8fa3bb}
  #kfBoot .kfBootBar{width:190px;height:3px;border-radius:3px;background:#122238;overflow:hidden}
  #kfBoot .kfBootBar:after{content:"";display:block;width:40%;height:100%;
    border-radius:3px;background:linear-gradient(90deg,#2ad4ff,#0a6cff);
    animation:kfBootSlide 1.1s ease-in-out infinite}
  @keyframes kfBootSlide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  @media (prefers-reduced-motion:reduce){#kfBoot .kfBootBar:after{animation:none;width:100%}}
</style>
</head><body><div id="root"></div>
<div id="kfBoot" role="status" aria-live="polite">
  <div class="kfBootCard">
    <div class="kfBootMark"></div>
    <div class="kfBootName">Klipper Farm</div>
    <div class="kfBootBar"></div>
    <div class="kfBootState">Загрузка интерфейса…</div>
  </div>
</div>
<script type="module" src="/src/main.tsx"></script></body></html>
